r second, Fast runs 2 steps per second.\n\n```text\n[ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba [ 5 ] \u2500\u2500\u25ba None\n            \u25b2                   \u25b2\n           slow                fast (When fast hits end, slow is in the middle!)\n```\n\n```python\ndef findMiddle(head):\n    slow = head\n    fast = head\n    while fast and fast.next:\n        slow = slow.next          # 1 step\n        fast = fast.next.next     # 2 steps\n    return slow                   # Exact middle node!\n```\n\n---\n\n### \ud83d\udd39 Pattern 4: The 3-Step Palindrome / Reorder Triple Crown (LC 234, LC 143)\n* **What it does:** Solves linked list symmetry/reordering in **$\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space** without converting to an array!\n* **The 3 Steps:**\n  1. **Find End of 1st Half:** Use `while fast.next and fast.next.next:` (so `slow` stops on the left of center).\n  2. **Reverse 2nd Half:** Apply the Conga Line 4-beat dance starting at `slow.next`.\n  3. **Compare Pointers:** Compare `head` and `reversed_2nd_half` side-by-side.\n  4. *(Bonus)* **Restore:** Re-reverse the second half so the input list is not mutated!\n\n```python\ndef isPalindrome(head: Optional[ListNode]) -> bool:\n    if not head or not head.next:\n        return True\n\n    # 1. Find midpoint (Tortoise & Hare)\n    slow, fast = head, head\n    while fast.next and fast.next.next:\n        slow = slow.next\n        fast = fast.next.next\n\n    # 2. Reverse 2nd half (Conga Line Dance)\n    prev, cur = None, slow.next\n    while cur:\n        nxt = cur.next\n        cur.next = prev\n        prev = cur\n        cur = nxt\n    second_half = prev\n\n    # 3. Compare 1st half vs reversed 2nd half\n    p1, p2 = head, second_half\n    is_pal = True\n    while is_pal and p2:\n        if p1.val != p2.val:\n            is_pal = False\n        p1 = p1.next\n        p2 = p2.next\n\n    # 4. Optional: Restore list\n    prev, cur = None, second_half\n    while cur:\n        nxt = cur.next\n        cur.next = prev\n        prev = cur\n        cur = nxt\n    slow.next = prev\n\n    return is_pal\n```\n\n#### \ud83d\udd2c Key Findings & Interview Trade-offs:\n* **Array Dump + Two Pointers Squeeze:** Great initial baseline ($\\mathcal{O}(n)$ time, $\\mathcal{O}(n)$ space).\n* **Two Pointers Squeeze vs `lst == lst[::-1]`:**\n  * **Memory:** Two Pointers allocates **$0$ extra space** vs $\\mathcal{O}(n)$ duplicate list copy for `[::-1]`.\n  * **Short-circuiting:** Two Pointers quits in **$0.004$ ms ($1,685\\times$ faster)** on early mismatch because it doesn't wait to reverse the entire list first.\n* **Is Array Dump FAANG-worthy?**\n  * As an initial solution: **Yes** (proves you write clean, bug-free code fast).\n  * As the final solution: **No** (interviewers will prompt for the $\\mathcal{O}(1)$ space in-place Triple Crown).\n\n\ud83d\udc49 *See full breakdown and benchmark in [`234_palindrome_linked_list.md`](./234_palindrome_linked_list.md).*\n\n---\n\n### \ud83d\udd39 Pattern 5: The Measuring Stick / Offset Two Pointers (LC 19, LC 1721)\n* **What it does:** Locates the $k$-th node from the end in a single pass without knowing list length and without an array!\n* **Analogy:** A physical wooden ruler of fixed length $k$.\n  * Front finger (`fast`) on the $k$-th node from start.\n  * Back finger (`second`) at `head`.\n  * Slide both forward together until `fast.next is None`.\n  * When `fast` reaches the end, `second` is guaranteed to be standing on the $k$-th node from the end!\n\n```text\nhead = [ 1,  2,  3,  4,  5 ], k = 2\n\nStep 1: first walks k - 1 steps to [ 2 ]\nStep 2: fast = first, second = head\nStep 3: Slide both until fast.next is None:\n        second lands on [ 4 ] (2nd from end!)\n```\n\n```python\ndef swapNodes(head: Optional[ListNode], k: int) -> Optional[ListNode]:\n    first = head\n    second = head\n\n    # 1. Walk first to k-th node from start (k - 1 steps!)\n    for _ in range(k - 1):\n        first = first.next\n\n    # 2. Slide measuring stick to find k-th from end\n    fast = first\n    while fast.next:\n        fast = fast.next\n        second = second.next\n\n    # 3. Swap values in-place\n    first.val, second.val = second.val, first.val\n    return head\n```\n\n#### \ud83d\udd2c Key Findings & Pitfalls:\n* **The \"Fencepost\" Step Rule:** Standing on Node 1 means reaching Node $k$ takes **`k - 1` steps**, not $k$! (Using `range(k)` takes 1 step too many and crashes on $k = \\text{length}$).\n* **Swapping Inside Reconstruction Loop (Direction-Dependent Bug):**  \n  If you dump to an array and rebuild, never do `if i == k - 1: swap` inside the loop. If $k$ is in the back half (e.g. `[100, 90], k = 2`), index 0 is read before the swap happens, outputting duplicate values `[100, 100]`. Always swap *before* the loop!\n\n\ud83d\udc49 *See full breakdown in [`1721_swapping_nodes_in_a_linked_list.md`](./1721_swapping_nodes_in_a_linked_list.md).*\n\n---\n\n### \ud83d\udd39 Pattern 6: The Positional Stream Accumulator / Horner's Rule (LC 1290)\n* **What it does:** Converts a stream of incoming digits/bits in a linked list into a single integer in **$\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space** without string conversions or exponentiation!\n* **The Analogy:** How you read digits in base-10:\n  * See 1: `(0 * 10) + 1 = 1`\n  * See 2: `(1 * 10) + 2 = 12`\n  * See 3: `(12 * 10) + 3 = 123`\n* **In Base-2 (Binary):** Multiply by 2 instead of 10:\n  * `ans = ans * 2 + head.val`\n  * Or with bitwise operations: `ans = (ans << 1) | head.val`\n\n```python\ndef getDecimalValue(head: ListNode | None) -> int:\n    ans = 0\n    while head:\n        ans = (ans << 1) | head.val  # Shift left, add bit\n        head = head.next\n    return ans\n```\n\n#### \ud83d\udd2c Key Findings:\n* **The String Concatenation Trap (`s += ...`):** Building a binary string with `s += str(head.val)` creates a brand new string on every node in Python, secretly degrading memory/time to $\\mathcal{O}(n^2)$.\n* **Hardware Shift Register Model:** `(ans << 1) | bit` mirrors how network packets and CPU registers accumulate bits across a serial wire.\n\n\ud83d\udc49 *See full breakdown in [`1290_convert_binary_number_in_a_linked_list_to_integer.md`](./1290_convert_binary_number_in_a_linked_list_to_integer.md).*\n\n---\n\n## \u26a0\ufe0f 4. The 5 Golden Rules of Linked Lists\n\n1. **Always stitch NODES, not numbers:**  \n   `cur.next = list1` \u2705  \n   `cur.next = list1.val` \u274c (CRASH: integer has no `.next`).\n2. **Never check `.val` on `None`:**  \n   Always check `while list1 and list2:`. If you use `or`, the moment one list finishes, `list1.val` crashes with `AttributeError`.\n3. **Always save `curr.next` before breaking it:**  \n   In reversals: `nxt = curr.next` must happen **before** `curr.next = prev`. Otherwise, the rest of the chain floats away into void!\n4. **`dummy` stays, `cur` walks:**  \n   Never do `dummy = dummy.next`. Use `cur = cur.next` so `dummy` anchors the start!\n5. **Restore mutated structures in production:**  \n   If you reverse part of a list to inspect it (like in LC 234), re-reverse it before returning so you don't corrupt caller data in multi-threaded environments.\n\n---\n\n## \ud83d\uddfa\ufe0f 5. The Master Classification of Linked List Questions (The 90% Rule)\n\nAccording to the famous LeetCode masterclass ([Post #2434752](https://leetcode.com/discuss/post/2434752/90-of-the-linked-list-questions-on-linke-4xc3/)), 90%+ of all Linked List interview questions fall into this clean hierarchy:\n\n```text\n\u251c\u2500\u2500 # Fundamentals & Design (LC 707)\n\u251c\u2500\u2500 # Category I: Given 1 Linked List\n\u2502   \u251c\u2500\u2500 1) Simple Recursion & Single-Pass (LC 1721, LC 369, LC 1290)\n\u2502   \u251c\u2500\u2500 2) Modifying the LL (Node Count Same)\n\u2502   \u2502   \u251c\u2500\u2500 A. Reversing the Linked List (LC 206, LC 92, LC 234, LC 25, LC 1265)\n\u2502   \u2502   \u2514\u2500\u2500 B. Reordering the Nodes (LC 86 IMP, LC 143, LC 24, LC 61, LC 328)\n\u2502   \u251c\u2500\u2500 3) Delete Nodes (LC 19, LC 83, LC 82, LC 203)\n\u2502   \u251c\u2500\u2500 4) Insert Node (LC 708 Circular)\n\u2502   \u2514\u2500\u2500 5) Fast & Slow Pointer / Cycles & Midpoint (LC 141, LC 876, LC 2095, LC 142)\n\u251c\u2500\u2500 # Category II: Given 2 or More Linked Lists (LC 2, LC 445, LC 21, LC 23 IMP, LC 160)\n\u251c\u2500\u2500 # Category III: Hash Table Augmented (LC 138 IMP, LC 1836)\n\u251c\u2500\u2500 # Category IV: Design Data Structures Using LL (LC 146 LRU, LC 706, LC 1472)\n\u251c\u2500\u2500 # Category V: Merge Sort on List (LC 148 IMP)\n\u251c\u2500\u2500 # Category VI: LL + Tree Hybrids (LC 426, LC 430, LC 2130, LC 237)\n\u2514\u2500\u2500 # Category VII: To Do (Hard Design Boss Challenges - LC 432, LC 460, LC 2296)\n```\n\n### \ud83d\udca1 The Crucial Duplicate Removal Rule:\n* **Sorted List:** **NO extra memory needed!** Compare adjacent items: `cur.val == cur.next.val` $\\rightarrow \\mathcal{O}(1)$ space.\n* **Unsorted List:** **You MUST use a Hash Table / HashSet!** Without sorting, duplicate values can appear anywhere in the list $\\rightarrow \\mathcal{O}(n)$ space.\n\n\ud83d\udc49 *For full visual diagrams, templates, and problem checklists, check out **[`linked_list_90_percent_taxonomy.md`](./linked_list_90_percent_taxonomy.md)**.*\n\n", "category": "cheat_sheets"}, "cheat_sheets/prefix_sum_seesaw_cheat_sheet.md": {"title": "\u2696\ufe0f Prefix Sum (The Seesaw Balance Pattern) Master Cheat Sheet", "content": "# \u2696\ufe0f Prefix Sum (The Seesaw Balance Pattern) Master Cheat Sheet\n\n> **Pattern:** Prefix Sum & Total Conservation (The Seesaw Balance Pattern)  \n> **Target Audience:** Complete Beginner / 1st-Year CS Student  \n> **The Big Idea:** In an array of fixed elements, the sum is **conserved**. If you know the Total Sum and your Left Sum, the Right Sum is instantly free: $\\text{Right} = \\text{Total} - \\text{Left} - \\text{Current}$.  \n> **Core Analogy:** A playground seesaw with a pivot in the middle.\n\n---\n\n## \ud83d\udca1 1. What Problem Does It Solve?\n\nIn problems asking you to compare the **left side vs. the right side** of an array (e.g., finding a balance point, split point, or pivot):\n\n* **The Brute Force Trap ($\\mathcal{O}(n^2)$):**  \n  At every index $i$, re-slicing and re-summing `sum(nums[:i])` and `sum(nums[i+1:])` wastes $2.5 \\times 10^9$ operations on large arrays.\n* **The Seesaw Solution ($\\mathcal{O}(n)$ Time, $\\mathcal{O}(1)$ Space):**  \n  Compute the `total_sum = sum(nums)` **once upfront**. As you walk forward, accumulate `left_sum`. The right side is derived with zero slicing!\n\n---\n\n## \ud83c\udfaf 2. The 3-Second Mental Checklist (How to Spot It)\n\nAsk yourself these **3 trigger questions**:\n\n```text\n1. Am I looking for a \"split point\", \"pivot index\", or comparing \"elements before\" vs \"elements after\"?\n                                  +\n2. Does the comparison involve SUMS, COUNTS, or CUMULATIVE properties?\n                                  +\n3. Is the whole array fixed/static (known total)?\n                                  \u2502\n                                  \u25bc\n             \u2696\ufe0f THE SEESAW PREFIX BALANCE PATTERN! \u2696\ufe0f\n```\n\n---\n\n## \u2696\ufe0f 3. The Core Intuition: The Playground Seesaw Analogy\n\nImagine a seesaw with weights placed across it:\n\n```text\n              TOTAL SUM = 28\n \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n \u2502   1       7       3   \u2502 6 \u2502   5     6 \u2502\n \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n         \u25b2                 \u25b2       \u25b2\n     LEFT SIDE           PIVOT   RIGHT SIDE\n (running accumulator)   num[i]   (Total - Left - num[i])\n```\n\n### The Conservation Law:\n$$\\mathbf{\\text{Left Sum} + \\text{Pivot Element} + \\text{Right Sum} = \\text{Total Sum}}$$\n\nRearranging for the Right side:\n$$\\mathbf{\\text{Right Sum} = \\text{Total Sum} - \\text{Left Sum} - \\text{Pivot Element}}$$\n\n* **You do NOT need two arrays (`lsum` and `rsum`).**\n* **You do NOT need list slicing (`nums[:i]` or `nums[i+1:]`).**\n* You only need **one scalar integer variable**: `left_sum = 0`!\n\n---\n\n## \u2699\ufe0f 4. Universal Code Template\n\n```python\ndef find_balance_point(nums: list[int]) -> int:\n    total = sum(nums)      # Pass 1: O(n) upfront total\n    left_sum = 0\n    \n    for i, num in enumerate(nums):  # Pass 2: O(n) walk\n        # Seesaw balance test:\n        # Does Left Side == Right Side?\n        if left_sum == total - left_sum - num:\n            return i\n            \n        # Add current number to left side as we walk forward\n        left_sum += num\n        \n    return -1\n```\n\n---\n\n## \ud83e\udde9 5. Where Else Does This Pattern Appear?\n\n| LeetCode # | Problem Name | Seesaw Condition |\n| :--- | :--- | :--- |\n| **LC 724** | **Find Pivot Index** | `left_sum == total - left_sum - num` |\n| **LC 1991**| **Find Middle Index in Array** | Identical problem (alias of LC 724). |\n| **LC 2270**| **Number of Ways to Split Array** | Split between $i$ and $i+1$: `left_sum >= total - left_sum`. |\n| **LC 238** | **Product of Array Except Self** | Multiplicative version: $\\text{Prefix Product} \\times \\text{Suffix Product}$. |\n| **LC 2017**| **Grid Game** | Top row right sum vs. bottom row left sum across two parallel seesaws. |\n\n---\n\n## \u2753 6. How is This Different from Sliding Window or Kadane?\n\n| Pattern | Mental Model | Window / Range | When to Pick |\n| :--- | :--- | :--- | :--- |\n| **Seesaw Prefix** | **Balance Scale** | Left of $i$ vs. Right of $i$ (splits entire array) | Splitting array into two sides, pivots, equilibrium points. |\n| **Sliding Window** | **Rubber Band** | Subarray of size $K$ or dynamic $[L, R]$ | Finding longest/shortest/max *contiguous slice*. |\n| **Kadane's Algorithm** | **Toxic Debt** | Subarray ending at index $i$ | Finding max sum subarray with *negative penalties*. |\n\n---\n\n## \u26a0\ufe0f 7. Student Traps to Avoid in Interviews\n\n1. **Order of updating `left_sum`:**  \n   Always check the balance condition **BEFORE** adding `num` to `left_sum`! (The pivot element itself is strictly excluded from both sides).\n2. **First / Last index edge cases:**  \n   * For index `0`: `left_sum` starts at `0`. Right sum is `total - num`.\n   * For the last index: `left_sum` is `total - last_num`. Right sum is `0`.  \n   The formula naturally handles both boundaries without any `if i == 0` special cases!\n", "category": "cheat_sheets"}, "cheat_sheets/sliding_window_cheat_sheet.md": {"title": "\ud83e\ude9f Sliding Window Master Cheat Sheet & Decision Guide", "content": "# \ud83e\ude9f Sliding Window Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Sliding Window (Contiguous Subarrays & Substrings)  \n> **Audience:** Complete Beginner / 1st-Year CS Student  \n> **Analogy:** The Expanding & Contracting Rubber Band\n\n---\n\n## \ud83d\udca1 1. What is Sliding Window?\n\nImagine looking through a small rectangular window cut into a cardboard sheet, sliding it across a long sentence. \n\nInstead of re-calculating the sum or checking all characters of every possible slice using nested loops ($\\mathcal{O}(n^2)$), we slide a **window** across the array. \n\nWhen the window moves:\n* We **add** the new element entering on the right: `+ nums[right]`.\n* We **remove** the old element leaving on the left: `- nums[left]`.\n\nThis turns an $\\mathcal{O}(n^2)$ brute force into a lightning-fast **$\\mathcal{O}(n)$** single pass!\n\n```text\nBrute Force (Nested Loops): Re-calculates 1+2+3, then 2+3+4, then 3+4+5 from scratch... (Wasteful!)\nSliding Window:             Take old sum, add new guy, subtract old guy. Done in 1 step!\n```\n\n---\n\n## \ud83d\udd0d 2. How to Spot It in 3 Seconds (The Trigger Words)\n\nLook for these **two key phrases** in any problem:\n1. **\"Contiguous\"** (elements must be right next to each other, no skipping).\n2. **\"Subarray\"** or **\"Substring\"** + asking for **\"Maximum\"**, **\"Minimum\"**, or **\"Longest / Shortest\"**.\n\n> \u26a0\ufe0f **Difference between Two Pointers & Sliding Window:**  \n> * **Two Pointers:** Pointers often move independently or from opposite ends to find *pairs* or *boundaries*.  \n> * **Sliding Window:** Both pointers move in the *same direction* to define a *continuous range of elements* (a window).\n\n---\n\n## \ud83d\udcd0 3. The Two Flavors of Sliding Window\n\n### \ud83d\udd39 Flavor 1: Fixed Size Window ($K$)\n* **The Window Size Never Changes:** It is always exactly length $K$.\n* **Analogy:** A magnifying glass of width $K$ sliding across a book 1 character at a time.\n* **The Golden Principle (Running Differential):**\n  Never recalculate the entire window ($\\mathcal{O}(k)$ per step $\\implies \\mathcal{O}(n \\cdot k)$ TLE). Instead, update only the 2 boundary elements in **$\\mathcal{O}(1)$**:\n  $$\\text{window} = \\text{window} + \\text{entering\\_element} - \\text{leaving\\_element}$$\n\n#### \u2699\ufe0f Template A: Numerical Sum / Average (LC 643)\n```python\ndef max_sum_fixed_window(nums: list[int], k: int) -> int:\n    # 1. Establish baseline for first window of size k\n    window_sum = sum(nums[:k])\n    max_sum = window_sum\n    \n    # 2. Slide from index k to end\n    for i in range(k, len(nums)):\n        window_sum += nums[i] - nums[i - k]  # Add entering nums[i], subtract leaving nums[i-k]\n        if window_sum > max_sum:\n            max_sum = window_sum\n            \n    return max_sum\n```\n> [!TIP]\n> **Deferred Division for Averages:** Never divide by $k$ inside the loop (`avg = tot / k`). Doing float math $100,000$ times is 1.6\u00d7 slower. Maximize the integer sum first, and divide by $k$ **once at return**!\n\n#### \u2699\ufe0f Template B: String Frequency / Condition Counter (LC 1456)\n*Strings don't support arithmetic (`+` / `-`), so you update an **integer score counter**:*\n```python\ndef max_vowels_fixed_window(s: str, k: int) -> int:\n    vowels = {'a', 'e', 'i', 'o', 'u'}\n    \n    # 1. Base window\n    count = sum(1 for ch in s[:k] if ch in vowels)\n    max_count = count\n    \n    # 2. Slide window\n    for i in range(k, len(s)):\n        # Entering element: s[i]\n        if s[i] in vowels:\n            count += 1\n        # Leaving element: s[i - k]\n        if s[i - k] in vowels:\n            count -= 1\n            \n        if count > max_count:\n            max_count = count\n            \n    return max_count\n```\n\n\ud83d\udc49 *Walkthroughs:* [LC 643: Maximum Average Subarray I](./643_maximum_average_subarray_i.md) | [LC 1456: Maximum Number of Vowels](./1456_maximum_number_of_vowels_in_a_substring_of_given_length.md)\n\n---\n\n### \ud83d\udd39 Flavor 2: Dynamic (Variable Size) Window\n* **The Window Grows and Shrinks Like a Rubber Band:**\n  * **Stretch Right:** Keep expanding `right` to explore and include elements.\n  * **Shrink Left:** If the window violates a rule (e.g., has a duplicate letter or sum is too big), pull `left` forward until it becomes valid again.\n* **Classic Problem:** *Longest Substring Without Repeating Characters* (LC 3).\n\n```text\nArray: [ a , b , c , a , b , c ]\n\nStep 1 (Expand): Window has 'a', 'b', 'c' -> [a, b, c] (Valid! Length 3)\nStep 2 (Conflict): 'a' enters -> [a, b, c, a] (Duplicate 'a'! Invalid!)\nStep 3 (Shrink):   Move left past the old 'a' -> [b, c, a] (Valid again! Length 3)\n```\n\n#### \u2699\ufe0f Universal Dynamic Window Template\n```python\ndef dynamic_sliding_window(s: str) -> int:\n    left = 0\n    seen = set()  # Tracks current elements in the window\n    max_len = 0\n    \n    for right in range(len(s)):\n        # While window is INVALID, shrink it from the left\n        while s[right] in seen:\n            seen.remove(s[left])\n            left += 1\n            \n        # Add right element to make window valid\n        seen.add(s[right])\n        \n        # Update best answer (window size is right - left + 1)\n        max_len = max(max_len, right - left + 1)\n        \n    return max_len\n```\n\n---\n\n## \ud83c\udfc6 4. Quick Decision Matrix\n\n| Problem Goal | Window Type | Condition to Shrink `left` | Classic LeetCode |\n|---|---|---|---|\n| Max sum of size $K$ | **Fixed ($K$)** | Automatically slide when index $\\ge K$ | LC 643: Max Average Subarray |\n| Longest substring without duplicates | **Dynamic** | While `s[right]` is already in `set` | LC 3: Longest Substring Without Repeats |\n| Minimum size subarray with sum $\\ge S$ | **Dynamic** | While `current_sum >= target` (try to make it smaller!) | LC 209: Minimum Size Subarray Sum |\n| Max consecutive ones if you can flip $K$ zeroes | **Dynamic** | While `zero_count > k` | LC 1004: Max Consecutive Ones III |\n\n---\n\n## \u26a0\ufe0f 5. Student Pitfalls to Avoid\n\n1. **Off-by-one window length formula:**  \n   The number of elements between `left` and `right` inclusive is **`right - left + 1`** (NOT `right - left`).\n   * Example: indices 2 to 4 has $4 - 2 + 1 = 3$ elements (indices 2, 3, 4).\n2. **Forgetting that `left` can move multiple times:**  \n   Notice the `while` loop inside: `while condition: left += 1`. Don't use an `if` statement when multiple items need to be kicked out of the window!\n3. **The `s[k]` vs `s[i]` indexing trap:**  \n   Inside `for i in range(k, len(s)):`, always use **`s[i]`** for the entering element. Using `s[k]` accidentally freezes the lookup at the exact same index $k$ on every step!\n4. **The \"Can `count` drop below 0?\" myth:**  \n   Beginners often write `if count < 0: count = 0`. This is mathematically impossible in a bug-free window! Every element leaving at `i - k` was previously added when it entered at `i`. You only subtract if the leaving element satisfies the condition (meaning it was already counted and `count >= 1`). Total additions $\\ge$ total subtractions at all times:\n   $$0 \\le \\text{count} \\le k$$\n", "category": "cheat_sheets"}, "cheat_sheets/two_pointers_cheat_sheet.md": {"title": "\ud83d\udcdd Two Pointers Master Cheat Sheet & Decision Guide", "content": "# \ud83d\udcdd Two Pointers Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Two Pointers Technique  \n> **Target Audience:** Quick reference for physical notebook notes and rapid interview review.  \n> **Philosophy:** Two pointers is not one formula \u2014 it is a choreography of two markers across 3 formations.\n\n---\n\n## \ud83d\udca1 1. What is Two Pointers?\n\nInstead of using two nested loops (`for i in ... for j in ...`) which takes **$\\mathcal{O}(n^2)$** time, we use **two integer index variables** (`left/right`, `slow/fast`, or `p1/p2`) that move through the data in a coordinated way, reducing time to **$\\mathcal{O}(n)$**.\n\n> **The Analogy:**  \n> A nested loop is like testing every single lock with every single key.  \n> Two pointers is like holding your left finger on a word while your right hand turns pages.\n\n---\n\n## \ud83c\udfaf 2. When to Use It? (The 3-Second Mental Checklist)\n\nAsk yourself these 3 questions:\n\n1. **Are the relative positions fixed or sorted?**  \n   *(You cannot shuffle or randomly rearrange elements; their original left-to-right order matters).*\n2. **Can I make decisions without backtracking?**  \n   *(Once a pointer moves forward, it never needs to step backward).*\n3. **Am I searching for pairs, boundaries, or comparing/matching TWO sequences (strings or arrays)?**\n\n\ud83d\udc49 If all three are **YES**, start writing Two Pointers.\n\n---\n\n## \ud83d\udcd0 3. The 5 Formations (How to Pick Which One)\n\n```text\nFormation A: THE SQUEEZE         Formation B: SCOUT & WRITER       Formation C: TWO CONVEYOR BELTS\n(Opposite ends, 1 array)         (Same direction, 1 array)         (Same direction, 2 separate arrays)\n\n l \u2500\u2500\u2500\u2500\u25ba             \u25c4\u2500\u2500\u2500\u2500 r     slow (writer)                     p1 \u2500\u2500\u2500\u2500\u25ba (on Array 1)\n [ .   .   .   .   .   .   . ]    \u25bc                                [ .   .   . ]\n                                 [ .   .   .   .   .   . ]         [ .   .   .   .   . ]\n                                  \u25b2                                p2 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba (on Array 2)\n                                 fast (scout) \u2500\u2500\u2500\u2500\u2500\u2500\u25ba\n\nFormation D: ANCHOR & SCOUT (Chunking / Grouping)\n(Same direction, 1 array, leapfrogging runs)\n\n anchor (marks start of streak)\n  \u25bc\n [ 0 ,  1 ,  2 ,  4 ,  5 ,  7 ]\n  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n              \u25b2\n             scout (sprints until streak breaks)\n\nFormation E: TAIL-BUFFER / REVERSE PLACEMENT\n(Backward movement, avoids overwriting unread elements)\n\n                   p1 \u25c4\u2500\u2500\u2500\u2500                p (write pointer) \u25c4\u2500\u2500\u2500\u2500\n nums1 = [ 2 , 5 , 6 ,  0 , 0 , 0 ]\n nums2 = [ 1 , 3 , 4 ]\n                   \u25b2\n                   p2 \u25c4\u2500\u2500\u2500\u2500\n```\n\n---\n\n### \ud83d\udd39 Formation A: \"The Squeeze\"\n* **Pointers:** `l = 0`, `r = len(arr) - 1` (opposite ends walking inward).\n* **When to use:**\n  * Testing symmetry from outside in (*Valid Palindrome*).\n  * Pair search in a sorted array (*Two Sum II*, *3Sum*).\n  * Boundary limits / geometric containers (*Container With Most Water*).\n  * In-place subsegment flipping (*Rotate Array - LC 189*, *Reverse String - LC 344*).\n* **Template:**\n  ```python\n  l, r = 0, len(arr) - 1\n  while l < r:\n      if condition(arr[l], arr[r]):\n          l += 1\n      else:\n          r -= 1\n  ```\n\n\ud83d\udc49 *See full breakdown in [`11_container_with_most_water.md`](./11_container_with_most_water.md), [`15_3sum.md`](./15_3sum.md), and [`189_rotate_array.md`](./189_rotate_array.md).*\n\n---\n\n### \ud83d\udd39 Formation B: \"Scout & Writer\" (Fast & Slow)\n* **Pointers:** `slow = 0`, `fast = 0` (same direction, 1 array).\n* **Roles:**\n  * `fast` (Scout): Inspects every element.\n  * `slow` (Writer): Marks the boundary where the next valid element belongs.\n* **When to use:**\n  * Modifying an array **in-place** without extra memory (*Move Zeroes*, *Remove Duplicates*).\n  * Cycle detection in linked lists (Tortoise & Hare: `slow += 1`, `fast += 2`).\n* **Template:**\n  ```python\n  slow = 0\n  for fast in range(len(nums)):\n      if is_valid(nums[fast]):\n          nums[slow] = nums[fast]\n          slow += 1\n  ```\n\n\ud83d\udc49 *See full breakdown in [`283_move_zeroes.md`](./283_move_zeroes.md), [`27_remove_element.md`](./27_remove_element.md), [`26_remove_duplicates_from_sorted_array.md`](./26_remove_duplicates_from_sorted_array.md), and [`80_remove_duplicates_from_sorted_array_ii.md`](./80_remove_duplicates_from_sorted_array_ii.md).*\n\n---\n\n### \ud83d\udd39 Formation C: \"Two Conveyor Belts\"\n* **Pointers:** `p1 = 0` on Sequence 1, `p2 = 0` on Sequence 2.\n* **Roles:** Move forward independently based on element comparison.\n* **When to use:**\n  * Comparing, matching, or merging **two separate sequences/strings** (*Is Subsequence*, *Merge Two Sorted Arrays*).\n* **Template:**\n  ```python\n  p1, p2 = 0, 0\n  while p1 < len(arr1) and p2 < len(arr2):\n      if arr1[p1] == arr2[p2]:\n          p1 += 1\n      p2 += 1\n  ```\n\n---\n\n### \ud83d\udd39 Formation D: \"Anchor & Scout\" (Chunking / Intervals)\n* **Pointers:** `anchor` (start of streak), `scout` / `i` (advancing through the streak).\n* **Roles:**\n  * `anchor` (`start`): Drops an anchor at the start of a continuous streak or category.\n  * `scout` (`i`): Sprints forward with an inner `while` loop as long as the streak condition holds.\n  * When streak breaks: Record the chunk `[anchor, scout]`, then leapfrog `anchor` to the next element.\n* **When to use:**\n  * Grouping contiguous ranges (*Summary Ranges - LC 228*).\n  * Run-Length Encoding / In-place string compression (*String Compression - LC 443*).\n  * Merging overlapping time blocks (*Merge Intervals - LC 56*).\n* **Template:**\n  ```python\n  res = []\n  i = 0\n  while i < len(nums):\n      start = nums[i]\n      while i + 1 < len(nums) and nums[i + 1] == nums[i] + 1:\n          i += 1\n      \n      # Process chunk from start to nums[i]\n      res.append(f\"{start}->{nums[i]}\" if start != nums[i] else str(start))\n      i += 1\n  ```\n\n\ud83d\udc49 *See full breakdown in [`228_summary_ranges.md`](./228_summary_ranges.md).*\n\n---\n\n### \ud83d\udd39 Formation E: \"The Tail-Buffer / Reverse Placement Pattern\"\n* **Pointers:** `p1 = m - 1` (last valid item in Array 1), `p2 = n - 1` (last item in Array 2), `p = m + n - 1` (write pointer at safe tail).\n* **The \"Bulldozer Collision\" Problem:** Moving left-to-right overwrites elements you haven't read yet!\n* **The Tail-Buffer Rule:** Look for where the empty space lives. If the zeros/buffer are at the **tail**, iterate from **right-to-left**. Place the **largest** elements first!\n* **When to use:**\n  * Merging sorted arrays in-place with trailing buffer (*Merge Sorted Array - LC 88*).\n  * Replacing characters in-place with extra buffer space (*URLify / Replace Spaces*).\n  * Processing operations with backspaces from the end (*Backspace String Compare - LC 844*).\n  * Squeezing extremes from outside inward to fill an array backwards (*Squares of a Sorted Array - LC 977*).\n* **Template:**\n  ```python\n  p1, p2, p = m - 1, n - 1, m + n - 1\n  while p1 >= 0 and p2 >= 0:\n      if nums1[p1] > nums2[p2]:\n          nums1[p] = nums1[p1]\n          p1 -= 1\n      else:\n          nums1[p] = nums2[p2]\n          p2 -= 1\n      p -= 1\n  while p2 >= 0:  # Copy any remaining nums2 items\n      nums1[p] = nums2[p2]\n      p2 -= 1\n      p -= 1\n  ```\n\n\ud83d\udc49 *See full breakdown in [`88_merge_sorted_array.md`](./88_merge_sorted_array.md).*\n\n---\n\n## \ud83c\udfc6 4. Quick Decision Matrix\n\n| What is the problem asking? | Input Data | Formation | Initial Pointers | Classic Problem |\n|---|---|---|---|---|\n| Search for a pair with target sum | 1 Sorted Array | **The Squeeze** | `l = 0`, `r = len - 1` | Two Sum II (LC 167) |\n| Check symmetry / Palindrome | 1 String / Array | **The Squeeze** | `l = 0`, `r = len - 1` | Valid Palindrome (LC 125) |\n| Find maximum container area | 1 Array | **The Squeeze** | `l = 0`, `r = len - 1` | Container With Most Water (LC 11) |\n| Remove duplicates / Move zeroes / Remove element in-place | 1 Array | **Scout & Writer** | `slow = 0`, `fast = 0` | Move Zeroes (LC 283), Remove Element (LC 27), Remove Duplicates I & II (LC 26, LC 80) |\n| Detect loop in a linked list | 1 Linked List | **Scout & Writer** | `slow = head`, `fast = head` | Linked List Cycle (LC 141) |\n| Check if String A is subsequence of String B | 2 Strings / Arrays | **Conveyor Belts** | `p1 = 0`, `p2 = 0` | Is Subsequence (LC 392) |\n| Merge two arrays in-place with tail buffer | 2 Arrays (1 with buffer) | **Tail-Buffer (Reverse)** | `p1 = m - 1`, `p2 = n - 1`, `p = end` | Merge Sorted Array (LC 88) |\n| Group contiguous runs / summary ranges | 1 Sorted Array / String | **Anchor & Scout** | `i = 0`, inner while | Summary Ranges (LC 228), String Compression (LC 443) |\n\n---\n\n## \ud83d\udd0d 5. Anchor & Scout vs. Sliding Window: What's the Difference?\n\nMany candidates ask: *\"Isn't Summary Ranges or String Compression just a Sliding Window since we have a `start` and an `end`?\"*\n\n**Answer:** No! The difference is **Overlapping vs. Non-Overlapping**:\n\n```text\nSLIDING WINDOW (Overlapping Frames):\n  Frame 1: [ 0 , 1 , 2 ]\n  Frame 2:     [ 1 , 2 , 4 ]\n  Frame 3:         [ 2 , 4 , 5 ]\n  \ud83d\udc49 Windows slide step-by-step and OVERLAP!\n  \ud83d\udc49 Elements (like 1 and 2) are tested inside multiple candidate windows.\n\nANCHOR & SCOUT / CHUNKING (Summary Ranges):\n  Chunk 1: [ 0 , 1 , 2 ] \n  Chunk 2:               [ 4 , 5 ] \n  Chunk 3:                         [ 7 ]\n  \ud83d\udc49 Chunks NEVER overlap!\n  \ud83d\udc49 Every element belongs to EXACTLY ONE chunk.\n```\n\n### \ud83c\udfa5 The Real-World Analogies:\n* **Sliding Window = A Moving Video Camera \ud83d\udcf9:** Panning smoothly across a street. Every frame overlaps 90% with the previous frame to find the \"longest/shortest/maximum\" segment (*LC 3, LC 643*).\n* **Anchor & Scout = A Bread Knife Slicing a Baguette \ud83e\udd56:** You slice off a clean piece, wrap it up, and the knife leapfrogs forward to cut the next independent piece (*LC 228, LC 443*).\n\n### \ud83d\udea8 The 3-Second Rule:\nAsk yourself: **\"Does a single element belong to multiple candidate answers?\"**\n* **If YES:** $\\implies$ **Sliding Window**\n* **If NO:** $\\implies$ **Two Pointers (Anchor & Scout / Partitioning)**\n\n---\n\n## \ud83c\udf9b\ufe0f 6. The Universal Mental Rule: \"Which Pointer Do I Move?\"\n\nNever guess or memorize whether to move `left` or `right`. Use the **Volume Knob Analogy**:\n\nIn a sorted array, numbers go from **Smallest $\\to$ Largest**:\n```text\n[ -4 ,  -1 ,   0 ,   1 ,   2 ,   5 ]\n  \u25b2                               \u25b2\n Smallest                       Biggest\n (left)                         (right)\n```\n\nThink of your pointers as two knobs controlling your state:\n* **Moving `left` forward (`left += 1`)** $\\to$ picks a **bigger** number $\\to$ **Turns the sum UP \ud83d\udd0a**\n* **Moving `right` backward (`right -= 1`)** $\\to$ picks a **smaller** number $\\to$ **Turns the sum DOWN \ud83d\udd09**\n\n### The 2-Question Steering Checklist:\n1. **What is wrong with my current state?**\n   * *Is my sum too small / too cold?* (e.g. `sum < target`) $\\to$ I need a bigger number!\n   * *Is my sum too big / too hot?* (e.g. `sum > target`) $\\to$ I need a smaller number!\n   * *Is my container bottlenecked?* $\\to$ The shorter wall is limiting my area!\n2. **Which pointer has the power to fix that problem?**\n   * Need to **increase** the value? $\\to$ Move `left += 1`.\n   * Need to **decrease** the value? $\\to$ Move `right -= 1`.\n   * Bottlenecked by the shorter wall? $\\to$ Move the shorter wall inward!\n\n> \u2b50 **Why this never fails:** Because the array is sorted, every move has a **100% predictable, monotonic outcome**. Moving `left` can only increase values; moving `right` can only decrease them.\n\n---\n\n## \u26a0\ufe0f 6. The Golden Rule\n> **\"Pointers only move in one direction. If you ever find yourself moving a pointer backward, you don't need Two Pointers \u2014 you need a Stack, a Sliding Window, or Backtracking.\"**\n\n", "category": "cheat_sheets"}, "02_linked_lists/01_linked_list_fundamentals.md": {"title": "\ud83e\udde0 Linked List Fundamentals: How to Think Like a Computer", "content": "# \ud83e\udde0 Linked List Fundamentals: How to Think Like a Computer\n\n> If you feel weak with Linked Lists, **start here**. This guide is designed to build 100% intuition with zero jargon.\n\n---\n\n## 1. What is an Array vs. What is a Linked List?\n\n### The Array (A Row of Assigned Hotel Rooms)\nIn an array `[10, 20, 30]`, memory is allocated in one contiguous block:\n- Room 101: `10`\n- Room 102: `20`\n- Room 103: `30`\n\nBecause they are side-by-side, if you want index `2`, your computer jumps directly to `101 + 2 = 103`. That's $\\mathcal{O}(1)$ time. But inserting a new item at the front forces everyone to pack their bags and shift rooms ($\\\\mathcal{O}(N)$).\n\n### The Linked List (A Scavenger Hunt / Treasure Hunt)\nIn a Linked List, elements can be scattered anywhere in the computer's memory.\n- You find Clue 1 at Address `0x100`: It says: *\"My value is 10, and the next clue is at Address `0x850`\"*.\n- You walk to Address `0x850`: It says: *\"My value is 20, and the next clue is at Address `0x320`\"*.\n- You walk to Address `0x320`: It says: *\"My value is 30, and there are no more clues (`None`)\"*.\n\n```text\n[ Address: 0x100 ]        [ Address: 0x850 ]        [ Address: 0x320 ]\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 val: 10\u2502 0x850 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba\u2502 val: 20\u2502 0x320 \u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba\u2502 val: 30\u2502 None  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518        \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518        \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n> **Crucial Takeaway:**  \n> A node does **not** know who came before it. It only holds its own `val` and an arrow `next` pointing to the next node.\n\n---\n\n## 2. Python ListNode Anatomy\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val     # The cargo / treasure / data\n        self.next = next   # The rope / pointer to the next node\n```\n\nWhen you do:\n```python\nnodeA = ListNode(10)\nnodeB = ListNode(20)\nnodeA.next = nodeB\n```\nYou are simply tying a rope from `nodeA` to `nodeB`.\n\n---\n\n## 3. The 2 Golden Rules of Pointer Mechanics (DO NOT CONFUSE THESE!)\n\nThis is where 90% of beginners get stuck. Look closely at these two operations:\n\n### Rule 1: Modifying the Node (`node.next = ...`)\n- **What it does:** You are **altering the object** in memory. You are untying or tying a rope.\n- **Example:** `curr.next = ListNode(5)` attaches a new node to `curr`.\n\n### Rule 2: Moving the Label (`curr = curr.next`)\n- **What it does:** You are **NOT changing any node in memory**. You are just picking up your sticky note named `curr` and placing it onto the next node down the chain.\n- **Example:** `curr = curr.next` means: *\"Worker, take one step forward along the rope.\"*\n\n```text\nBefore: \n  [ Node 1 ] \u2500\u2500\u2500\u2500\u25ba [ Node 2 ]\n      \u25b2\n      \u2502\n     curr\n\nOperation: curr = curr.next\n\nAfter:\n  [ Node 1 ] \u2500\u2500\u2500\u2500\u25ba [ Node 2 ]\n                       \u25b2\n                       \u2502\n                      curr   (No nodes were altered! Only curr moved!)\n```\n\n---\n\n## 4. Why Losing the Head Means Losing the Entire List\n\nIn Python, variables are just labels pointing to memory addresses.\n\nIf you have:\n`head -> [ 1 ] -> [ 2 ] -> [ 3 ] -> None`\n\nIf you write:\n```python\nhead = head.next  # head now points to [ 2 ]\n```\nNode `[ 1 ]` still exists in memory, but because no variable points to it, Python's Garbage Collector will delete it. And because nothing points to `[ 1 ]`, you can **never get back to it**.\n\n---\n\n## 5. The Universal Dummy Node (Anchor) Pattern\n\nWhenever you need to **construct a new linked list** or **modify the head of an existing list**, always use a **Dummy Node**.\n\n### The Train & Stake Analogy:\n1. \ud83d\udccc **`dummy` (The Stake):** Hammered into the ground at the start. It never moves.\n2. \ud83d\udc77\u200d\u2642\ufe0f **`curr` (The Worker):** Walks forward down the tracks, stitching new cars onto the end.\n\n```python\ndummy = ListNode(0)  # The anchor\ncurr = dummy         # The builder starts at the anchor\n\nfor val in [10, 20, 30]:\n    curr.next = ListNode(val)  # 1. Stitch new node to curr\n    curr = curr.next           # 2. Step onto the new node\n\n# Return the real head (everything after the stake):\nreturn dummy.next\n```\n", "category": "02_linked_lists"}, "02_linked_lists/02_add_two_numbers.md": {"title": "\ud83d\udd22 LeetCode 2: Add Two Numbers \u2013 DSA Pattern & Solution Guide", "content": "# \ud83d\udd22 LeetCode 2: Add Two Numbers \u2013 DSA Pattern & Solution Guide\n\n> **Pattern:** Linked List Traversal with Carry State  \n> **Difficulty:** Medium  \n> **Source Reference:** [NeetCode - Add Two Numbers (LeetCode 2)](https://www.youtube.com/watch?v=wgFPrzTjm7s)\n\n---\n\n## \ud83d\udccc Problem Description\nYou are given two **non-empty** linked lists representing two non-negative integers. The digits are stored in **reverse order**, and each of their nodes contains a single digit. Add the two numbers and return the sum as a linked list.\n\n```text\nInput: l1 = [2,4,3], l2 = [5,6,4]\nOutput: [7,0,8]\nExplanation: 342 + 465 = 807.\n```\n\n---\n\n## \ud83d\udca1 Key Intuitions & Why Reverse Order Helps\n\n### Elementary School Addition\nWhen adding multi-digit numbers by hand, you always start from the **least significant digit (ones place)** and move towards the left, carrying over any value $\\\\ge 10$:\n\n```text\n    1  (carry)\n    3  4  2\n  + 4  6  5\n  ---------\n    8  0  7\n```\n\nBecause the linked lists are **already reversed**, the head node of each list is the **ones place**:\n- $L_1$: `2 -> 4 -> 3` (corresponds to $342$)\n- $L_2$: `5 -> 6 -> 4` (corresponds to $465$)\n\nWe can traverse from `l1` and `l2` head directly without needing to reverse the lists first!\n\n---\n\n## \ud83d\udd0d Visual Step-by-Step Walkthrough\n\n### Example 1: Standard Addition (`[2,4,3] + [5,6,4]`)\n1. **Ones place:** `2 + 5 + 0 = 7` $\\\\implies$ Digit `7`, Carry `0`. Create node `[7]`\n2. **Tens place:** `4 + 6 + 0 = 10` $\\\\implies$ Digit `0`, Carry `1`. Create node `[0]`\n3. **Hundreds place:** `3 + 4 + 1 = 8` $\\\\implies$ Digit `8`, Carry `0`. Create node `[8]`\n- **Result List:** `7 -> 0 -> 8` (Represents $807$)\n\n---\n\n### Example 2: Lists of Different Lengths (`[2,4,3] + [5,6,4,9]`)\n- $L_1$: `2 -> 4 -> 3` ($342$)\n- $L_2$: `5 -> 6 -> 4 -> 9` ($9465$)\n\nWhen `l1` runs out of nodes, we treat its missing digits as `0`:\n1. `2 + 5 + 0 = 7` $\\\\implies$ Digit `7`, Carry `0`\n2. `4 + 6 + 0 = 10` $\\\\implies$ Digit `0`, Carry `1`\n3. `3 + 4 + 1 = 8` $\\\\implies$ Digit `8`, Carry `0`\n4. `0 (missing l1) + 9 + 0 = 9` $\\\\implies$ Digit `9`, Carry `0`\n- **Result List:** `7 -> 0 -> 8 -> 9` ($9807$)\n\n---\n\n### Example 3: The Trailing Carry Edge Case (`[7] + [8]`)\n- $L_1$: `7`\n- $L_2$: `8`\n- $7 + 8 = 15 \\\\implies$ Digit `5`, Carry `1`.\n- Both `l1` and `l2` become `None` (exhausted).\n- **Crucial check:** Since `carry = 1`, loop condition `while l1 or l2 or carry:` runs one last time, appending final node `[1]`!\n- **Result List:** `5 -> 1` ($15$)\n\n---\n\n## \u2753 Deep Dive: Why do we need `cur = dummy`? Isn't `dummy` alone enough?\n\n### \ud83d\ude82 The Train & The Stake Analogy\n\nImagine you are building a toy train on a track. \n\nEach train car has only **one hitch on its back** to connect to the next car (`.next`). There is **no reverse gear** and **no rear-view mirror**\u2014you can only move forward.\n\n#### The Two Roles:\n1. \ud83d\udccc **`dummy` (The Wooden Stake):** A heavy wooden stake hammered into the ground at the very beginning of the track. It **never moves**. Its only job is to remember where the train started.\n2. \ud83d\udc77\u200d\u2642\ufe0f **`cur` (The Builder/Worker):** You, walking down the track with tools in your hand.\n\n---\n\n### Step-by-Step Visual Walkthrough:\n\n#### Step 0: Setup\n```python\ndummy = ListNode()  # Hammer stake into the ground\ncur = dummy         # Worker stands at the stake\n```\n```text\n[ STAKE (dummy) ] \n       \u25b2\n       \u2502\n   \ud83d\udc77\u200d\u2642\ufe0f (cur stands here)\n```\n\n#### Step 1: Add digit 7\n```python\ncur.next = ListNode(7)  # Attach Car 7 to whatever you are touching\ncur = cur.next          # Step forward onto Car 7\n```\n```text\n[ STAKE (dummy) ] \u2500\u2500\u2500\u2500\u25ba [ CAR 7 ]\n                            \u25b2\n                            \u2502\n                        \ud83d\udc77\u200d\u2642\ufe0f (cur walked here)\n```\n*Notice: `dummy` did NOT move. But `dummy.next` is now Car 7!*\n\n#### Step 2: Add digit 0\n```python\ncur.next = ListNode(0)  # Attach Car 0 to Car 7\ncur = cur.next          # Step forward onto Car 0\n```\n```text\n[ STAKE (dummy) ] \u2500\u2500\u2500\u2500\u25ba [ CAR 7 ] \u2500\u2500\u2500\u2500\u25ba [ CAR 0 ]\n                                            \u25b2\n                                            \u2502\n                                        \ud83d\udc77\u200d\u2642\ufe0f (cur walked here)\n```\n\n#### Step 3: Add digit 8\n```python\ncur.next = ListNode(8)  # Attach Car 8 to Car 0\ncur = cur.next          # Step forward onto Car 8\n```\n```text\n[ STAKE (dummy) ] \u2500\u2500\u2500\u2500\u25ba [ CAR 7 ] \u2500\u2500\u2500\u2500\u25ba [ CAR 0 ] \u2500\u2500\u2500\u2500\u25ba [ CAR 8 ]\n                                                            \u25b2\n                                                            \u2502\n                                                        \ud83d\udc77\u200d\u2642\ufe0f (cur walked here)\n```\n\n#### \ud83c\udfc1 Returning the Result\nWhen the function finishes:\n- `cur` is standing way at the back on `[ CAR 8 ]`. If you returned `cur`, you would only return the tail!\n- `dummy` is still sitting at the very front of the track!\n- `dummy.next` points directly to the real first car `[ CAR 7 ]`!\n\n```python\nreturn dummy.next  # Returns 7 -> 0 -> 8\n```\n\n---\n\n### \ud83d\udca5 What happens if you try to use `dummy` alone?\n\n#### \u274c Flaw 1: If you advance `dummy`\n```python\ndummy = ListNode()\n# In loop:\ndummy.next = ListNode(7)\ndummy = dummy.next  # You move the stake forward!\n```\nAt the end, `dummy` is on Car 8. `dummy.next` is `None`. You lost the beginning of the list forever!\n\n#### \u274c Flaw 2: If you DO NOT advance `dummy`\n```python\ndummy = ListNode()\n# In loop:\ndummy.next = ListNode(7)  # Stake -> 7\ndummy.next = ListNode(0)  # Overwrite! Stake -> 0 (Car 7 is lost!)\ndummy.next = ListNode(8)  # Overwrite! Stake -> 8 (Car 0 is lost!)\n```\n`dummy.next` will only point to the final single digit `[8]`.\n\n---\n\n## \ud83d\udcbb Complete Python 3 Solution\n\n```python\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nclass Solution:\n    def addTwoNumbers(self, l1: ListNode, l2: ListNode) -> ListNode:\n        # 1. Create a dummy node as an anchor, and a moving pointer 'cur'\n        dummy = ListNode()\n        cur = dummy\n        \n        carry = 0\n        \n        # 2. Continue while any list has digits left OR there is a trailing carry\n        while l1 or l2 or carry:\n            # Extract digits (default to 0 if list is exhausted)\n            v1 = l1.val if l1 else 0\n            v2 = l2.val if l2 else 0\n            \n            # 3. New digit and carry calculation\n            val = v1 + v2 + carry\n            carry = val // 10\n            val = val % 10\n            \n            # 4. Insert new node at current position and advance cursor\n            cur.next = ListNode(val)\n            cur = cur.next\n            \n            # 5. Advance list pointers if available\n            l1 = l1.next if l1 else None\n            l2 = l2.next if l2 else None\n            \n        # 6. Return the head of the newly created list\n        return dummy.next\n```\n\n---\n\n## \u23f1\ufe0f Complexity Analysis\n- **Time Complexity:** $\\\\mathcal{O}(\\\\max(N, M))$\n- **Space Complexity:** $\\\\mathcal{O}(\\\\max(N, M))$\n", "category": "02_linked_lists"}, "02_linked_lists/03_reverse_linked_list.md": {"title": "\ud83d\udd04 LeetCode 206: Reverse Linked List \u2013 Master Guide", "content": "# \ud83d\udd04 LeetCode 206: Reverse Linked List \u2013 Master Guide\n\n> **Pattern:** In-Place Pointer Flipping (3-Pointer Technique)  \n> **Difficulty:** Easy (Must-Know Foundation)\n\n---\n\n## \ud83d\udccc Problem Description\nGiven the `head` of a singly linked list, reverse the list, and return the reversed list.\n\n```text\nInput:  1 -> 2 -> 3 -> 4 -> 5 -> None\nOutput: 5 -> 4 -> 3 -> 2 -> 1 -> None\n```\n\n---\n\n## \ud83d\udca1 The Core Intuition: The 3-Pointer Technique\n\nTo flip an arrow `A -> B` into `A <- B`, you need 3 variables:\n1. `prev`: The node behind us (where our arrow should point to). Initially `None`.\n2. `curr`: The node we are currently standing on. Initially `head`.\n3. `nxt` (or `temp`): A temporary bookmark to remember where the rest of the list is *before* we break the forward arrow!\n\n---\n\n## \ud83d\udd0d Step-by-Step Frame-by-Frame Walkthrough\n\nLet's reverse `1 -> 2 -> 3 -> None`:\n\n### Initial State:\n```text\nNone       [ 1 ] \u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba None\n \u25b2           \u25b2\n \u2502           \u2502\nprev        curr\n```\n\n---\n\n### Iteration 1 (at Node 1):\n1. **Save next node:** `nxt = curr.next` (Bookmark Node 2)\n2. **Reverse arrow:** `curr.next = prev` (Node 1 now points to `None`)\n3. **Advance prev:** `prev = curr` (`prev` steps onto Node 1)\n4. **Advance curr:** `curr = nxt` (`curr` steps onto Node 2)\n\n```text\nNone \u25c4\u2500\u2500\u2500\u2500 [ 1 ]        [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba None\n             \u25b2            \u25b2\n             \u2502            \u2502\n            prev         curr\n```\n\n---\n\n### Iteration 2 (at Node 2):\n1. `nxt = curr.next` (Bookmark Node 3)\n2. `curr.next = prev` (Node 2 now points back to Node 1)\n3. `prev = curr` (`prev` steps onto Node 2)\n4. `curr = nxt` (`curr` steps onto Node 3)\n\n```text\nNone \u25c4\u2500\u2500\u2500\u2500 [ 1 ] \u25c4\u2500\u2500\u2500\u2500 [ 2 ]        [ 3 ] \u2500\u2500\u2500\u2500\u25ba None\n                         \u25b2            \u25b2\n                         \u2502            \u2502\n                        prev         curr\n```\n\n---\n\n### Iteration 3 (at Node 3):\n1. `nxt = curr.next` (Bookmark `None`)\n2. `curr.next = prev` (Node 3 now points back to Node 2)\n3. `prev = curr` (`prev` steps onto Node 3)\n4. `curr = nxt` (`curr` steps onto `None`)\n\n```text\nNone \u25c4\u2500\u2500\u2500\u2500 [ 1 ] \u25c4\u2500\u2500\u2500\u2500 [ 2 ] \u25c4\u2500\u2500\u2500\u2500 [ 3 ]        None\n                                     \u25b2            \u25b2\n                                     \u2502            \u2502\n                                    prev         curr\n```\n\n### \ud83c\udfc1 Loop Terminates (`curr == None`):\nLook where `prev` is standing: it is on **Node 3** (the new head of the reversed list)!\n\n```python\nreturn prev  # Returns 3 -> 2 -> 1 -> None\n```\n\n---\n\n## \ud83d\udcbb Python 3 Implementation\n\n```python\nclass Solution:\n    def reverseList(self, head: ListNode) -> ListNode:\n        prev = None\n        curr = head\n        \n        while curr:\n            nxt = curr.next   # 1. Bookmark the next node\n            curr.next = prev  # 2. Reverse the pointer\n            prev = curr       # 3. Step prev forward\n            curr = nxt        # 4. Step curr forward\n            \n        return prev  # prev is the new head!\n```\n\n- **Time Complexity:** $\\\\mathcal{O}(N)$\n- **Space Complexity:** $\\\\mathcal{O}(1)$ in-place.\n", "category": "02_linked_lists"}, "02_linked_lists/04_merge_two_sorted_lists.md": {"title": "\ud83e\udea2 LeetCode 21: Merge Two Sorted Lists \u2013 Master Guide", "content": "# \ud83e\udea2 LeetCode 21: Merge Two Sorted Lists \u2013 Master Guide\n\n> **Pattern:** Dummy Node + Zipper Merge Technique  \n> **Difficulty:** Easy (Classic Interview Problem)\n\n---\n\n## \ud83d\udccc Problem Description\nYou are given the heads of two sorted linked lists `list1` and `list2`.\nMerge the two lists into one **sorted** list by splicing together the nodes of the first two lists.\nReturn the head of the merged linked list.\n\n```text\nInput: list1 = [1,2,4], list2 = [1,3,4]\nOutput: [1,1,2,3,4,4]\n```\n\n---\n\n## \ud83d\udca1 The Zipper Analogy\nThink of two rows of people arranged by height.\nYou stand at the front with a new rope (`dummy`).\nYou look at the person at the front of Row 1 and Row 2. Whoever is shorter gets called next, grabbed onto your rope (`curr.next`), and you take a step forward (`curr = curr.next`).\n\n---\n\n## \ud83d\udd0d Visual Step-by-Step Walkthrough\n\n```text\nlist1: [ 1 ] -> [ 2 ] -> [ 4 ]\nlist2: [ 1 ] -> [ 3 ] -> [ 4 ]\n\n1. Setup:\n   [dummy] \n      \u25b2\n      \u2502\n     curr\n\n2. Compare list1.val (1) and list2.val (1):\n   Pick list1's 1. \n   curr.next = list1\n   curr = curr.next\n   list1 = list1.next\n   \n   [dummy] -> [ 1 (l1) ]\n                 \u25b2\n                 \u2502\n                curr\n\n3. Compare list1.val (2) and list2.val (1):\n   Pick list2's 1.\n   curr.next = list2\n   curr = curr.next\n   list2 = list2.next\n\n   [dummy] -> [ 1 ] -> [ 1 (l2) ]\n                          \u25b2\n                          \u2502\n                         curr\n\n4. Repeat until one list is exhausted!\n5. Attach the remaining tail:\n   If list1 is left: curr.next = list1\n   If list2 is left: curr.next = list2\n```\n\n---\n\n## \ud83d\udcbb Python 3 Implementation\n\n```python\nclass Solution:\n    def mergeTwoLists(self, list1: ListNode, list2: ListNode) -> ListNode:\n        dummy = ListNode()\n        curr = dummy\n        \n        while list1 and list2:\n            if list1.val <= list2.val:\n                curr.next = list1\n                list1 = list1.next\n            else:\n                curr.next = list2\n                list2 = list2.next\n            curr = curr.next\n            \n        # Attach whichever list still has nodes remaining\n        curr.next = list1 if list1 else list2\n        \n        return dummy.next\n```\n\n- **Time Complexity:** $\\\\mathcal{O}(N + M)$\n- **Space Complexity:** $\\\\mathcal{O}(1)$ (reuses existing nodes!)\n", "category": "02_linked_lists"}, "02_linked_lists/05_remove_nth_node_from_end.md": {"title": "\u2702\ufe0f LeetCode 19: Remove Nth Node From End of List", "content": "# \u2702\ufe0f LeetCode 19: Remove Nth Node From End of List\n\n> **Pattern:** Two Pointers with Fixed Gap (Measuring Stick) + Dummy Node  \n> **Difficulty:** Medium\n\n---\n\n## \ud83d\udccc Problem Description\nGiven the `head` of a linked list, remove the $n$-th node from the end of the list and return its head.\n\n```text\nInput: head = [1,2,3,4,5], n = 2\nOutput: [1,2,3,5] (Node 4 removed)\n```\n\n---\n\n## \ud83d\udca1 The Measuring Stick Technique\n\nHow do you find the $N$-th node from the end in **one single pass** without counting the total length first?\n\n### The Ruler Analogy:\nHold a ruler of length $N$.\n1. Place the `right` pointer $N$ steps ahead of `left`.\n2. Move both `left` and `right` at the **same speed** until `right` hits the end (`None`).\n3. Now `left` is pointing **directly before the node to be deleted**!\n\n---\n\n## \ud83d\udd0d Why the Dummy Node is Lifesaving Here\nWhat if $N$ equals the list length (i.e. deleting the head node `[1]`)?\nBy starting `left` at `dummy` (which sits at index $-1$ before the head), `left` will naturally stop right before the head, allowing `left.next = left.next.next` to safely delete the head!\n\n```text\nExample: [1, 2, 3, 4, 5], n = 2\n\n1. Initialize dummy and pointers:\n   [dummy] \u2500\u2500\u2500\u2500\u25ba [ 1 ] \u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba [ 4 ] \u2500\u2500\u2500\u2500\u25ba [ 5 ] \u2500\u2500\u2500\u2500\u25ba None\n      \u25b2            \u25b2\n      \u2502            \u2502\n    left         right\n\n2. Advance right by n + 1 steps (3 steps):\n   [dummy] \u2500\u2500\u2500\u2500\u25ba [ 1 ] \u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba [ 4 ] \u2500\u2500\u2500\u2500\u25ba [ 5 ] \u2500\u2500\u2500\u2500\u25ba None\n      \u25b2                                    \u25b2\n      \u2502                                    \u2502\n    left                                 right (3 steps ahead)\n\n3. Move both pointers together until right is None:\n   [dummy] \u2500\u2500\u2500\u2500\u25ba [ 1 ] \u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba [ 4 ] \u2500\u2500\u2500\u2500\u25ba [ 5 ] \u2500\u2500\u2500\u2500\u25ba None\n                                           \u25b2                                    \u25b2\n                                           \u2502                                    \u2502\n                                         left                                 right\n\n4. Delete Node 4:\n   left.next = left.next.next  (Node 3 skips Node 4 and connects directly to Node 5!)\n```\n\n---\n\n## \ud83d\udcbb Python 3 Implementation\n\n```python\nclass Solution:\n    def removeNthFromEnd(self, head: ListNode, n: int) -> ListNode:\n        dummy = ListNode(0, head)\n        left = dummy\n        right = head\n        \n        # Advance right pointer n steps\n        for _ in range(n):\n            right = right.next\n            \n        # Move both until right reaches None\n        while right:\n            left = left.next\n            right = right.next\n            \n        # Delete the nth node\n        left.next = left.next.next\n        \n        return dummy.next\n```\n\n- **Time Complexity:** $\\\\mathcal{O}(N)$ single pass\n- **Space Complexity:** $\\\\mathcal{O}(1)$\n", "category": "02_linked_lists"}, "02_linked_lists/06_linked_list_cycle.md": {"title": "\ud83d\udd01 LeetCode 141 & 142: Linked List Cycle Detection", "content": "# \ud83d\udd01 LeetCode 141 & 142: Linked List Cycle Detection\n\n> **Pattern:** Fast & Slow Pointers (Floyd's Tortoise and Hare)  \n> **Difficulty:** Easy / Medium\n\n---\n\n## \ud83d\udccc Problem Description\nGiven `head`, the head of a linked list, determine if the linked list has a cycle in it.\n\n---\n\n## \ud83d\udca1 The Race Track Analogy\nImagine two runners on a running track:\n- \ud83d\udc22 **Slow runner:** Runs 1 meter/sec.\n- \ud83d\udc07 **Fast runner:** Runs 2 meters/sec.\n\n1. **If the track is straight (no cycle):** The fast runner will reach the finish line (`None`).\n2. **If the track is circular (has a cycle):** The fast runner will lap the slow runner and they will **inevitably crash into each other**.\n\n---\n\n## \ud83d\udd0d Part 1: Does a cycle exist? (LeetCode 141)\n\n```python\nclass Solution:\n    def hasCycle(self, head: ListNode) -> bool:\n        slow = fast = head\n        \n        while fast and fast.next:\n            slow = slow.next          # 1 step\n            fast = fast.next.next     # 2 steps\n            \n            if slow == fast:          # Crash detected! Cycle exists!\n                return True\n                \n        return False  # Fast hit None -> No cycle!\n```\n\n---\n\n## \ud83d\udd0d Part 2: Where does the cycle begin? (LeetCode 142)\n\nOnce `slow` and `fast` meet:\n1. Leave `slow` where it is.\n2. Move a new pointer `slow2` to the `head`.\n3. Move both `slow` and `slow2` at **1 step at a time**.\n4. **The exact node where they collide is the start of the cycle!**\n\n```python\nclass Solution:\n    def detectCycle(self, head: ListNode) -> ListNode:\n        slow = fast = head\n        \n        while fast and fast.next:\n            slow = slow.next\n            fast = fast.next.next\n            if slow == fast:\n                break\n        else:\n            return None  # No cycle\n            \n        # Mathematical convergence to cycle entry point:\n        slow2 = head\n        while slow != slow2:\n            slow = slow.next\n            slow2 = slow2.next\n            \n        return slow  # Start of cycle\n```\n", "category": "02_linked_lists"}, "02_linked_lists/1290_convert_binary_number_in_a_linked_list_to_integer.md": {"title": "\u26a1 LeetCode 1290: Convert Binary Number in a Linked List to Integer \u2013 Master Guide", "content": "# \u26a1 LeetCode 1290: Convert Binary Number in a Linked List to Integer \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** Top Interview 150 / Linked Lists & Bit Manipulation  \n> **Pattern:** Positional Stream Accumulation (Horner's Rule & Bit Shift)  \n> **LeetCode Link:** [LeetCode 1290: Convert Binary Number in a Linked List to Integer](https://leetcode.com/problems/convert-binary-number-in-a-linked-list-to-integer/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven `head` which is a reference node to a singly-linked list. The value of each node in the linked list is either `0` or `1`. The linked list holds the binary representation of a number.\n\nReturn the decimal value of the number in the linked list. The most significant bit is at the head of the linked list.\n\n```text\nExample 1:\nInput:  head = [ 1 ] \u2500\u2500\u25ba [ 0 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba None\nOutput: 5\nExplanation: (101) in base-2 is (1 * 4) + (0 * 2) + (1 * 1) = 5.\n\nExample 2:\nInput:  head = [ 0 ] \u2500\u2500\u25ba None\nOutput: 0\n\nExample 3:\nInput:  head = [ 1, 1, 1, 1 ] \u2500\u2500\u25ba None\nOutput: 15\n```\n\n---\n\n## \u2696\ufe0f Why String Concatenation is an Anti-Pattern\n\nA common initial instinct:\n```python\nnum = \"\"\nwhile head:\n    num += str(head.val)   # \u26a0\ufe0f O(n^2) trap!\n    head = head.next\nbinary = 0\nfor i in range(len(num)):\n    binary += int(num[i]) * (2 ** (len(num) - 1 - i))\nreturn binary\n```\n\n### Why interviewers ask you to optimize this:\n1. **Python String Immutability ($\\mathcal{O}(n^2)$ copying):**  \n   Every time you execute `num += str(...)`, Python allocates a new string in RAM and copies all existing characters.\n2. **Two Passes & Exponentiation:**  \n   First pass builds the string; second pass calculates powers of 2 using `2 ** (power)`.\n3. **Hardware Realities:**  \n   In hardware and systems programming (e.g. Nvidia, embedded microcontrollers), data arrives as a **stream of bits** across a wire. You process bits on the fly in $\\mathcal{O}(1)$ space!\n\n---\n\n## \ud83c\udf92 The \"Aha!\" Mental Model: Base-10 vs Base-2 Streams\n\nHow do you read a standard base-10 number from a stream of incoming digits?\n\n```text\nDigits arrive:  '1'  \u2500\u2500\u25ba  '2'  \u2500\u2500\u25ba  '3'\n\nStart:  ans = 0\nSee 1:  ans = (0 * 10) + 1  = 1\nSee 2:  ans = (1 * 10) + 2  = 12\nSee 3:  ans = (12 * 10) + 3 = 123\n```\nEach step **multiplies the current total by 10 and adds the new digit**!\n\n---\n\n### \u26a1 The Exact Same Logic in Base-2 (Binary):\nInstead of multiplying by 10, **multiply by 2**:\n\n```text\nBits arrive:  [ 1 ]  \u2500\u2500\u25ba  [ 0 ]  \u2500\u2500\u25ba  [ 1 ]   (Binary 101)\n\nStart:  ans = 0\nSee 1:  ans = (0 * 2) + 1 = 1\nSee 0:  ans = (1 * 2) + 0 = 2\nSee 1:  ans = (2 * 2) + 1 = 5  (Exact Answer!)\n```\n\nThis is known as **Horner's Rule** for polynomial evaluation.\n\n---\n\n## \ud83d\udcbb Production Code Options\n\n### Option A: Clean Arithmetic (Horner's Rule)\n```python\nclass Solution:\n    def getDecimalValue(self, head: ListNode | None) -> int:\n        ans = 0\n        while head:\n            ans = ans * 2 + head.val  # Shift left by 1 place, add new bit\n            head = head.next\n        return ans\n```\n\n### Option B: Low-Level Bitwise (Hardware Shift Register - Nvidia Favorite)\nMultiplying by 2 is equivalent to a **bit shift left (`<< 1`)**, and adding a single bit is a **bitwise OR (`|`)**:\n\n```python\nclass Solution:\n    def getDecimalValue(self, head: ListNode | None) -> int:\n        ans = 0\n        while head:\n            ans = (ans << 1) | head.val\n            head = head.next\n        return ans\n```\n\n---\n\n## \ud83d\udcca Complexity Analysis\n\n| Metric | String Concatenation | Horner's Rule / Bit Shift |\n| :--- | :--- | :--- |\n| **Time Complexity** | $\\mathcal{O}(n^2)$ (string re-allocation) | **$\\mathcal{O}(n)$ single pass** \ud83c\udfc6 |\n| **Space Complexity** | $\\mathcal{O}(n)$ (stores string) | **$\\mathcal{O}(1)$ auxiliary space** \ud83c\udfc6 |\n| **Passes** | 2 passes | **1 single pass** |\n", "category": "02_linked_lists"}, "02_linked_lists/143_reorder_list.md": {"title": "\ud83d\udd04 LeetCode 143: Reorder List \u2013 The \"Triple Crown\" Master Guide", "content": "# \ud83d\udd04 LeetCode 143: Reorder List \u2013 The \"Triple Crown\" Master Guide\n\n> **Difficulty:** Medium (LinkedIn, Amazon, Microsoft Interview Favorite)  \n> **Source Reference:** [NeetCode - Reorder List (LeetCode 143)](https://www.youtube.com/watch?v=S5bfdUTrKLM)  \n> **Pattern:** 3-in-1 Combination (Fast/Slow Pointers + In-Place Reversal + Zipper Merge)\n\n---\n\n## \ud83d\udccc Problem Description\n\nYou are given the head of a singly linked-list:\n$$L_0 \\to L_1 \\to L_2 \\to \\dots \\to L_{n-1} \\to L_n$$\n\nReorder the list to be on the following form:\n$$L_0 \\to L_n \\to L_1 \\to L_{n-1} \\to L_2 \\to L_{n-2} \\to \\dots$$\n\n> **Constraint:** You must do this **in-place** without modifying the node values (only changing the pointers/links).\n\n```text\nExample 1 (Even Length):\nInput:  1 -> 2 -> 3 -> 4 -> None\nOutput: 1 -> 4 -> 2 -> 3 -> None\n\nExample 2 (Odd Length):\nInput:  1 -> 2 -> 3 -> 4 -> 5 -> None\nOutput: 1 -> 5 -> 2 -> 4 -> 3 -> None\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Intuition: Why this is 3 Problems in One\n\nIf this were a regular array `[1, 2, 3, 4, 5]`, it would be trivial using two pointers from opposite ends:\n- Take from front (`1`), take from back (`5`)\n- Take from front (`2`), take from back (`4`)\n- Take remaining (`3`)\n\n**The Challenge with a Singly Linked List:**  \nYou **cannot go backwards** from the tail! You can only go forward (`.next`).\n\n### How to overcome this in $\\mathcal{O}(1)$ Extra Space?\nWe divide the problem into **3 simple phases** that you already know:\n\n```text\nOriginal List:  1 -> 2 -> 3 -> 4 -> 5 -> None\n\nPhase 1 (Split in Half):\nFirst Half:     1 -> 2 -> 3 -> None\nSecond Half:    4 -> 5 -> None\n\nPhase 2 (Reverse Second Half):\nFirst Half:     1 -> 2 -> 3 -> None\nReversed 2nd:   5 -> 4 -> None\n\nPhase 3 (Zipper Merge / Interleave):\n1 \u2500\u2500\u2500\u2500\u25ba 5 \u2500\u2500\u2500\u2500\u25ba 2 \u2500\u2500\u2500\u2500\u25ba 4 \u2500\u2500\u2500\u2500\u25ba 3 -> None\n```\n\n---\n\n## \ud83d\udd0d Phase-by-Phase Deep Dive & Pointer Diagrams\n\n---\n\n### \ud83d\udfe2 Phase 1: Find the Middle & Split the List\n\nWe use the **Fast & Slow Pointer** technique:\n- `slow` moves 1 step at a time.\n- `fast` moves 2 steps at a time.\n- Start `fast` at `head.next` so `slow` lands on the exact end of the first half.\n\n```text\nInitial State:\n[ 1 ] \u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba [ 4 ] \u2500\u2500\u2500\u2500\u25ba [ 5 ] \u2500\u2500\u2500\u2500\u25ba None\n  \u25b2           \u25b2\n  \u2502           \u2502\n slow        fast\n\nStep 1:\n[ 1 ] \u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba [ 4 ] \u2500\u2500\u2500\u2500\u25ba [ 5 ] \u2500\u2500\u2500\u2500\u25ba None\n              \u25b2                       \u25b2\n              \u2502                       \u2502\n             slow                    fast\n\nStep 2:\n[ 1 ] \u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba [ 4 ] \u2500\u2500\u2500\u2500\u25ba [ 5 ] \u2500\u2500\u2500\u2500\u25ba None\n                          \u25b2                                   \u25b2\n                          \u2502                                   \u2502\n                         slow                                fast (hits end)\n```\n\nNow:\n1. The **second half** starts at `slow.next` (Node 4).\n2. \u26a0\ufe0f **CRITICAL MOVE:** Cut the connection between the two halves by setting `slow.next = None`! If you forget this, your list will have a loop/cycle.\n\n```python\nslow, fast = head, head.next\nwhile fast and fast.next:\n    slow = slow.next\n    fast = fast.next.next\n\nsecond = slow.next   # Head of second half (Node 4)\nslow.next = None     # Disconnect! First half ends at Node 3\n```\n\n---\n\n### \ud83d\udfe2 Phase 2: Reverse the Second Half\n\nNow take the second half (`4 -> 5 -> None`) and reverse its arrows using the standard **3-pointer technique**:\n\n```text\nBefore:  None       [ 4 ] \u2500\u2500\u2500\u2500\u25ba [ 5 ] \u2500\u2500\u2500\u2500\u25ba None\n          \u25b2           \u25b2\n          \u2502           \u2502\n         prev        curr\n\nStep 1:  None \u25c4\u2500\u2500\u2500\u2500 [ 4 ]        [ 5 ] \u2500\u2500\u2500\u2500\u25ba None\n                      \u25b2            \u25b2\n                      \u2502            \u2502\n                     prev         curr\n\nStep 2:  None \u25c4\u2500\u2500\u2500\u2500 [ 4 ] \u25c4\u2500\u2500\u2500\u2500 [ 5 ]        None\n                                   \u25b2            \u25b2\n                                   \u2502            \u2502\n                                  prev         curr (None)\n```\n\nAt the end of the loop, `prev` is pointing to **Node 5**.\n```python\nprev = None\ncurr = second\nwhile curr:\n    nxt = curr.next\n    curr.next = prev\n    prev = curr\n    curr = nxt\n\nsecond = prev  # 'second' now points to 5 -> 4 -> None\n```\n\n---\n\n### \ud83d\udfe2 Phase 3: The Zipper Merge (Interleave)\n\nNow we have two distinct lists:\n- `first`:  `1 -> 2 -> 3 -> None`\n- `second`: `5 -> 4 -> None`\n\nWe want to stitch them together like teeth on a zipper: `1 -> 5 -> 2 -> 4 -> 3`.\n\n#### \u26a0\ufe0f The Bookmark Trap: Why we need `tmp1` and `tmp2`\nIf you do `first.next = second`, you immediately overwrite Node 1's arrow to Node 2! You would lose Node 2 and Node 3 forever!\n\nSo before modifying any pointers, **bookmark the next steps**:\n```python\ntmp1 = first.next   # Bookmark Node 2\ntmp2 = second.next  # Bookmark Node 4\n\nfirst.next = second # 1 points to 5\nsecond.next = tmp1  # 5 points to 2\n\n# Move pointers forward to our bookmarks:\nfirst = tmp1        # Move to 2\nsecond = tmp2       # Move to 4\n```\n\n```text\nVisualizing the Stitch:\n\nStep 1:\n[ 1 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 5 ]\n                \u2502\n                \u25bc\n              [ 2 ] \u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u25ba None\n                \u2502\n              [ 4 ] \u2500\u2500\u2500\u2500\u25ba None\n\nStep 2:\n[ 1 ] \u2500\u2500\u25ba [ 5 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba None\n```\n\nThe `while second:` loop naturally terminates when `second` becomes `None`!\n\n---\n\n## \ud83d\udcbb Complete Python 3 Code\n\n```python\n# Definition for singly-linked list.\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\n\nclass Solution:\n    def reorderList(self, head: Optional[ListNode]) -> None:\n        if not head or not head.next:\n            return\n        \n        # ----------------------------------------------------\n        # Phase 1: Find Middle (Fast & Slow Pointers)\n        # ----------------------------------------------------\n        slow, fast = head, head.next\n        while fast and fast.next:\n            slow = slow.next\n            fast = fast.next.next\n            \n        second = slow.next  # Start of second half\n        slow.next = None    # Cut list into two separate halves!\n        \n        # ----------------------------------------------------\n        # Phase 2: Reverse Second Half (In-place 3 Pointers)\n        # ----------------------------------------------------\n        prev = None\n        curr = second\n        while curr:\n            nxt = curr.next\n            curr.next = prev\n            prev = curr\n            curr = nxt\n            \n        second = prev  # 'second' is now head of reversed second half\n        \n        # ----------------------------------------------------\n        # Phase 3: Zipper Merge First & Second Halves\n        # ----------------------------------------------------\n        first = head\n        while second:\n            tmp1, tmp2 = first.next, second.next\n            \n            first.next = second\n            second.next = tmp1\n            \n            first = tmp1\n            second = tmp2\n```\n\n---\n\n## \u23f1\ufe0f Complexity Analysis\n\n- **Time Complexity:** $\\mathcal{O}(N)$\n  - Phase 1 (Find middle): $\\mathcal{O}(N/2)$\n  - Phase 2 (Reverse second half): $\\mathcal{O}(N/2)$\n  - Phase 3 (Zipper merge): $\\mathcal{O}(N/2)$\n  - Total Time: $\\mathcal{O}(N)$\n- **Space Complexity:** $\\mathcal{O}(1)$\n  - All operations are done in-place by simply rewiring existing pointer connections. Zero extra nodes or arrays created!\n\n---\n\n## \ud83e\udde0 Common Interview Traps & Pitfalls\n\n1. **Cycle creation (Forgetting `slow.next = None`):**  \n   If you don't cut the link between the two halves, the tail of the first half will still point to the old second half, creating an infinite cycle.\n2. **Losing references during the Zipper Merge:**  \n   Always bookmark `tmp1 = first.next` and `tmp2 = second.next` *before* changing `.next` pointers.\n3. **Loop condition for Zipper:**  \n   `while second:` is sufficient because the second half is either equal in length or 1 node shorter than the first half.\n", "category": "02_linked_lists"}, "02_linked_lists/1721_swapping_nodes_in_a_linked_list.md": {"title": "\ud83d\udd04 LeetCode 1721: Swapping Nodes in a Linked List \u2013 Master Guide", "content": "# \ud83d\udd04 LeetCode 1721: Swapping Nodes in a Linked List \u2013 Master Guide\n\n> **Difficulty:** Medium  \n> **Study Plan:** Top Interview 150 / Linked Lists  \n> **Pattern:** Two Pointers (The Measuring Stick / Offset Technique)  \n> **LeetCode Link:** [LeetCode 1721: Swapping Nodes in a Linked List](https://leetcode.com/problems/swapping-nodes-in-a-linked-list/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nYou are given the `head` of a linked list, and an integer `k`.\n\nReturn the head of the linked list after **swapping the values** of the $k^{\\text{th}}$ node from the beginning and the $k^{\\text{th}}$ node from the end (the list is 1-indexed).\n\n```text\nExample 1:\nInput:  head = [ 1, 2, 3, 4, 5 ], k = 2\nOutput: [ 1, 4, 3, 2, 5 ]\nExplanation: The 2nd node from start is 2. The 2nd node from end is 4. Swapped!\n\nExample 2:\nInput:  head = [ 7, 9, 6, 6, 7, 8, 3, 0, 9, 5 ], k = 5\nOutput: [ 7, 9, 6, 6, 8, 7, 3, 0, 9, 5 ]\n\nExample 3:\nInput:  head = [ 100, 90 ], k = 2\nOutput: [ 90, 100 ]\n```\n\n---\n\n## \ud83d\udea8 The Sneaky Bug: Swapping Inside a Rebuild Loop\n\nWhen storing values in a list and rebuilding the linked list:\n```python\n# \u274c TRAP: Swapping during reconstruction\nfor i in range(len(lst)):\n    if i == k - 1:\n        lst[k-1], lst[len(lst) - k] = lst[len(lst)-k], lst[k-1]\n        cur.val = lst[i]\n```\n### Why did this pass 68 test cases and fail 64?\n* **When $k$ is in the front half:** The loop visits index `k - 1` *before* the second node, so the swap happens early and both values are read correctly.\n* **When $k$ is in the back half (e.g. `[100, 90], k = 2`):** The loop visits index `0` *before* index `1`. It reads the unswapped value `100`, then later swaps at index `1` and reads `100` again $\\implies$ outputting `[100, 100]`!\n* **The Rule:** Always complete your list manipulations **before** beginning node creation or assignment!\n\n---\n\n## \ud83c\udf92 The \"Aha!\" Mental Model: The Measuring Stick \ud83d\udccf\n\nHow do you find the $k^{\\text{th}}$ node from the **end** without knowing the list's total length and without allocating an array?\n\nUse two pointers like a **fixed-length wooden ruler**:\n\n```text\nhead = [ 1,  2,  3,  4,  5 ], k = 2\n\nStep 1: Walk 'first' to the k-th node from start:\n        [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba [ 5 ]\n                   \u25b2\n                 first (k-th from start)\n\nStep 2: Place 'second' at head, and 'fast' at 'first':\n        second    fast\n          \u2502        \u2502\n          \u25bc        \u25bc\n        [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba [ 5 ] \u2500\u2500\u25ba None\n\nStep 3: Slide both together until 'fast' hits the last node!\n                             second    fast\n                               \u2502        \u2502\n                               \u25bc        \u25bc\n        [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba [ 5 ] \u2500\u2500\u25ba None\n                               \u25b2\n                      k-th node from END!\n```\n\nBecause the gap between `fast` and `second` is fixed at $k$ nodes:\nWhen `fast` hits the final node (`fast.next is None`), **`second` is guaranteed to be standing on the $k^{\\text{th}}$ node from the end!**\n\n---\n\n## \ud83d\udd90\ufe0f The \"Fencepost\" Step Rule: Why `range(k - 1)`?\n\nRemember: `first` **already starts on Node 1** (`head`).\n* To reach Node 1 ($k = 1$): You need **0 steps** $\\implies$ `range(0)`.\n* To reach Node 2 ($k = 2$): You need **1 step** $\\implies$ `range(1)`.\n* To reach Node $k$: You need **$k - 1$ steps** $\\implies$ `range(k - 1)`.\n\n> [!WARNING]\n> Using `range(k)` takes 1 step too many! On $k = 1$, it lands on Node 2. On $k = 5$ on a 5-node list, it walks into `None` and crashes with `AttributeError`!\n\n---\n\n## \ud83d\udcbb Complete Production Code ($\\mathcal{O}(1)$ Space)\n\n```python\n# Definition for singly-linked list.\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\n\nclass Solution:\n    def swapNodes(self, head: Optional[ListNode], k: int) -> Optional[ListNode]:\n        first = head\n        second = head\n\n        # 1. Walk first to the k-th node from the beginning (k - 1 steps)\n        for _ in range(k - 1):\n            first = first.next\n\n        # 2. Put fast at first, and slide second from head\n        fast = first\n        while fast.next:\n            fast = fast.next\n            second = second.next\n\n        # 3. Swap their values directly in-place!\n        first.val, second.val = second.val, first.val\n\n        return head\n```\n\n---\n\n## \ud83d\udcca Complexity Analysis\n\n| Metric | Approach 1 (Store Node References) | Approach 2 (Measuring Stick) |\n| :--- | :--- | :--- |\n| **Time Complexity** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ single pass |\n| **Space Complexity** | $\\mathcal{O}(n)$ (array of node pointers) | **$\\mathcal{O}(1)$ (Zero extra memory!)** \ud83c\udfc6 |\n| **Passes** | 1 pass to store, 1 pass to read | 1 single synchronized pass |\n\n---\n\n## \ud83c\udfaf Related Benchmark Problems\nThis exact **Measuring Stick / Offset Technique** solves:\n1. **LC 19: Remove Nth Node From End of List** (Deletes the target node using dummy head).\n2. **LC 876: Middle of the Linked List** (Ratio variation where fast moves 2x).\n3. **LC 141: Linked List Cycle Detection** (Detecting closed loops).\n", "category": "02_linked_lists"}, "02_linked_lists/206_reverse_linked_list.md": {"title": "\ud83d\udd04 LeetCode 206: Reverse Linked List \u2013 Master Guide", "content": "# \ud83d\udd04 LeetCode 206: Reverse Linked List \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** LeetCode 75 / Top Interview 150 / NeetCode 150  \n> **Pat
