<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Study Guide Viewer</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    pre code.hljs{display:block;overflow-x:auto;padding:1em}code.hljs{padding:3px 5px}/*!
  Theme: GitHub Dark

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    /* Markdown Typography Styling */
    .md-body {
      color: #e2e8f0;
      line-height: 1.75;
    }
    .md-body h1 {
      font-size: 1.875rem;
      font-weight: 800;
      color: #34d399;
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.5rem;
    }
    .md-body h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.35rem;
    }
    .md-body h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .md-body p {
      margin-bottom: 1rem;
      color: #cbd5e1;
    }
    .md-body blockquote {
      border-left: 4px solid #10b981;
      padding-left: 1rem;
      color: #94a3b8;
      background: rgba(16, 185, 129, 0.05);
      border-radius: 0 0.5rem 0.5rem 0;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .md-body ul, .md-body ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }
    .md-body ul {
      list-style-type: disc;
    }
    .md-body ol {
      list-style-type: decimal;
    }
    .md-body li {
      margin-bottom: 0.35rem;
    }
    .md-body code:not(pre code) {
      background: #1e293b;
      color: #38bdf8;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      font-family: monospace;
      font-size: 0.875em;
    }
    .md-body pre {
      background: #090d16 !important;
      border: 1px solid #1e293b;
      border-radius: 0.75rem;
      padding: 1rem;
      overflow-x: auto;
      margin-bottom: 1.25rem;
    }
    .md-body pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .md-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }
    .md-body th, .md-body td {
      border: 1px solid #1e293b;
      padding: 0.6rem 0.8rem;
      text-align: left;
    }
    .md-body th {
      background: #0f172a;
      color: #38bdf8;
      font-weight: 600;
    }
    .md-body tr:nth-child(even) {
      background: rgba(30, 41, 59, 0.3);
    }
    .md-body a {
      color: #34d399;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .md-body hr {
      border: 0;
      border-top: 1px solid #1e293b;
      margin: 2rem 0;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-black antialiased">

  <!-- TOP NAV BAR -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-30 px-4 sm:px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="tracker.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium transition-colors" title="Back to Tracker">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Tracker
      </a>
      <a href="faang_plan.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium transition-colors" title="View 10-Week Roadmap">
        🗺️ Roadmap
      </a>
      <span class="text-slate-600 hidden sm:inline">|</span>
      <h1 id="header-doc-title" class="text-sm sm:text-base font-bold text-white truncate max-w-[200px] sm:max-w-md">
        DSA Study Guide
      </h1>
    </div>

    <div class="flex items-center gap-3">
      <!-- Search Docs Dropdown / Filter -->
      <div class="relative">
        <select id="doc-selector" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 max-w-[180px] sm:max-w-xs truncate">
          <!-- Populated by JS -->
        </select>
      </div>

      <button id="toggle-sidebar-btn" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs flex items-center gap-1 lg:hidden">
        📑 List
      </button>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- SIDEBAR: LIST OF ALL DOCS -->
    <aside id="sidebar" class="w-72 bg-slate-900/60 border-r border-slate-800 overflow-y-auto flex-shrink-0 hidden lg:block p-4 space-y-4">
      <div class="relative">
        <input type="text" id="sidebar-search" placeholder="Search guides..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-300 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
      </div>

      <div id="sidebar-groups" class="space-y-4 text-xs">
        <!-- Rendered by JS -->
      </div>
    </aside>

    <!-- CONTENT VIEWER -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8 lg:p-12 max-w-5xl mx-auto w-full">
      <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 sm:p-10 shadow-2xl relative">
        <div id="rendered-content" class="md-body">
          <!-- Injected dynamically -->
        </div>
      </div>
    </main>

  </div>

    const DOCS_DATA = {"README.md": {"title": "\ud83d\ude80 Data Structures & Algorithms (DSA) Interview Master Guide", "content": "# \ud83d\ude80 Data Structures & Algorithms (DSA) Interview Master Guide\n\n> **Course Reference:** AlgoMaster.io, NeetCode 150 & freeCodeCamp LeetCode Patterns  \n> **Repository:** `~/Developer/projects/dsa/`  \n> **Goal:** Build intuitive, pattern-based thinking for coding interviews without rote memorization.\n\n---\n\n## \ud83d\uddfa\ufe0f How This Repository Is Organized\n\n| Document / Tool | Purpose | How to Use It |\n|---|---|---|\n| \ud83d\udcd1 **[README.md](./README.md)** | **The Central Index** | Your master roadmap and directory. |\n| \ud83d\udcca **[Daily DSA Tracker](./tracker.html)** | **Interactive Progress Dashboard** | Visual timeline of problems solved per day, difficulty breakdown, and LocalStorage persistence. |\n| \ud83d\uddfa\ufe0f **[FAANG 10-Week Roadmap UI](./faang_plan.html)** | **Interactive Roadmap & Pacing** | Tabbed phases (Phase 1\u20134), weekly quotas (2 weekdays / 5 weekends), milestone checklist. |\n| \ud83e\udded **[dsa_patterns_study_guide.md](./dsa_patterns_study_guide.md)** | **Universal Pattern Master Guide** | The 9 core algorithmic patterns with visual templates and Big-O cheat sheets. |\n| \ud83d\udcda **[`cheat_sheets/`](./cheat_sheets/)** | **High-Yield Pattern Reference** | 12 dedicated cheat sheets for Two Pointers, Sliding Window, DP, Trees, Graphs, etc. |\n| \ud83d\udcc1 **`01_arrays_and_pointers/`** | **Arrays & Transformations** | Clean in-place array manipulation, Two Pointers, Sliding Window, Kadane, Prefix Sums. |\n| \ud83d\udcc1 **`02_linked_lists/`** | **Linked Lists Masterclass** | 11 Archetypes, Floyd Cycle, In-Place Reversals, Zipper Merges, LRU Cache. |\n| \ud83d\udcc1 **`03_stacks_and_queues/`** | **Stacks & Monotonicity** | LIFO plates, monotonic stacks, calculator parsers, parentheses validators. |\n| \ud83d\udcc1 **`04_sorting/`** | **Sorting Algorithms from Scratch** | Bubble, Selection, Insertion, Merge, Quick Sort + Decision Matrix. |\n\n---\n\n## \ud83d\uddc2\ufe0f 1. Sorting Algorithms Series (AlgoMaster.io)\nLearn how comparison-based sorting works from first principles:\n\n* [\ud83e\udee7 **08. Bubble Sort \u2013 Complete Guide & Intuition**](./04_sorting/08_bubble_sort.md) \u2013 Adjacent swapping, soda bubble analogy, and the early termination `swapped` flag.\n* [\ud83c\udfaf **09. Selection Sort \u2013 Complete Guide & Intuition**](./04_sorting/09_selection_sort.md) \u2013 Finding minimums, minimal write swaps, and why it is unstable.\n* [\ud83c\udccf **10. Insertion Sort \u2013 Complete Guide & Intuition**](./04_sorting/10_insertion_sort.md) \u2013 Card player shifting technique, adaptive $\\mathcal{O}(n)$ on nearly-sorted data.\n* [\ud83c\udf32 **11. Merge Sort \u2013 Complete Guide & Intuition**](./04_sorting/11_merge_sort.md) \u2013 Divide and conquer, two-way zipper merge, guaranteed $\\mathcal{O}(n \\log n)$ time.\n* [\u26a1 **12. Quick Sort \u2013 Complete Guide & Intuition**](./04_sorting/12_quick_sort.md) \u2013 Pivot partitioning (Lomuto scheme), in-place recursion, and average vs. worst-case.\n* [\ud83d\udcca **13. Ultimate Sorting Cheat Sheet & Decision Tree**](./cheat_sheets/13_sorting_cheat_sheet.md) \u2013 Comparison matrix of all 10 sorting algorithms + interview decision tree.\n\n---\n\n## \ud83d\udcd1 2. Linked List Masterclass Series\nMaster pointer mechanics and in-place manipulations:\n\n* [\ud83e\udde0 **01. Linked List Fundamentals: How to Think Like a Computer**](./02_linked_lists/01_linked_list_fundamentals.md) \u2013 Node anatomy, pointer mechanics (`curr = curr.next` vs `curr.next = ...`), garbage collection, and the Train & Anchor analogy.\n* [\ud83d\udd22 **02. Add Two Numbers (LeetCode 2)**](./02_linked_lists/02_add_two_numbers.md) \u2013 Reverse-order addition, carry propagation, and deep dive into `cur = dummy`.\n* [\ud83d\udd04 **03. Reverse a Linked List (LeetCode 206)**](./02_linked_lists/206_reverse_linked_list.md) \u2013 The Preschool Conga Line 4-beat dance, why `cur` steps into `None`, and why you must `return prev`.\n* [\ud83e\udea2 **04. Merge Two Sorted Lists (LeetCode 21)**](./02_linked_lists/21_merge_two_sorted_lists.md) \u2013 The zipper merge technique with a dummy anchor.\n* [\u2702\ufe0f **05. Remove N-th Node From End (LeetCode 19)**](./02_linked_lists/05_remove_nth_node_from_end.md) \u2013 The measuring stick / runner technique in a single pass.\n* [\ud83d\udd01 **06. Linked List Cycle Detection (LeetCode 141 & 142)**](./02_linked_lists/06_linked_list_cycle.md) \u2013 Floyd's Tortoise and Hare race track pattern.\n* [\ud83d\udd04 **07. Reorder List (LeetCode 143)**](./02_linked_lists/143_reorder_list.md) \u2013 The 3-in-1 Triple Crown (Find Middle + In-Place Reversal + Zipper Merge).\n* [\u2702\ufe0f **08. Remove Duplicates from Sorted List (LeetCode 83)**](./02_linked_lists/83_remove_duplicates_from_sorted_list.md) \u2013 In-place pointer skipping, why `cur` must stay put during duplicates, and `return head` vs `return dummy.next`.\n* [\ud83e\ude9e **09. Palindrome Linked List (LeetCode 234)**](./02_linked_lists/234_palindrome_linked_list.md) \u2013 Two Pointers Squeeze vs. The In-Place Triple Crown (Tortoise & Hare Middle + Conga Line Reversal + $\\mathcal{O}(1)$ Space Verification).\n* [\ud83d\udd04 **10. Swapping Nodes in a Linked List (LeetCode 1721)**](./02_linked_lists/1721_swapping_nodes_in_a_linked_list.md) \u2013 The Measuring Stick / Offset Two Pointers technique, fencepost steps (k-1), and avoiding direction-dependent reconstruction bugs.\n* [\u26a1 **11. Convert Binary Number in a Linked List to Integer (LeetCode 1290)**](./02_linked_lists/1290_convert_binary_number_in_a_linked_list_to_integer.md) \u2013 Horner's stream accumulator, avoiding $\\mathcal{O}(n^2)$ string copying, and bitwise shift-and-OR.\n* \ud83d\uddfa\ufe0f [**The 90% Linked List Master Taxonomy & Archetype Guide**](./02_linked_lists/linked_list_90_percent_taxonomy.md) \u2013 Based on the viral LeetCode masterclass: The 11 archetypes, decision tree, visual templates, and complete 30+ problem checklist.\n\n---\n\n## \ud83d\udcda 3. Two Pointers & Array Patterns\nLearn when and how to avoid nested $\\mathcal{O}(n^2)$ loops:\n\n* [\ud83d\udcca **Two Pointers Master Cheat Sheet & Decision Guide**](./cheat_sheets/two_pointers_cheat_sheet.md) \u2013 Quick reference: The 3 formations (Squeeze, Scout & Writer, Conveyor Belts), 3-second mental triggers, and decision matrix.\n* [\ud83e\udea3 **11. Container With Most Water (LeetCode 11)**](./01_arrays_and_pointers/11_container_with_most_water.md) \u2013 Two pointers from opposite ends, greedy choice proof, fast-forward micro-optimizations, and FAANG/Google interview strategies.\n* [\ud83c\udfaf **15. 3Sum (LeetCode 15)**](./01_arrays_and_pointers/15_3sum.md) \u2013 1 Anchor + Squeeze, the Volume Knob steering rule, the Clothing Outfit analogy for skipping duplicates, and the 4 speedup optimizations.\n* [\ud83c\udfc3 **392. Is Subsequence (LeetCode 392)**](./01_arrays_and_pointers/392_is_subsequence.md) \u2013 Dual-sequence synchronization, beginner traps (dict & `.index()`), the 3-question Two-Pointer checklist, and binary search follow-up.\n* [\ud83d\udcc8 **122. Best Time to Buy and Sell Stock II (LeetCode 122)**](./01_arrays_and_pointers/122_best_time_to_buy_and_sell_stock_ii.md) \u2013 Valley-to-Peak vs. Telescoping daily step accumulation, unlimited transactions, and why it is pure Greedy (not Kadane).\n* [\ud83c\udfdb\ufe0f **13. Roman to Integer (LeetCode 13)**](./01_arrays_and_pointers/13_roman_to_integer.md) \u2013 Lookahead subtraction rule, why nested dict/list lookups cost 6 ms, and the 2-ms direct comparison optimization.\n* [\ud83c\udfdb\ufe0f **12. Integer to Roman (LeetCode 12)**](./01_arrays_and_pointers/12_integer_to_roman.md) \u2013 The ATM / Cashier Greedy Subtraction pattern, why repeated subtraction `while` loop beats division in interviews, and code comparison.\n* [\ud83e\ude9f **643. Maximum Average Subarray I (LeetCode 643)**](./01_arrays_and_pointers/643_maximum_average_subarray_i.md) \u2013 Fixed-size sliding window, the running differential pattern (add new, subtract old), eliminating TLE, and why deferred division is 1.6x faster.\n* [\ud83d\udd24 **1456. Maximum Number of Vowels in a Substring of Given Length (LeetCode 1456)**](./01_arrays_and_pointers/1456_maximum_number_of_vowels_in_a_substring_of_given_length.md) \u2013 Running differential on frequency counters, the `s[k]` vs `s[i]` indexing trap, and why `count` can mathematically never drop below 0.\n* [\ud83c\udfc3 **283. Move Zeroes (LeetCode 283)**](./01_arrays_and_pointers/283_move_zeroes.md) \u2013 Fast & Slow pointers (Scout & Writer), the Snowplow / Wall of Zeros visual diagram, and why `slow += 1` handles consecutive zeros cleanly.\n* [\ud83d\udd20 **290. Word Pattern (LeetCode 290)**](./01_arrays_and_pointers/290_word_pattern.md) \u2013 Bijective (1-to-1) mapping, why `in dict.values()` is an $\\mathcal{O}(k)$ linear scan trap (290x slower), and the two pure $\\mathcal{O}(n)$ solutions (Two Maps & Set Cardinality).\n* [\u2696\ufe0f **724. Find Pivot Index (LeetCode 724)**](./01_arrays_and_pointers/724_find_pivot_index.md) \u2013 Prefix Sum (The Seesaw Balance Pattern), total sum conservation, eliminating $\\mathcal{O}(n^2)$ slicing to achieve a 123x speedup.\n* [\ud83e\uddf1 **20. Valid Parentheses (LeetCode 20)**](./03_stacks_and_queues/20_valid_parentheses.md) \u2013 Cafeteria plate stack analogy, instant $\\mathcal{O}(1)$ odd-length pruning, and the \"Push-Expected\" 0-ms pattern.\n* [\ud83c\udfaf **678. Valid Parenthesis String (LeetCode 678 - Medium)**](./03_stacks_and_queues/678_valid_parenthesis_string.md) \u2013 Two Stacks (Indices) pattern for wildcard characters (`*`), handling index ordering, and greedy cleanup.\n* [\ud83d\udcca **228. Summary Ranges (LeetCode 228)**](./01_arrays_and_pointers/228_summary_ranges.md) \u2013 Two Pointers Formation D (Anchor & Scout), eliminating lost-tail bugs, and consecutive chunking.\n* [\ud83d\ude97 **66. Plus One (LeetCode 66)**](./01_arrays_and_pointers/66_plus_one.md) \u2013 The Car Odometer pattern, why integer string conversion is rejected in interviews, and schoolbook carry propagation.\n* [\ud83e\udea2 **88. Merge Sorted Array (LeetCode 88)**](./01_arrays_and_pointers/88_merge_sorted_array.md) \u2013 Two Pointers Formation E (The Tail-Buffer / Reverse Placement Pattern), avoiding the Bulldozer Overwrite collision, and why `while p1 >= 0` is omitted.\n* [\u2702\ufe0f **27. Remove Element (LeetCode 27)**](./01_arrays_and_pointers/27_remove_element.md) \u2013 Two Pointers Formation B (Scout & Writer / Fast & Slow), in-place clean zone partitioning, and the swap-with-tail follow-up.\n* [\u2702\ufe0f **26. Remove Duplicates from Sorted Array (LeetCode 26)**](./01_arrays_and_pointers/26_remove_duplicates_from_sorted_array.md) \u2013 Two Pointers Formation B (Scout & Writer), the Sorted vs. Unsorted duplicate rule, and why `Counter` is an interview space trap.\n* [\u2702\ufe0f **80. Remove Duplicates from Sorted Array II (LeetCode 80 - Medium)**](./01_arrays_and_pointers/80_remove_duplicates_from_sorted_array_ii.md) \u2013 Two Pointers Formation B (Scout & Writer with streak state machine) and the Senior FAANG Lookback $M$ formula (`x != nums[k - M]`).\n* [\ud83d\uddf3\ufe0f **169. Majority Element (LeetCode 169)**](./01_arrays_and_pointers/169_majority_element.md) \u2013 Boyer-Moore Voting Algorithm, Battle Royale 1-for-1 mutual cancellation, Tug-of-War invariant, and Python bytecode `elif` optimization.\n* [\ud83d\udd04 **189. Rotate Array (LeetCode 189 - Medium)**](./01_arrays_and_pointers/189_rotate_array.md) \u2013 Pythonic slice replacement vs. The FAANG $\\mathcal{O}(1)$ space Triple Reversal Algorithm (Two Pointers Formation A Squeeze).\n* [\ud83d\udcc8 **121. Best Time to Buy and Sell Stock (LeetCode 121)**](./01_arrays_and_pointers/121_best_time_to_buy_and_sell_stock.md) \u2013 Running minimum tracking, avoiding `min()/max()` function overhead, and the Kadane Maximum Subarray equivalence.\n* [\ud83c\udfae **55. Jump Game (LeetCode 55 - Medium)**](./01_arrays_and_pointers/55_jump_game.md) \u2013 The Horizon / Laser Reach greedy expansion pattern (`max_reach = max(max_reach, i + jump)`), quicksand zero traps, and eliminating $\\mathcal{O}(n^2)$ recursion.\n* [\ud83d\udcca **274. H-Index (LeetCode 274 - Medium)**](./01_arrays_and_pointers/274_h_index.md) \u2013 The Runner Finish Line rank comparison, greedy descending sort $\\mathcal{O}(n \\log n)$ vs counting sort $\\mathcal{O}(n)$, and handling all tie-breaks.\n* [\ud83c\udfaf **125. Valid Palindrome (LeetCode 125)**](./01_arrays_and_pointers/125_valid_palindrome.md) \u2013 Two Pointers Formation A (Inward Squeeze), skipping non-alphanumeric characters, and why $\\mathcal{O}(1)$ auxiliary space beats string reversal.\n* [\ud83c\udfaf **392. Is Subsequence (LeetCode 392)**](./01_arrays_and_pointers/392_is_subsequence.md) \u2013 Two Pointers Formation C (Two Conveyor Belts), checklist matching, and the HashMap + Binary Search follow-up for $10^9$ queries.\n* [\ud83c\udfaf **167. Two Sum II - Input Array Is Sorted (LeetCode 167 - Medium)**](./01_arrays_and_pointers/167_two_sum_ii_input_array_is_sorted.md) \u2013 Two Pointers Formation A (Inward Squeeze), why HashMap is rejected for $\\mathcal{O}(1)$ space constraint, and sum steering rules.\n* [\ud83e\udea3 **11. Container With Most Water (LeetCode 11 - Medium)**](./01_arrays_and_pointers/11_container_with_most_water.md) \u2013 Two Pointers Formation A (Inward Squeeze) with Greedy Bottleneck rule, mathematical proof of why the shorter wall must move, and reducing Python overhead.\n* [\ud83c\udfaf **15. 3Sum (LeetCode 15 - Medium)**](./01_arrays_and_pointers/15_3sum.md) \u2013 Two Pointers (Fixed Anchor + Inward Squeeze), eliminating $\\mathcal{O}(n^3)$ brute force, in-place deduplication without sets, and positive-anchor early pruning.\n* [\ud83c\udf5e **238. Product of Array Except Self (LeetCode 238 - Medium)**](./01_arrays_and_pointers/238_product_of_array_except_self.md) \u2013 Prefix & Suffix Accumulator (The Sandwich Pattern), eliminating division operations, and reducing auxiliary space from $\\mathcal{O}(n)$ to $\\mathcal{O}(1)$.\n* [\ud83e\ude9f **3. Longest Substring Without Repeating Characters (LeetCode 3 - Medium)**](./01_arrays_and_pointers/3_longest_substring_without_repeating_characters.md) \u2013 Dynamic Sliding Window (The Rubber Band), eliminating $\\mathcal{O}(n^3)$ substring rebuilds, and linear pass state maintenance with a hash set.\n\n---\n\n## \ud83e\udded 4. Algorithmic Patterns Master Study Guide & Cheat Sheets\nFor universal templates, mental models, and decision checklists across all major patterns:\n\ud83d\udc49 **[Open DSA Patterns Master Study Guide](./dsa_patterns_study_guide.md)**\n\n* \ud83e\udd85 [**Greedy Algorithms Master Cheat Sheet**](./cheat_sheets/greedy_cheat_sheet.md) \u2013 The 4 Archetypes (The Cashier, The Horizon, The Scheduler, The Accumulator), Greedy vs. Two Pointers distinction, and 3-second triggers.\n* \ud83e\uddf1 [**Arrays, Strings & HashMaps Cheat Sheet**](./cheat_sheets/arrays_hashmaps_cheat_sheet.md) \u2013 Contiguous memory, avoiding $\\mathcal{O}(n^2)$ string concatenation, Two-Sum complement trick.\n* \ud83c\udfaf [**Two Pointers Master Cheat Sheet**](./cheat_sheets/two_pointers_cheat_sheet.md) \u2013 Squeeze, Scout & Writer, Two Conveyor Belts.\n* \ud83e\ude9f [**Sliding Window Master Cheat Sheet**](./cheat_sheets/sliding_window_cheat_sheet.md) \u2013 The rubber-band technique for contiguous subarrays/substrings (Fixed vs. Dynamic).\n* \ud83d\udd0d [**Binary Search Master Cheat Sheet**](./cheat_sheets/binary_search_cheat_sheet.md) \u2013 Phonebook halving, avoiding infinite loops, and binary search on monotonic answers.\n* \ud83c\udf32 [**BFS vs. DFS Master Cheat Sheet**](./cheat_sheets/bfs_dfs_cheat_sheet.md) \u2013 The water ripple (shortest path) vs. the maze runner (tree depth & flood-fill).\n* \ud83d\udd04 [**Backtracking Master Cheat Sheet**](./cheat_sheets/backtracking_cheat_sheet.md) \u2013 Decision trees with an \"Undo\" button (Subsets, Permutations, Combinations).\n* \u26f0\ufe0f [**Priority Queues & Heaps Cheat Sheet**](./cheat_sheets/heaps_priority_queues_cheat_sheet.md) \u2013 Hospital ER triage, `heapq` in Python, and the Top-K Min-Heap pattern.\n* \ud83d\udcc8 [**Kadane's Algorithm Master Cheat Sheet**](./cheat_sheets/kadanes_algorithm_cheat_sheet.md) \u2013 The Toxic Debt analogy, Maximum Subarray (LC 53), stock differences, and circular arrays.\n* \ud83c\udfe7 [**Greedy Subtraction (ATM Pattern) Cheat Sheet**](./cheat_sheets/greedy_subtraction_atm_cheat_sheet.md) \u2013 Decomposing quantities into canonical units (Roman numerals, currency change, time units), `while` vs `//` trade-offs.\n* \u2696\ufe0f [**Prefix Sum (The Seesaw Balance) Cheat Sheet**](./cheat_sheets/prefix_sum_seesaw_cheat_sheet.md) \u2013 Total sum conservation, finding pivot/equilibrium indices in $\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space.\n* \ud83d\udd17 [**Linked List Master Cheat Sheet**](./cheat_sheets/linked_list_master_cheat_sheet.md) \u2013 Russian nesting dolls mental model, `dummy` vs `cur`, in-place pointer stitching, and avoiding `TypeError: len()`.\n* \ud83d\uddfa\ufe0f [**90% Linked List Master Taxonomy Guide**](./02_linked_lists/linked_list_90_percent_taxonomy.md) \u2013 The 11 archetypes classifying 90%+ of LeetCode linked list problems, 10-second classifier decision tree, and complete problem checklists.\n* \ud83d\udd79\ufe0f [**Bit Manipulation Master Cheat Sheet**](./cheat_sheets/bitwise_cheat_sheet.md) \u2013 The 6 silicon operators, Horner's stream shift, power-of-two check, Brian Kernighan bit clearing, and XOR cancellation.\n", "category": "Root"}, "dsa_patterns_study_guide.md": {"title": "\ud83e\udded DSA Patterns Master Study Guide", "content": "# \ud83e\udded DSA Patterns Master Study Guide\n> **Based on:** Sheldon Chai's 75-Minute LeetCode Patterns Masterclass (freeCodeCamp)  \n> **Audience:** First-Year CSE Student to FAANG Candidate  \n> **Philosophy:** Learn the *patterns*, not just individual problems. When you recognize the pattern, the code writes itself.\n\n---\n\n## \ud83d\uddfa\ufe0f Visual Roadmap & Master Cheat Sheets\n\nClick any pattern below to open its **deep-dive beginner cheat sheet** with full visual diagrams, step-by-step traces, and notebook-ready templates:\n\n| # | Pattern | When to Use | Time Complexity | Deep-Dive Cheat Sheet |\n|---|---|---|---|---|\n| 1 | **Arrays, Strings & HashMaps** | Contiguous memory, $\\mathcal{O}(1)$ lookups, frequency count | $\\mathcal{O}(1)$ read / lookup | \ud83d\udcd6 **[Arrays & HashMaps Guide](./arrays_hashmaps_cheat_sheet.md)** |\n| 2 | **Two Pointers** | Sorted lists, pairs, palindromes, shrinking windows | $\\mathcal{O}(n)$ | \ud83d\udcd6 **[Two Pointers Master Guide](./two_pointers_cheat_sheet.md)** |\n| 3 | **Sliding Window** | Contiguous subarrays/substrings (\"longest/shortest\") | $\\mathcal{O}(n)$ | \ud83d\udcd6 **[Sliding Window Guide](./sliding_window_cheat_sheet.md)** |\n| 4 | **Binary Search** | Sorted search space, monotonic feasibility (\"find min speed\") | $\\mathcal{O}(\\log n)$ | \ud83d\udcd6 **[Binary Search Guide](./binary_search_cheat_sheet.md)** |\n| 5 | **BFS & DFS** | Shortest path (BFS), maze exploration & tree depth (DFS) | $\\mathcal{O}(V + E)$ | \ud83d\udcd6 **[BFS vs. DFS Guide](./bfs_dfs_cheat_sheet.md)** |\n| 6 | **Backtracking** | Generate all combinations, subsets, permutations with \"undo\" | $\\mathcal{O}(2^n)$ or $\\mathcal{O}(n!)$ | \ud83d\udcd6 **[Backtracking Guide](./backtracking_cheat_sheet.md)** |\n| 7 | **Heaps / Priority Queues** | Constantly track min/max, \"Top K\", live median streams | Push/Pop: $\\mathcal{O}(\\log k)$ | \ud83d\udcd6 **[Heaps & Priority Queues Guide](./heaps_priority_queues_cheat_sheet.md)** |\n| 8 | **Kadane's Algorithm** | Contiguous subarray with negative penalties / max gain | $\\mathcal{O}(n)$ | \ud83d\udcd6 **[Kadane's Algorithm Guide](./kadanes_algorithm_cheat_sheet.md)** |\n| 9 | **Greedy Subtraction (ATM Pattern)** | Canonical unit decomposition, Roman numerals, currency change | $\\mathcal{O}(1)$ / $\\mathcal{O}(D)$ | \ud83d\udcd6 **[Greedy Subtraction Guide](./greedy_subtraction_atm_cheat_sheet.md)** |\n| 10 | **Prefix Sum (Seesaw Balance Pattern)** | Finding equilibrium/pivot index, comparing left vs right sides | $\\mathcal{O}(n)$ | \ud83d\udcd6 **[Prefix Sum (Seesaw) Guide](./prefix_sum_seesaw_cheat_sheet.md)** |\n| 11 | **Linked Lists (Pointers & Dummies)** | In-place node stitching, reversing arrows, fast/slow cycles | $\\mathcal{O}(n)$ | \ud83d\udcd6 **[Linked List Master Guide](./linked_list_master_cheat_sheet.md)**<br>\ud83d\uddfa\ufe0f **[90% Taxonomy Guide](./linked_list_90_percent_taxonomy.md)** |\n| 12 | **Tips & Tricks (Telescoping Sums & Loops)** | Bytecode optimization, collapsing intervals into adjacent steps | $\\mathcal{O}(n)$ | \ud83d\udca1 **[Jump to Section 12](#12--tips--tricks-bytecode-telescoping-sums--interval-decomposition)** |\n| 13 | **Bit Manipulation** | Direct silicon logic, LSB extraction, power of 2, Horner's stream shift | $\\mathcal{O}(1)$ | \ud83d\udcd6 **[Bit Manipulation Guide](./bitwise_cheat_sheet.md)** |\n\n---\n\n## 1. \ud83e\uddf1 Arrays, Strings, Sets & HashMaps\n\n### \ud83d\udca1 The Big Idea\n* **Array = A row of houses on the same street.** Because elements sit contiguously in memory, finding house #4 is instant ($\\mathcal{O}(1)$ index access). However, inserting at index 0 requires every house to slide over ($\\mathcal{O}(n)$).\n* **String = Words carved in stone (Immutable).** Doing `s += char` inside a loop builds a brand-new string every iteration ($\\mathcal{O}(n^2)$ trap!). Always use `[].append()` and `\"\".join()`.\n* **Set = VIP bouncer's guest list.** Answers: *\"Have I seen this before?\"* in instant $\\mathcal{O}(1)$ time.\n* **HashMap = Coat-check ticket.** Hand in your key (ticket), instantly get back your value (jacket) in $\\mathcal{O}(1)$ time.\n* \u26a1 **Performance Finding (Avoid Nested Lookups in Loops):** Avoid chaining lookups like `s[i+1] in sub[s[i]]` inside loops. Replacing nested dictionary-in-list checks with direct numeric comparisons (`val[s[i]] < val[s[i+1]]` like in Roman to Integer) cuts out multiple Python hash table and list scans, dropping runtime from 10 ms to 2 ms (Beats 90%+).\n* \ud83d\udd20 **Bijective (1-to-1) Mapping Pattern & The `in dict.values()` Trap (LC 290):**  \n  * Checking `key in dict` is **$\\mathcal{O}(1)$**, but checking `val in dict.values()` is **$\\mathcal{O}(k)$ linear scan** because hash tables only index keys! Inside a loop, `val in dict.values()` silently degrades time to $\\mathcal{O}(n^2)$ (290\u00d7 slower on scale).\n  * **The Fix:** Use **Two HashMaps** (`p_to_w` and `w_to_p`) or a secondary `seen` Set to maintain pure $\\mathcal{O}(1)$ lookups in both directions, or the Pythonic Set Cardinality rule: `len(set(p)) == len(set(w)) == len(set(zip(p, w)))`.\n* \ud83d\ude97 **The Car Odometer & Schoolbook Carry Pattern (LC 66):**  \n  * Avoid `int(\"\".join(...)) + 1` in interviews: it overflows 64-bit integer limits in C++/Java and wastes $\\mathcal{O}(n)$ string memory.\n  * **The Odometer Model:** Walk right-to-left. If `digits[i] < 9`, bump by 1 and **return immediately** ($\\mathcal{O}(1)$ best case!). If `digits[i] == 9`, roll it over to `0` and let the loop carry leftward.\n  * If the loop finishes without returning, every digit was a 9 (e.g. `[9, 9, 9]` became `[0, 0, 0]`). Prepend `[1]` using `return [1] + digits` (avoiding the slow $\\mathcal{O}(n)$ `digits.insert(0, 1)`).\n\n### \ud83d\udccb What Kind of Problems Fall Under Arrays, Strings & HashMaps?\n| Category | Problem Statement / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **Instant Pair Lookup ($\\mathcal{O}(1)$ Complement)** | Find two numbers that sum to target using `seen[target - num]`. | **LC 1: Two Sum** |\n| **Frequency Anagrams / Counting** | Check if two strings have identical character frequencies. | **LC 242: Valid Anagram** |\n| **Bijective / 1-to-1 Mapping** | Two strings follow exact same structure without duplicate bindings. | **LC 290: Word Pattern**, **LC 205: Isomorphic Strings** |\n| **Prefix Sum with Hash Lookup** | Find total number of continuous subarrays summing to $K$. | **LC 560: Subarray Sum Equals K** |\n| **Direct Numeric Lookahead** | Compare current element with next element without nested lookups. | **LC 13: Roman to Integer** |\n| **Schoolbook Addition / Carry** | Simulate arithmetic from right to left; roll over 9s to 0s. | **LC 66: Plus One**, **LC 2: Add Two Numbers** |\n| **Majority Element / Frequency** | Mutual cancellation in $\\mathcal{O}(1)$ space vs. hash table frequency count. | **LC 169: Majority Element** |\n\n\ud83d\udc49 **Deep Dive Guide:** [Arrays, Strings & HashMaps Master Cheat Sheet](./arrays_hashmaps_cheat_sheet.md) | [Majority Element (LC 169)](./169_majority_element.md) | [Plus One (LC 66)](./66_plus_one.md) | [Roman to Integer (LC 13)](./13_roman_to_integer.md) | [Word Pattern (LC 290)](./290_word_pattern.md)\n\n---\n\n## 2. \ud83c\udfaf Two Pointers\n\n### \ud83d\udca1 The Big Idea\nInstead of checking every pair with nested loops ($\\mathcal{O}(n^2)$), use two index markers that move in a coordinated way, cutting runtime to $\\mathcal{O}(n)$.\n\n### \ud83d\udcd0 The 5 Formations:\n1. **The Squeeze (`l = 0, r = len - 1`):** Opposite ends walking inward (*Valid Palindrome*, *Container With Most Water*).\n2. **Scout & Writer (`slow = 0, fast = 0`):** Same array, same direction (*Move Zeroes*, *Remove Duplicates*).\n3. **Two Conveyor Belts (`p1 = 0, p2 = 0`):** Two separate arrays/strings (*Is Subsequence*, *Merge Sorted Lists*).\n4. **Anchor & Scout (`start = nums[i]`, inner while):** Grouping contiguous runs or intervals (*Summary Ranges*, *String Compression*).\n5. **The Tail-Buffer / Reverse Placement (`p = m + n - 1`, backwards):** Working right-to-left into safe trailing zeros to avoid the \"Bulldozer Overwrite\" collision (*Merge Sorted Array*).\n\n### \ud83d\udccb What Kind of Problems Fall Under Two Pointers?\n| Formation | Problem Category / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **The Squeeze** | Symmetry / Palindrome check from outside in. | **LC 125: Valid Palindrome** |\n| **The Squeeze** | Pair search in sorted array (`left` moves if sum too small, `right` if too large). | **LC 167: Two Sum II**, **LC 15: 3Sum** |\n| **The Squeeze** | Maximum geometric container (move shorter wall inward). | **LC 11: Container With Most Water** |\n| **The Squeeze** | In-place subsegment flipping / triple reversal rotation. | **LC 189: Rotate Array** |\n| **Scout & Writer** | In-place element removal / compaction without extra memory. | **LC 283: Move Zeroes**, **LC 27: Remove Element**, **LC 26: Remove Duplicates I & II (LC 80)** |\n| **Scout & Writer** | Linked list cycle detection / middle finding (Slow 1x, Fast 2x). | **LC 141: Linked List Cycle**, **LC 876: Middle of Linked List** |\n| **Two Conveyor Belts** | Subsequence matching (progress pointer on match). | **LC 392: Is Subsequence** |\n| **Tail-Buffer (Reverse)** | In-place merge using trailing garbage buffer from the back. | **LC 88: Merge Sorted Array** |\n| **Anchor & Scout** | Contiguous chunk grouping / run-length encoding. | **LC 228: Summary Ranges**, **LC 443: String Compression** |\n\n\ud83d\udc49 **Deep Dive Guide:** [Two Pointers Master Cheat Sheet](./two_pointers_cheat_sheet.md) | [Rotate Array (LC 189)](./189_rotate_array.md) | [Remove Duplicates II (LC 80)](./80_remove_duplicates_from_sorted_array_ii.md) | [Remove Duplicates (LC 26)](./26_remove_duplicates_from_sorted_array.md) | [Remove Element (LC 27)](./27_remove_element.md) | [Merge Sorted Array (LC 88)](./88_merge_sorted_array.md) | [Summary Ranges (LC 228)](./228_summary_ranges.md) | [Container With Most Water (LC 11)](./11_container_with_most_water.md) | [3Sum (LC 15)](./15_3sum.md) | [Move Zeroes (LC 283)](./283_move_zeroes.md) | [Is Subsequence (LC 392)](./392_is_subsequence.md)\n\n### \u2696\ufe0f Two Pointers (Anchor & Scout) vs. Sliding Window: What's the Difference?\nMany candidates confuse **Anchor & Scout** with **Sliding Window** because both track a range `[start ... end]`.\n\n* **Sliding Window (Overlapping Frames - Video Camera \ud83d\udcf9):**  \n  Windows slide and **overlap** (`[0..2]`, `[1..3]`, `[2..4]`). Single elements belong to **multiple candidate windows**. Used to find the \"longest/shortest/maximum\" segment (*LC 3, LC 643*).\n* **Anchor & Scout (Non-Overlapping Chunks - Bread Knife \ud83e\udd56):**  \n  The array is sliced into **disjoint, independent chunks** (`[0..2]`, `[4..5]`, `[7]`). Elements belong to **exactly one chunk**. Once a chunk is cut, the anchor leapfrogs to the next chunk (*LC 228 Summary Ranges, LC 443 String Compression*).\n* **The 3-Second Rule:** Does a single element belong to multiple candidate answers?  \n  * **YES** $\\implies$ Sliding Window.  \n  * **NO** $\\implies$ Two Pointers (Anchor & Scout).\n\n---\n\n## 3. \ud83e\ude9f Sliding Window\n\n### \ud83d\udca1 The Big Idea: The Expanding & Shrinking Rubber Band\nImagine stretching a rubber band across an array:\n1. **Expand:** Stretch `right` forward to explore and include elements.\n2. **Contract:** If a rule is violated (e.g. duplicate letter or sum too big), pull `left` forward until it becomes valid again.\n3. **The Magic:** Neither pointer ever steps backward! Total time is strictly $\\mathcal{O}(n)$.\n\n### \ud83d\udd04 The Universal \"Subtract Old, Add New\" Differential Pattern (Fixed Window of Size $K$)\nWhenever a problem asks for the maximum/minimum/target property of a contiguous window of fixed size $K$:\n* **The TLE Trap:** Re-slicing `nums[i:i+k]` or re-summing using a nested loop costs $\\mathcal{O}(k)$ per position $\\implies \\mathcal{O}(n \\cdot k)$ total time ($2.5 \\times 10^9$ operations for $n=10^5$, instant TLE!).\n* **The Running Differential:** Consecutive windows share $K-1$ elements in common! You never re-sum the whole window:\n  $$\\text{window\\_sum} = \\text{window\\_sum} + \\text{entering\\_element} - \\text{leaving\\_element}$$\n* **Clean Indexing Template (`range(k, len(nums))`):**\n  ```python\n  # 1. Establish initial window\n  window_sum = sum(nums[:k])\n  max_sum = window_sum\n  \n  # 2. Slide by 1 step from index k to end\n  for i in range(k, len(nums)):\n      window_sum += nums[i] - nums[i - k]  # Add entering (nums[i]), remove leaving (nums[i-k])\n      if window_sum > max_sum:\n          max_sum = window_sum\n  ```\n* \u26a1 **Pro Optimization (Deferred Division):** For averages, never divide by $k$ inside the loop (`avg = tot / k` allocates $10^5$ floating point numbers and slows down code by ~1.6x). Maximize the integer sum first, and divide by $k$ once at the very end!\n* \ud83d\udd24 **Applying to Strings & Frequency Counters (LC 1456):** Strings do not support arithmetic, but your **integer counter** does! Update the counter based on boolean membership: `count += (s[i] in target) - (s[i - k] in target)`.\n* \ud83d\udee1\ufe0f **Why `count` Never Drops Below 0:** Beginners often defensively add `if count < 0: count = 0`. This is mathematically unnecessary: you only subtract an item when it leaves if it was already credited when it entered. Thus, total additions $\\ge$ total subtractions at all times ($0 \\le \\text{count} \\le k$).\n\n### \ud83d\udccb What Kind of Problems Fall Under Sliding Window?\n| Flavor | Problem Category / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **Fixed ($K$) Sums** | Maximum or minimum sum/average of subarray of size $K$. | **LC 643: Maximum Average Subarray I** |\n| **Fixed ($K$) Frequency** | Maximum occurrences of target condition in window of size $K$. | **LC 1456: Max Number of Vowels** |\n| **Dynamic (Longest)** | Longest substring without repeating characters. | **LC 3: Longest Substring Without Repeating** |\n| **Dynamic (Longest)** | Max consecutive ones with at most $K$ zero flips. | **LC 1004: Max Consecutive Ones III** |\n| **Dynamic (Shortest)** | Minimum size subarray sum $\\ge$ target. | **LC 209: Minimum Size Subarray Sum** |\n| **Dynamic (Exact)** | Subarrays with $K$ different integers (`atMost(K) - atMost(K-1)`). | **LC 992: Subarrays with K Different Integers** |\n\n\ud83d\udc49 **Deep Dive Guide:** [Sliding Window Master Cheat Sheet](./sliding_window_cheat_sheet.md) | [Maximum Average Subarray I (LC 643)](./643_maximum_average_subarray_i.md) | [Maximum Number of Vowels (LC 1456)](./1456_maximum_number_of_vowels_in_a_substring_of_given_length.md)\n\n---\n\n## 4. \ud83d\udd0d Binary Search\n\n### \ud83d\udca1 The Big Idea: The \"Higher or Lower\" Guessing Game\nWhen data is sorted, checking the exact middle lets you throw away 50% of the remaining search space every single step.\n* Searching through $1,000,000$ items takes only **20 checks** ($\\log_2 10^6 \\approx 20$).\n* **Binary Search on the Answer:** If you need to find the \"minimum speed\" or \"maximum capacity\" where answers transition from `[No, No, No, YES, YES]`, use binary search on that boundary!\n\n### \ud83d\udccb What Kind of Problems Fall Under Binary Search?\n| Category | Problem Statement / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **Direct Value Search** | Find target in sorted array (or first/last occurrence). | **LC 704: Binary Search**, **LC 34: First and Last Position** |\n| **Rotated Sorted Arrays** | Find target when sorted array was rotated at unknown pivot. | **LC 33: Search in Rotated Sorted Array** |\n| **Peak Finding** | Find a local maximum where `nums[mid] > nums[mid+1]`. | **LC 162: Find Peak Element** |\n| **Binary Search on Answer** | Find minimum eating speed $K$ to eat all bananas within $H$ hours. | **LC 875: Koko Eating Bananas** |\n| **Binary Search on Answer** | Minimum ship capacity to ship packages within $D$ days. | **LC 1011: Capacity To Ship Packages** |\n\n\ud83d\udc49 **Deep Dive Guide:** [Binary Search Master Cheat Sheet](./binary_search_cheat_sheet.md)\n\n---\n\n## 5. \ud83c\udf0a Breadth-First Search (BFS) vs. \ud83c\udf32 Depth-First Search (DFS)\n\n### \ud83d\udca1 The Big Idea\n* **BFS (The Water Ripple):** Spreads outward layer-by-layer using a **Queue**.  \n  \u2b50 *Superpower:* In unweighted graphs/grids, **BFS guarantees the shortest path**!\n* **DFS (The Maze Runner):** Dives as deep as possible down one branch using **Recursion** until it hits a dead end, then backtracks.  \n  \u2b50 *Superpower:* Cleanest way to explore all paths, calculate tree depths, and flood-fill islands.\n\n### \ud83d\udccb What Kind of Problems Fall Under BFS & DFS?\n| Algorithm | Problem Category / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **BFS (Queue)** | Shortest path in unweighted maze / grid. | **LC 1091: Shortest Path in Binary Matrix** |\n| **BFS (Queue)** | Level-order tree traversal / infection spread. | **LC 102: Binary Tree Level Order**, **LC 994: Rotting Oranges** |\n| **DFS (Recursion)** | Flood fill / connected component counting. | **LC 200: Number of Islands** |\n| **DFS (Recursion)** | Tree height, symmetry, and max path sum. | **LC 104: Max Depth of Binary Tree**, **LC 124: Tree Max Path Sum** |\n| **DFS (Recursion)** | Cycle detection in directed graphs (Topological Sort). | **LC 207: Course Schedule** |\n\n\ud83d\udc49 **Deep Dive Guide:** [BFS vs. DFS Master Cheat Sheet](./bfs_dfs_cheat_sheet.md)\n\n---\n\n## 6. \ud83d\udd04 Backtracking\n\n### \ud83d\udca1 The Big Idea: The Decision Tree with an \"Undo\" Button\nWhen you need to generate all possibilities (subsets, combinations, permutations):\n1. **Choose:** Make a move (`path.append(choice)`).\n2. **Explore:** Recurse deeper (`backtrack()`).\n3. **Un-choose:** Undo your move (`path.pop()`) so the next branch starts with a clean slate!\n\n### \ud83d\udccb What Kind of Problems Fall Under Backtracking?\n| Category | Problem Statement / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **Subsets (Power Set)** | Generate all possible subsets of an array (include / exclude). | **LC 78: Subsets** |\n| **Combinations** | Pick $K$ elements that sum to target without reuse. | **LC 39: Combination Sum**, **LC 77: Combinations** |\n| **Permutations** | Generate all orderings where position matters. | **LC 46: Permutations** |\n| **Constraint Satisfaction** | Fill a board satisfying row, col, subgrid rules with pruning. | **LC 51: N-Queens**, **LC 37: Sudoku Solver** |\n| **Word Search on Board** | Spell a word by moving 4-directionally without reusing cells. | **LC 79: Word Search** |\n\n\ud83d\udc49 **Deep Dive Guide:** [Backtracking Master Cheat Sheet](./backtracking_cheat_sheet.md)\n\n---\n\n## 7. \u26f0\ufe0f Priority Queues & Heaps\n\n### \ud83d\udca1 The Big Idea: Hospital ER Triage\nIn a hospital Emergency Room, patients aren't seen by arrival time \u2014 the person with the most critical condition (highest priority) is seen first.\n* A **Heap** gives instant $\\mathcal{O}(1)$ access to the smallest (or largest) item.\n* Adding an item or removing the top item takes $\\mathcal{O}(\\log k)$ time.\n* \u2b50 *Counter-Intuitive Top-K Rule:* To find the $K$ **largest** elements, keep a **Min-Heap** of size $K$!\n\n### \ud83d\udccb What Kind of Problems Fall Under Heaps / Priority Queues?\n| Category | Problem Statement / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **Top K Frequent / Largest** | Maintain a Min-Heap of size $K$ to evict small items. | **LC 215: Kth Largest Element**, **LC 347: Top K Frequent** |\n| **Continuous Stream Median** | Two Heaps: Max-Heap for lower half, Min-Heap for upper half. | **LC 295: Find Median from Data Stream** |\n| **K-Way Merge** | Merge $K$ sorted linked lists/arrays simultaneously. | **LC 23: Merge k Sorted Lists** |\n| **Task Scheduling / Greedy** | Pick the most frequent or highest profit available task first. | **LC 621: Task Scheduler** |\n\n\ud83d\udc49 **Deep Dive Guide:** [Heaps & Priority Queues Master Cheat Sheet](./heaps_priority_queues_cheat_sheet.md)\n\n---\n\n## 8. \ud83d\udcc8 Kadane's Algorithm\n\n### \ud83d\udca1 The Big Idea: The Toxic Debt Rule\nWhen finding the maximum contiguous subarray among negative numbers:\n* Positive running balances help future numbers. Keep carrying them forward!\n* The second your running balance drops below 0, it becomes **toxic debt**.\n* **Declare bankruptcy, drop the past, and start fresh!**\n* Formula: `current_sum = max(num, current_sum + num)`\n\n### \ud83d\udccb What Kind of Problems Fall Under Kadane's Algorithm?\n| Category | Problem Statement / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **Max Subarray Sum** | Contiguous slice with largest sum in presence of negatives. | **LC 53: Maximum Subarray** |\n| **Circular Max Subarray** | $\\max(\\text{Kadane Max}, \\text{Total} - \\text{Kadane Min})$. | **LC 918: Maximum Sum Circular Subarray** |\n| **Max Product Subarray** | Track both `cur_max` and `cur_min` (negative flips to positive). | **LC 152: Maximum Product Subarray** |\n| **Maximum Difference / Stock** | Convert price array into daily deltas: Kadane on differences. | **LC 121: Best Time to Buy and Sell Stock** |\n\n\ud83d\udc49 **Deep Dive Guide:** [Kadane's Algorithm Master Cheat Sheet](./kadanes_algorithm_cheat_sheet.md)\n\n---\n\n## 9. \ud83c\udfe7 Greedy Subtraction (The ATM / Cashier Pattern)\n\n### \ud83d\udca1 The Big Idea: The ATM Dispenser Analogy\nInstead of converting a number into a string and doing complicated digit-by-digit place-value math (`10 ** cur_l`), treat the problem like **an ATM dispensing cash with the fewest bills possible**:\n* Define your denominations in **strictly descending order** (from largest to smallest).\n* For Roman numerals, treat subtractive pairs (`900: 'CM'`, `4: 'IV'`) as standard bill denominations!\n* For each denomination, repeatedly peel off bills (`while num >= bill: num -= bill; result.append(symbol)`) until you must drop to the next smaller bill.\n\n### \ud83d\udccb What Kind of Problems Fall Under Greedy Subtraction?\n| Category | Problem Statement / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **Symbol Decomposition** | Decimal to Roman numerals with subtractive pairs. | **LC 12: Integer to Roman** |\n| **Number to English Words** | Break number into billions, millions, thousands, hundreds. | **LC 273: Integer to English Words** |\n| **Canonical Coin Change** | Dispense fewest coins for standard currencies ($0.25, 0.10, 0.05, 0.01$). | Real-World ATM Systems |\n| **Time / Storage Conversion** | Convert seconds into days, hours, mins, secs without string math. | General CS Systems |\n\n### \ud83c\udfaf When to Use It?\n1. Decomposing a total into standard predefined units (Roman numerals, currency change, seconds to days/hours/mins).\n2. The unit system is canonical (greedily picking the largest never blocks an optimal answer).\n3. Inner `while` loop runs $\\le 3$ times per symbol for Roman numerals, making it strictly $\\mathcal{O}(1)$ time with zero division math bugs.\n\n\ud83d\udc49 **Deep Dive Guide:** [Greedy Subtraction (ATM Pattern) Master Cheat Sheet](./greedy_subtraction_atm_cheat_sheet.md) | [LeetCode 12: Integer to Roman](./12_integer_to_roman.md)\n\n---\n\n## 10. \u2696\ufe0f Prefix Sum (The Seesaw Balance Pattern)\n\n### \ud83d\udca1 The Big Idea: The Seesaw / Conservation Analogy\nWhen a problem asks you to compare the left side of an array with the right side (pivots, equilibrium indices, split points):\n* **The TLE Trap:** Calling `sum(nums[:i])` and `sum(nums[i+1:])` inside a loop takes $\\mathcal{O}(n^2)$ time ($2.5 \\times 10^9$ operations!).\n* **Total Conservation Law:** In an array, total sum is constant. Thus:\n  $$\\text{Left Sum} + \\text{nums}[i] + \\text{Right Sum} = \\text{Total Sum}$$\n  $$\\mathbf{\\text{Right Sum} = \\text{Total Sum} - \\text{Left Sum} - \\text{nums}[i]}$$\n* You never calculate the right side! Just maintain one running integer: `left_sum`.\n\n### \ud83c\udfaf When to Use It? (The 3-Second Mental Radar)\n1. Problem asks for an **index where left side equals right side** (or a comparison between elements before vs elements after).\n2. The property is cumulative (sum, frequency, product, or count).\n3. Check the balance condition **before** adding `nums[i]` to `left_sum`!\n\n### \ud83d\udccb What Kind of Problems Fall Under This Pattern?\nThe Seesaw Balance pattern applies to **4 major problem archetypes** on LeetCode:\n\n| Category | Problem Type | Problem Statement / Goal | The Seesaw Equation |\n| :--- | :--- | :--- | :--- |\n| **1. Equilibrium / Pivot Points** | **LC 724 / LC 1991: Find Pivot Index** | Find an index where sum of elements on left equals sum on right. | `left_sum == total - left_sum - nums[i]` |\n| **2. Valid Split Points** | **LC 2270: Number of Ways to Split Array** | Count indices where left subarray sum is $\\ge$ right subarray sum. | `left_sum >= total - left_sum` |\n| **3. String / Character Balances** | **LC 1422: Maximum Score After Splitting a String** | Split string into two non-empty substrings: maximize (zeros on left + ones on right). | `left_zeros + (total_ones - left_ones)` |\n| **4. Multiplicative Balance (No Division)** | **LC 238: Product of Array Except Self** | Find product of all elements except self without using division. | $\\text{left\\_prod} \\times \\text{right\\_prod}$ (two running passes) |\n| **5. Two-Row Grid Path Balances** | **LC 2017: Grid Game** | Robot 1 picks a column to drop from Row 0 to Row 1; minimize Robot 2's score. | Robot 2 gets $\\max(\\text{Row 0 Right}, \\text{Row 1 Left})$ |\n\n\ud83d\udc49 **Deep Dive Guide:** [Prefix Sum (Seesaw) Master Cheat Sheet](./prefix_sum_seesaw_cheat_sheet.md) | [Find Pivot Index (LC 724)](./724_find_pivot_index.md)\n\n---\n\n## 11. \ud83d\udd17 Linked Lists (Pointer Choreography & The Dummy Head)\n\n### \ud83d\udca1 The Big Idea: The Nested Russian Doll\n* A Linked List is **NOT** a flat array! It is a chain of nested objects: `ListNode(val, next=ListNode(...))`.\n* A node only knows its own value and where the next node lives (`.next`). Finding length is **$\\mathcal{O}(n)$**, not $\\mathcal{O}(1)$! Calling `len(head)` will crash with a `TypeError`!\n\n### \ud83d\udee1\ufe0f The Dummy Head Superweapon:\n* When building or modifying a list, use a **Dummy Node** (`dummy = ListNode()`) to anchor the front.\n* **`dummy` (The Coat Rack):** Never moves! Retains the pointer to the start so you never lose the head.\n* **`cur` (Your Hand):** Walks forward (`cur = cur.next`), stitching new nodes to the tail.\n* **`return dummy.next`:** Skips the fake placeholder node and returns the first real node of your result!\n\n### \ud83c\udf92 In-Place Reversal: The Conga Line Backpack Model (LC 206)\n* A line of children holding each other's backpacks: `[ Alice ] \u2500\u2500\u25ba [ Bob ] \u2500\u2500\u25ba [ Charlie ] \u2500\u2500\u25ba None`.\n* You want Charlie at the front and Alice at the back. **If Bob turns around without a spotter, Charlie runs off!**\n* **The 4-Beat Rhythmic Dance:**\n  1. `nxt = curr.next` $\\implies$ **SPOTTER:** Hold child in front so they don't run away!\n  2. `curr.next = prev` $\\implies$ **TURN AROUND:** Grab backpack of person behind you!\n  3. `prev = curr` $\\implies$ **SLIDE PREV:** You are now the person \"behind\" for the next round.\n  4. `curr = nxt` $\\implies$ **SLIDE CURR:** Next child's turn to turn around.\n* When loop ends (`curr = None`), **`return prev`** (pointing to Charlie, the new front of the line!).\n\n### \ud83e\ude9e The 3-Step Triple Crown: Palindrome & Reorder (LC 234, LC 143)\n* **Goal:** Verify palindromes or reorder nodes in **$\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ auxiliary space**.\n* **Step 1 (Find Mid):** `while fast.next and fast.next.next:` (slow stops at end of 1st half).\n* **Step 2 (Reverse 2nd Half):** In-place Conga Line 4-beat dance on `slow.next`.\n* **Step 3 (Compare / Merge):** Walk `p1 = head` and `p2 = reversed_second_half` until `p2` is exhausted.\n* **Senior Bonus (Restore):** Re-reverse the second half back to original so caller's memory is intact.\n* **Baseline vs Slicing:** Two Pointers Squeeze (`l < r`) beats `lst == lst[::-1]` by avoiding $\\mathcal{O}(n)$ array duplication and exiting in $\\mathcal{O}(1)$ time on mismatch ($1,685\\times$ faster).\n\n### \ud83d\udccf The Measuring Stick / Offset Two Pointers (LC 19, LC 1721)\n* **Goal:** Locate or swap the $k$-th node from the beginning and $k$-th node from the end in **$\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space**.\n* **The \"Fencepost\" Step Rule:** To reach Node $k$ from Node 1, take **`k - 1` steps** (`range(k - 1)`). Taking $k$ steps lands you on Node $k+1$!\n* **The Measuring Stick:** Set `fast = first` ($k$-th from start) and `second = head`. Slide both until `fast.next is None`. `second` is guaranteed to be on the $k$-th node from the end!\n* **Direction-Dependent Swap Bug:** If using an array to rebuild, never swap inside the loop (`if i == k - 1:`). When $k$ is in the second half (e.g. `[100, 90], k = 2`), earlier nodes are read before swapping, causing duplicate values (`[100, 100]`). Always swap *before* the loop!\n\n### \u26a1 The Positional Stream Accumulator / Horner's Rule (LC 1290)\n* **Goal:** Convert an incoming stream of bits/digits into an integer in **$\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space** without string conversions (`s += ...`) or powers (`2 ** k`).\n* **The Shift-and-Add Model:** Just like reading base-10 digits (`ans = ans * 10 + digit`), in binary we shift left by 1 and add the bit: `ans = ans * 2 + head.val` or `ans = (ans << 1) | head.val`.\n\n### \ud83d\udccb What Kind of Problems Fall Under Linked Lists?\n| Pattern / Technique | Problem Category / Goal | Classic LeetCode |\n| :--- | :--- | :--- |\n| **Dummy Head + Zipper Merge** | Merge two sorted lists into one sorted list in-place. | **LC 21: Merge Two Sorted Lists** |\n| **Conga Line Reversal (Prev/Curr/Next)** | Reverse all arrows in a single pass without extra space. | **LC 206: Reverse Linked List** |\n| **Tortoise & Hare (Slow 1x, Fast 2x)** | Detect cycles without using sets; find exact middle node. | **LC 141: Linked List Cycle**, **LC 876: Middle of Linked List** |\n| **Pointer Skipping (Snip & Recheck)** | Remove duplicate nodes in-place (advance only in `else`). | **LC 83: Remove Duplicates from Sorted List** |\n| **Dummy + Offset Two Pointers** | Remove $N$-th node from end in a single pass. | **LC 19: Remove Nth Node From End** |\n| **Reorder / Palindrome (3-Step)** | Find mid $\\to$ reverse second half $\\to$ merge/compare. | **LC 143: Reorder List**, **LC 234: Palindrome Linked List** |\n| **Measuring Stick (Offset Runners)** | Swap $k$-th from start and $k$-th from end in $\\mathcal{O}(1)$ space. | **LC 1721: Swapping Nodes in a Linked List** |\n| **Horner's Stream Accumulation** | Convert binary linked list to decimal in $\\mathcal{O}(1)$ space. | **LC 1290: Convert Binary in Linked List** |\n\n### \ud83d\uddfa\ufe0f The 11 Archetypes of Linked Lists (The 90% Rule)\nAccording to the viral LeetCode master taxonomy, 90%+ of all linked list problems collapse into **11 archetypes**:\n1. **Type 0:** Design & Sentinels (`LC 707`)\n2. **Type 1:** Single-Pass / Stream / Recursion (`LC 1290`, `LC 1721`, `LC 369`)\n3. **Type 2:** Conga Line Reversals (`LC 206`, `LC 92`, `LC 234`, `LC 25`)\n4. **Type 3:** Reordering & Conveyor Belts (`LC 86`, `LC 143`, `LC 24`, `LC 328`)\n5. **Type 4:** Deleting Nodes / Skip & Bypass (`LC 19`, `LC 83`, `LC 82`, `LC 203`)\n   *(Rule: Sorted duplicates = $\\mathcal{O}(1)$ space; Unsorted duplicates = Hash Table $\\mathcal{O}(n)$ space!)*\n6. **Type 5:** Circular List Insertion (`LC 708`)\n7. **Type 6:** Multiple Lists & Zipper Merge (`LC 21`, `LC 2`, `LC 445`, `LC 23`)\n8. **Type 7:** Fast & Slow Pointers / Tortoise & Hare (`LC 141`, `LC 876`, `LC 2095`, `LC 142`)\n9. **Type 8:** Hash Table Augmented (`LC 138` Random Pointer, `LC 1836`)\n10. **Type 9:** Custom Data Structures: DLL + HashMap (`LC 146` LRU Cache, `LC 1472`)\n11. **Type 10:** Divide & Conquer / Tree Hybrids (`LC 148` Sort List, `LC 426`, `LC 430`, `LC 237`)\n\n\ud83d\udc49 **Deep Dive Guides:** [90% Linked List Taxonomy Guide](./linked_list_90_percent_taxonomy.md) | [Linked List Master Cheat Sheet](./linked_list_master_cheat_sheet.md) | [Convert Binary in Linked List (LC 1290)](./1290_convert_binary_number_in_a_linked_list_to_integer.md) | [Swapping Nodes in a Linked List (LC 1721)](./1721_swapping_nodes_in_a_linked_list.md) | [Reverse Linked List (LC 206)](./206_reverse_linked_list.md) | [Merge Two Sorted Lists (LC 21)](./21_merge_two_sorted_lists.md) | [Remove Duplicates (LC 83)](./83_remove_duplicates_from_sorted_list.md) | [Palindrome Linked List (LC 234)](./234_palindrome_linked_list.md) | [Linked List Fundamentals](./01_linked_list_fundamentals.md)\n\n---\n\n## \ud83d\udca1 12. Python Under-the-Hood & Interview Pro Tips\n\n### \u26a1 12.1. The Python Loop Speed Hierarchy: Direct vs. Range vs. While\n\nMany candidates wonder: *\"Does loop syntax actually matter in Python?\"*  \n**Answer: YES, dramatically!** The difference can be the difference between **3 ms (Beats 30%)** and **0 ms (Beats 100%)** on LeetCode.\n\n```text\n\ud83e\udd47 FASTEST:  for ch in s:              (Direct C-Pointer Iteration)\n\ud83e\udd48 MIDDLE:   for i in range(len(s)):   (Range Index Generation)\n\ud83e\udd49 SLOWEST:  while i < len(s):         (Manual Bytecode While Loop)\n```\n\n#### Why is `for ch in s` faster than `for i in range(len(s))`?\n\nLook at what Python has to do on **every single iteration**:\n\n| What happens in: `for i in range(len(s)): s[i]` | What happens in: `for ch in s:` |\n| :--- | :--- |\n| 1. `len(s)` computes string length. | 1. Internal C pointer advances 1 memory address. |\n| 2. `range()` iterator generates an integer object `i`. | 2. Yields the character directly to your variable. |\n| 3. `s[i]` performs array bounds check (`0 <= i < len`). | **No integer objects created, no bounds check!** |\n| 4. Fetches the character object. | **Runs entirely in compiled C machine code.** |\n\n#### \ud83c\udfaf The Golden Rule for Loop Selection:\n* **Default to `for item in collection:`** whenever you only need the value.\n* **Use `for i, item in enumerate(collection):`** when you need *both* the index and the value.\n* **Use `for i in range(n):`** only when generating synthetic numbers or step jumps.\n* **Only use `while`** when step sizes are dynamic (e.g. `i += k`), pointers squeeze inwards (`while l < r:`), or checking node pointers (`while fast and fast.next:`).\n\n---\n\n### \ud83c\udf92 12.2. The 4 Golden Python Micro-Rules for High-Performance DSA\n\nYou don't need obscure hacks to write blazing-fast Python. Remember these 4 core idioms:\n\n1. **Iterate items directly:**  \n   `for ch in s:` \u2705  \n   `for i in range(len(s)): s[i]` \u274c *(unless indices are strictly needed)*.\n2. **Use Python \"Truthiness\" for empty checks:**  \n   `if not stack:` \u2705 (evaluates directly in C via `tp_as_sequence->sq_length == 0`)  \n   `if len(stack) == 0:` \u274c (involves function call overhead and integer comparison).\n3. **Check mathematical invariants BEFORE starting loops:**  \n   In [LC 20: Valid Parentheses](./20_valid_parentheses.md):  \n   Every opening bracket requires a closing bracket. A valid string **can never have an odd length**!  \n   ```python\n   if len(s) % 2 != 0:\n       return False  # Instant O(1) early exit before touching stack/memory!\n   ```\n4. **Combine Peek + Pop in short-circuit evaluation:**  \n   Instead of checking `stack[-1]` in an `elif` and calling `stack.pop()` in `else`:\n   ```python\n   # Combined in 1 line:\n   if not stack or stack.pop() != expected:\n       return False\n   ```\n\n---\n\n### \ud83d\udce5 12.3. The \"Push-Expected\" Stack Pattern (LC 20)\n\nWhen matching pairs (parentheses, tags, brackets), beginners map `closing -> opening` and constantly check `stack[-1]`.\n\nTop-tier candidates flip the logic: **Map opening brackets to what you EXPECT to see next!**\n\n```python\nclass Solution:\n    def isValid(self, s: str) -> bool:\n        if len(s) % 2 != 0:\n            return False  # Early exit on odd length\n\n        mapping = {'(': ')', '[': ']', '{': '}'}\n        stack = []\n\n        for ch in s:\n            if ch in mapping:\n                stack.append(mapping[ch])  # Push the EXPECTED closer!\n            elif not stack or stack.pop() != ch:\n                return False\n\n        return not stack\n```\n\n#### \ud83d\udca1 Why \"Push-Expected\" is Superior:\n* When you see `'('`, you push `')'` to the stack.\n* When you encounter a closing character (`')'`), **you don't even need a dictionary lookup!** You just pop and compare directly: `stack.pop() != ch`.\n* This **cuts dictionary lookups in half** (lookup only occurs on opening brackets)!\n\n---\n\n### \ud83e\ude9c 12.4. Telescoping Sums & Interval Decomposition\n\n#### The Big Idea: The Staircase Analogy\nSuppose you walk from **Floor 1 to Floor 5**:\n* **Direct Calculation:** $\\text{Top} - \\text{Bottom} = 5 - 1 = \\mathbf{4}$\n* **Step-by-Step Sum:** $(2 - 1) + (3 - 2) + (4 - 3) + (5 - 4) = 1 + 1 + 1 + 1 = \\mathbf{4}$\n\nBoth give the **exact same answer**. The intermediate steps cancel out:\n$$(C - A) = (B - A) + (C - B)$$\n\n#### \ud83c\udfaf When to Use This in Interviews?\nAsk yourself: **\"Can I break a multi-day / multi-step action into single 1-step moves with ZERO penalty?\"**\n\n1. **When it WORKS (e.g. Stock II - LC 122):**  \n   You have **unlimited transactions** and no fees. Holding a stock for 5 days is mathematically identical to buying and selling every single day!  \n   \ud83d\udc49 *Action:* Don't track valleys or peaks. Just loop through adjacent pairs: `if prices[i] > prices[i-1]: profit += prices[i] - prices[i-1]`.\n2. **When it FAILS (e.g. Stock I - LC 121):**  \n   You are strictly limited to **1 transaction total**. If you cash out on Day 2, your quota is spent. You cannot break it into daily steps.  \n   \ud83d\udc49 *Action:* Forced to track the single lowest day (`min_price`).\n\n*\ud83d\udc49 See [`122_best_time_to_buy_and_sell_stock_ii.md`](./122_best_time_to_buy_and_sell_stock_ii.md) for the complete problem walkthrough.*\n\n\n\n", "category": "Root"}, "faang_preparation_plan.md": {"title": "\ud83c\udfaf 10-Week FAANG DSA Mastery Roadmap & Targets", "content": "# \ud83c\udfaf 10-Week FAANG DSA Mastery Roadmap & Targets\n\n> **Pace Formula:** 2 problems/day on weekdays (Mon\u2013Fri = 10 problems) + 5 problems/day on weekends (Sat\u2013Sun = 10 problems)  \n> **Target Velocity:** **20 problems/week** $\\approx$ **80 problems/month**  \n> **Total Horizon:** **10\u201312 Weeks (~150 to 180 high-yield Top Interview problems)**  \n> **Philosophy:** *Solve by archetype and pattern, not by memorizing problem IDs.*\n\n---\n\n## \ud83d\udcca Summary of Velocity & Milestones\n\n| Phase | Duration | Core Focus Topics | Target Total Solved |\n|---|---|---|---|\n| **Phase 1: Foundations & Arrays** | Weeks 1 \u2013 3 | Two Pointers, Sliding Window, Prefix Sum, HashMaps, Kadane | 0 $\\rightarrow$ 60 |\n| **Phase 2: Linked Lists, Stacks & Binary Search** | Weeks 4 \u2013 6 | Fast/Slow Pointers, Reversals, Monotonic Stack, Binary Search Boundaries | 60 $\\rightarrow$ 120 |\n| **Phase 3: Trees, BFS/DFS & Heaps** | Weeks 7 \u2013 9 | Binary Trees, BSTs, Level-order BFS, Graph Traversals, Top-K Heaps | 120 $\\rightarrow$ 180 |\n| **Phase 4: Backtracking & Dynamic Programming** | Weeks 10 \u2013 12 | Decision Trees, Subsets/Permutations, 1D/2D DP, Interval & Matrix | 180 $\\rightarrow$ 210+ & Mock Interviews |\n\n---\n\n## \ud83d\uddd3\ufe0f Detailed Week-by-Week Breakdown\n\n### \ud83d\udccd Phase 1: Arrays, Strings & Pointers (Weeks 1 \u2013 3)\n* **Goal:** Never get stuck on indices, pointers, or off-by-one errors. Master $\\mathcal{O}(1)$ space in-place manipulation.\n\n#### **Week 1: Two Pointers & In-Place Array Transformations**\n* **Weekday Target (10 problems):**\n  * \u2705 [LC 88. Merge Sorted Array (Easy)](./88_merge_sorted_array.md)\n  * \u2705 [LC 27. Remove Element (Easy)](./27_remove_element.md)\n  * \u2705 [LC 26. Remove Duplicates from Sorted Array (Easy)](./26_remove_duplicates_from_sorted_array.md)\n  * \u2705 [LC 80. Remove Duplicates from Sorted Array II (Medium)](./80_remove_duplicates_from_sorted_array_ii.md)\n  * \u2705 [LC 169. Majority Element (Easy)](./169_majority_element.md)\n  * \u2705 [LC 189. Rotate Array (Medium)](./189_rotate_array.md)\n  * \u2705 [LC 121. Best Time to Buy and Sell Stock (Easy)](./121_best_time_to_buy_and_sell_stock.md)\n  * [ ] LC 122. Best Time to Buy and Sell Stock II (Medium)\n  * [ ] LC 55. Jump Game (Medium)\n  * [ ] LC 45. Jump Game II (Medium)\n* **Weekend Target (10 problems):**\n  * [ ] LC 125. Valid Palindrome (Easy)\n  * [ ] LC 392. Is Subsequence (Easy)\n  * [ ] LC 167. Two Sum II - Input Array Is Sorted (Medium)\n  * [ ] LC 11. Container With Most Water (Medium)\n  * [ ] LC 15. 3Sum (Medium)\n  * [ ] LC 238. Product of Array Except Self (Medium)\n  * [ ] LC 134. Gas Station (Medium)\n  * [ ] LC 274. H-Index (Medium)\n  * [ ] LC 380. Insert Delete GetRandom O(1) (Medium)\n  * [ ] LC 42. Trapping Rain Water (Hard - *FAANG Classic Milestone*)\n\n---\n\n#### **Week 2: Sliding Window & HashMaps**\n* **Weekday Target (10 problems):**\n  * Fixed window: LC 643 (Max Average Subarray I), LC 1456 (Max Vowels)\n  * Dynamic window: LC 3 (Longest Substring Without Repeating Characters), LC 209 (Minimum Size Subarray Sum)\n  * HashMaps: LC 1 (Two Sum), LC 205 (Isomorphic Strings), LC 290 (Word Pattern), LC 242 (Valid Anagram), LC 49 (Group Anagrams), LC 128 (Longest Consecutive Sequence)\n* **Weekend Target (10 problems):**\n  * Hard Window: LC 76 (Minimum Window Substring), LC 30 (Substring with Concatenation of All Words)\n  * Matrix: LC 36 (Valid Sudoku), LC 54 (Spiral Matrix), LC 48 (Rotate Image), LC 73 (Set Matrix Zeroes), LC 289 (Game of Life)\n  * Intervals: LC 228 (Summary Ranges), LC 56 (Merge Intervals), LC 57 (Insert Interval)\n\n---\n\n#### **Week 3: Prefix Sums, Kadane & Matrix Manipulation**\n* **Weekday Target (10 problems):**\n  * Prefix sums: LC 724 (Find Pivot Index), LC 560 (Subarray Sum Equals K), LC 525 (Contiguous Array), LC 238 (Prefix/Suffix Products)\n  * Kadane variants: LC 53 (Maximum Subarray), LC 918 (Maximum Sum Circular Subarray), LC 152 (Maximum Product Subarray)\n  * String transforms: LC 14 (Longest Common Prefix), LC 58 (Length of Last Word), LC 151 (Reverse Words in a String)\n* **Weekend Target (10 problems):**\n  * Simulation: LC 6 (Zigzag Conversion), LC 68 (Text Justification - Hard)\n  * Greedy Cashier / ATM: LC 13 (Roman to Integer), LC 12 (Integer to Roman)\n  * Substrings: LC 28 (Find Index of First Occurrence), LC 452 (Minimum Number of Arrows to Burst Balloons)\n\n---\n\n### \ud83d\udccd Phase 2: Linked Lists, Stacks & Binary Search (Weeks 4 \u2013 6)\n* **Goal:** Fluid pointer rewiring with $\\mathcal{O}(1)$ space; understanding LIFO monotonicity and logarithmic boundary searches.\n\n#### **Week 4: Linked List Mastery (11 Archetypes)**\n* **Weekday Target (10 problems):**\n  * Traversal & dummy node: LC 206 (Reverse LL), LC 21 (Merge Two Sorted Lists), LC 83 (Remove Duplicates from Sorted List), LC 82 (Remove Duplicates II)\n  * Tortoise & Hare: LC 141 (Cycle), LC 142 (Cycle II), LC 876 (Middle of LL)\n  * Measuring stick: LC 19 (Remove Nth from End), LC 1721 (Swapping Nodes), LC 61 (Rotate List)\n* **Weekend Target (10 problems):**\n  * Triple crowns: LC 234 (Palindrome LL), LC 143 (Reorder List), LC 92 (Reverse Linked List II)\n  * Hard rewiring: LC 25 (Reverse Nodes in k-Group - *FAANG Bar Raiser*), LC 138 (Copy List with Random Pointer), LC 2 (Add Two Numbers), LC 445 (Add Two Numbers II), LC 86 (Partition List), LC 23 (Merge k Sorted Lists - Hard), LC 146 (LRU Cache - *Top 1 FAANG Question*)\n\n---\n\n#### **Week 5: Stacks & Monotonic Stacks**\n* **Weekday Target (10 problems):**\n  * Classical stack: LC 20 (Valid Parentheses), LC 678 (Valid Parenthesis String - Parked), LC 71 (Simplify Path), LC 155 (Min Stack), LC 150 (Evaluate Reverse Polish Notation)\n  * Two stacks / Queues: LC 232 (Queue using Stacks), LC 225 (Stack using Queues)\n  * Monotonic stack introduction: LC 739 (Daily Temperatures), LC 496 (Next Greater Element I), LC 503 (Next Greater Element II), LC 901 (Online Stock Span)\n* **Weekend Target (10 problems):**\n  * Deep monotonic stack: LC 84 (Largest Rectangle in Histogram - Hard), LC 85 (Maximal Rectangle - Hard), LC 402 (Remove K Digits), LC 316 (Remove Duplicate Letters)\n  * Calculator series: LC 224 (Basic Calculator - Hard), LC 227 (Basic Calculator II), LC 394 (Decode String), LC 735 (Asteroid Collision), LC 856 (Score of Parentheses), LC 946 (Validate Stack Sequences)\n\n---\n\n#### **Week 6: Binary Search & Monotonic Spaces**\n* **Weekday Target (10 problems):**\n  * Standard & rotated: LC 704 (Binary Search), LC 35 (Search Insert Position), LC 74 (Search a 2D Matrix), LC 33 (Search in Rotated Sorted Array), LC 81 (Search in Rotated II), LC 153 (Find Minimum in Rotated), LC 154 (Find Minimum II)\n  * Ranges: LC 34 (First and Last Position), LC 162 (Find Peak Element), LC 278 (First Bad Version)\n* **Weekend Target (10 problems):**\n  * Binary search on answer space: LC 875 (Koko Eating Bananas), LC 1011 (Capacity To Ship Packages), LC 410 (Split Array Largest Sum - Hard), LC 4 (Median of Two Sorted Arrays - Hard)\n  * 2D binary search: LC 240 (Search a 2D Matrix II), LC 378 (Kth Smallest in Sorted Matrix)\n  * Math & Bitwise: LC 69 (Sqrt(x)), LC 50 (Pow(x, n)), LC 66 (Plus One), LC 1290 (Binary LL to Integer)\n\n---\n\n### \ud83d\udccd Phase 3: Trees, BFS/DFS & Heaps (Weeks 7 \u2013 9)\n* **Goal:** Master recursion, tree depth, level-order queues, and min/max heap invariants.\n\n#### **Week 7: Binary Trees & BSTs**\n* **Weekday Target (10 problems):**\n  * Traversals: LC 104 (Max Depth), LC 111 (Min Depth), LC 100 (Same Tree), LC 101 (Symmetric Tree), LC 226 (Invert Binary Tree), LC 112 (Path Sum), LC 113 (Path Sum II), LC 129 (Sum Root to Leaf), LC 222 (Count Complete Tree Nodes), LC 110 (Balanced Tree)\n* **Weekend Target (10 problems):**\n  * Construction & Ancestors: LC 236 (Lowest Common Ancestor - Classic), LC 235 (LCA of BST), LC 105 (Construct from Preorder/Inorder), LC 106 (Construct from Inorder/Postorder), LC 114 (Flatten to LL), LC 116 / 117 (Populating Next Pointers)\n  * BST properties: LC 98 (Validate BST), LC 530 (Minimum Absolute Difference), LC 230 (Kth Smallest in BST), LC 297 (Serialize & Deserialize Tree - Hard)\n\n---\n\n#### **Week 8: Level-Order BFS & Graphs Basics**\n* **Weekday Target (10 problems):**\n  * Tree BFS: LC 102 (Level Order Traversal), LC 107 (Bottom-Up Level Order), LC 103 (Zigzag Level Order), LC 199 (Right Side View), LC 637 (Average of Levels)\n  * Graph BFS/DFS: LC 200 (Number of Islands - *Meta Favorite*), LC 133 (Clone Graph), LC 695 (Max Area of Island), LC 417 (Pacific Atlantic Water Flow), LC 130 (Surrounded Regions)\n* **Weekend Target (10 problems):**\n  * Topological sort: LC 207 (Course Schedule), LC 210 (Course Schedule II), LC 802 (Find Eventual Safe States)\n  * Word ladder: LC 127 (Word Ladder - Hard), LC 909 (Snakes and Ladders), LC 433 (Minimum Genetic Mutation), LC 399 (Evaluate Division), LC 994 (Rotting Oranges), LC 752 (Open the Lock), LC 785 (Is Graph Bipartite?)\n\n---\n\n#### **Week 9: Priority Queues (Heaps) & Tries**\n* **Weekday Target (10 problems):**\n  * Heaps: LC 215 (Kth Largest Element in Array), LC 373 (Find K Pairs with Smallest Sums), LC 347 (Top K Frequent Elements), LC 973 (K Closest Points to Origin), LC 1046 (Last Stone Weight), LC 621 (Task Scheduler), LC 767 (Reorganize String)\n  * Tries: LC 208 (Implement Trie), LC 211 (Design Add and Search Words), LC 648 (Replace Words)\n* **Weekend Target (10 problems):**\n  * Advanced Heaps & Two Heaps: LC 295 (Find Median from Data Stream - Hard), LC 502 (IPO - Hard), LC 23 (Merge k Sorted Lists with Heap)\n  * Trie Hard: LC 212 (Word Search II - Hard), LC 421 (Maximum XOR of Two Numbers)\n  * Union-Find / DSU: LC 547 (Number of Provinces), LC 684 (Redundant Connection), LC 1319 (Number of Operations to Make Network Connected), LC 721 (Accounts Merge), LC 128 (Longest Consecutive with DSU)\n\n---\n\n### \ud83d\udccd Phase 4: Backtracking & Dynamic Programming (Weeks 10 \u2013 12)\n* **Goal:** Develop 100% confidence with recursion trees, memoization, and bottom-up DP tables.\n\n#### **Week 10: Backtracking & Decision Trees**\n* **Weekday Target (10 problems):**\n  * Subsets & combinations: LC 78 (Subsets), LC 90 (Subsets II), LC 77 (Combinations), LC 39 (Combination Sum), LC 40 (Combination Sum II), LC 216 (Combination Sum III)\n  * Permutations: LC 46 (Permutations), LC 47 (Permutations II), LC 17 (Letter Combinations of a Phone Number), LC 22 (Generate Parentheses)\n* **Weekend Target (10 problems):**\n  * Grid search & constraints: LC 79 (Word Search), LC 51 (N-Queens - Hard), LC 52 (N-Queens II), LC 37 (Sudoku Solver - Hard), LC 131 (Palindrome Partitioning), LC 93 (Restore IP Addresses), LC 842 (Split Array into Fibonacci), LC 140 (Word Break II - Hard), LC 282 (Expression Add Operators - Hard), LC 698 (Partition to K Equal Sum Subsets)\n\n---\n\n#### **Week 11: 1D Dynamic Programming & Interval DP**\n* **Weekday Target (10 problems):**\n  * Climbing & Fibonacci: LC 70 (Climbing Stairs), LC 746 (Min Cost Climbing Stairs), LC 198 (House Robber), LC 213 (House Robber II)\n  * Unbounded / Knapsack: LC 322 (Coin Change), LC 518 (Coin Change II), LC 279 (Perfect Squares)\n  * Word break & LIS: LC 139 (Word Break), LC 300 (Longest Increasing Subsequence), LC 673 (Number of LIS)\n* **Weekend Target (10 problems):**\n  * Partition & Stock DP: LC 416 (Partition Equal Subset Sum), LC 494 (Target Sum), LC 123 (Best Time to Buy and Sell Stock III - Hard), LC 188 (Stock IV - Hard), LC 309 (Stock with Cooldown), LC 714 (Stock with Transaction Fee), LC 152 (Max Product Subarray DP), LC 354 (Russian Doll Envelopes - Hard), LC 410 (Split Array DP), LC 1048 (Longest String Chain)\n\n---\n\n#### **Week 12: 2D DP, Strings & Final Mock Sprint**\n* **Weekday Target (10 problems):**\n  * Grid paths: LC 62 (Unique Paths), LC 63 (Unique Paths II), LC 64 (Minimum Path Sum), LC 120 (Triangle)\n  * String 2D DP: LC 1143 (Longest Common Subsequence), LC 72 (Edit Distance - Hard), LC 97 (Interleaving String), LC 115 (Distinct Subsequences - Hard), LC 10 (Regular Expression Matching - Hard), LC 44 (Wildcard Matching - Hard)\n* **Weekend Target (10 problems):**\n  * 10 Final FAANG Simulated Mock Interview Timed Sessions (45 min each, 2 random questions).\n\n---\n\n## \ud83d\udcc8 Daily & Weekly Target Tracking Formula\n\n* **Weekly Quota:** 20 problems\n* **Daily Weekday Routine:** \n  * \ud83c\udf05 **Morning (30\u201340 min):** 1 problem (solve, reflect, document key archetype).\n  * \ud83c\udf06 **Evening (30\u201340 min):** 1 problem (solve, review time/space trade-offs).\n* **Weekend Deep Sprint:**\n  * \u2615 **Saturday:** 5 problems (mixed Mediums).\n  * \u2615 **Sunday:** 5 problems (including 1 Hard milestone + review cheat sheets).\n", "category": "Root"}, "04_sorting/08_bubble_sort.md": {"title": "\ud83e\udee7 Bubble Sort \u2013 Complete Guide & Intuition", "content": "# \ud83e\udee7 Bubble Sort \u2013 Complete Guide & Intuition\n\n> **Source Reference:** [AlgoMaster.io \u2013 Bubble Sort](https://algomaster.io/learn/dsa/bubble-sort)  \n> **Category:** Comparison-Based Elementary Sorting  \n> **Difficulty:** Easy (Fundamental)\n\n---\n\n## \ud83d\udccc 1. What Is Bubble Sort?\n\n**Bubble Sort** is a comparison-based sorting algorithm that repeatedly steps through the array, compares adjacent elements, and swaps them if they are in the wrong order (i.e. `arr[j] > arr[j + 1]`).\n\n### \ud83e\udd64 Why is it called \"Bubble\" Sort?\nIn a carbonated drink (like soda), larger bubbles rise to the surface faster than smaller ones. \nIn Bubble Sort, **larger values \"bubble up\" to the end of the array** with every pass because they keep getting swapped forward at each comparison.\n\n```text\nPass 1: The absolute largest number bubbles to the last index (n - 1).\nPass 2: The 2nd largest number bubbles to the 2nd-to-last index (n - 2).\nPass i: The i-th largest number bubbles to index (n - i).\n```\nAfter at most $n - 1$ passes, the entire array is guaranteed to be sorted.\n\n---\n\n## \ud83d\udd0d 2. Step-by-Step Visual Walkthrough\n\nLet's sort the array: `[5, 1, 4, 2, 8]` (Length $n = 5$)\n\n### \ud83d\udd35 Pass 1 ($i = 0$):\nCompare adjacent pairs up to index $n - 1 - 0 = 4$:\n1. Compare `[5, 1]`: $5 > 1 \\implies$ **Swap** $\to [1, 5, 4, 2, 8]$\n2. Compare `[5, 4]`: $5 > 4 \\implies$ **Swap** $\to [1, 4, 5, 2, 8]$\n3. Compare `[5, 2]`: $5 > 2 \\implies$ **Swap** $\to [1, 4, 2, 5, 8]$\n4. Compare `[5, 8]`: $5 < 8 \\implies$ No swap $\to [1, 4, 2, 5, \\mathbf{8}]$\n\n\ud83d\udc49 **Result of Pass 1:** $\\mathbf{8}$ (the largest element) is locked in its permanent final position!\n\n---\n\n### \ud83d\udd35 Pass 2 ($i = 1$):\nCompare adjacent pairs up to index $n - 1 - 1 = 3$:\n1. Compare `[1, 4]`: $1 < 4 \\implies$ No swap $\to [1, 4, 2, 5, 8]$\n2. Compare `[4, 2]`: $4 > 2 \\implies$ **Swap** $\to [1, 2, 4, 5, 8]$\n3. Compare `[4, 5]`: $4 < 5 \\implies$ No swap $\to [1, 2, 4, \\mathbf{5}, \\mathbf{8}]$\n\n\ud83d\udc49 **Result of Pass 2:** $\\mathbf{5}$ is locked in place!\n\n---\n\n### \ud83d\udd35 Pass 3 ($i = 2$):\nCompare adjacent pairs up to index $n - 1 - 2 = 2$:\n1. Compare `[1, 2]`: $1 < 2 \\implies$ No swap\n2. Compare `[2, 4]`: $2 < 4 \\implies$ No swap\n\n\ud83d\udc49 **Result of Pass 3:** Z
