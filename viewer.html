3999$, the total steps are strictly bounded ($\\le 15$ operations).\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 Fixed dictionary of 13 entries.\n\n---\n\n## \u26a0\ufe0f Common Student Pitfalls to Avoid\n\n1. **Ascending Order Trap:**  \n   If you write the dictionary from `1: \"I\"` up to `1000: \"M\"`, the code will try to pay off $3749$ using 3,749 `\"I\"`s! Always order from **largest to smallest**.\n2. **Missing Subtractive Forms:**  \n   You must include the 6 subtractive forms (`900: 'CM'`, `400: 'CD'`, `90: 'XC'`, `40: 'XL'`, `9: 'IX'`, `4: 'IV'`) as first-class denominations in your table.\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/13_roman_to_integer.md": {"title": "\ud83c\udfdb\ufe0f LeetCode 13: Roman to Integer \u2013 Master Guide", "content": "# \ud83c\udfdb\ufe0f LeetCode 13: Roman to Integer \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** Top Interview 150 / NeetCode 150 / Blind 75  \n> **Pattern:** Hash Map / Linear Scan (Lookahead Comparison)  \n> **LeetCode Link:** [LeetCode 13: Roman to Integer](https://leetcode.com/problems/roman-to-integer/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nRoman numerals are represented by seven different symbols:\n* `I = 1`, `V = 5`, `X = 10`, `L = 50`, `C = 100`, `D = 500`, `M = 1000`\n\nUsually, symbols are written from largest to smallest from left to right: `XII = 10 + 1 + 1 = 12`.\n\nHowever, when a smaller symbol appears **before** a larger symbol, it represents subtraction:\n* `IV = 5 - 1 = 4`\n* `IX = 10 - 1 = 9`\n* `XL = 50 - 10 = 40`, `XC = 100 - 10 = 90`\n* `CD = 500 - 100 = 400`, `CM = 1000 - 100 = 900`\n\nGiven a roman numeral string `s`, convert it to an integer.\n\n```text\nExample 1: s = \"III\"      -> Output: 3\nExample 2: s = \"LVIII\"    -> Output: 58 (50 + 5 + 3)\nExample 3: s = \"MCMXCIV\"  -> Output: 1994 (1000 + 900 + 90 + 4)\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: The Universal Subtraction Rule\n\nYou do **not** need a separate dictionary of subtraction pairs (`{\"I\": [\"V\", \"X\"]}`).\n\nThere is a single **universal mathematical rule** for Roman numerals:\n\n> **\"Whenever a smaller value appears BEFORE a larger value, SUBTRACT it. Otherwise, ADD it!\"**\n\n```text\nLook at \"MCMXCIV\" (1994):\n- M (1000) >= C (100)  -> ADD 1000\n- C (100)  <  M (1000) -> SUBTRACT 100  (Lookahead sees larger M!)\n- M (1000) >= X (10)   -> ADD 1000\n- X (10)   <  C (100)  -> SUBTRACT 10   (Lookahead sees larger C!)\n- C (100)  >= I (1)    -> ADD 100\n- I (1)    <  V (5)    -> SUBTRACT 1    (Lookahead sees larger V!)\n- V (5)    is last     -> ADD 5\n\nTotal = +1000 - 100 + 1000 - 10 + 100 - 1 + 5 = 1994\n```\n\n---\n\n## \ud83d\udd2c Performance Finding: Why Did the Initial Code Take 10 ms (Beats 16%)?\n\n### Your Initial Approach:\n```python\nsub = {\"I\": [\"V\", \"X\"], \"X\": [\"L\", \"C\"], \"C\": [\"D\", \"M\"]}\nwhile i < len(s):\n    if i < len(s) - 1 and s[i] in sub and s[i + 1] in sub[s[i]]:\n        total -= dct[s[i]]\n    else:\n        total += dct[s[i]]\n    i += 1\n```\n\n### Why it was slower:\n1. **Three lookups per character:**\n   * Hash lookup in `sub` (`s[i] in sub`).\n   * Hash lookup to extract the list (`sub[s[i]]`).\n   * Linear search in the list (`s[i+1] in [...]`).\n2. **`while` loop bytecode overhead:** Python's interpreted `while i < len(s): ... i += 1` executes slower in bytecode than a C-optimized `for i in range(...)`.\n\n---\n\n## \u26a1 The Optimized Version (2\u20133 ms, Beats 90%+)\n\nReplace all nested lookups with **one direct integer comparison**:\n\n```python\nclass Solution:\n    def romanToInt(self, s: str) -> int:\n        dct = {\n            \"I\": 1, \"V\": 5, \"X\": 10, \"L\": 50,\n            \"C\": 100, \"D\": 500, \"M\": 1000\n        }\n        total = 0\n        n = len(s)\n        \n        for i in range(n):\n            # If current numeral is smaller than the next one, subtract it!\n            if i < n - 1 and dct[s[i]] < dct[s[i + 1]]:\n                total -= dct[s[i]]\n            else:\n                total += dct[s[i]]\n                \n        return total\n```\n\n---\n\n## \u23f1\ufe0f Complexity Analysis\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 Single pass through string of length $n$. (Since $n \\le 15$ by constraints, this takes $\\le 15$ operations).\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 The dictionary has a fixed size of 7 key-value pairs.\n\n---\n\n## \ud83c\udfa9 Fun Interview Bonus: The `str.replace` 1-ms Trick\n\nIn Python, the 6 subtraction cases can be replaced with additive equivalents:\n* `\"IV\"` $\\to$ `\"IIII\"` ($4$)\n* `\"IX\"` $\\to$ `\"VIIII\"` ($9$)\n* `\"XL\"` $\\to$ `\"XXXX\"` ($40$)\n* `\"XC\"` $\\to$ `\"LXXXX\"` ($90$)\n* `\"CD\"` $\\to$ `\"CCCC\"` ($400$)\n* `\"CM\"` $\\to$ `\"DCCCC\"` ($900$)\n\n```python\nclass SolutionCheat:\n    def romanToInt(self, s: str) -> int:\n        translations = {\n            \"I\": 1, \"V\": 5, \"X\": 10, \"L\": 50,\n            \"C\": 100, \"D\": 500, \"M\": 1000\n        }\n        s = (s.replace(\"IV\", \"IIII\")\n              .replace(\"IX\", \"VIIII\")\n              .replace(\"XL\", \"XXXX\")\n              .replace(\"XC\", \"LXXXX\")\n              .replace(\"CD\", \"CCCC\")\n              .replace(\"CM\", \"DCCCC\"))\n              \n        return sum(translations[c] for c in s)\n```\n*(Because `str.replace()` runs in compiled C code, this often clocks in at 0\u20131 ms on LeetCode!)*\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/1456_maximum_number_of_vowels_in_a_substring_of_given_length.md": {"title": "\ud83e\ude9f LeetCode 1456: Maximum Number of Vowels in a Substring of Given Length", "content": "# \ud83e\ude9f LeetCode 1456: Maximum Number of Vowels in a Substring of Given Length\n\n> **Difficulty:** Medium  \n> **Study Plan:** LeetCode 75  \n> **Pattern:** Fixed-Size Sliding Window (Running Differential on Frequencies)  \n> **LeetCode Link:** [LeetCode 1456: Maximum Number of Vowels](https://leetcode.com/problems/maximum-number-of-vowels-in-a-substring-of-given-length/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven a string `s` and an integer `k`, return the maximum number of vowel letters (`'a'`, `'e'`, `'i'`, `'o'`, `'u'`) in any substring of `s` with length `k`.\n\n### Example:\n```text\nInput: s = \"abciiidef\", k = 3\nOutput: 3\nExplanation: The substring \"iii\" contains 3 vowel letters.\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: Running Differential on Counters\n\n### Why Brute Force Fails (TLE on testcase 104/107):\n* Slicing `s[i:i+k]` and checking every letter with an inner loop takes $\\mathcal{O}(k)$ time per position.\n* When `len(s) = 100,000` and `k = 50,436`:\n  $$\\text{Operations} \\approx 50,000 \\times 50,000 = \\mathbf{2,500,000,000} \\text{ (2.5 billion) } \\implies \\text{TLE!}$$\n\n### The Sliding Window Insight (The VIP Room Analogy):\nYou cannot do arithmetic (`+`, `-`) directly on letters, but you **can** do arithmetic on your **integer vowel score**:\n1. When a new character enters the window on the right (`s[i]`):\n   * Is it a vowel? $\\implies \\text{count} += 1$\n2. When an old character leaves the window on the left (`s[i - k]`):\n   * Was it a vowel? $\\implies \\text{count} -= 1$\n\n---\n\n## \ud83d\udcbb Clean $\\mathcal{O}(n)$ Solution\n\n```python\nclass Solution:\n    def maxVowels(self, s: str, k: int) -> int:\n        vowels = {'a', 'e', 'i', 'o', 'u'}\n        \n        # 1. Base window: count vowels in the first k characters\n        count = 0\n        for i in range(k):\n            if s[i] in vowels:\n                count += 1\n                \n        max_count = count\n        if max_count == k:  # Early exit: can't beat k vowels!\n            return k\n            \n        # 2. Slide window from index k to the end\n        for i in range(k, len(s)):\n            # Add new character entering on right (use i!)\n            if s[i] in vowels:\n                count += 1\n            # Subtract old character leaving on left (use i - k!)\n            if s[i - k] in vowels:\n                count -= 1\n                \n            if count > max_count:\n                max_count = count\n                if max_count == k:\n                    return k\n                    \n        return max_count\n```\n\n---\n\n## \u26a0\ufe0f The Two Big Interview Traps for this Problem\n\n### 1. The `s[k]` vs `s[i]` Indexing Typo:\n* **The bug:** Writing `if s[k] in vowels: count += 1` inside the loop.\n* **What happens:** As `i` moves forward, `s[k]` keeps checking the exact same index $k$ over and over again instead of the new entering character!\n* **The rule:** The entering element is always **`s[i]`**, and the leaving element is always **`s[i - k]`**.\n\n### 2. The \"Can `count` drop below 0?\" Myth:\n* Beginners often write:\n  ```python\n  if count < 0:\n      count = 0  # \u274c Unnecessary defensive code!\n  ```\n* **Why it's mathematically impossible for `count` to be negative:**\n  * Every character that leaves (`s[i - k]`) was **previously added** when it entered!\n  * You only subtract if `s[i - k] in vowels` is `True`.\n  * If it is a vowel, `count` was already $\\ge 1$.\n  * Therefore: **$0 \\le \\text{count} \\le k$ at all times.**\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/15_3sum.md": {"title": "\ud83c\udfaf LeetCode 15: 3Sum \u2013 Master Guide & Optimization Playbook", "content": "# \ud83c\udfaf LeetCode 15: 3Sum \u2013 Master Guide & Optimization Playbook\n\n> **Difficulty:** Medium  \n> **Study Plan:** Top Interview 150 / NeetCode 150 / Blind 75  \n> **Pattern:** Two Pointers (1 Fixed Anchor + The Squeeze)  \n> **LeetCode Link:** [LeetCode 15: 3Sum](https://leetcode.com/problems/3sum/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven an integer array `nums`, return **all unique triplets** `[nums[i], nums[j], nums[k]]` such that:\n$$i \\ne j \\ne k \\quad \\text{and} \\quad nums[i] + nums[j] + nums[k] == 0$$\n\n> **The Big Constraint:** The solution set **must not contain duplicate triplets**.\n\n```text\nExample 1:\nInput: nums = [-1, 0, 1, 2, -1, -4]\nSorted: [-4, -1, -1, 0, 1, 2]\nOutput: [[-1, -1, 2], [-1, 0, 1]]\n\nExample 2:\nInput: nums = [0, 1, 1]\nOutput: [] (No triplet sums to 0)\n\nExample 3:\nInput: nums = [0, 0, 0]\nOutput: [[0, 0, 0]]\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: 3Sum is just 2Sum in Disguise!\n\nA brute force approach checks every combination of 3 numbers using 3 nested loops:\n$$\\mathcal{O}(n^3) \\text{ time } \\implies 3000^3 = 2.7 \\times 10^{10} \\text{ operations (Instant TLE!)}$$\n\n### How to turn $\\mathcal{O}(n^3)$ into $\\mathcal{O}(n^2)$?\nLook at the equation:\n$$nums[p1] + nums[p2] + nums[p3] = 0$$\n\nMove $nums[p1]$ to the other side:\n$$nums[p2] + nums[p3] = -nums[p1]$$\n\n1. **Sort the array first** ($\\mathcal{O}(n \\log n)$).\n2. **Fix an Anchor (`p1`):** Use a `for` loop to pick your first number.\n3. **Run Two Pointers on the rest:** Find two numbers to the right of `p1` that add up to $-nums[p1]$. That is literally **Two Sum II (Sorted)**!\n\n```text\n       p1 (Anchor)        p2 (left) \u2500\u2500\u2500\u2500\u25ba             \u25c4\u2500\u2500\u2500\u2500 p3 (right)\n       \u25bc                  \u25bc                                 \u25bc\nNums: [ -4  |  -1  |  -1  |  0  |  1  |  2  |  2 ]\n```\n\n---\n\n## \ud83c\udf9b\ufe0f How to Steer the Pointers (The Volume Knob Analogy)\n\nIn a sorted array, numbers go from **Smallest $\\to$ Largest**:\n* Moving **`p2` forward (`p2 += 1`)** picks a **bigger** number $\\to$ **Turns the sum UP \ud83d\udd0a**\n* Moving **`p3` backward (`p3 -= 1`)** picks a **smaller** number $\\to$ **Turns the sum DOWN \ud83d\udd09**\n\n```text\nIf (nums[p1] + nums[p2] + nums[p3] < 0):   Sum is too cold/small! Turn volume UP  -> p2 += 1\nIf (nums[p1] + nums[p2] + nums[p3] > 0):   Sum is too hot/big!   Turn volume DOWN -> p3 -= 1\nIf (nums[p1] + nums[p2] + nums[p3] == 0):  Jackpot! Found a valid triplet!\n```\n\n---\n\n## \ud83d\ude80 The 4 Speedups: From 2325 ms (Beats 5%) to 450 ms (Beats 90%+)\n\nIf you implement the basic logic and use `list(set(out))` to remove duplicates, your code will pass but will run at **2325 ms (Beats 5%)**. Here is why and how the 4 speedups fix it:\n\n---\n\n### \u26a1 Speedup 1: Early Exit when Anchor is Positive (`nums[p1] > 0`)\nSince the array is sorted, every number to the right of `p1` is $\\ge nums[p1]$.\n* If the smallest number `nums[p1]` is already greater than 0, then `nums[p2]` and `nums[p3]` are also positive!\n* Three positive numbers can **never** add up to 0 ($1 + 2 + 3 = 6 \\ne 0$).\n* **Action:** Immediately `break` the outer loop!\n\n```python\nif nums[p1] > 0:\n    break\n```\n\n---\n\n### \u26a1 Speedup 2: Skip Duplicate Anchors\nIf `nums = [-1, -1, 0, 1]`:\n* When `p1 = 0` (value `-1`), you do a full two-pointer scan and find `[-1, 0, 1]`.\n* When `p1 = 1` (value `-1` again!), why repeat the exact same search?\n* **Action:** Skip it if it's the same as the previous anchor!\n\n```python\nif p1 > 0 and nums[p1] == nums[p1 - 1]:\n    continue\n```\n\n---\n\n### \u26a1 Speedup 3: Clean Squeeze Condition\nInstead of `while p2 < len(nums) and p3 > p1 and p2 < p3:`, just write `while p2 < p3:`.\n* If `p2 < p3`, boundary checks like `< len(nums)` are mathematically redundant and waste CPU cycles on every loop tick.\n\n---\n\n### \u26a1 Speedup 4: Skip Identical Twins (The Clothing Outfit Analogy)\n\n> **\ud83d\udc55 The Outfit Analogy:**  \n> Imagine picking an outfit: **[Shirt, Pants, Shoes]**.  \n> * Shirt (`p1`): Black Shirt.  \n> * Pants (`p2`): Blue Jeans.  \n> * Shoes (`p3`): White Sneakers.  \n> \n> That's **Outfit 1: `[Black Shirt, Blue Jeans, White Sneakers]`**.  \n> Right next to the blue jeans on the rack is **another identical pair of Blue Jeans**.  \n> Would you try on the identical blue jeans with the same shoes and call it a \"new outfit\"?  \n> **No!** You slide past all the identical blue jeans until you see a different pair of pants!\n\n#### Trace on real numbers:\nSuppose `nums = [-2, 0, 0, 2, 2]` with anchor `p1 = -2`:\n\n```text\nRound 1: p1=-2, p2=0 (idx 1), p3=2 (idx 4)\nSum = -2 + 0 + 2 = 0 -> MATCH! Record [-2, 0, 2]\n\nIf we only did p2 += 1 and p3 -= 1:\nRound 2: p1=-2, p2=0 (idx 2), p3=2 (idx 3)\nSum = -2 + 0 + 2 = 0 -> DUPLICATE! Recorded [-2, 0, 2] AGAIN!\n```\n\n#### The Fix: Fast-forward past identical twins:\n```python\np2 += 1\np3 -= 1\n\n# Skip any other numbers identical to what we just used:\nwhile p2 < p3 and nums[p2] == nums[p2 - 1]:\n    p2 += 1\nwhile p2 < p3 and nums[p3] == nums[p3 + 1]:\n    p3 -= 1\n```\n\n---\n\n## \ud83d\udcbb Complete Optimized Python 3 Solution\n\n```python\nclass Solution:\n    def threeSum(self, nums: list[int]) -> list[list[int]]:\n        out = []\n        nums.sort()  # Step 1: Must sort first\n        n = len(nums)\n        \n        for p1 in range(n - 2):\n            # Speedup 1: If smallest number > 0, sum can NEVER be 0\n            if nums[p1] > 0:\n                break\n                \n            # Speedup 2: Skip duplicate anchors\n            if p1 > 0 and nums[p1] == nums[p1 - 1]:\n                continue\n                \n            p2 = p1 + 1\n            p3 = n - 1\n            \n            # Speedup 3: Clean squeeze\n            while p2 < p3:\n                total = nums[p1] + nums[p2] + nums[p3]\n                \n                if total == 0:\n                    out.append([nums[p1], nums[p2], nums[p3]])\n                    p2 += 1\n                    p3 -= 1\n                    \n                    # Speedup 4: Skip duplicate twins in-place\n                    while p2 < p3 and nums[p2] == nums[p2 - 1]:\n                        p2 += 1\n                    while p2 < p3 and nums[p3] == nums[p3 + 1]:\n                        p3 -= 1\n                        \n                elif total > 0:\n                    p3 -= 1  # Sum too big -> turn volume down!\n                else:\n                    p2 += 1  # Sum too small -> turn volume up!\n                    \n        return out\n```\n\n---\n\n## \u23f1\ufe0f Complexity Analysis\n\n* **Time Complexity:** $\\mathcal{O}(n^2)$\n  * Sorting takes $\\mathcal{O}(n \\log n)$.\n  * The outer loop runs $n$ times. For each iteration, the two pointers traverse the rest of the array in $\\mathcal{O}(n)$.\n  * Total Time: $\\mathcal{O}(n \\log n + n^2) = \\mathcal{O}(n^2)$.\n* **Space Complexity:** $\\mathcal{O}(1)$ (ignoring the output array and sorting stack space). No extra HashMaps or Sets needed.\n\n---\n\n## \ud83c\udfe2 FAANG Interview Playbook: How to Handle This Under Pressure\n\n1. **Don't panic about writing Speedup 4 upfront:**  \n   If you are nervous about boundary checks under interview pressure, it is 100% fine to write the anchor + two-pointer loop and use a `set()` or simple deduplication first.\n2. **When the interviewer asks: *\"Can we eliminate the set?\"***  \n   Deliver the clothing analogy:  \n   > *\"Since the array is sorted, duplicate numbers sit right next to each other. Whenever I record a match, I can simply advance the pointer past duplicate values (`while nums[p2] == nums[p2-1]`) so we never evaluate identical twins.\"*\n3. This shows strong problem-solving dialogue and earns maximum communication points.\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/167_two_sum_ii_input_array_is_sorted.md": {"title": "\ud83c\udfaf LeetCode 167: Two Sum II - Input Array Is Sorted \u2013 Master Study Guide", "content": "# \ud83c\udfaf LeetCode 167: Two Sum II - Input Array Is Sorted \u2013 Master Study Guide\n\n> **Difficulty:** Medium | **Pattern:** Two Pointers Formation A (Inward Squeeze)  \n> **Complexity:** Time: $\\mathcal{O}(n)$ | Auxiliary Space: $\\mathcal{O}(1)$ (Strictly constant memory)  \n> **Source Code:** [`167_two_sum_ii_input_array_is_sorted.py`](./167_two_sum_ii_input_array_is_sorted.py)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven a **1-indexed** array of integers `numbers` that is **already sorted in non-decreasing order**, find two numbers such that they add up to a specific `target` number.\n* Return indices as `[index1, index2]` (1-based, so add `+1`).\n* **Critical Constraint:** *\"Your solution must use only constant extra space $\\mathcal{O}(1)$.\"*\n\n```text\nExample 1:\nInput: numbers = [2, 7, 11, 15], target = 9\nOutput: [1, 2] (2 + 7 = 9)\n\nExample 2:\nInput: numbers = [2, 3, 4], target = 6\nOutput: [1, 3] (2 + 4 = 6)\n```\n\n---\n\n## \u26a0\ufe0f The HashMap Trap (Why LC 167 Exists)\n\nIn LeetCode 1, the array was **unsorted**, so we had to use a `HashMap` ($\\mathcal{O}(n)$ space).\n\nIf you submit a HashMap on LC 167, LeetCode accepts it, but your memory score plummets (Beats ~25%). In an interview, the interviewer will say:\n> *\"Good, but why did I tell you the array was ALREADY SORTED? Can you eliminate the HashMap to achieve $\\mathcal{O}(1)$ auxiliary space?\"*\n\n---\n\n## \ud83e\udde0 Mental Model: The Inward Squeeze (Formation A)\n\nSince the array is sorted, we can steer our sum with two pointers squeezing inward:\n* Pointer `l` starts at smallest number (`index 0`).\n* Pointer `r` starts at largest number (`index len - 1`).\n\n```text\nl ->                                <- r\n[ 2,    7,    11,    15 ],   target = 9\n```\n\n### The Steering Wheel Rules:\nCalculate `cur_sum = numbers[l] + numbers[r]`:\n1. **If `cur_sum == target`:** Match found! Return `[l + 1, r + 1]`.\n2. **If `cur_sum < target`:** The sum is too small. Squeeze the left pointer forward (`l += 1`) to pick a larger number!\n3. **If `cur_sum > target`:** The sum is too large. Squeeze the right pointer backward (`r -= 1`) to pick a smaller number!\n\n```text\nStep 1: numbers[0] + numbers[3] = 2 + 15 = 17 (> 9). Too big! r -= 1.\nStep 2: numbers[0] + numbers[2] = 2 + 11 = 13 (> 9). Too big! r -= 1.\nStep 3: numbers[0] + numbers[1] = 2 + 7  =  9 (== 9). Match! Return [1, 2].\n```\n\n---\n\n## \ud83d\udcbb Production Implementation\n\n```python\nclass Solution:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        l, r = 0, len(numbers) - 1\n        \n        while l < r:\n            cur_sum = numbers[l] + numbers[r]\n            \n            if cur_sum == target:\n                return [l + 1, r + 1]\n            elif cur_sum < target:\n                l += 1  # Need a larger sum\n            else:\n                r -= 1  # Need a smaller sum\n                \n        return []\n```\n\n---\n\n## \u26a1 Complexity Comparison\n\n| Method | Time | Space | Meets Constraint? | Interview Grade |\n|---|---|---|---|---|\n| HashMap (Dict) | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ | \u274c No | Pass (with follow-up prompt) |\n| **Two Pointers Squeeze** | $\\mathcal{O}(n)$ | $\\mathcal{O}(1)$ | \u2705 **Yes** | \ud83c\udfc6 **FAANG Gold Standard** |\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/169_majority_element.md": {"title": "\ud83d\uddf3\ufe0f 169. Majority Element", "content": "# \ud83d\uddf3\ufe0f 169. Majority Element\n\n> **Difficulty:** Easy (LeetCode Label) / **Classic FAANG Follow-up**  \n> **Pattern:** Boyer-Moore Voting Algorithm (The Mutual Cancellation Pattern)  \n> **Constraints:** $\\mathcal{O}(n)$ Time, strictly $\\mathcal{O}(1)$ Auxiliary Space.\n\n---\n\n## \ud83d\udca1 1. The 3-Tier Interview Ladder\n\nWhen an interviewer asks this problem, they want to observe your thought hierarchy:\n\n```text\nTier 1: Hash Map / Counter       -> O(n) Time, O(n) Space  (Mention first!)\nTier 2: Sorting Middle Element   -> O(n log n) Time, O(1) Space\nTier 3: Boyer-Moore Voting       -> O(n) Time, O(1) Space  (The FAANG Gold Standard)\n```\n\n> \ud83c\udfaf **Pro Interview Strategy:**  \n> Start by stating: *\"The straightforward solution is a HashMap/Counter to tally frequencies in $\\mathcal{O}(n)$ time and $\\mathcal{O}(n)$ space. But since the majority element appears more than $\\lfloor n / 2 \\rfloor$ times, we can optimize space to $\\mathcal{O}(1)$ using Boyer-Moore Voting.\"*\n\n---\n\n## \u2694\ufe0f 2. The Mental Model: The Battle Royale Arena\n\nThe problem guarantees that the majority element appears **strictly more than 50% of the time**:\n\n$$\\text{Majority Count} > \\frac{n}{2} \\implies \\text{Majority Count} - \\text{All Opponents Combined} > 0$$\n\n### The Analogy:\nImagine an arena where:\n* The **Majority Clan** has $> 50\\%$ of all warriors.\n* All other minority clans combined have $< 50\\%$ of the warriors.\n* **The Rule:** Whenever two warriors from **different clans** fight, they eliminate each other (1-for-1 mutual cancellation).\n\nEven if every single minority warrior teams up to eliminate a majority warrior, **the majority clan is mathematically guaranteed to have survivors left standing!**\n\n---\n\n## \u2753 3. Why is it Safe to Reset when `count == 0`?\n\n```text\nnums = [ 1 , 2 , 1 , 2 ,  3 , 3 , 3 ]\n        \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n       Two 1s and Two 2s\n          (Count = 0)\n```\n\nIn that prefix `[1, 2, 1, 2]`:\n* `1` appeared 2 times (50%).\n* Opponents appeared 2 times (50%).\n\n> \ud83d\udd11 **The Mathematical Miracle:**  \n> If you discard a subsegment where elements cancelled each other out equally,  \n> **the true majority element in the entire array STILL maintains a majority (> 50%) in the remaining subarray!**  \n> Looking at the remainder: `[ 3 , 3 , 3 ]` $\\implies$ `3` is still the majority!\n\n---\n\n## \u26a1 4. Python Bytecode Optimization: Why `elif` Beats Two `if` Checks\n\nMany candidates write:\n```python\n# \u26a0\ufe0f Redundant evaluation on reset!\nif count == 0:\n    candidate = num\nif candidate == num:\n    count += 1\nelse:\n    count -= 1\n```\n\nWhen `count == 0`, you set `candidate = num`. Then Python immediately evaluates `if candidate == num:`, which is **guaranteed to be True**!\n\n### The Faster `elif` Version:\nWhen `count == 0`, settle `count = 1` immediately and skip all other checks:\n\n```python\nclass Solution:\n    def majorityElement(self, nums: list[int]) -> int:\n        candidate = None\n        count = 0\n\n        for num in nums:\n            if count == 0:\n                candidate = num\n                count = 1\n            elif candidate == num:\n                count += 1\n            else:\n                count -= 1\n\n        return candidate\n```\n\n*(This cuts out 6\u20138 CPU bytecode instructions on every reset, dropping runtime into the top percentile!)*\n\n---\n\n## \ud83d\udcca 5. Complexity Comparison\n\n| Approach | Time Complexity | Auxiliary Space | Best Used For |\n| :--- | :---: | :---: | :--- |\n| **`Counter(nums)`** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ | Rapid prototyping, when $> 50\\%$ constraint isn't guaranteed |\n| **`nums.sort()`** | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(1)$ | Quick 1-liner (`nums[len(nums) // 2]`) |\n| **Boyer-Moore Voting** | **$\\mathcal{O}(n)$** | **$\\mathcal{O}(1)$** | **Strict $\\mathcal{O}(1)$ space interview requirement** |\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/189_rotate_array.md": {"title": "\ud83d\udd04 189. Rotate Array", "content": "# \ud83d\udd04 189. Rotate Array\n\n> **Difficulty:** Medium \u2b50  \n> **Pattern:** Two Pointers \u2014 **Formation A: The Squeeze (The Triple Reversal Algorithm)**  \n> **Constraints:** $\\mathcal{O}(n)$ Time, strictly $\\mathcal{O}(1)$ Auxiliary Space in-place.\n\n---\n\n## \ud83d\udd0d 1. Analysis of Your Solution\n\nYour solution:\n```python\nclass Solution:\n    def rotate(self, nums: list[int], k: int) -> None:\n        \"\"\"\n        Do not return anything, modify nums in-place instead.\n        \"\"\"\n        k %= len(nums)\n        nums[:] = nums[len(nums) - k:] + nums[:len(nums) - k]\n```\n\n### \u2705 What You Did Great:\n1. **Handled the Modulo Edge Case:**  \n   `k %= len(nums)` is mandatory. If $k = 10$ and $n = 4$, rotating 10 times is identical to rotating $10 \\pmod 4 = 2$ times. Many candidates crash on $k > n$ because they forget this!\n2. **Proper In-Place Replacement (`nums[:] = ...`):**  \n   You correctly used `nums[:] = ...` instead of `nums = ...`. Writing `nums = ...` only rebinds a local variable, leaving the caller's original list unmutated. `nums[:]` modifies the memory buffer in-place!\n3. **High LeetCode Percentile:** Beats **82.92%** on runtime!\n\n---\n\n## \u26a0\ufe0f 2. The Big Interview Catch: The Space Constraint\n\nLook at the **Follow-up** on the LeetCode problem description:\n> *\"Could you solve it in-place with $\\mathcal{O}(1)$ extra space?\"*\n\n### Why Slicing Fails the Follow-Up:\nUnder the hood in Python:\n* `nums[len(nums) - k:]` creates a **brand new list** of size $k$.\n* `nums[:len(nums) - k]` creates a **second brand new list** of size $n - k$.\n* The `+` operator creates a **third brand new list** of size $n$.\n\nTotal memory allocated behind the scenes: **$\\mathcal{O}(n)$ extra space**!\n\nIf an interviewer asks:\n> *\"What if `nums` is a 10 GB file on disk and your machine only has 100 MB of RAM? You cannot allocate slices. Can you rotate it in strictly $\\mathcal{O}(1)$ space?\"*\n\n---\n\n## \ud83d\udca1 3. The FAANG $\\mathcal{O}(1)$ Superweapon: The Triple Reversal Algorithm\n\nLook at the structure of the array:\n```text\nnums = [ 1 , 2 , 3 , 4 ,   5 , 6 , 7 ],  k = 3\n         \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n            Part A          Part B\n```\nWhen rotated to the right by $k = 3$, the target result is:\n```text\ntarget = [ 5 , 6 , 7 ,   1 , 2 , 3 , 4 ]\n           \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n            Part B          Part A\n```\nNotice what happened: **Part B moved to the front, and Part A moved to the back!**\n\n### \ud83c\udfa9 The 3-Step Reversal Magic:\n\n#### Step 1: Reverse the ENTIRE array (`0` to `n - 1`)\n```text\n[ 7 , 6 , 5 ,   4 , 3 , 2 , 1 ]\n \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n(Part B front,  Part A back \u2014 but both are inside-out!)\n```\n\n#### Step 2: Reverse the first $k$ elements (`0` to `k - 1`)\nFlip `[ 7 , 6 , 5 ]` back to normal:\n```text\n[ 5 , 6 , 7 ,   4 , 3 , 2 , 1 ]\n \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n  Part B is now in perfect order!\n```\n\n#### Step 3: Reverse the remaining $n - k$ elements (`k` to `n - 1`)\nFlip `[ 4 , 3 , 2 , 1 ]` back to normal:\n```text\n[ 5 , 6 , 7 ,   1 , 2 , 3 , 4 ]  \u2705 PERFECTLY ROTATED IN O(1) SPACE!\n```\n\n---\n\n## \ud83d\udcbb 4. Python Implementation (Two Pointers Squeeze)\n\nReversing a subsegment in-place is just our standard **Two Pointers Squeeze (`start < end`)**:\n\n```python\nclass Solution:\n    def rotate(self, nums: list[int], k: int) -> None:\n        n = len(nums)\n        k %= n\n\n        # Helper: Two Pointers Squeeze to reverse a slice in-place\n        def reverse_sub(start: int, end: int) -> None:\n            while start < end:\n                nums[start], nums[end] = nums[end], nums[start]\n                start += 1\n                end -= 1\n\n        # 1. Reverse the entire array\n        reverse_sub(0, n - 1)\n        # 2. Reverse first k elements\n        reverse_sub(0, k - 1)\n        # 3. Reverse the remaining n - k elements\n        reverse_sub(k, n - 1)\n```\n\n---\n\n## \ud83d\udcca 5. Comparison: Your Slice Solution vs. Triple Reversal\n\n| Metric | Your Slicing Solution | Triple Reversal (Two Pointers) |\n| :--- | :---: | :---: |\n| **Time Complexity** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ |\n| **Auxiliary Space** | **$\\mathcal{O}(n)$** (allocates new slices) | **$\\mathcal{O}(1)$** (pure in-place swaps) |\n| **Code Length** | 2 lines | 12 lines |\n| **Interview Verdict** | Great starter (shows Python fluency) | **Required for the follow-up question** |\n\n### \ud83c\udfaf Interview Recommendation:\nIn an interview:\n1. First, state the slicing approach: *\"In Python, we can do this in $\\mathcal{O}(n)$ time using slice replacement.\"*\n2. Then proactively add: *\"However, slicing allocates $\\mathcal{O}(n)$ auxiliary memory. To solve it in strictly $\\mathcal{O}(1)$ space, we can use the **Triple Reversal** algorithm with Two Pointers.\"*\n\nThis demonstrates both practical Python productivity AND deep algorithmic mastery!\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/228_summary_ranges.md": {"title": "\ud83d\udcca LeetCode 228: Summary Ranges \u2013 Master Guide", "content": "# \ud83d\udcca LeetCode 228: Summary Ranges \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** Top Interview 150 / Arrays & Strings  \n> **Pattern:** Two Pointers Formation D: Anchor & Scout (Interval Chunking)  \n> **LeetCode Link:** [LeetCode 228: Summary Ranges](https://leetcode.com/problems/summary-ranges/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nYou are given a **sorted unique** integer array `nums`.\n\nA range `[a, b]` is the set of all integers from `a` to `b`, inclusive. Return the smallest sorted list of ranges that cover all the numbers in the array exactly:\n* Each element of `nums` is covered by exactly one range.\n* There is no integer `x` such that `x` is in one of the ranges but not in `nums`.\n* Format: `\"a->b\"` if `a != b`, or `\"a\"` if `a == b`.\n\n```text\nExample 1:\nInput:  nums = [0, 1, 2, 4, 5, 7]\nOutput: [\"0->2\", \"4->5\", \"7\"]\n\nExample 2:\nInput:  nums = [0, 2, 3, 4, 6, 8, 9]\nOutput: [\"0\", \"2->4\", \"6\", \"8->9\"]\n```\n\n---\n\n## \ud83c\udf92 The \"Aha!\" Mental Model: The Anchor & Scout\n\nWhy did your initial `for` loop feel awkward? Because in a traditional `for i in range(len(nums)):`:\n* You detect the break on the **next** number (`nums[i] - nums[i-1] != 1`).\n* This causes an **off-by-one trap** on where the range ended (`nums[i-1]` vs `nums[i]`).\n* More importantly: **the final range disappears!** When the loop reaches the end of the array, there is no next number to trigger the `else` block, leaving the last range un-appended.\n\n### \u2693 The Fix: Anchor & Scout\nInstead of checking backwards, look forward with an **inner `while` loop**:\n\n```text\nnums = [ 0 ,  1 ,  2 ,  4 ,  5 ,  7 ]\n\nRound 1:\n  Anchor drops at index 0:  start = nums[0] (0)\n  Scout sprints forward:    0 -> 1 -> 2\n  Scout stops at 2 (since next number 4 != 2 + 1)\n  \n  \ud83d\udcdd Record: \"0->2\"\n  Advance to index 3!\n\nRound 2:\n  Anchor drops at index 3:  start = nums[3] (4)\n  Scout sprints forward:    4 -> 5\n  Scout stops at 5 (since next number 7 != 5 + 1)\n  \n  \ud83d\udcdd Record: \"4->5\"\n  Advance to index 5!\n\nRound 3:\n  Anchor drops at index 5:  start = nums[5] (7)\n  Scout looks ahead:        No more numbers!\n  \n  \ud83d\udcdd Record: \"7\" (since start == nums[i])\n```\n\n---\n\n## \ud83d\udcbb Clean Production Code\n\n```python\nclass Solution:\n    def summaryRanges(self, nums: list[int]) -> list[str]:\n        res = []\n        i = 0\n        n = len(nums)\n\n        while i < n:\n            start = nums[i]\n\n            # Fast-forward i as long as the sequence is consecutive\n            while i + 1 < n and nums[i + 1] == nums[i] + 1:\n                i += 1\n\n            # Format single numbers vs ranges\n            if start == nums[i]:\n                res.append(str(start))\n            else:\n                res.append(f\"{start}->{nums[i]}\")\n\n            # Move to the start of the next run\n            i += 1\n\n        return res\n```\n\n---\n\n## \ud83d\udd2c Why This Pattern Beats the Single `for` Loop\n\n| Feature | Single `for` Loop with `if/else` | Two Pointers `while` Loop (Anchor & Scout) |\n| :--- | :--- | :--- |\n| **Handling the Last Range** | \u274c Lost! Must copy-paste append logic after loop | \u2705 Automatically processed on the final iteration |\n| **Off-by-One Traps** | \u26a0\ufe0f High (is it `nums[i]` or `nums[i-1]`?) | \u2705 Zero (when inner loop terminates, `nums[i]` is the exact end) |\n| **Empty Array `[]`** | Needs explicit `if not nums: return []` check | \u2705 `0 < 0` is false, returns `[]` automatically |\n| **Time Complexity** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ (pointer `i` only moves forward) |\n| **Space Complexity** | $\\mathcal{O}(1)$ auxiliary memory | $\\mathcal{O}(1)$ auxiliary memory |\n\n---\n\n## \ud83c\udfaf Related Benchmark Problems\nThis exact **Anchor & Scout** pattern solves:\n1. **LC 443: String Compression** (Count runs of `['a', 'a', 'a', 'b', 'b']`).\n2. **LC 56: Merge Intervals** (Group contiguous overlapping time blocks).\n3. **LC 1869: Longer Contiguous Segments of Ones than Zeros**.\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/238_product_of_array_except_self.md": {"title": "\ud83c\udf5e LeetCode 238: Product of Array Except Self \u2013 Master Study Guide", "content": "# \ud83c\udf5e LeetCode 238: Product of Array Except Self \u2013 Master Study Guide\n\n> **Difficulty:** Medium | **Pattern:** Prefix & Suffix Accumulator (The Sandwich Pattern)  \n> **Complexity:** Time: $\\mathcal{O}(n)$ | Auxiliary Space: $\\mathcal{O}(1)$ (Output array excluded)  \n> **Source Code:** [`238_product_of_array_except_self.py`](./238_product_of_array_except_self.py)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven an integer array `nums`, return an array `res` such that `res[i]` is equal to the product of all elements of `nums` **except `nums[i]`**.\n\n* **Constraint 1:** You must write an algorithm that runs in $\\mathcal{O}(n)$ time.\n* **Constraint 2:** You **cannot use the division operation `/`**.\n\n```text\nExample 1:\nInput:  nums = [1, 2, 3, 4]\nOutput: [24, 12, 8, 6]\n\nExplanation:\n- res[0] = 2 * 3 * 4 = 24\n- res[1] = 1 * 3 * 4 = 12\n- res[2] = 1 * 2 * 4 = 8\n- res[3] = 1 * 2 * 3 = 6\n\nExample 2:\nInput:  nums = [-1, 1, 0, -3, 3]\nOutput: [0, 0, 9, 0, 0]\n```\n\n---\n\n## \ud83e\udde0 Mental Model: The Sandwich (Left \u00d7 Right)\n\nWithout division, the product of everything except index `i` is simply:\n$$\\text{res}[i] = (\\text{product of everything to the LEFT of } i) \\times (\\text{product of everything to the RIGHT of } i)$$\n\n```text\nArray:               [ 1,      2,      3,      4 ]\n\nPrefix (Left):       [ 1,      1,      2,      6 ]   (what's before each element)\nSuffix (Right):      [ 24,     12,     4,      1 ]   (what's after each element)\n--------------------------------------------------------------------------------\nResult (Left \u00d7 Right): [ 24,    12,     8,      6 ]\n```\n\n---\n\n## \ud83d\ude80 The $\\mathcal{O}(1)$ Extra Space Optimization (FAANG Follow-Up)\n\nInstead of allocating two separate lists `prefix = []` and `suffix = []`, we reuse `res`!\n\n1. **Forward Pass:** Store all left products directly into `res`.\n2. **Backward Pass:** Use a single scalar variable `suffix = 1` moving backward, multiplying directly into `res[i]` on the fly.\n\n```python\nclass Solution:\n    def productExceptSelf(self, nums: List[int]) -> List[int]:\n        n = len(nums)\n        res = [1] * n\n        \n        # 1. Forward Pass: Collect products to the left\n        prefix = 1\n        for i in range(n):\n            res[i] = prefix\n            prefix *= nums[i]\n            \n        # 2. Backward Pass: Multiply products to the right on the fly\n        suffix = 1\n        for i in range(n - 1, -1, -1):\n            res[i] *= suffix\n            suffix *= nums[i]\n            \n        return res\n```\n\n---\n\n## \u26a1 Complexity & Trade-offs\n\n| Approach | Time | Aux Space | Notes |\n|---|---|---|---|\n| Brute Force (Nested loops) | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(1)$ | TLE for $n = 10^5$. |\n| Total Product with Division `/` | $\\mathcal{O}(n)$ | $\\mathcal{O}(1)$ | Breaks on `0` (ZeroDivisionError) and banned by problem. |\n| Separate `prefix[]` & `suffix[]` | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ | \u2705 Great intuitive baseline (what you coded!). |\n| **Running In-Place `res[]` (Optimal)** | $\\mathcal{O}(n)$ | **$\\mathcal{O}(1)$** | \ud83c\udfc6 FAANG Standard. Beats memory percentiles. |\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/26_remove_duplicates_from_sorted_array.md": {"title": "\u2702\ufe0f 26. Remove Duplicates from Sorted Array", "content": "# \u2702\ufe0f 26. Remove Duplicates from Sorted Array\n\n> **Difficulty:** Easy  \n> **Pattern:** Two Pointers \u2014 **Formation B: Scout & Writer (Fast & Slow Pointers)**  \n> **Constraints:** $\\mathcal{O}(n)$ Time, strictly $\\mathcal{O}(1)$ Auxiliary Space in-place.\n\n---\n\n## \u26a0\ufe0f 1. Honest Review of Your `Counter` Solution\n\nYour solution:\n```python\nfrom collections import Counter\n\nclass Solution:\n    def removeDuplicates(self, nums: List[int]) -> int:\n        counter = Counter(nums)\n        k = 0\n        for key in counter:\n            nums[k] = key\n            k += 1\n        return k\n```\n\n### Does it work on LeetCode?\n**Yes!** In Python 3.7+, dictionaries preserve insertion order. `Counter` extracts unique keys in the order they first appeared, and you overwrite `nums` with those keys. LeetCode accepts it!\n\n### Is it good in a FAANG interview?\n**NO \u2014 this is an immediate interview trap!**\n\nHere is why an interviewer will stop you:\n1. **Violates the $\\mathcal{O}(1)$ Space Constraint:**  \n   `Counter(nums)` allocates a brand new hash table in memory holding up to $n$ key-value pairs $\\implies \\mathcal{O}(n)$ extra space! The problem explicitly states:\n   > *\"Do not allocate extra space for another array. You must do this by modifying the input array in-place with O(1) extra memory.\"*\n2. **Ignores the Biggest Clue in the Title:**  \n   Notice the word: **\"SORTED\"**.\n   * If an array is **UNSORTED** $\\implies$ You **MUST** use a Hash Table ($\\mathcal{O}(n)$ space) because duplicates could be anywhere.\n   * If an array is **SORTED** $\\implies$ **All duplicates are glued together side-by-side as adjacent neighbors!** You do **NOT** need a Hash Table!\n\n---\n\n## \ud83d\udca1 2. The $\\mathcal{O}(1)$ Solution: Reuse What You Just Learned!\n\nLook at how identical this is to the **Scout & Writer** code you just wrote for [LC 27: Remove Element](file:///Users/sathyat/Developer/projects/dsa/27_remove_element.md):\n\n```text\nIn LC 27 (Remove Element):\n\"Keep the number if it is NOT equal to val\"\n    if nums[i] != val:\n        nums[k] = nums[i]\n        k += 1\n\nIn LC 26 (Remove Duplicates):\n\"Keep the number if it is NOT equal to its previous neighbor\"\n    if nums[i] != nums[i - 1]:\n        nums[k] = nums[i]\n        k += 1\n```\n\n### The Setup:\n* The very first number `nums[0]` is **always unique** and already sitting in place.\n* **Writer (`k`):** Starts at index **`1`** (the destination for the 2nd unique number).\n* **Scout (`i`):** Starts at index **`1`** and inspects every number.\n\n---\n\n## \ud83c\udfac 3. Visual Step-by-Step Trace\n\nLet `nums = [ 0 , 0 , 1 , 1 , 1 , 2 , 2 , 3 ]`:\n\n```text\nInitial:\nk = 1, nums[0] is already settled as 0.\nnums = [ 0 ,  0 ,  1 ,  1 ,  1 ,  2 ,  2 ,  3 ]\n              \u25b2\n             k, i\n\nStep 1:\ni = 1: nums[1] (0) == nums[0] (0). Duplicate neighbor! Skip!\nnums = [ 0 ,  0 ,  1 ,  1 ,  1 ,  2 ,  2 ,  3 ]\n              \u25b2    \u25b2\n              k    i\n\nStep 2:\ni = 2: nums[2] (1) != nums[1] (0). NEW UNIQUE NUMBER FOUND!\nWrite nums[k] = nums[i] -> nums[1] = 1, bump k -> 2.\nnums = [ 0 ,  1 ,  1 ,  1 ,  1 ,  2 ,  2 ,  3 ]\n                   \u25b2    \u25b2\n                   k    i\n\nStep 3:\ni = 3: nums[3] (1) == nums[2] (1). Duplicate neighbor! Skip!\nStep 4:\ni = 4: nums[4] (1) == nums[3] (1). Duplicate neighbor! Skip!\n\nStep 5:\ni = 5: nums[5] (2) != nums[4] (1). NEW UNIQUE NUMBER FOUND!\nWrite nums[k] = nums[i] -> nums[2] = 2, bump k -> 3.\nnums = [ 0 ,  1 ,  2 ,  1 ,  1 ,  2 ,  2 ,  3 ]\n                        \u25b2              \u25b2\n                        k              i\n\nStep 6:\ni = 6: nums[6] (2) == nums[5] (2). Duplicate neighbor! Skip!\n\nStep 7:\ni = 7: nums[7] (3) != nums[6] (2). NEW UNIQUE NUMBER FOUND!\nWrite nums[k] = nums[i] -> nums[3] = 3, bump k -> 4.\nnums = [ 0 ,  1 ,  2 ,  3 ,  1 ,  2 ,  2 ,  3 ]\n                             \u25b2\n                             k = 4 (Done!)\n```\n\nThe first `4` numbers are `[ 0 , 1 , 2 , 3 ]` \u2014 **$\\mathcal{O}(1)$ space, zero hash tables allocated!**\n\n---\n\n## \ud83d\udcbb 4. The Clean FAANG Python Solution\n\n```python\nclass Solution:\n    def removeDuplicates(self, nums: list[int]) -> int:\n        if not nums:\n            return 0\n\n        # Writer starts at 1 because nums[0] is guaranteed unique\n        k = 1\n\n        # Scout scans from 1 to the end\n        for i in range(1, len(nums)):\n            # If current element differs from previous neighbor, it's a new unique number!\n            if nums[i] != nums[i - 1]:\n                nums[k] = nums[i]\n                k += 1\n\n        return k\n```\n\n---\n\n## \ud83d\udcca 5. Comparison: `Counter` vs. Two Pointers\n\n| Metric | Your `Counter` Approach | Optimal Two Pointers (Scout & Writer) |\n| :--- | :---: | :---: |\n| **Time Complexity** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ |\n| **Auxiliary Space** | **$\\mathcal{O}(n)$ (Violates constraint \u274c)** | **$\\mathcal{O}(1)$ (Passes FAANG \u2705)** |\n| **Memory Overhead** | Allocates hash table + dict nodes in heap | Uses only 2 integer pointers |\n| **Interview Verdict** | **Warning / Pushback from interviewer** | **100% Pass** |\n\n---\n\n## \ud83d\udd11 The Golden Interview Rule: Sorted vs. Unsorted Duplicates\n\nMemorize this forever:\n\n> * **If the problem says \"SORTED\":**  \n>   Duplicates are guaranteed to be adjacent neighbors (`nums[i] == nums[i - 1]`).  \n>   \ud83d\udc49 **Use Two Pointers ($\\mathcal{O}(1)$ space). Never use a Hash Table!**\n>\n> * **If the problem says \"UNSORTED\":**  \n>   Duplicates can appear anywhere (`[4, 1, 2, 4]`).  \n>   \ud83d\udc49 **You MUST use a Hash Table / Counter ($\\mathcal{O}(n)$ space).**\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/274_h_index.md": {"title": "\ud83d\udcca LeetCode 274: H-Index \u2013 Master Study Guide", "content": "# \ud83d\udcca LeetCode 274: H-Index \u2013 Master Study Guide\n\n> **Difficulty:** Medium | **Top Interview 150:** Arrays / Sorting  \n> **Pattern:** Sorting + Linear Scan Rank Comparison  \n> **Complexity:** Time: $\\mathcal{O}(n \\log n)$ | Space: $\\mathcal{O}(1)$ (in-place sort)  \n> **Source Code:** [`274_h_index.py`](./274_h_index.py)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven an array of integers `citations` where `citations[i]` is the number of citations a researcher received for their $i$-th paper, compute the researcher's **H-Index**.\n\n> **Definition:** A scientist has an index $h$ if $h$ of their $n$ papers have **at least $h$ citations each**, and the other $n - h$ papers have **no more than $h$ citations each**.\n\n```text\nExample 1:\nInput: citations = [3, 0, 6, 1, 5]\nOutput: 3\nExplanation:\nSorted descending: [6, 5, 3, 1, 0]\n- 1st paper has 6 citations (6 >= 1) -> Valid\n- 2nd paper has 5 citations (5 >= 2) -> Valid\n- 3rd paper has 3 citations (3 >= 3) -> Valid\n- 4th paper has 1 citation  (1 >= 4) -> Invalid!\nResult: 3 papers meet the threshold -> H-Index = 3.\n\nExample 2:\nInput: citations = [100]\nOutput: 1\nExplanation: 1st paper has 100 citations (100 >= 1). H-Index = 1.\n```\n\n---\n\n## \ud83e\udde0 Mental Model: The Runner Finish Line / Finger Count\n\nSort descending. Compare the paper's citations against its rank ($i + 1$):\n* Does paper at rank $i + 1$ have $\\ge i + 1$ citations?\n* If **YES**, update $h = i + 1$.\n* The very first time a paper fails ($c < i + 1$), **stop immediately** (`break`), because all subsequent papers have even fewer citations!\n\n---\n\n## \ud83d\udcbb Production Implementation\n\n```python\nfrom typing import List\n\nclass Solution:\n    def hIndex(self, citations: List[int]) -> int:\n        citations.sort(reverse=True)\n        h_index = 0\n        \n        for i, c in enumerate(citations):\n            if c >= i + 1:\n                h_index = i + 1\n            else:\n                break\n                \n        return h_index\n```\n\n### \u26a1 Complexity:\n* **Time Complexity:** $\\mathcal{O}(n \\log n)$ due to sorting. The linear scan takes $\\mathcal{O}(n)$.\n* **Space Complexity:** $\\mathcal{O}(1)$ auxiliary space (in-place sort).\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/27_remove_element.md": {"title": "\u2702\ufe0f 27. Remove Element", "content": "# \u2702\ufe0f 27. Remove Element\n\n> **Difficulty:** Easy  \n> **Pattern:** Two Pointers \u2014 **Formation B: Scout & Writer (Fast & Slow Pointers)**  \n> **Complexity:** $\\mathcal{O}(n)$ Time, $\\mathcal{O}(1)$ Auxiliary Space in-place.\n\n---\n\n## \ud83c\udfaf 1. Is Your Solution Good?\n\n**YES! It is the textbook, 100% optimal FAANG solution.**\n\n```python\nclass Solution:\n    def removeElement(self, nums: list[int], val: int) -> int:\n        k = 0\n        for i in range(len(nums)):\n            if nums[i] != val:\n                nums[k] = nums[i]\n                k += 1\n        return k\n```\n\n### Why this is top-tier:\n1. **$\\mathcal{O}(n)$ Single Pass:** Visits every element exactly once.\n2. **$\\mathcal{O}(1)$ Auxiliary Space:** Modifies the array in-place without allocating a second list.\n3. **Preserves Relative Order:** Although the problem says *\"the order of the elements may be changed\"*, this solution naturally keeps elements in their original relative sequence.\n\n---\n\n## \ud83d\udca1 2. The Mental Model: Scout & Writer\n\nYou intuitively applied **Formation B (Scout & Writer)**:\n\n```text\n                  Scout (i) -> sprints ahead to inspect every item\n                  \u25bc\nnums = [ 0 , 1 ,  2 ,  2 ,  3 ,  0 ,  4 ,  2 ],  val = 2\n         \u25b2\n         Writer (k) -> marks the boundary where the next VALID element belongs\n```\n\n### The Two Roles:\n* **`i` (The Scout / Fast):** Sprints through the entire array. It inspects every element and asks: *\"Is this number NOT equal to `val`?\"*\n* **`k` (The Writer / Slow):** Stands at the boundary of the **\"clean zone\"**. Whenever the Scout finds a valid number, the Writer copies it to `nums[k]` and takes one step forward (`k += 1`).\n\n### \ud83d\udcd0 The Array Partition Invariant:\nAt any point during the loop, the array is cleanly partitioned into two zones:\n```text\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502   Clean Valid Elements    \u2502    Trash / Ignored / Unexplored  \u2502\n\u2502   (Indices 0 to k - 1)    \u2502    (Indices k to len - 1)        \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\nWhen the loop finishes, **`k` is literally the count of valid elements**! Returning `k` is instant.\n\n---\n\n## \ud83c\udfac 3. Visual Step-by-Step Trace\n\nLet `nums = [ 3 , 2 , 2 , 3 ]`, `val = 3`:\n\n```text\nStart:\nk = 0, i = 0: nums[0] is 3 (matches val). Skip!\nnums = [ 3 , 2 , 2 , 3 ]\n         \u25b2\n        k, i\n\nStep 1:\nk = 0, i = 1: nums[1] is 2 (!= val). Write nums[0] = 2, k -> 1.\nnums = [ 2 , 2 , 2 , 3 ]\n             \u25b2\n             k, i\n\nStep 2:\nk = 1, i = 2: nums[2] is 2 (!= val). Write nums[1] = 2, k -> 2.\nnums = [ 2 , 2 , 2 , 3 ]\n                 \u25b2\n                 k, i\n\nStep 3:\nk = 2, i = 3: nums[3] is 3 (matches val). Skip!\nLoop finishes.\n\nReturn k = 2.\nThe first 2 elements are [ 2 , 2 ] \u2705\n```\n\n---\n\n## \ud83d\udc6f 4. The Family Resemblance: Notice the Pattern!\n\nNotice how this exact same **Scout & Writer** template solves multiple classic problems with just a 1-line condition change:\n\n| Problem | Condition to Keep Element | What Writer Does |\n| :--- | :--- | :--- |\n| **LC 27: Remove Element** | `if nums[i] != val:` | `nums[k] = nums[i]; k += 1` |\n| **LC 283: Move Zeroes** | `if nums[i] != 0:` | `nums[k] = nums[i]; k += 1` *(fill tail with 0s)* |\n| **LC 26: Remove Duplicates (Sorted)** | `if nums[i] != nums[k - 1]:` | `nums[k] = nums[i]; k += 1` |\n\nOnce you master this template, you've solved 3 different interview problems with the same muscle memory!\n\n---\n\n## \ud83e\udde0 5. The Senior Follow-Up: What if `val` is Rare?\n\nInterviewers love to ask:\n> *\"What if `nums` has 100,000 elements, but only 2 of them equal `val`? Your code will still execute `nums[k] = nums[i]` 99,998 times! Can you optimize the number of writes?\"*\n\n### \ud83d\udca1 The Alternative: Two Pointers Squeeze (Swap with Tail)\nBecause the problem states that **order does not matter**, we can swap the unwanted element with the **last** element and shrink the array size:\n\n```python\nclass Solution:\n    def removeElement(self, nums: list[int], val: int) -> int:\n        i = 0\n        n = len(nums)\n        \n        while i < n:\n            if nums[i] == val:\n                nums[i] = nums[n - 1]  # Overwrite with last element\n                n -= 1                 # Shrink array boundary\n            else:\n                i += 1                 # Only advance if current element is valid!\n                \n        return n\n```\n\n* **Why this is clever:** If `nums = [1, 2, 3, 5, 4]`, `val = 4`, we do only **1 assignment** instead of 4!\n* **Trade-off:** It scrambles the original relative order of elements, which is fine for LC 27.\n\n---\n\n## \ud83d\udcca 6. Complexity Analysis\n\n| Metric | Scout & Writer (Your Solution) | Swap with Tail (Alternative) |\n| :--- | :---: | :---: |\n| **Time Complexity** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ (fewer write operations) |\n| **Space Complexity** | $\\mathcal{O}(1)$ | $\\mathcal{O}(1)$ |\n| **Preserves Order?** | \u2705 Yes | \u274c No |\n| **Interview Recommendation** | **Primary Choice (Clean & Standard)** | **Mention as Follow-up Optimization** |\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/283_move_zeroes.md": {"title": "\ud83c\udfc3 LeetCode 283: Move Zeroes \u2013 Master Guide", "content": "# \ud83c\udfc3 LeetCode 283: Move Zeroes \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** LeetCode 75 / Top Interview 150  \n> **Pattern:** Two Pointers (Formation B: Scout & Writer / Fast & Slow)  \n> **LeetCode Link:** [LeetCode 283: Move Zeroes](https://leetcode.com/problems/move-zeroes/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven an integer array `nums`, move all `0`'s to the end of it while maintaining the relative order of the non-zero elements.\n\n**Constraint:** You must do this **in-place** without making a copy of the array ($\\mathcal{O}(1)$ extra space).\n\n### Example:\n```text\nInput: nums = [0, 1, 0, 3, 12]\nOutput: [1, 3, 12, 0, 0]\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: The Two Pointers Scout & Writer\n\nInstead of shifting elements repeatedly ($\\mathcal{O}(n^2)$), use **two pointers** moving in the same direction:\n\n* **`fast` (The Scout):** Scans through every index hunting for non-zero numbers.\n* **`slow` (The Writer):** Points to the exact spot where the **next non-zero number belongs** (which is also the front of the \"Wall of Zeros\").\n\n---\n\n## \ud83d\ude9c The \"Snowplow / Wall of Zeros\" Visual Diagram\n\nThink of the array as partitioned into three distinct zones:\n```text\n[ Non-Zeros (Done!) ] | [ Wall of 0s ] | [ Unexplored Elements ... ]\n                      \u25b2                \u25b2\n                    slow              fast\n```\n\n### \ud83c\udfac Visual Step-by-Step Trace on `nums = [0, 1, 0, 0, 3, 12]`\n\n#### \ud83d\udccd START:\n```text\nIndices:     0       1       2       3       4       5\n          \u250c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\nArray:    \u2502  0  \u2502   1   \u2502   0   \u2502   0   \u2502   3   \u2502   12   \u2502\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n             \u25b2\n        slow = 0\n        fast = 0\n```\n* `nums[fast] == 0` $\\implies$ Ignore! `slow` stays parked at index 0. `fast` steps ahead.\n\n---\n\n#### \ud83d\udccd STEP 1: `fast` finds `1` (First Swap!)\n```text\nIndices:     0       1       2       3       4       5\n          \u250c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\nArray:    \u2502  0  \u2502   1   \u2502   0   \u2502   0   \u2502   3   \u2502   12   \u2502\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n             \u25b2       \u25b2\n           slow     fast\n             \u2502       \u2502\n             \u2514\u2500\u2500Swap\u2500\u2518\n```\n**After Swap & `slow += 1`:**\n```text\n          \u250c\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\nArray:    \u2502  1  \u2502 \u2502   0   \u2502   0   \u2502   0   \u2502   3   \u2502  12  \u2502\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n          [Done!]     \u25b2\n                    slow=1\n```\n* Index `0` is locked in! `slow` moves to index `1` (which now holds a `0`).\n\n---\n\n#### \ud83d\udccd STEPS 2 & 3: Consecutive Zeros Accumulate (The Wall Grows!)\n`fast` scans index `2` and index `3`. Both are `0`.  \n`slow` stays parked at index `1`.\n\n```text\nIndices:     0       1       2       3       4       5\n          \u250c\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\nArray:    \u2502  1  \u2502 \u2502   0   \u2502   0   \u2502   0   \u2502   3   \u2502   12   \u2502\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n          [Done!]  [ Wall of 0s  ]\n                     \u25b2                \u25b2\n                   slow=1           fast=3\n```\n* Notice how the **Wall of Zeros** is naturally bunching up between `slow` and `fast`!\n\n---\n\n#### \ud83d\udccd STEP 4: `fast` finds `3` (Second Swap!)\n`fast` arrives at index `4` and spots `3`!\n\n```text\nIndices:     0       1       2       3       4       5\n          \u250c\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\nArray:    \u2502  1  \u2502 \u2502   0   \u2502   0   \u2502   0   \u2502   3   \u2502   12   \u2502\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                     \u25b2                        \u25b2\n                    slow                     fast\n                     \u2502                         \u2502\n                     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500Swap\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n**After Swap & `slow += 1`:**\n```text\nIndices:     0       1       2       3       4       5\n          \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\nArray:    \u2502  1  \u2502   3   \u2502 \u2502   0   \u2502   0   \u2502   0   \u2502   12   \u2502\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n          [    Done!    ]  [ Wall of 0s  ]\n                             \u25b2\n                           slow=2\n```\n* `3` is placed in the front of the wall!\n* The `0` was kicked to index `4`.\n* `slow += 1` steps to index `2` \u2014 which is **already the next `0` in the wall**!\n\n---\n\n#### \ud83d\udccd STEP 5: `fast` finds `12` (Final Swap!)\n`fast` reaches the last index `5` and spots `12`!\n\n```text\nIndices:     0       1       2       3       4       5\n          \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\nArray:    \u2502  1  \u2502   3   \u2502 \u2502   0   \u2502   0   \u2502   0   \u2502   12   \u2502\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                             \u25b2                        \u25b2\n                            slow                     fast\n                             \u2502                         \u2502\n                             \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500Swap\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n**After Swap & `slow += 1`:**\n```text\nIndices:     0       1       2       3       4       5\n          \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510 \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\nArray:    \u2502  1  \u2502   3   \u2502  12   \u2502 \u2502   0   \u2502   0   \u2502   0  \u2502\n          \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n          [    ALL NON-ZEROS    ] [     ALL ZEROS        ]\n                                    \u25b2\n                                  slow=3\n```\n\n---\n\n## \ud83d\udcbb The Clean 4-Line Implementation\n\n```python\nclass Solution:\n    def moveZeroes(self, nums: list[int]) -> None:\n        \"\"\"\n        Do not return anything, modify nums in-place instead.\n        \"\"\"\n        slow = 0\n        for fast in range(len(nums)):\n            if nums[fast] != 0:\n                nums[slow], nums[fast] = nums[fast], nums[slow]\n                slow += 1\n```\n\n---\n\n## \ud83d\udcca Iteration-by-Iteration Trace Table\n\n| Step | `fast` | `nums[fast]` | `slow` | `nums[slow]` | Action Taken | Array After Step |\n| :---: | :---: | :---: | :---: | :---: | :--- | :--- |\n| **0** | `0` | `0` | `0` | `0` | Do nothing (`slow` waits) | `[0, 1, 0, 0, 3, 12]` |\n| **1** | `1` | `1` | `0` | `0` | **Swap** indices 0 & 1, `slow=1` | `[1, 0, 0, 0, 3, 12]` |\n| **2** | `2` | `0` | `1` | `0` | Do nothing (`slow` waits) | `[1, 0, 0, 0, 3, 12]` |\n| **3** | `3` | `0` | `1` | `0` | Do nothing (`slow` waits) | `[1, 0, 0, 0, 3, 12]` |\n| **4** | `4` | `3` | `1` | `0` | **Swap** indices 1 & 4, `slow=2` | `[1, 3, 0, 0, 0, 12]` |\n| **5** | `5` | `12` | `2` | `0` | **Swap** indices 2 & 5, `slow=3` | `[1, 3, 12, 0, 0, 0]` |\n\n---\n\n## \ud83d\udca1 Why `slow += 1` Works (Even with Consecutive Zeros)\n\n1. **The Invariant:** All elements between `slow` and `fast` are **always `0`s**.\n2. **The Advance:** When you swap `nums[slow]` with `nums[fast]`, slot `slow` receives the non-zero number.\n3. The very next slot (`slow + 1`) is guaranteed to be the next `0` in that contiguous block of zeros. No searching needed!\n\n---\n\n## \u23f1\ufe0f Complexity Blueprint\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 exactly one pass through the array with `fast`.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 strictly in-place modifications, zero additional memory allocated.\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/290_word_pattern.md": {"title": "\ud83d\udd20 LeetCode 290: Word Pattern \u2013 Master Guide", "content": "# \ud83d\udd20 LeetCode 290: Word Pattern \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** Top Interview 150  \n> **Pattern:** HashMaps / Bijective (1-to-1) Mapping  \n> **LeetCode Link:** [LeetCode 290: Word Pattern](https://leetcode.com/problems/word-pattern/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven a `pattern` string (e.g., `\"abba\"`) and a string `s` of space-separated words (e.g., `\"dog cat cat dog\"`):\n\nDetermine if `s` follows the **same pattern**. A full match means:\n1. Each character in `pattern` maps to **exactly one** word in `s`.\n2. Each word in `s` maps to **exactly one** character in `pattern`.\n3. No two distinct pattern characters can map to the same word, and vice-versa (**Bijective / One-to-One** mapping).\n\n### Examples:\n* `pattern = \"abba\", s = \"dog cat cat dog\"` $\\implies$ **`True`** (`a -> dog`, `b -> cat`)\n* `pattern = \"abba\", s = \"dog cat cat fish\"` $\\implies$ **`False`** (`a` cannot map to both `dog` and `fish`)\n* `pattern = \"abba\", s = \"dog dog dog dog\"` $\\implies$ **`False`** (both `a` and `b` cannot map to `dog`)\n\n---\n\n## \ud83d\udca1 Reviewing Your Solution\n\n```python\nclass Solution:\n    def wordPattern(self, pattern: str, s: str) -> bool:\n        lst = s.split(\" \")\n        if len(pattern) != len(lst):\n            return False\n        dct = {}\n        for i in range(len(pattern)):\n            if pattern[i] not in dct:\n                if lst[i] in dct.values():   # \u26a0\ufe0f Hidden complexity!\n                    return False\n                dct[pattern[i]] = lst[i]\n            elif dct[pattern[i]] != lst[i]:\n                return False\n        return True\n```\n\n### The Verdict:\n* **Correctness:** **100% Correct!** It successfully detects the 1-to-1 constraint.\n* **On LeetCode:** **Accepted!** Because the English alphabet only has 26 lowercase letters, `len(dct.values()) <= 26`, so the linear search is small enough to pass.\n* **In a FAANG Interview:** The interviewer will immediately ask:  \n  > *\"What is the time complexity of `lst[i] in dct.values()`?\"*\n\n---\n\n## \u26a0\ufe0f The Hidden Interview Trap: `in dict.values()` is $\\mathcal{O}(k)$!\n\nRemember how dictionary lookups work:\n* `key in dict` $\\implies$ **$\\mathcal{O}(1)$** (instant hash table jump!).\n* `value in dict.values()` $\\implies$ **$\\mathcal{O}(k)$**!  \n  A dictionary's hash table is indexed by **keys**, NOT values! To find a value, Python has to do a **linear scan through every value** in the dictionary.\n\nIf you have $N$ unique items:\n$$\\text{Total Time} = N \\text{ iterations} \\times \\mathcal{O}(N) \\text{ value scan} = \\mathbf{\\mathcal{O}(N^2)}$$\n\n### Real Python Benchmark ($N = 5,000$ unique items):\n* `in dct.values()`: **439.83 ms** \ud83d\udc22\n* Two HashMaps ($\\mathcal{O}(1)$): **1.51 ms** \u26a1 (**292\u00d7 faster!**)\n\n---\n\n## \ud83c\udfc6 The Two Pure $\\mathcal{O}(n)$ Interview Solutions\n\n### Approach 1: Two HashMaps (or HashMap + Set) \u2014 *The Standard Interview Pattern*\nTrack the forward mapping (`char -> word`) AND either a backward mapping (`word -> char`) or a set of `seen_words` to keep every lookup strictly $\\mathcal{O}(1)$:\n\n```python\nclass Solution:\n    def wordPattern(self, pattern: str, s: str) -> bool:\n        words = s.split(\" \")\n        if len(pattern) != len(words):\n            return False\n            \n        p_to_w = {}\n        w_to_p = {}\n        \n        for p, w in zip(pattern, words):\n            # Check both directions in O(1) time\n            if (p in p_to_w and p_to_w[p] != w) or (w in w_to_p and w_to_p[w] != p):\n                return False\n            p_to_w[p] = w\n            w_to_p[w] = p\n            \n        return True\n```\n\n---\n\n### Approach 2: The 1-Line Pythonic Set Cardinality Trick \ud83e\ude84\nFor a bijection to hold between two sequences of equal length:\n1. The number of unique characters `len(set(pattern))`\n2. The number of unique words `len(set(words))`\n3. The number of unique pairs `len(set(zip(pattern, words)))`\n\n**Must all be identical!**\n\n```python\nclass Solution:\n    def wordPattern(self, pattern: str, s: str) -> bool:\n        words = s.split(\" \")\n        if len(pattern) != len(words):\n            return False\n        return len(set(pattern)) == len(set(words)) == len(set(zip(pattern, words)))\n```\n\n* If `pattern = \"abba\", words = [\"dog\", \"cat\", \"cat\", \"dog\"]`:\n  * `set(pattern)` = `{'a', 'b'}` (size 2)\n  * `set(words)` = `{'dog', 'cat'}` (size 2)\n  * `set(zip)` = `{('a','dog'), ('b','cat')}` (size 2)  \n  \ud83d\udc49 $2 == 2 == 2 \\implies \\mathbf{\\text{True}}$!\n\n* If `pattern = \"abba\", words = [\"dog\", \"dog\", \"dog\", \"dog\"]`:\n  * `set(pattern)` = `{'a', 'b'}` (size 2)\n  * `set(words)` = `{'dog'}` (size 1)  \n  \ud83d\udc49 $2 \\ne 1 \\implies \\mathbf{\\text{False}}$!\n\n---\n\n## \u23f1\ufe0f Complexity Blueprint\n\n* **Time Complexity:** $\\mathcal{O}(n + m)$ where $n$ is length of `pattern` and $m$ is length of string `s` (for splitting words).\n* **Space Complexity:** $\\mathcal{O}(u)$ where $u$ is the number of unique words and characters stored in the HashMaps.\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/392_is_subsequence.md": {"title": "\ud83c\udfaf LeetCode 392: Is Subsequence \u2013 Master Study Guide", "content": "# \ud83c\udfaf LeetCode 392: Is Subsequence \u2013 Master Study Guide\n\n> **Difficulty:** Easy | **Pattern:** Two Pointers Formation C (Two Conveyor Belts)  \n> **Complexity:** Time: $\\mathcal{O}(|t|)$ | Auxiliary Space: $\\mathcal{O}(1)$ (Beats 99% memory!)  \n> **Source Code:** [`392_is_subsequence.py`](./392_is_subsequence.py)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven two strings `s` and `t`, return `true` if `s` is a **subsequence** of `t`, or `false` otherwise.\n\n> A **subsequence** means you can delete some (or zero) characters from `t` without changing the relative order of the remaining characters.\n\n```text\nExample 1:\nInput:  s = \"abc\", t = \"ahbgdc\"\nOutput: True ('a', 'b', 'c' appear in order: a -> b -> c)\n\nExample 2:\nInput:  s = \"axc\", t = \"ahbgdc\"\nOutput: False ('x' never appears after 'a')\n```\n\n---\n\n## \ud83e\udde0 Mental Model: Two Conveyor Belts (Formation C)\n\nImagine two independent conveyor belts:\n* **Belt 1 (`p1`):** The shopping checklist `s`. Only advances when an item is found!\n* **Belt 2 (`p2`):** The supermarket warehouse stream `t`. Constantly moving forward looking for matches.\n\n```text\nChecklist (s):  [a]   b    c\n                 \u2191 p1\n\nStream (t):     [a]   h    b    g    d    c\n                 \u2191 p2\nMatch! Advance p1 -> 'b', advance p2 -> 'h'.\n```\n\n### The Invariants:\n1. `p2` **always advances** on every step (`p2 += 1`) because we cannot rewind time in the warehouse stream.\n2. `p1` **only advances** when `s[p1] == t[p2]`.\n3. If `p1 == len(s)`, all checklist items were matched in order $\\to$ **`True`**!\n\n---\n\n## \ud83d\udcbb Production Implementation\n\n```python\nclass Solution:\n    def isSubsequence(self, s: str, t: str) -> bool:\n        p1, p2 = 0, 0\n        \n        while p1 < len(s) and p2 < len(t):\n            if s[p1] == t[p2]:\n                p1 += 1\n            p2 += 1  # p2 moves every single step\n            \n        return p1 == len(s)\n```\n\n---\n\n## \u26a1 Complexity & Follow-up\n* **Time Complexity:** $\\mathcal{O}(|t|)$ \u2013 Single pass through `t`.\n* **Auxiliary Space:** $\\mathcal{O}(1)$ \u2013 Zero extra memory allocated.\n\n### \ud83d\udcbc FAANG Follow-up Question:\n> *\"What if there are lots of incoming `s`, say $s_1, s_2, \\dots, s_k$ where $k \\ge 10^9$, and you want to check one by one against a fixed `t`?\"*\n\n* **Answer:** Preprocess `t` into a **HashMap of indices** (`char -> [idx1, idx2, ...]`). Then for each character in `s`, use **Binary Search (`bisect_right`)** to find the next valid index in $\\mathcal{O}(|s| \\log |t|)$ time instead of scanning `t` each time!\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/3_longest_substring_without_repeating_characters.md": {"title": "\ud83e\ude9f LeetCode 3: Longest Substring Without Repeating Characters \u2013 Master Study Guide", "content": "# \ud83e\ude9f LeetCode 3: Longest Substring Without Repeating Characters \u2013 Master Study Guide\n\n> **Difficulty:** Medium | **Pattern:** Dynamic Sliding Window (The Rubber Band)  \n> **Complexity:** Time: $\\mathcal{O}(n)$ | Auxiliary Space: $\\mathcal{O}(\\min(n, m))$ where $m \\le 128$ ASCII chars  \n> **Source Code:** [`3_longest_substring_without_repeating_characters.py`](./3_longest_substring_without_repeating_characters.py)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven a string `s`, find the length of the **longest substring** without repeating characters.\n\n```text\nExample 1:\nInput:  s = \"abcabcbb\"\nOutput: 3\nExplanation: The answer is \"abc\", with length 3.\n\nExample 2:\nInput:  s = \"bbbbb\"\nOutput: 1\nExplanation: The answer is \"b\", with length 1.\n\nExample 3:\nInput:  s = \"pwwkew\"\nOutput: 3\nExplanation: The answer is \"wke\", with length 3 (\"pwke\" is a subsequence, not a substring!).\n```\n\n---\n\n## \u26a0\ufe0f Why Brute Force Hits TLE (1028 / 1036 Passed)\n\nIf you check substrings from every index and do `len(tmp) == len(set(tmp))` inside a `while` loop:\n1. **`set(tmp)` rebuilds a set from scratch on every single character**: That takes $\\mathcal{O}(k)$ time per step.\n2. **String slicing/appending `tmp += s[j]` creates new string copies** in memory.\n3. Total time explodes to $\\mathcal{O}(n^3)$, which passes small inputs but hits **Time Limit Exceeded** on inputs with thousands of characters.\n\n---\n\n## \ud83e\udde0 Mental Model: The Rubber Band (Dynamic Sliding Window)\n\nInstead of restarting the search or re-building sets, use a **Rubber Band window** `[left, right]`:\n* `right` stretches the window forward, absorbing new characters.\n* `seen` keeps track of characters currently inside the window.\n\n```text\nString:   a   b   c   a   b   c   b   b\nWindow:  [a   b   c]                              seen = {a, b, c}, len = 3\n                  \u2191 incoming 'a' is a duplicate!\n\nAction:   Snap 'left' forward past the old 'a'!\nWindow:      [b   c   a]                          seen = {b, c, a}, len = 3\n```\n\n### The 2 Invariant Rules:\n1. **Stretch (`right`):** Look at incoming character `s[right]`.\n2. **Contract (`left`):** If `s[right]` is already in `seen`, contract the window by removing `s[left]` from `seen` and advancing `left += 1` until the duplicate is gone!\n3. Add `s[right]` to `seen`, and record `max_len = max(max_len, right - left + 1)`.\n\n---\n\n## \ud83d\udcbb Production Implementation\n\n```python\nclass Solution:\n    def lengthOfLongestSubstring(self, s: str) -> int:\n        seen = set()\n        left = 0\n        max_len = 0\n        \n        for right in range(len(s)):\n            # While the incoming character is a duplicate, shrink from left\n            while s[right] in seen:\n                seen.remove(s[left])\n                left += 1\n                \n            seen.add(s[right])\n            max_len = max(max_len, right - left + 1)\n            \n        return max_len\n```\n\n---\n\n## \u26a1 Complexity & FAANG Notes\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2013 Each character enters `seen` once and leaves `seen` at most once (at most $2n$ total pointer moves).\n* **Space Complexity:** $\\mathcal{O}(\\min(n, m))$ \u2013 The set never holds more than the character set size ($m \\le 128$ for ASCII).\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/55_jump_game.md": {"title": "\ud83c\udfae LeetCode 55: Jump Game \u2013 Master Study Guide", "content": "# \ud83c\udfae LeetCode 55: Jump Game \u2013 Master Study Guide\n\n> **Difficulty:** Medium | **Top Interview 150:** Arrays / Greedy  \n> **Pattern:** Greedy (Archetype 2: The Horizon / Laser Reach)  \n> **Complexity:** Time: $\\mathcal{O}(n)$ | Space: $\\mathcal{O}(1)$  \n> **Source Code:** [`55_jump_game.py`](./55_jump_game.py)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nYou are given an integer array `nums` where each element represents your **maximum jump power** from that stone.\nStarting at index `0`, determine if you can ever reach or land on the last stone (`len(nums) - 1`).\n\n```text\nExample 1:\nInput: nums = [2, 3, 1, 1, 4]\nOutput: true (From 0 jump 1 to stone 1; from stone 1 jump 3 to stone 4)\n\nExample 2:\nInput: nums = [3, 2, 1, 0, 4]\nOutput: false (Every possible jump lands directly on the '0' quicksand at index 3)\n```\n\n---\n\n## \ud83e\udde0 Mental Model: The Flashlight / Laser Reach\n\nDo not try to simulate individual hops. Simulating hops creates a massive decision tree in your head.\n\nInstead, ask one question as you walk forward:\n> **\"What is the furthest stone illuminated by my flashlight beam?\" (`max_reach`)**\n\n```text\nAt each stone i:\nThe furthest stone you could launch yourself to is: i + nums[i]\n```\n\n### The 3 Golden Rules:\n1. **Can I even stand here?**  \n   If `i > max_reach`, you walked past the edge of illuminated ground. You ran out of momentum. Return `False`!\n2. **Can I stretch my horizon?**  \n   `max_reach = max(max_reach, i + nums[i])`\n3. **Did I cross the finish line?**  \n   If `max_reach >= len(nums) - 1`, return `True` immediately!\n\n---\n\n## \ud83d\udcbb Production Implementation\n\n```python\nfrom typing import List\n\nclass Solution:\n    def canJump(self, nums: List[int]) -> bool:\n        max_reach = 0\n        target = len(nums) - 1\n        \n        for i, jump in enumerate(nums):\n            # If current stone is beyond furthest reachable horizon, we are stuck!\n            if i > max_reach:\n                return False\n                \n            # Greedily stretch our reach as far as possible\n            max_reach = max(max_reach, i + jump)\n            \n            # Early victory check\n            if max_reach >= target:\n                return True\n                \n        return True\n```\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 Single pass through `nums`.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 Only one scalar integer (`max_reach`).\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/643_maximum_average_subarray_i.md": {"title": "\ud83e\ude9f LeetCode 643: Maximum Average Subarray I \u2013 Master Guide", "content": "# \ud83e\ude9f LeetCode 643: Maximum Average Subarray I \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** LeetCode 75 / Top Interview 150  \n> **Pattern:** Fixed-Size Sliding Window (The Running Differential Pattern)  \n> **LeetCode Link:** [LeetCode 643: Maximum Average Subarray I](https://leetcode.com/problems/maximum-average-subarray-i/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nYou are given an integer array `nums` consisting of `n` elements, and an integer `k`.\n\nFind a contiguous subarray whose **length is equal to `k`** that has the **maximum average value** and return this value. Any calculation with a precision error $\\le 10^{-5}$ will be accepted.\n\n### Example:\n```text\nInput: nums = [1, 12, -5, -6, 50, 3], k = 4\nOutput: 12.75\nExplanation: Subarray [12, -5, -6, 50] has sum 51, and 51 / 4 = 12.75\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: The Running Differential Pattern \ud83e\ude9f\n\n### Why Brute Force Gets TLE:\nIf you take a slice `nums[i:i+k]` or use a loop to add $k$ numbers for every starting point:\n* You repeat $k$ operations $(n - k + 1)$ times $\\implies \\mathcal{O}(n \\cdot k)$ operations.\n* When $n = 100,000$ and $k = 50,000$, that's $\\approx 2.5 \\times 10^9$ operations $\\implies$ **Instant Time Limit Exceeded (TLE)**!\n\n### The Insight:\nNotice what happens when a fixed-size window of size $k=4$ moves forward by 1 step:\n\n```text\
