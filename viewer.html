ero swaps occurred! The array is already fully sorted.\n\n---\n\n## \u26a1 3. The Critical Optimization: Early Termination (`swapped` Flag)\n\nWithout optimization, standard Bubble Sort blindly runs all $n - 1$ passes, even if the array is already sorted on Pass 1. That takes $\\mathcal{O}(n^2)$ time even for `[1, 2, 3, 4, 5]`.\n\n### The Fix:\nAdd a boolean flag `swapped = False` at the start of each pass.\n- If we complete an entire pass without making **a single swap**, the array is already 100% sorted!\n- We `break` early immediately.\n\n```text\nImpact on Sorted Array of 10,000 Elements:\n- Without Early Termination: ~50,000,000 comparisons (O(n^2))\n- With Early Termination:        10,000 comparisons (O(n))\n\ud83d\ude80 A 5,000x speedup!\n```\n\n---\n\n## \ud83d\udcbb 4. Python 3 Implementation\n\n```python\ndef bubble_sort(arr: list[int]) -> list[int]:\n    n = len(arr)\n    \n    # Outer loop: counts passes (from 0 to n-1)\n    for i in range(n - 1):\n        swapped = False\n        \n        # Inner loop: compare adjacent pairs.\n        # Notice range(n - 1 - i): we shrink the range because \n        # the last 'i' elements are already sorted!\n        for j in range(n - 1 - i):\n            if arr[j] > arr[j + 1]:\n                # Swap adjacent elements\n                arr[j], arr[j + 1] = arr[j + 1], arr[j]\n                swapped = True\n                \n        # If no two elements were swapped in this pass, array is sorted!\n        if not swapped:\n            break\n            \n    return arr\n```\n\n---\n\n## \ud83d\udcca 5. Complexity Analysis\n\n| Case | Time Complexity | Condition / Explanation |\n| :--- | :--- | :--- |\n| **Best Case** | $\\mathcal{O}(n)$ | Array is already sorted. The `swapped` flag triggers early exit on Pass 1 ($n - 1$ comparisons, 0 swaps). |\n| **Average Case** | $\\mathcal{O}(n^2)$ | Elements in random order. Nested loop comparisons. |\n| **Worst Case** | $\\mathcal{O}(n^2)$ | Array is in reverse sorted order (e.g. `[5, 4, 3, 2, 1]`). Exactly $\\frac{n(n-1)}{2}$ comparisons and swaps. |\n| **Space Complexity** | $\\mathcal{O}(1)$ | In-place sorting. Uses only a constant amount of memory for variables. |\n\n---\n\n## \ud83d\udd12 6. Stability Analysis: Is Bubble Sort Stable?\n\n**YES, Bubble Sort is Stable.**\n\n### What does \"Stable\" mean?\nIf two elements have equal values (e.g. `5_a` and `5_b`), a stable sort guarantees that their original relative order is preserved (`5_a` remains before `5_b` in the sorted output).\n\n### Why is Bubble Sort Stable?\nThe swap condition uses a strict inequality: `if arr[j] > arr[j + 1]:`.\nIf `arr[j] == arr[j + 1]`, no swap happens. Thus, duplicate values never leapfrog each other.\n\n---\n\n## \u2696\ufe0f 7. When to Use & When NOT to Use\n\n### \u2705 Good Use Cases:\n1. **Nearly Sorted Data:** If only 1 or 2 elements are misplaced, early termination makes Bubble Sort run in near $\\mathcal{O}(n)$ time.\n2. **Small Datasets ($N < 30$):** Simple with zero recursion or heap overhead.\n3. **Detecting if an Array is Sorted:** One pass of Bubble Sort determines if an array is sorted in $\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space.\n4. **Teaching Intuition:** The clearest illustration of adjacent swaps and loop invariants.\n\n### \u274c Poor Use Cases:\n1. **Large Datasets ($N > 1000$):** Quadratic $\\mathcal{O}(n^2)$ is unacceptably slow compared to Merge Sort or Quick Sort ($\\\\mathcal{O}(n \\log n)$).\n2. **Reverse Sorted / Random Data:** Insertion Sort typically outperforms Bubble Sort because it does fewer actual writes/swaps.\n", "category": "04_sorting"}, "04_sorting/09_selection_sort.md": {"title": "\ud83c\udfaf Selection Sort \u2013 Complete Guide & Intuition", "content": "# \ud83c\udfaf Selection Sort \u2013 Complete Guide & Intuition\n\n> **Source Reference:** [AlgoMaster.io \u2013 Selection Sort](https://algomaster.io/learn/dsa/selection-sort)  \n> **Category:** Comparison-Based Elementary Sorting  \n> **Difficulty:** Easy\n\n---\n\n## \ud83d\udccc 1. What Is Selection Sort?\n\n**Selection Sort** divides the array into two parts:\n1. A **sorted sublist** on the left (initially empty).\n2. An **unsorted sublist** on the right (initially the whole array).\n\nIn each pass, the algorithm finds (\"selects\") the **minimum element** from the unsorted sublist and swaps it with the leftmost unsorted element, growing the sorted sublist by one.\n\n```text\nPass 1: Find minimum in arr[0...n-1], swap with arr[0].\nPass 2: Find minimum in arr[1...n-1], swap with arr[1].\nPass i: Find minimum in arr[i...n-1], swap with arr[i].\n```\n\n---\n\n## \ud83d\udd0d 2. Visual Walkthrough\n\nArray: `[64, 25, 12, 22, 11]`\n\n1. **Pass 1 ($i = 0$):** Search `[64, 25, 12, 22, 11]`. Min is `11` at index 4. Swap `arr[0]` and `arr[4]`.  \n   $\to [\\mathbf{11}, 25, 12, 22, 64]$\n2. **Pass 2 ($i = 1$):** Search `[25, 12, 22, 64]`. Min is `12` at index 2. Swap `arr[1]` and `arr[2]`.  \n   $\to [\\mathbf{11}, \\mathbf{12}, 25, 22, 64]$\n3. **Pass 3 ($i = 2$):** Search `[25, 22, 64]`. Min is `22` at index 3. Swap `arr[2]` and `arr[3]`.  \n   $\to [\\mathbf{11}, \\mathbf{12}, \\mathbf{22}, 25, 64]$\n4. **Pass 4 ($i = 3$):** Search `[25, 64]`. Min is `25` at index 3. Swap with itself.  \n   $\to [\\mathbf{11}, \\mathbf{12}, \\mathbf{22}, \\mathbf{25}, \\mathbf{64}]$ (Sorted!)\n\n---\n\n## \ud83d\udcbb 3. Python 3 Implementation\n\n```python\ndef selection_sort(arr: list[int]) -> list[int]:\n    n = len(arr)\n    \n    for i in range(n - 1):\n        # Assume the current position is the minimum\n        min_idx = i\n        \n        # Scan the rest of the array to find the true minimum\n        for j in range(i + 1, n):\n            if arr[j] < arr[min_idx]:\n                min_idx = j\n                \n        # Swap the found minimum with the first unsorted position\n        if min_idx != i:\n            arr[i], arr[min_idx] = arr[min_idx], arr[i]\n            \n    return arr\n```\n\n---\n\n## \ud83d\udcca 4. Complexity & Key Characteristics\n\n- **Time Complexity:** $\\mathcal{O}(n^2)$ in **ALL cases** (Best, Average, Worst).  \n  *Why?* Even if the array is sorted, Selection Sort must still scan all remaining elements to confirm the minimum.\n- **Space Complexity:** $\\mathcal{O}(1)$ (In-place).\n- **Total Swaps:** At most $n - 1$ swaps. (Minimizes memory writes!).\n- **Stability:** \u274c **NOT Stable.**  \n  *Example:* Sorting `[4_a, 4_b, 1]`. The `1` is swapped with `4_a`, resulting in `[1, 4_b, 4_a]`. The relative order of `4_a` and `4_b` was inverted.\n", "category": "04_sorting"}, "04_sorting/10_insertion_sort.md": {"title": "\ud83c\udccf Insertion Sort \u2013 Complete Guide & Intuition", "content": "# \ud83c\udccf Insertion Sort \u2013 Complete Guide & Intuition\n\n> **Source Reference:** [AlgoMaster.io \u2013 Insertion Sort](https://algomaster.io/learn/dsa/insertion-sort)  \n> **Category:** Comparison-Based Adaptive Sorting  \n> **Difficulty:** Easy (Extremely Practical)\n\n---\n\n## \ud83d\udccc 1. What Is Insertion Sort?\n\n**Insertion Sort** works the exact same way most people sort a hand of playing cards:\n1. Start with one card in your hand (trivially sorted).\n2. Pick up the next card from the table.\n3. Compare it backward against the cards already in your hand and **slide/shift** larger cards to the right.\n4. **Insert** the new card into its correct open slot.\n\n---\n\n## \ud83d\udd0d 2. Visual Walkthrough\n\nArray: `[12, 11, 13, 5, 6]`\n\n1. **Step 1:** Key = `11`. Compare with `12`. Shift `12` right. Insert `11`.  \n   $\to [\\mathbf{11, 12}, 13, 5, 6]$\n2. **Step 2:** Key = `13`. Compare with `12`. $13 > 12$, no shift needed.  \n   $\to [\\mathbf{11, 12, 13}, 5, 6]$\n3. **Step 3:** Key = `5`. Compare with `13, 12, 11`. Shift all right. Insert `5`.  \n   $\to [\\mathbf{5, 11, 12, 13}, 6]$\n4. **Step 4:** Key = `6`. Shift `13, 12, 11` right. Insert `6`.  \n   $\to [\\mathbf{5, 6, 11, 12, 13}]$ (Sorted!)\n\n---\n\n## \ud83d\udcbb 3. Python 3 Implementation\n\n```python\ndef insertion_sort(arr: list[int]) -> list[int]:\n    for i in range(1, len(arr)):\n        key = arr[i]\n        j = i - 1\n        \n        # Shift elements of arr[0...i-1] that are greater than key to one position ahead\n        while j >= 0 and arr[j] > key:\n            arr[j + 1] = arr[j]\n            j -= 1\n            \n        # Place key into its correct position\n        arr[j + 1] = key\n        \n    return arr\n```\n\n---\n\n## \ud83d\udcca 4. Complexity & Key Characteristics\n\n- **Best Case Time:** $\\mathcal{O}(n)$ \u2013 When array is already sorted (the `while` condition immediately fails).\n- **Worst / Average Case Time:** $\\mathcal{O}(n^2)$ \u2013 Reverse sorted array.\n- **Space Complexity:** $\\mathcal{O}(1)$ in-place.\n- **Stability:** \u2705 **STABLE.**\n- **Why it matters in real systems:** Hybrid sorting algorithms like **Timsort** (used in Python's `sort()` and Java's `Arrays.sort()`) use Insertion Sort for small blocks ($N \\le 32$ or $64$) because of low constant factor overhead and great CPU cache locality.\n", "category": "04_sorting"}, "04_sorting/11_merge_sort.md": {"title": "\ud83c\udf32 Merge Sort \u2013 Complete Guide & Intuition", "content": "# \ud83c\udf32 Merge Sort \u2013 Complete Guide & Intuition\n\n> **Source Reference:** [AlgoMaster.io \u2013 Merge Sort](https://algomaster.io/learn/dsa/merge-sort)  \n> **Category:** Divide and Conquer  \n> **Difficulty:** Medium (Guaranteed $\\mathcal{O}(n \\log n)$)\n\n---\n\n## \ud83d\udccc 1. What Is Merge Sort?\n\nMerge Sort is a classic **Divide and Conquer** algorithm:\n1. **Divide:** Recursively split the array in half until each subarray has only 1 element (a 1-element array is always sorted).\n2. **Conquer & Combine:** Merge the two sorted halves back together in linear time using the two-pointer merge technique.\n\n```text\n                  [38, 27, 43, 3, 9, 82, 10]\n                  /                        \\\n          [38, 27, 43, 3]              [9, 82, 10]\n          /             \\              /         \\\n      [38, 27]       [43, 3]        [9, 82]      [10]\n      /      \\       /     \\        /     \\        |\n    [38]    [27]   [43]    [3]     [9]    [82]   [10]\n      \\      /       \\     /        \\     /        |\n      [27, 38]       [3, 43]        [9, 82]      [10]\n          \\             /              \\         /\n          [3, 27, 38, 43]              [9, 10, 82]\n                  \\                        /\n                  [3, 9, 10, 27, 38, 43, 82]\n```\n\n---\n\n## \ud83d\udcbb 2. Python 3 Implementation\n\n```python\ndef merge_sort(arr: list[int]) -> list[int]:\n    # Base case: 0 or 1 elements are already sorted\n    if len(arr) <= 1:\n        return arr\n        \n    mid = len(arr) // 2\n    left_half = merge_sort(arr[:mid])\n    right_half = merge_sort(arr[mid:])\n    \n    return merge(left_half, right_half)\n\ndef merge(left: list[int], right: list[int]) -> list[int]:\n    result = []\n    i = j = 0\n    \n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:  # <= guarantees stability!\n            result.append(left[i])\n            i += 1\n        else:\n            result.append(right[j])\n            j += 1\n            \n    # Append any remaining elements\n    result.extend(left[i:])\n    result.extend(right[j:])\n    return result\n```\n\n---\n\n## \ud83d\udcca 3. Complexity & Key Characteristics\n\n- **Time Complexity:** $\\mathcal{O}(n \\log n)$ in **ALL cases** (Best, Average, Worst).\n  - Tree depth is $\\log_2 n$.\n  - Work per level is $\\mathcal{O}(n)$ to merge.\n- **Space Complexity:** $\\mathcal{O}(n)$ auxiliary memory for merging subarrays.\n- **Stability:** \u2705 **STABLE.**\n- **Best for:** Sorting Linked Lists (where random access is not available, and extra space is $\\mathcal{O}(1)$ with pointers) and external sorting of large files on disk.\n", "category": "04_sorting"}, "04_sorting/12_quick_sort.md": {"title": "\u26a1 Quick Sort \u2013 Complete Guide & Intuition", "content": "# \u26a1 Quick Sort \u2013 Complete Guide & Intuition\n\n> **Source Reference:** [AlgoMaster.io \u2013 Quick Sort](https://algomaster.io/learn/dsa/quick-sort)  \n> **Category:** Divide and Conquer (Partitioning)  \n> **Difficulty:** Medium (Fastest in Practice)\n\n---\n\n## \ud83d\udccc 1. What Is Quick Sort?\n\nQuick Sort is an in-place divide-and-conquer algorithm:\n1. **Choose a Pivot:** Pick an element from the array (e.g. last element, random element, or median of three).\n2. **Partition:** Rearrange the array so that:\n   - All elements **less than or equal to the pivot** are placed to its left.\n   - All elements **greater than the pivot** are placed to its right.\n   - The pivot lands in its **final sorted position**.\n3. **Recursively Sort:** Apply Quick Sort to the left and right subarrays.\n\n---\n\n## \ud83d\udd0d 2. Lomuto Partition Scheme Trace\n\nArray: `[10, 80, 30, 90, 40, 50, 70]`, Pivot = `70`\n- Pointer `i` marks the boundary of elements $\\le 70$.\n- Pointer `j` scans from `0` to `n-2`:\n  - `10 <= 70` $\\to$ swap with itself, $i$ advances.\n  - `80 > 70` $\\to$ skip.\n  - `30 <= 70` $\\to$ swap `80` and `30`.\n  - At the end, swap pivot `70` into index $i + 1$.\n\n---\n\n## \ud83d\udcbb 3. Python 3 Implementation\n\n```python\ndef quick_sort(arr: list[int], low: int, high: int) -> None:\n    if low < high:\n        # pi is partitioning index, arr[pi] is at right place\n        pi = partition(arr, low, high)\n        \n        quick_sort(arr, low, pi - 1)   # Sort left of pivot\n        quick_sort(arr, pi + 1, high)  # Sort right of pivot\n\ndef partition(arr: list[int], low: int, high: int) -> int:\n    pivot = arr[high]  # Choosing last element as pivot\n    i = low - 1        # Index of smaller element\n    \n    for j in range(low, high):\n        if arr[j] <= pivot:\n            i += 1\n            arr[i], arr[j] = arr[j], arr[i]\n            \n    # Swap pivot to its correct final place\n    arr[i + 1], arr[high] = arr[high], arr[i + 1]\n    return i + 1\n```\n\n---\n\n## \ud83d\udcca 4. Complexity & Key Characteristics\n\n- **Average Time:** $\\mathcal{O}(n \\log n)$ with very small constant factors (cache-friendly).\n- **Worst Case Time:** $\\mathcal{O}(n^2)$ (occurs when pivot is always smallest/largest, e.g. already sorted with naive pivot choice).\n- **Space Complexity:** $\\mathcal{O}(\\log n)$ recursion stack space.\n- **Stability:** \u274c **NOT Stable.**\n", "category": "04_sorting"}, ".agents/rules/dsa_workflow.md": {"title": "\ud83e\udd16 Automated DSA Documentation & Tracking Protocol", "content": "# \ud83e\udd16 Automated DSA Documentation & Tracking Protocol\n\nWhenever the user solves, discusses, or submits a new problem in this repository, ALWAYS execute the following automated synchronization workflow autonomously without being prompted.\n\n---\n\n## \u26a1 Automated 5-Step Workflow for Every New Problem\n\n### Step 1: Bucket Placement & File Creation\n* Identify the algorithmic category and store files in the corresponding directory:\n  * Arrays / Two Pointers / Sliding Window / Greedy $\\to$ `01_arrays_and_pointers/`\n  * Linked Lists $\\to$ `02_linked_lists/`\n  * Stacks & Monotonic $\\to$ `03_stacks_and_queues/`\n  * Sorting $\\to$ `04_sorting/`\n  * Binary Search $\\to$ `05_binary_search/`\n  * Trees & Graphs $\\to$ `06_trees_and_graphs/`\n  * Dynamic Programming & Backtracking $\\to$ `07_dynamic_programming/`\n* Create both:\n  1. `<num>_<problem_name>.py`: Production Python solution with test assertions.\n  2. `<num>_<problem_name>.md`: Intuitive study guide with plain English breakdown, ASCII visual diagrams, beginner traps, and FAANG interview role.\n\n### Step 2: Auto-Update Pattern Cheat Sheets\n* Review `cheat_sheets/` (e.g. `greedy_cheat_sheet.md`, `two_pointers_cheat_sheet.md`, `sliding_window_cheat_sheet.md`, `kadanes_algorithm_cheat_sheet.md`).\n* If the problem reveals a new archetype, edge case, or decision rule, immediately update the relevant cheat sheet.\n\n### Step 3: Auto-Update `tracker.html` & `faang_plan.html`\n* Add the problem entry to `SCRATCH_PROBLEMS` in `tracker.html` (Title, Number, Difficulty, Pattern, Date, Study Doc link, Key Mental Model).\n* Update the daily count and weekly velocity progress bar ($20$ problems/week).\n* Check off the problem in `faang_plan.html`.\n\n### Step 4: Rebuild HTML Viewer\n* Run `python3 build_viewer.py` to bundle the new `.md` study guides into `viewer.html` so it opens with dark-mode formatting and syntax highlighting.\n\n### Step 5: Update Central `README.md`\n* Add the new problem entry to the appropriate section in `README.md`.\n\n### Step 6: Git Auto-Commit & Remote Sync (MANDATORY)\n* Maintain everything as an active Git repository, NOT just a local folder.\n* After every problem solved, doc updated, or tracker synced:\n  1. Stage all modified and new files (`git add .`).\n  2. Create a descriptive commit authored by `tsathya98` (e.g. `feat(lc-134): add Gas Station study guide and tracker sync`).\n  3. Push immediately to remote (`git push origin main`).\n* The GitHub account for this repository is strictly **`tsathya98`** (email: `tsathya98@gmail.com`), NEVER work/corporate accounts.\n* Repository remote: `https://github.com/tsathya98/dsa-patterns-handbook.git`.\n\n\n", "category": ".agents"}, "cheat_sheets/13_sorting_cheat_sheet.md": {"title": "\ud83d\udcca The Ultimate Sorting Algorithms Comparison Cheat Sheet", "content": "# \ud83d\udcca The Ultimate Sorting Algorithms Comparison Cheat Sheet\n\n> **Summary Reference:** Comparison of all 10 core sorting algorithms covering Time, Space, Stability, In-Place behavior, and Best Use Cases.\n\n---\n\n## \ud83c\udfc6 Master Comparison Table\n\n| Algorithm | Best Time | Average Time | Worst Time | Space | In-Place? | Stable? | Best Used For |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |\n| **Bubble Sort** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(1)$ | Yes | Yes | Nearly sorted data, small inputs, teaching |\n| **Selection Sort** | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(1)$ | Yes | No | Minimizing memory writes (at most $n$ swaps) |\n| **Insertion Sort** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(1)$ | Yes | Yes | Small datasets ($N \\le 32$), online data streams |\n| **Merge Sort** | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n)$ | No | Yes | Guaranteed $\\mathcal{O}(n \\log n)$, Linked Lists, External Sort |\n| **Quick Sort** | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(\\log n)$ | Yes | No | General purpose, fast in-memory array sorting |\n| **Heap Sort** | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(1)$ | Yes | No | Embedded systems where $\\mathcal{O}(1)$ space and guaranteed $\\mathcal{O}(n \\log n)$ required |\n| **Counting Sort** | $\\mathcal{O}(n + k)$ | $\\mathcal{O}(n + k)$ | $\\mathcal{O}(n + k)$ | $\\mathcal{O}(k)$ | No | Yes | Small integer keys in range $[0, k]$ |\n| **Radix Sort** | $\\mathcal{O}(d \\cdot (n + b))$ | $\\mathcal{O}(d \\cdot (n + b))$ | $\\mathcal{O}(d \\cdot (n + b))$ | $\\mathcal{O}(n + b)$ | No | Yes | Fixed-digit integers/strings |\n| **Bucket Sort** | $\\mathcal{O}(n + k)$ | $\\mathcal{O}(n + k)$ | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n + k)$ | No | Yes | Uniformly distributed floating point numbers in $[0, 1)$ |\n| **Timsort** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(n)$ | No | Yes | Standard library default (Python `sorted()`, Java `Arrays.sort()`) |\n\n---\n\n## \ud83c\udfaf Interview Decision Tree: \"Which Sorting Algorithm Should I Pick?\"\n\n```text\n                           [ Need to Sort Data ]\n                                     \u2502\n           \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n    [ Array / Contiguous ]                               [ Linked List ]\n           \u2502                                                   \u2502\n    Is elements range small integers?                    Merge Sort (O(N log N), O(1) space)\n     \u250c\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2510\n   [Yes]        [No]\n     \u2502           \u2502\nCounting Sort  Need guaranteed O(N log N) & Stability?\n or Radix Sort   \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n               [Yes]                [No]\n                 \u2502                    \u2502\n             Merge Sort         Need O(1) Space?\n                                 \u250c\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2510\n                               [Yes]      [No]\n                                 \u2502          \u2502\n                             Heap Sort   Quick Sort (Fastest Average)\n```\n", "category": "cheat_sheets"}, "cheat_sheets/arrays_hashmaps_cheat_sheet.md": {"title": "\ud83e\uddf1 Arrays, Strings & HashMaps Master Cheat Sheet & Decision Guide", "content": "# \ud83e\uddf1 Arrays, Strings & HashMaps Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Core Linear Data Structures (Arrays, Strings, Sets, and HashMaps)  \n> **Audience:** Complete Beginner / 1st-Year CS Student  \n> **Analogies:** The Row of Houses (Array) vs. The VIP Bouncer (Set) vs. The Coat Check (HashMap)\n\n---\n\n## \ud83d\udca1 1. The 4 Big Data Structures Compared\n\n| Data Structure | Plain English Analogy | Superpower | Big Weakness |\n|---|---|---|---|\n| **Array / List** | A row of houses on a street | Instant index access (`arr[4]`) in $\\mathcal{O}(1)$ | Inserting/deleting in the middle is slow ($\\mathcal{O}(n)$) |\n| **String** | An immutable sentence carved in stone | Fast sequential reads | Changing a character creates a whole new string! |\n| **Set** | A VIP bouncer's guest list | Instant presence check: *\"Have I seen this?\"* in $\\mathcal{O}(1)$ | No duplicate items, no indexing (`set[0]` doesn't exist) |\n| **HashMap / Dict** | A coat-check ticket system | Look up any value by key (`ticket -> coat`) in $\\mathcal{O}(1)$ | Uses more memory than an array |\n\n---\n\n## \ud83d\uded1 2. The #1 Python String Trap: $\\mathcal{O}(n^2)$ Concatenation\n\nIn Python, strings are **immutable** (cannot be changed in-place).\n```python\n# \u274c DANGEROUS CODE (O(n^2)):\nresult = \"\"\nfor char in s:\n    result += char  # Python builds an ENTIRE NEW STRING copy every single time!\n```\nIf `s` has $100,000$ characters, this does $10^{10}$ operations and **Times Out (TLE)**!\n\n```python\n# \u2705 OPTIMAL CODE (O(n)):\nresult = []\nfor char in s:\n    result.append(char)\nreturn \"\".join(result)  # Fast single-pass string allocation!\n```\n\n---\n\n## \ud83c\udfc6 3. The \"Two Sum\" Complement Trick (The Most Famous Interview Pattern)\n\nWhen asked to find two numbers that add up to `target`:\n* **Brute Force:** Check every pair using nested loops $\\to \\mathcal{O}(n^2)$.\n* **HashMap Trick:** As you walk through the array, remember every number you've seen. For each number, ask the HashMap: *\"Have we already seen `target - num`?\"* $\\to \\mathcal{O}(n)$ time!\n\n```python\ndef twoSum(nums: list[int], target: int) -> list[int]:\n    seen = {}  # number -> index\n    \n    for i, num in enumerate(nums):\n        complement = target - num\n        if complement in seen:\n            return [seen[complement], i]\n        seen[num] = i\n        \n    return []\n```\n\n---\n\n## \ud83d\uddc2\ufe0f 4. The Group Anagrams Pattern (Canonical Keys)\n\nWhen you need to group items together (like anagrams `\"eat\"`, `\"tea\"`, `\"ate\"`):\n1. **Find a signature (canonical key):** Sorting the characters of `\"eat\"`, `\"tea\"`, and `\"ate\"` all produce the exact same key: `\"aet\"`.\n2. Store the words in a dictionary where the key is the sorted signature!\n\n```python\nfrom collections import defaultdict\n\ndef groupAnagrams(strs: list[str]) -> list[list[str]]:\n    groups = defaultdict(list)\n    \n    for word in strs:\n        sorted_key = \"\".join(sorted(word))  # \"eat\" -> \"aet\"\n        groups[sorted_key].append(word)\n        \n    return list(groups.values())\n```\n", "category": "cheat_sheets"}, "cheat_sheets/backtracking_cheat_sheet.md": {"title": "\ud83d\udd04 Backtracking Master Cheat Sheet & Decision Guide", "content": "# \ud83d\udd04 Backtracking Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Backtracking (Exhaustive Search with Undo / Pruning)  \n> **Audience:** Complete Beginner / 1st-Year CS Student  \n> **Analogy:** Exploring a Maze with an \"Undo\" (Ctrl+Z) Button\n\n---\n\n## \ud83d\udca1 1. What is Backtracking?\n\nImagine walking through a maze. You reach a fork in the road:\n1. You **choose** to go Left.\n2. You walk until you hit a dead end.\n3. You don't give up! You **backtrack** (walk backward to the fork).\n4. Now you **choose** to go Right!\n\nBacktracking is simply **brute-force recursion**, but with a superpower:\nWhenever you reach an invalid state or finish recording a combination, you **undo your last move** and try the next alternative.\n\n```text\nDecision Tree for [1, 2]:\n                    [] (Start)\n                 /      \\\n            Include 1   Don't Include 1\n              /             \\\n            [1]              []\n           /   \\            /   \\\n        [1,2]  [1]        [2]   []\n```\n\n---\n\n## \u2699\ufe0f 2. The 3-Step Universal Template\n\nEvery single backtracking problem in computer science follows the exact same 3-step rhythm:\n\n```python\ndef backtrack(state):\n    if base_case_reached:\n        results.append(list(path))  # Record answer snapshot\n        return\n        \n    for choice in available_choices:\n        if is_valid(choice):\n            path.append(choice)      # 1. CHOOSE (Make a move)\n            backtrack(next_state)    # 2. EXPLORE (Recurse deeper)\n            path.pop()               # 3. UN-CHOOSE (Undo / Backtrack!)\n```\n\n> \u26a0\ufe0f **The Critical Line: `path.pop()`**  \n> If you forget `path.pop()`, the choices from earlier branches pollute the next branches!\n\n---\n\n## \ud83c\udfc6 3. The 3 Classic Types of Backtracking Problems\n\n---\n\n### \ud83d\udd39 Type 1: Subsets (Include vs. Exclude)\n* **Goal:** Generate all possible subsets (power set) of an array `[1, 2, 3]`.\n* **Formula:** An array of length $N$ has $2^N$ subsets.\n* **LeetCode Problem:** *Subsets* (LC 78).\n\n```python\ndef subsets(nums: list[int]) -> list[list[int]]:\n    result = []\n    \n    def backtrack(start_idx: int, path: list[int]):\n        # Every path along the way is a valid subset!\n        result.append(list(path))  # Must use list(path) to make a copy!\n        \n        for i in range(start_idx, len(nums)):\n            path.append(nums[i])        # 1. Choose\n            backtrack(i + 1, path)      # 2. Explore\n            path.pop()                  # 3. Un-choose\n            \n    backtrack(0, [])\n    return result\n```\n\n---\n\n### \ud83d\udd39 Type 2: Permutations (Order Matters!)\n* **Goal:** Rearrange numbers in all possible orders (e.g. `[1, 2, 3]` $\\to$ `[1,2,3]`, `[1,3,2]`, `[2,1,3]`...).\n* **Formula:** An array of length $N$ has $N!$ permutations.\n* **LeetCode Problem:** *Permutations* (LC 46).\n\n```python\ndef permute(nums: list[int]) -> list[list[int]]:\n    result = []\n    \n    def backtrack(path: list[int]):\n        if len(path) == len(nums):\n            result.append(list(path))\n            return\n            \n        for num in nums:\n            if num not in path:          # Only choose numbers not yet picked!\n                path.append(num)         # 1. Choose\n                backtrack(path)          # 2. Explore\n                path.pop()               # 3. Un-choose\n                \n    backtrack([])\n    return result\n```\n\n---\n\n### \ud83d\udd39 Type 3: Combinations (Choose $K$ items)\n* **Goal:** Pick $K$ items out of $N$ candidates (e.g., choose 2 items from `[1, 2, 3, 4]`).\n* **LeetCode Problem:** *Combinations* (LC 77).\n\n---\n\n## \u26a0\ufe0f 4. The #1 Python Trap in Backtracking\n\nLook at this common bug:\n```python\nresult.append(path)  # \u274c FATAL BUG!\n```\nIn Python, lists are passed **by reference**! If you do `result.append(path)`, every element in `result` will point to the exact same list in memory. When the recursion finishes and `path` is popped empty, your `result` will be `[[], [], []]`!\n\n**The Fix:** Always append a **copy** of the list:\n```python\nresult.append(list(path))  # \u2705 Or path[:]\n```\n", "category": "cheat_sheets"}, "cheat_sheets/bfs_dfs_cheat_sheet.md": {"title": "\ud83c\udf32 BFS vs. DFS Master Cheat Sheet & Decision Guide", "content": "# \ud83c\udf32 BFS vs. DFS Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Tree & Graph Traversal (Breadth-First Search vs. Depth-First Search)  \n> **Audience:** Complete Beginner / 1st-Year CS Student  \n> **Analogies:** The Water Ripple (BFS) vs. The Maze Runner (DFS)\n\n---\n\n## \ud83d\udca1 1. What Are Trees and Graphs in Plain English?\n\n* A **Node (Vertex)** = A city, a webpage, or a number in a circle.\n* An **Edge** = A road or link connecting two nodes.\n* A **Tree** = A graph with no cycles (it branches out like an upside-down family tree from the `root`).\n\nWhen you want to visit every room in a building, there are two distinct strategies:\n1. **BFS (Breadth-First Search):** Explore all immediate neighboring rooms on your current floor before going up to the next floor.\n2. **DFS (Depth-First Search):** Pick one hallway and walk as far as you can until you hit a dead end, then backtrack and try the next hallway.\n\n---\n\n## \ud83c\udf0a 2. BFS: The Breadth-First Search\n\n```text\n               ( 1 )              Level 0 (Start)\n             /       \\\n          ( 2 )     ( 3 )         Level 1 (Neighbors of 1)\n          /   \\     /   \\\n        (4)   (5) (6)   (7)       Level 2 (Neighbors of 2 & 3)\n\nBFS Visit Order: 1 -> 2 -> 3 -> 4 -> 5 -> 6 -> 7 (Layer by Layer!)\n```\n\n### \ud83d\udca1 The Big Superpower of BFS\n> **In unweighted graphs or grids, BFS GUARANTEES the SHORTEST path!**  \n> Why? Because it checks everything at distance 1, then distance 2, then distance 3. The first time you reach your target, you are 100% guaranteed it took the fewest possible steps.\n\n### \u2699\ufe0f Data Structure: **Queue (`collections.deque`)** \u2014 First In, First Out (FIFO)\n\n#### \u2699\ufe0f BFS Template (Level-by-Level)\n```python\nfrom collections import deque\n\ndef bfs(root):\n    if not root:\n        return []\n    \n    queue = deque([root])\n    results = []\n    \n    while queue:\n        level_size = len(queue)\n        current_level = []\n        \n        # Process every node at the CURRENT level\n        for _ in range(level_size):\n            node = queue.popleft()\n            current_level.append(node.val)\n            \n            if node.left:\n                queue.append(node.left)\n            if node.right:\n                queue.append(node.right)\n                \n        results.append(current_level)\n        \n    return results\n```\n\n---\n\n## \ud83c\udf32 3. DFS: The Depth-First Search\n\n```text\n               ( 1 )\n             /       \\\n          ( 2 )     ( 5 )\n          /   \\\n        (3)   (4)\n\nDFS Visit Order: 1 -> 2 -> 3 (hits dead end, backtracks) -> 4 -> 5\n```\n\n### \ud83d\udca1 The Big Superpower of DFS\n> **DFS is great for exploring complete paths, checking connectivity, and counting regions.**  \n> It uses almost no extra memory for shallow branches and writes very elegantly using **Recursion**.\n\n### \u2699\ufe0f Data Structure: **Call Stack (Recursion)**\n\n#### \u2699\ufe0f DFS Template (e.g. *Number of Islands* - LC 200)\n```python\ndef numIslands(grid: list[list[str]]) -> int:\n    if not grid:\n        return 0\n        \n    rows, cols = len(grid), len(grid[0])\n    islands = 0\n    \n    def dfs(r, c):\n        # 1. Base case: out of bounds or water ('0')\n        if r < 0 or r >= rows or c < 0 or c >= cols or grid[r][c] != '1':\n            return\n            \n        # 2. Sink the land (mark visited so we don't re-visit!)\n        grid[r][c] = '0'\n        \n        # 3. Explore 4 directions: Up, Down, Left, Right\n        dfs(r + 1, c)\n        dfs(r - 1, c)\n        dfs(r, c + 1)\n        dfs(r, c - 1)\n\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == '1':\n                dfs(r, c)      # Sinks the whole connected island\n                islands += 1   # Count 1 island\n                \n    return islands\n```\n\n---\n\n## \ud83c\udfc6 4. When to Use BFS vs. DFS (The Decision Table)\n\n| Problem Clue | Which to Pick? | Why? |\n|---|---|---|\n| *\"Find the **shortest** path / minimum steps\"* | **BFS** | BFS explores by distance layer-by-layer; first arrival is shortest. |\n| *\"Traverse level-by-level\"* | **BFS** | Natural fit for a queue. |\n| *\"Find if **any** path exists from A to B\"* | **DFS** | Just dive deep until you find it; less queue overhead. |\n| *\"Find maximum depth of binary tree\"* | **DFS** | 3 lines of recursion: `1 + max(dfs(left), dfs(right))`. |\n| *\"Count connected components / islands\"* | **DFS** (or BFS) | DFS flood-fill is simpler to write. |\n\n---\n\n## \u26a0\ufe0f 5. The #1 Beginner Trap: The Infinite Loop\n\nIn a graph or grid, nodes can point back to each other: `A -> B -> A -> B...`\n* **Always maintain a `visited` set (or mark visited in-place like `grid[r][c] = '0'`).**\n* If you forget to record visited nodes, your BFS/DFS will loop infinitely and crash!\n", "category": "cheat_sheets"}, "cheat_sheets/binary_search_cheat_sheet.md": {"title": "\ud83d\udd0d Binary Search Master Cheat Sheet & Decision Guide", "content": "# \ud83d\udd0d Binary Search Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Binary Search (Divide and Conquer on Monotonic Spaces)  \n> **Audience:** Complete Beginner / 1st-Year CS Student  \n> **Analogy:** The \"Higher or Lower\" Number Guessing Game\n\n---\n\n## \ud83d\udca1 1. What is Binary Search?\n\nImagine playing a guessing game: *\"I am thinking of a number between 1 and 100.\"*\n* If you guess 1, then 2, then 3... that is **Linear Search** ($\\mathcal{O}(n)$). In the worst case, you ask 100 questions.\n* The smart way: You guess **50**.\n  * If the host says *\"Higher!\"*, you just eliminated all numbers from 1 to 50 in **one single second**!\n  * Next you guess **75**, eliminating half of what's left.\n\nEvery single question cuts the remaining search space **in half**.\n* Searching through $1,000,000$ items takes at most **20 checks** ($\\log_2(1,000,000) \\approx 20$)!\n* Time Complexity: **$\\mathcal{O}(\\log n)$** instead of $\\mathcal{O}(n)$.\n\n---\n\n## \ud83c\udfaf 2. When Can You Use It?\n\nYou can use Binary Search whenever the data has **monotonic behavior**:\n1. **Explicitly Sorted Array:** Numbers are in increasing or decreasing order (`[1, 3, 5, 8, 12, 19]`).\n2. **Binary Search on the Answer (Monotonic Predicate):**  \n   The array might not be given, but the answer space transitions from `False` to `True` at some point:\n   `[Impossible, Impossible, Impossible, POSSIBLE, POSSIBLE, POSSIBLE]`  \n   Binary search finds that exact turning point!\n\n---\n\n## \u2699\ufe0f 3. The Classical Template (Bug-Free & Easy to Remember)\n\nMost students get infinite loops in Binary Search because they mess up `low <= high` or `mid + 1`. Memorize this standard template:\n\n```python\ndef binary_search(nums: list[int], target: int) -> int:\n    low = 0\n    high = len(nums) - 1\n    \n    while low <= high:\n        # 1. Find the exact middle\n        mid = (low + high) // 2\n        \n        # 2. Check if we hit the jackpot\n        if nums[mid] == target:\n            return mid\n        \n        # 3. Target is in the right half -> discard left half\n        elif nums[mid] < target:\n            low = mid + 1\n            \n        # 4. Target is in the left half -> discard right half\n        else:\n            high = mid - 1\n            \n    return -1  # Not found\n```\n\n```text\nVisualizing low, mid, high:\nIndices:  0    1    2    3    4    5    6\nNums:   [ 2 ,  5 ,  8 , 12 , 16 , 23 , 38 ]    Target = 23\n          \u25b2              \u25b2              \u25b2\n         low            mid            high\n\n1. nums[mid] = 12 < 23 (Target is higher!)\n2. Discard indices 0 to 3 -> move low to mid + 1 (index 4)\n\nIndices:  0    1    2    3    4    5    6\nNums:   [ . ,  . ,  . ,  . , 16 , 23 , 38 ]\n                              \u25b2    \u25b2    \u25b2\n                             low  mid  high\n3. nums[mid] = 23 == Target! FOUND at index 5!\n```\n\n---\n\n## \ud83c\udf1f 4. Advanced Flavor: \"Binary Search on the Answer\"\n*This is the favorite interview question at top tech companies!*\n\n### The Problem Style:\nThe problem does **not** give you a sorted list to search through. Instead, it asks:\n> *\"Find the **minimum speed** to finish a task in $H$ hours\"* or *\"Find the **maximum capacity** to ship packages in $D$ days.\"*\n\n### How to recognize it:\n1. If a speed of 10 works, will a speed of 11 also work? **Yes.**\n2. If a speed of 4 is too slow, will a speed of 3 also be too slow? **Yes.**\n\nThe answers look like this:\n```text\nSpeed:     1      2      3      4      5      6      7\nFeasible: [No  , No  , No  ,  YES ,  YES ,  YES ,  YES ]\n                               \u25b2\n                      We want to find this boundary!\n```\n\n#### \u2699\ufe0f Binary Search on Answer Template (e.g. *Koko Eating Bananas* - LC 875)\n```python\ndef minEatingSpeed(piles: list[int], h: int) -> int:\n    low = 1              # Minimum possible speed\n    high = max(piles)    # Maximum possible speed needed\n    ans = high\n    \n    while low <= high:\n        mid_speed = (low + high) // 2\n        \n        if can_finish(piles, mid_speed, h):\n            ans = mid_speed        # Record this valid speed\n            high = mid_speed - 1   # Can we go even slower? Search left!\n        else:\n            low = mid_speed + 1    # Too slow! Must speed up! Search right!\n            \n    return ans\n```\n\n---\n\n## \u26a0\ufe0f 5. Student Traps & Tips\n\n1. **Integer Overflow in other languages:**  \n   In Java/C++, `(low + high) // 2` can overflow if numbers are huge ($2 \\times 10^9$). In Python, integers have arbitrary precision so you're safe, but interviewers love when you write:\n   `mid = low + (high - low) // 2`\n2. **Never do `low = mid` or `high = mid`:**  \n   Always include the `+ 1` or `- 1` (`low = mid + 1` or `high = mid - 1`). If you don't, when `low` and `high` are adjacent, your loop will run infinitely!\n", "category": "cheat_sheets"}, "cheat_sheets/bitwise_cheat_sheet.md": {"title": "\u26a1 Bit Manipulation Master Cheat Sheet & Decision Guide", "content": "# \u26a1 Bit Manipulation Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Bit Manipulation & Bitwise Operations  \n> **Target Audience:** Hardware, Systems (Nvidia, Qualcomm), and High-Performance Software Engineering.  \n> **Philosophy:** Bits are the native language of the CPU. What takes loops and dictionaries in high-level code often takes **1 single clock cycle** with bitwise operators.\n\n---\n\n## \ud83d\udca1 1. The 6 Fundamental Bitwise Operators\n\n| Operator | Name | What it Does | Silicon Rule | Example (a = 5 = 101\u2082, b = 3 = 011\u2082) |\n| :---: | :--- | :--- | :--- | :--- |\n| **`&`** | **AND** | `1` only if BOTH bits are 1 | Multiplies bits | `5 & 3` $\\implies 001_2 = \\mathbf{1}$ |\n| **`\\|`** | **OR** | `1` if AT LEAST ONE bit is 1 | Sets a bit | `5 \\| 3` $\\implies 111_2 = \\mathbf{7}$ |\n| **`^`** | **XOR** | `1` if bits are DIFFERENT (`0^1=1`, `1^1=0`) | Toggles a bit | `5 ^ 3` $\\implies 110_2 = \\mathbf{6}$ |\n| **`~`** | **NOT** | Flips all bits (`~x = -(x + 1)`) | Inverts | `~5` $\\implies \\mathbf{-6}$ |\n| **`<<`** | **Left Shift** | Shifts bits left, fills with 0 (Multiplies by $2^k$) | Shift left | `5 << 1` $\\implies 1010_2 = \\mathbf{10}$ |\n| **`>>`** | **Right Shift** | Shifts bits right (Divides by $2^k$) | Shift right | `5 >> 1` $\\implies 10_2 = \\mathbf{2}$ |\n\n---\n\n## \ud83d\udd79\ufe0f 2. The Stream Accumulation Pattern (Horner's Rule in Bits)\n\nWhen reading an incoming stream of bits from left to right (like in a network packet or [LC 1290: Convert Binary in Linked List](./1290_convert_binary_number_in_a_linked_list_to_integer.md)):\n\n```text\nBits arrive:  [ 1 ]  \u2500\u2500\u25ba  [ 0 ]  \u2500\u2500\u25ba  [ 1 ]   (Binary 101 = Decimal 5)\n\nStep 1: Start ans = 0\nStep 2: ans = (ans << 1) | 1  -> 0001 (1)\nStep 3: ans = (ans << 1) | 0  -> 0010 (2)\nStep 4: ans = (ans << 1) | 1  -> 0101 (5)\n```\n\n```python\nans = 0\nwhile head:\n    ans = (ans << 1) | head.val  # Shift left by 1 (multiply by 2), attach new bit!\n    head = head.next\n```\n\n---\n\n## \ud83c\udfc6 3. The 5 Essential \"Power Hacks\" (Interview Weapons)\n\n### \ud83d\udd39 Hack 1: Odd or Even Check\n* **Normal Code:** `if n % 2 == 1:` (requires division/modulo).\n* **Bitwise Hack:**\n  ```python\n  if n & 1:  # The least significant bit (LSB) is 1 for odd numbers!\n      # n is Odd\n  ```\n\n---\n\n### \ud83d\udd39 Hack 2: Is `n` a Power of 2? (LC 231)\nPowers of 2 have **exactly one bit set**:\n* $4 = 100_2$\n* $8 = 1000_2$\n* $16 = 10000_2$\n\nNotice what happens when you subtract 1:\n* $8 - 1 = 7 = 0111_2$\n* $8 \\ \\& \\ 7 = 1000_2 \\ \\& \\ 0111_2 = \\mathbf{0}$!\n\n```python\ndef isPowerOfTwo(n: int) -> bool:\n    return n > 0 and (n & (n - 1)) == 0\n```\n\n---\n\n### \ud83d\udd39 Hack 3: Clear the Lowest Set Bit (Brian Kernighan's Algorithm - LC 191)\n`n & (n - 1)` always wipes out the **rightmost `1` bit** to `0`:\n\n```text\n  n     = 1 1 0 1 0 0\n  n - 1 = 1 1 0 0 1 1\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  n & (n-1) = 1 1 0 0 0 0  (Lowest 1 bit wiped out!)\n```\n\n#### Count Number of Set Bits (Hamming Weight) in $\\mathcal{O}(\\text{bits})$ time:\n```python\ndef hammingWeight(n: int) -> int:\n    count = 0\n    while n > 0:\n        n = n & (n - 1)  # Strips 1 set bit per round!\n        count += 1\n    return count\n```\n\n---\n\n### \ud83d\udd39 Hack 4: Extract the Lowest Set Bit (LSB)\nTo isolate **only** the lowest set bit and turn everything else to `0`:\n```python\nlowest_bit = n & -n\n```\n* Example: $12 = 1100_2 \\implies 12 \\ \\& \\ (-12) = 0100_2 = \\mathbf{4}$!\n* *Why it works:* Two's complement negation `-n` inverts all bits and adds 1.\n\n---\n\n### \ud83d\udd39 Hack 5: XOR Cancellation / The Duplicate Eraser (LC 136)\nThe 3 magical properties of XOR:\n1. $x \\oplus x = \\mathbf{0}$ (Any number XORed with itself vanishes!).\n2. $x \\oplus 0 = \\mathbf{x}$ (Any number XORed with 0 stays itself).\n3. Order doesn't matter: $a \\oplus b \\oplus a = (a \\oplus a) \\oplus b = 0 \\oplus b = \\mathbf{b}$.\n\n#### Find the Single Number in an array of duplicates:\n```python\ndef singleNumber(nums: list[int]) -> int:\n    res = 0\n    for num in nums:\n        res ^= num  # All duplicates destroy each other!\n    return res\n```\n\n---\n\n## \ud83c\udfaf 4. Quick Decision Matrix\n\n| What is the problem asking? | Bitwise Formula | Classic Problem |\n| :--- | :--- | :--- |\n| Accumulate stream of bits | `(ans << 1) \\| bit` | LC 1290: Convert Binary in Linked List |\n| Find single non-duplicate | `res ^= num` | LC 136: Single Number |\n| Check power of two | `n > 0 and (n & (n - 1)) == 0` | LC 231: Power of Two |\n| Count number of 1-bits | `n = n & (n - 1)` loop | LC 191: Number of 1 Bits |\n| Missing number in range `0..n` | XOR all indices and values | LC 268: Missing Number |\n| Swap two numbers without temp | `a ^= b; b ^= a; a ^= b` | Bitwise Swap |\n", "category": "cheat_sheets"}, "cheat_sheets/greedy_cheat_sheet.md": {"title": "\ud83e\udd85 The Master Guide to Greedy Algorithms: Intuition, Archetypes & The Two-Pointers Distinction", "content": "# \ud83e\udd85 The Master Guide to Greedy Algorithms: Intuition, Archetypes & The Two-Pointers Distinction\n\n> **Target Audience:** Intuitive, pattern-first problem solvers.  \n> **Rule #1:** Zero Dynamic Programming jargon. No abstract math proofs.  \n> **Rule #2:** If you can understand making change at a cash register, you understand Greedy.\n\n---\n\n## \ud83e\udded 1. What is \"Greedy\" in Plain English?\n\nImagine you are at an all-you-can-eat buffet with a 10-minute timer.\n* You don't sit down with a notebook mapping out all 50 possible dish combinations.\n* You walk up to each station and ask one selfish question: **\"What is the single best, tastiest item right in front of me right now?\"**\n* You put it on your plate, move forward, and **never put anything back**.\n\n> ### \ud83e\udde0 The Definition:\n> A **Greedy Algorithm** builds an optimal solution step-by-step by **always making the choice that looks best at that exact moment**, without ever second-guessing or backtracking.\n\n---\n\n## \u2696\ufe0f 2. The Big Confusion: Greedy vs. Two Pointers\n\nCandidates constantly confuse these two in interviews. Here is the clear distinction:\n\n| Dimension | \ud83c\udfaf Two Pointers | \ud83e\udd85 Greedy |\n|---|---|---|\n| **What is it?** | A **Mechanical Technique** (Data Structure pointer traversal). | A **Strategic Philosophy** (How you make decisions). |\n| **Pointers on Screen** | Always explicit pointers: `left`, `right`, or `slow`, `fast`. | Can be pointers, a single `for` loop variable, or sorting + priority queue. |\n| **Core Question** | *\"Which end of the array should I squeeze or advance next?\"* | *\"What is the best immediate choice right here, and can I lock it in forever?\"* |\n| **Overlap Alert!** | Many Two-Pointer problems use **Greedy Decision Rules**! (e.g., Container With Most Water). | Two Pointers is just *one way* to implement a greedy choice! |\n\n### The Container With Most Water (LC 11) Example:\n* **Two Pointers:** `left = 0`, `right = len(height) - 1`.\n* **Greedy Decision:** *\"The container's height is bottlenecked by the shorter wall. Moving the taller wall can NEVER increase water volume. Therefore, I greedily advance the shorter wall inward.\"*\n* \ud83d\udc49 **Two Pointers is the car; Greedy is the driver deciding which turn to make.**\n\n---\n\n## \ud83d\uddc2\ufe0f 3. The 4 Universal Archetypes of Greedy Problems\n\nAlmost 95% of all Greedy interview problems fall into one of these 4 practical buckets:\n\n```text\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   THE 4 GREEDY ARCHETYPES                               \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 1. The Cashier     \u2502 2. The Horizon     \u2502 3. The Interval Scheduler    \u2502\n\u2502    (Atm / Change)  \u2502    (Laser Reach)   \u2502    (Meeting Rooms)           \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 4. The Accumulator (Telescoping / Micro-Gains)                         \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n### Archetype 1: The Cashier / ATM Pattern (Largest Unit First)\n* **The Real-Life Analogy:** A customer asks for \\$87 in change. You don't give them 87 one-dollar bills. You greedily grab the biggest bill possible: one \\$50, one \\$20, one \\$10, one \\$5, and two \\$1s.\n* **The Rule:** Decompose descending from largest denomination to smallest.\n* **Classic Problems:**\n  * **LC 12: Integer to Roman** (Greedily subtract 1000, 900, 500, etc.)\n  * **Coin Change (Canonical Coins)**\n\n---\n\n### Archetype 2: The Horizon / Laser Reach Pattern (Expand the Boundary)\n* **The Real-Life Analogy:** You are hiking across stepping stones in the dark with a flashlight. As you step onto each stone, you sweep your beam forward. You don't care *which* exact step you took; you only care: **\"What is the furthest stone illuminated so far?\"**\n* **The Rule:** Track a single scalar `max_reach`. If you ever reach a stone where `i > max_reach`, you ran out of light and are stranded.\n* **Classic Problems:**\n  * **LC 55: Jump Game** (`max_reach = max(max_reach, i + nums[i])`)\n  * **LC 45: Jump Game II** (Count how many times your horizon must expand to reach the end)\n  * **LC 1024: Video Stitching**\n\n---\n\n### Archetype 3: The Interval Scheduler / Activity Chooser (Earliest Finish Time)\n* **The Real-Life Analogy:** A conference room can only host one meeting at a time. To fit the maximum number of meetings in one day, which meeting do you pick first?  \n  * *Trap:* Pick the shortest meeting? No.\n  * *Greedy Truth:* **Pick the meeting that ends earliest!** The sooner a meeting finishes, the more room you leave open for future meetings.\n* **The Rule:** Sort intervals by **end time** (`key=lambda x: x[1]`). Greedily pick the next interval whose start time $\\ge$ current finish time.\n* **Classic Problems:**\n  * **LC 435: Non-overlapping Intervals**\n  * **LC 452: Minimum Number of Arrows to Burst Balloons**\n  * **LC 252 / 253: Meeting Rooms**\n\n---\n\n### Archetype 4: The Micro-Gain Accumulator (Telescoping Sums)\n* **The Real-Life Analogy:** In a stock market with unlimited zero-fee trades, if the price goes from \\$1 $\\to$ \\$5 $\\to$ \\$10, you don't need to predict the future peak. Harvesting every upward tick (\\$5 - \\$1 = \\$4, and \\$10 - \\$5 = \\$5) naturally sums to the total valley-to-peak run (\\$9).\n* **The Rule:** If today's step is positive (`prices[i] > prices[i-1]`), greedily add it. If it's negative, ignore it.\n* **Classic Problems:**\n  * **LC 122: Best Time to Buy and Sell Stock II**\n  * **LC 134: Gas Station** (Greedily track surplus vs. deficit)\n\n---\n\n## \ud83d\udd0d 4. The 3-Second \"Is It Greedy?\" Checklist (Interview Mental Triggers)\n\nWhen an interviewer hands you a problem, how do you know if Greedy works? Run this 3-question filter:\n\n### 1. Does \"Bigger / Further / Earliest\" strictly dominate?\n* If reaching stone 10 is *always* strictly better than or equal to reaching stone 5 with zero penalty, **try Greedy**.\n\n### 2. Is there an \"Undo\" penalty?\n* Does picking an option right now prevent a completely different, secretly superior combination down the road?\n* *If NO (choices don't trap you):* **Greedy works.**\n* *If YES (taking 3 coins now prevents an optimal 2-coin answer later, like with arbitrary coin denominations [1, 3, 4] for 6):* **Greedy fails**, you need exhaustive search.\n\n### 3. Can sorting simplify the world?\n* If sorting the input by size, start time, end time, or weight makes the best immediate choice obvious, it is almost certainly a Greedy problem.\n\n---\n\n## \ud83d\udccb Summary Table for Quick Reference\n\n| Greedy Archetype | What You Track | Golden Rule |\n|---|---|---|\n| **The Cashier / ATM** | `remaining_target` | Pick the largest denomination that fits. |\n| **The Horizon** | `max_reach` | Update furthest reachable boundary; fail if `i > max_reach`. |\n| **The Scheduler** | `last_end_time` | Sort by end time; pick what finishes earliest. |\n| **The Accumulator** | `total_profit` | Grab every positive adjacent delta `curr - prev > 0`. |\n| **The Squeeze Driver** | `left`, `right` | Bottleneck rule: Move whichever pointer restricts max potential. |\n", "category": "cheat_sheets"}, "cheat_sheets/greedy_subtraction_atm_cheat_sheet.md": {"title": "\ud83c\udfe7 Greedy Subtraction (The ATM / Cashier Pattern) Master Cheat Sheet", "content": "# \ud83c\udfe7 Greedy Subtraction (The ATM / Cashier Pattern) Master Cheat Sheet\n\n> **Pattern:** Greedy Subtraction / Change-Making Decomposition  \n> **Target Audience:** Rapid interview review, mental checklist, and copy-paste templates.  \n> **Philosophy:** When converting a total into standard denominations, always greedily take the largest available piece first until you can't, then move down.\n\n---\n\n## \ud83d\udca1 1. What is the Greedy Subtraction (ATM) Pattern?\n\nInstead of converting a number into a string and doing complicated digit-by-digit place-value math (`10 ** len`), we maintain an **ordered list/mapping of standard denominations from largest to smallest**.\n\nWe greedily deduct the largest possible denomination repeatedly until the remaining balance is smaller than that denomination, then step down to the next smaller one.\n\n```text\nTarget: 3749\nAvailable Denominations: [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1]\n\nStep 1: 3749 >= 1000? YES -> take 1000 (\"M\"), remainder = 2749\nStep 2: 2749 >= 1000? YES -> take 1000 (\"M\"), remainder = 1749\nStep 3: 1749 >= 1000? YES -> take 1000 (\"M\"), remainder = 749\nStep 4:  749 >= 1000? NO  -> drop to 900\nStep 5:  749 >=  900? NO  -> drop to 500\nStep 6:  749 >=  500? YES -> take 500  (\"D\"), remainder = 249\n... and so on down to 0!\n```\n\n---\n\n## \ud83c\udfaf 2. When to Use It? (The 3-Second Mental Checklist)\n\nAsk yourself these 3 questions:\n\n1. **Am I decomposing a single quantity into standard fixed units or symbols?**  \n   *(Roman numerals, cash change, seconds to days/hours/minutes, numbers to English words).*\n2. **Is the unit system canonical (Greedy works)?**  \n   *(Taking the largest denomination immediately never prevents an optimal solution).*\n3. **Can I predefine the denominations in descending order?**  \n   *(If yes, you only need one single pass over the denominations list).*\n\n\ud83d\udc49 If all three are **YES**, use **Greedy Subtraction**.\n\n---\n\n## \ud83c\udfe7 3. Real-World Mental Models\n\n| Everyday Scenario | Denominations (Largest to Smallest) | Greedy Action |\n| :--- | :--- | :--- |\n| **ATM Dispenser** | `$100, $50, $20, $10, $5, $1` | Peel off the biggest bill that fits into remaining balance. |\n| **Time Formatter** | `86400s (Day), 3600s (Hour), 60s (Min), 1s (Sec)` | Convert big chunks first, what's left is minutes and seconds. |\n| **Metric / Storage**| `1 TB, 1 GB, 1 MB, 1 KB, 1 B` | Show highest unit without manual decimal parsing. |\n| **Roman Numerals** | `1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1` | Peel off largest Roman value or subtractive combo. |\n\n---\n\n## \ud83d\udee0\ufe0f 4. The Two Implementation Flavors\n\n### Flavor A: Repeated Subtraction (`while` loop) \u2014 *Whiteboard Favorite!* \ud83c\udfc6\nBest for interviews because it avoids math edge cases (off-by-one division bugs).\n\n```python\ndef decompose_while(num: int, denominations: dict) -> list:\n    result = []\n    for unit in denominations:\n        while num >= unit:\n            result.append(denominations[unit])\n            num -= unit\n    return result\n```\n\n* **When to use:** When each denomination is used only a few times (e.g., Roman numerals where count $\\le 3$).\n* **Advantage:** Impossible to get wrong under interview stress.\n\n---\n\n### Flavor B: Division & Modulo (`//` and `%`) \u2014 *Arithmetic 1-Step* \u26a1\nBest when the multiplier can be large (e.g., converting $987,654$ seconds into hours).\n\n```python\ndef decompose_math(num: int, denominations: list) -> list:\n    result = []\n    for unit, label in denominations:\n        if num == 0:\n            break\n        count = num // unit\n        if count > 0:\n            result.append((count, label))\n            num %= unit\n    return result\n```\n\n* **When to use:** When `num` can be huge, avoiding thousands of subtraction loops.\n* **Advantage:** Direct $\\mathcal{O}(1)$ math per denomination.\n\n---\n\n## \ud83d\udccb 5. Classic Problems in this Family\n\n| LeetCode # | Problem Name | Denomination Set | Trick / Nuance |\n| :--- | :--- | :--- | :--- |\n| **LC 12** | **Integer to Roman** | `[1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1]` | Include subtractive pairs (`900: 'CM'`, `4: 'IV'`) as standard bills! |\n| **LC 273** | **Integer to English Words** | `[10^9: \"Billion\", 10^6: \"Million\", 10^3: \"Thousand\"]` | Process in 3-digit chunks using division and recursion. |\n| **LC 322** | **Coin Change (Warning!)** | Arbitrary coin arrays (e.g., `[1, 3, 4]` for amount `6`) | \u26a0\ufe0f **Greedy FAILS** here! Must use **Dynamic Programming** ($4+1+1=3$ coins vs optimal $3+3=2$ coins). |\n\n> [!WARNING]\n> **When does the ATM Greedy logic FAIL?**  \n> Greedy only works on **canonical** coin systems (like US coins `[25, 10, 5, 1]` or Roman numerals). If an interview gives arbitrary coin values like `[1, 3, 4]` and asks for change of `6`:\n> * Greedy picks: `4 + 1 + 1` (3 coins)\n> * Optimal is: `3 + 3` (2 coins)  \n> For arbitrary coin sets, switch to **DP (Unbounded Knapsack)**!\n\n---\n\n## \u26a0\ufe0f 6. Top 3 Pitfalls to Avoid in Interviews\n\n1. **Forgetting subtractive combinations in Roman numerals:**\n   * Do NOT just store `[1000, 500, 100, 50, 10, 5, 1]`.\n   * Pre-bake `900 (\"CM\")`, `400 (\"CD\")`, `90 (\"XC\")`, `40 (\"XL\")`, `9 (\"IX\")`, `4 (\"IV\")` directly into your denomination list.\n2. **Sorting order mistake:**\n   * Denominations **MUST** be processed in descending order. If you check `1` first, a number like `5` would dispense five `1`s instead of one `5`.\n3. **Dictionary insertion order in older Python versions:**\n   * In Python 3.7+, dictionaries preserve insertion order. In languages like Java or C++, use an `Array` / `List` of pairs (`[(1000, \"M\"), (900, \"CM\"), ...]`), not an unordered hash table (`unordered_map` / `HashMap`).\n\n---\n\n## \u23f1\ufe0f 7. Complexity Blueprint\n\n* **Time Complexity:** $\\mathcal{O}(1)$ for Roman numerals (fixed 13 denominations, $\\le 15$ total loop iterations). In general, $\\mathcal{O}(D)$ where $D$ is the number of denominations.\n* **Space Complexity:** $\\mathcal{O}(1)$ auxiliary space (fixed denomination table).\n", "category": "cheat_sheets"}, "cheat_sheets/heaps_priority_queues_cheat_sheet.md": {"title": "\u26f0\ufe0f Priority Queues & Heaps Master Cheat Sheet & Decision Guide", "content": "# \u26f0\ufe0f Priority Queues & Heaps Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Binary Heap / Priority Queue  \n> **Audience:** Complete Beginner / 1st-Year CS Student  \n> **Analogy:** Hospital Emergency Room (ER) Triage\n\n---\n\n## \ud83d\udca1 1. What is a Heap / Priority Queue?\n\n* A regular **Queue (FIFO)** = A line at a ticket counter. First person to arrive is the first person served.\n* A **Priority Queue** = A hospital Emergency Room. Patients don't get seen by arrival time \u2014 the person with the **most critical condition** (highest priority) gets seen first!\n\nA **Binary Heap** is the specialized data structure behind a Priority Queue:\n* **Instant minimum (or maximum) lookup:** You can see the top element in $\\mathcal{O}(1)$ time.\n* **Fast insert & remove:** Adding an element or removing the top element takes only **$\\mathcal{O}(\\log n)$** time.\n\n---\n\n## \ud83d\udc0d 2. Heaps in Python (`import heapq`)\n\nPython's built-in `heapq` module creates a **Min-Heap by default**:\n* The **smallest** number always sits at index 0 (`heap[0]`).\n* `heapq.heappush(heap, val)` $\\to$ Inserts `val` in $\\mathcal{O}(\\log n)$.\n* `heapq.heappop(heap)` $\\to$ Pops and returns the **smallest** item in $\\mathcal{O}(\\log n)$.\n\n```python\nimport heapq\n\nmin_heap = []\nheapq.heappush(min_heap, 10)\nheapq.heappush(min_heap, 2)\nheapq.heappush(min_heap, 8)\n\nprint(min_heap[0])  # Output: 2 (Always the smallest!)\nprint(heapq.heappop(min_heap))  # Returns 2, and heap re-balances!\n```\n\n### \ud83d\udca1 Trick: How to make a Max-Heap in Python?\nSince Python only has a min-heap, multiply numbers by `-1` before pushing, and multiply by `-1` when popping:\n```python\nheapq.heappush(max_heap, -num)\nlargest = -heapq.heappop(max_heap)\n```\n\n---\n\n## \ud83c\udfc6 3. The Classic \"Top K Elements\" Pattern\n\n### Why not just sort the array?\n* Sorting the whole array takes $\\mathcal{O}(n \\log n)$ time.\n* Using a Heap of size $K$ takes only **$\\mathcal{O}(n \\log k)$** time and $\\mathcal{O}(k)$ space. When $k \\ll n$ (e.g., finding Top 10 out of 1,000,000 items), a heap is thousands of times faster!\n\n---\n\n### \ud83d\udd11 The Counter-Intuitive Rule:\n> * **To find the $K$ LARGEST elements:** Keep a **MIN-HEAP** of size $K$.  \n>   *(The smallest of your top candidates sits at the top. Whenever a bigger number comes along, you pop the top loser off!)*\n> * **To find the $K$ SMALLEST elements:** Keep a **MAX-HEAP** of size $K$.\n\n#### \u2699\ufe0f Top K Largest Template (e.g. *Kth Largest Element in an Array* - LC 215)\n```python\nimport heapq\n\ndef findKthLargest(nums: list[int], k: int) -> int:\n    min_heap = []\n    \n    for num in nums:\n        heapq.heappush(min_heap, num)\n        \n        # If heap exceeds size k, evict the smallest element!\n        if len(min_heap) > k:\n            heapq.heappop(min_heap)\n            \n    # The top of the heap is now the Kth largest element!\n    return min_heap[0]\n```\n\n---\n\n## \ud83c\udfaf 4. When to Use a Heap (Cheat Sheet Triggers)\n\nAsk yourself:\n1. Does the problem ask for **\"Top K elements\"**, **\"Kth smallest/largest\"**, or **\"K closest points\"**?\n2. Are you merging multiple sorted lists into one (*Merge K Sorted Lists* - LC 23)?\n3. Do you need to continuously calculate the **Median** of a dynamic stream of numbers (*Find Median from Data Stream* - LC 295)?\n\n\ud83d\udc49 Use a **Heap**!\n", "category": "cheat_sheets"}, "cheat_sheets/kadanes_algorithm_cheat_sheet.md": {"title": "\ud83d\udcc8 Kadane's Algorithm Master Cheat Sheet & Decision Guide", "content": "# \ud83d\udcc8 Kadane's Algorithm Master Cheat Sheet & Decision Guide\n\n> **Pattern:** Dynamic Programming / Greedy Prefix Reset (Kadane's Algorithm)  \n> **Target Audience:** Complete Beginner / 1st-Year CS Student  \n> **The Big Idea:** Contiguous subarray optimization in $\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space.  \n> **Core Analogy:** Declaring bankruptcy on \"Toxic Debt\".\n\n---\n\n## \ud83d\udca1 1. What Problem Does It Solve?\n\n> **The Problem:** Given an array of numbers containing both positive and negative values, find the **contiguous subarray** (an unbroken slice) that yields the **largest possible sum**.\n> \n> * **LeetCode 53: Maximum Subarray**  \n> * Example: `[-2, 1, -3, 4, -1, 2, 1, -5, 4]` $\\implies$ Max sum is **6** (from subarray `[4, -1, 2, 1]`).\n\n* **Brute Force:** Checking all pairs `(i, j)` and calculating their sums takes **$\\mathcal{O}(n^2)$** time.\n* **Kadane's Algorithm:** Solves it in a **single pass** in **$\\mathcal{O}(n)$ time** and **$\\mathcal{O}(1)$ space**.\n\n---\n\n## \ud83d\udcb8 2. The Core Intuition: The \"Toxic Debt\" Analogy\n\nImagine you are walking down a street collecting cash bags (positive numbers) and bills/debt (negative numbers):\n* **Positive numbers (`+$`):** Valuable assets. Keep them!\n* **Negative numbers (`-$`):** Debts/losses. They hurt your total.\n\nAs you walk, you track your running wallet balance (`current_sum`):\n* If your past streak has a **positive balance** (e.g., `+5`), it can help boost future numbers. Keep carrying it forward!\n* But if your past streak drops **below 0** (e.g., `-3`), it has become **toxic debt**:\n  * If you carry a debt of `-3` into a new number `+4`, your total becomes $4 - 3 = 1$.\n  * If you had simply **thrown away the past debt**, you would have **$4$**!\n\n> \ud83d\udca1 **The Golden Rule of Kadane:**  \n> **\"Never carry negative debt forward. The moment your running sum drops below 0, declare bankruptcy, discard the past, and start a fresh streak right here!\"**\n\n---\n\n## \ud83c\udfaf 3. When to Use Kadane? (The 3-Second Mental Radar)\n\nLook for these **3 unmistakable clues** in the problem prompt:\n\n```text\nClue 1: \"Contiguous Subarray\"  (Elements must be unbroken neighbors)\n            +\nClue 2: Array has NEGATIVE numbers (Penalties / Losses)\n            +\nClue 3: Asking for \"Maximum Sum\", \"Maximum Score\", or \"Best Profit\"\n            \u2502\n            \u25bc\n   \ud83d\udea8 100% KADANE'S ALGORITHM! \ud83d\udea8\n```\n\n> \ud83d\udca1 **The Dead Giveaway:**  \n> If an array had **only positive numbers**, the maximum subarray would trivially be the **entire array**!  \n> The only reason this problem exists is because **negative numbers act as penalties**.\n\n---\n\n## \u2753 4. Why Kadane? (Why Other Patterns Fail Here)\n\n| Pattern | Why It Doesn't Work Here |\n|---|---|\n| **Two Pointers (The Squeeze)** | Requires a **sorted array** so pointers know whether moving `left` or `right` increases or decreases the sum. But here, the array is unsorted and sorting it scrambles the contiguous order! |\n| **Sliding Window** | Sliding window shrinks `left` **one element at a time** (`left += 1`). But in Kadane, once a sum is negative, you don't shrink by 1 \u2014 **you instantly dump the entire past window!** |\n| **Prefix Sums** | Works, but requires building an auxiliary array and tracking minimums. Kadane accomplishes the same thing on the fly with **$\\mathcal{O}(1)$ memory**. |\n\n---\n\n## \ud83c\udf9b\ufe0f 5. The 1-Line Question Kadane Asks at Every Element\n\nAt every single number, you make an easy choice:\n> *\"Should I **add this number to my past streak**, OR **ditch the past and start a brand new streak** with just this number?\"*\n\n$$\\text{current\\_sum} = \\max(\\text{num}, \\text{current\\_sum} + \\text{num})$$\n$$\\text{max\\_sum} = \\max(\\text{max\\_sum}, \\text{current\\_sum})$$\n\n---\n\n## \ud83d\udd0d 6. Step-by-Step Frame Trace (Visual Proof)\n\nArray: `[-2, 1, -3, 4, -1, 2, 1, -5, 4]`\n\n| Step | Num | Past Streak + Num | Or Start Fresh (Num)? | `current_sum` | `max_so_far` | Action Taken |\n|:---:|:---:|:---:|:---:|:---:|:---:|:---|\n| 0 | `-2` | \u2014 | `-2` | **`-2`** | **`-2`** | Start at first element |\n| 1 | `1` | $-2 + 1 = -1$ | `1` | **`1`** | **`1`** | Ditched `-2` debt! Started fresh with `1` |\n| 2 | `-3` | $1 + (-3) = -2$ | `-3` | **`-2`** | **`1`** | Running sum dipped negative |\n| 3 | `4` | $-2 + 4 = 2$ | `4` | **`4`** | **`4`** | Ditched `-2` debt! Started fresh with `4` |\n| 4 | `-1` | $4 + (-1) = 3$ | `-1` | **`3`** | **`4`** | Kept streak (still positive) |\n| 5 | `2` | $3 + 2 = 5$ | `2` | **`5`** | **`5`** | New record high! \ud83c\udf89 |\n| 6 | `1` | $5 + 1 = 6$ | `1` | **`6`** | **`6`** | New record high! \ud83c\udfc6 |\n| 7 | `-5` | $6 + (-5) = 1$ | `-5` | **`1`** | **`6`** | Kept streak (still positive) |\n| 8 | `4` | $1 + 4 = 5$ | `4` | **`5`** | **`6`** | Finished! Max answer is **6** |\n\n---\n\n## \ud83d\udcbb 7. The Standard Clean Python 3 Code\n\n```python\nclass Solution:\n    def maxSubArray(self, nums: list[int]) -> int:\n        current_sum = nums[0]\n        max_sum = nums[0]\n        \n        for num in nums[1:]:\n            # Choice: Extend previous streak, or start fresh from 'num'\n            current_sum = max(num, current_sum + num)\n            # Update the best answer seen so far\n            max_sum = max(max_sum, current_sum)\n            \n        return max_sum\n```\n\n---\n\n## \u26a0\ufe0f 8. The Classic Interview Trap: All Negative Numbers\n\nWhat if the input is all negative numbers, like `nums = [-5, -2, -8]`?\n* The correct answer is **`-2`** (the single least-negative number).\n* **\u274c The Common Bug:** Initializing `max_sum = 0`.  \n  If you do that, your code will return `0`, which is **wrong** because `0` is not even in the array!\n* **\u2705 The Fix:** Always initialize both `current_sum` and `max_sum` to `nums[0]` (or `float('-inf')`).\n\n---\n\n## \ud83d\uddc2\ufe0f 9. The 4 Problem Archetypes That Use Kadane\n\n| Archetype | Problem | Kadane Application |\n|---|---|---|\n| **1. Classic Max Subarray** | LC 53: Maximum Subarray | Pure standard template. |\n| **2. Daily Differences / Stock Profit** | LC 121: Best Time to Buy & Sell Stock | Convert prices to daily differences (`prices[i] - prices[i-1]`), then run Kadane! |\n| **3. Circular Subarray** | LC 918: Maximum Sum Circular Subarray | `max(Kadane(Max Subarray), Total_Sum - Kadane(Min Subarray))`. |\n| **4. Maximum Product Subarray** | LC 152: Maximum Product Subarray | Track both `max_prod` and `min_prod` because negative $\\times$ negative = positive. |\n\n---\n\n## \ud83e\udde0 10. The Golden Rule to Remember Forever\n> **\"When looking for an optimal contiguous subarray among negative penalties: never carry debt. Accumulate positive gains, and drop the past the second your streak falls below zero.\"**\n", "category": "cheat_sheets"}, "cheat_sheets/linked_list_master_cheat_sheet.md": {"title": "\ud83d\udd17 Linked List Master Cheat Sheet: The Intuitive Guide", "content": "# \ud83d\udd17 Linked List Master Cheat Sheet: The Intuitive Guide\n\n> **Target Audience:** Anyone who finds Linked Lists abstract or confusing.  \n> **Philosophy:** A Linked List is NOT an array. It is a **treasure hunt of nested boxes**. Once you see the physical picture, the code writes itself.  \n> \ud83d\uddfa\ufe0f **Full LeetCode Taxonomy:** Looking for the comprehensive 11-type classification of 90%+ of all interview questions? See **[The 90% Linked List Master Taxonomy Guide](./linked_list_90_percent_taxonomy.md)**.\n\n---\n\n## \ud83d\udce6 1. What IS a Linked List? (The Russian Nesting Doll)\n\nIn an **array** `[10, 20, 30]`, items sit side-by-side like a row of houses on the same street. That's why you can jump to `arr[2]` instantly ($\\mathcal{O}(1)$).\n\nA **Linked List** is completely different. It is a chain of **Russian nesting dolls**:\n\n```python\n# A linked list with values: 10 -> 20 -> 30 -> None\n# In Python's memory, it is literally:\nListNode(val=10, next=ListNode(val=20, next=ListNode(val=30, next=None)))\n```\n\n```text\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502     val: 10     \u2502\n\u2502  next: \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u25ba \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518        \u2502     val: 20     \u2502\n                           \u2502  next: \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u25ba \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                           \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518        \u2502     val: 30     \u2502\n                                                      \u2502  next: None     \u2502\n                                                      \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n* Node `10` holds a pointer (`.next`) to Node `20`.\n* Node `20` holds a pointer (`.next`) to Node `30`.\n* Node `30` points to `None` (the end of the chain!).\n\n> \u26a0\ufe0f **The #1 Confusion:**  \n> Why does `len(head)` crash?  \n> Because a linked list node does **not** know how many nodes follow it! It only knows its own value and the next box. Finding the length requires walking every node ($\\mathcal{O}(n)$).\n\n---\n\n## \ud83d\udee1\ufe0f 2. The Anchor & Hand Pattern (`dummy` vs `cur`)\n\nWhenever you build a new linked list, you will always see:\n```python\ndummy = ListNode()\ncur = dummy\n```\n\nHere is the exact physical mental model to never get confused again:\n\n```text\n       [ DUMMY ] (The Coat Rack: fixed to the wall, never moves)\n           \u2502\n           \u2502 .next\n           \u25bc\n        [  1  ] \u2500\u2500\u25ba [  2  ] \u2500\u2500\u25ba [  4  ] \u2500\u2500\u25ba None\n           \u25b2\n          cur   (Your Hand: walks to the very end of the chain)\n```\n\n| Variable | What It Represents | Does It Move? | Why It Exists |\n| :--- | :--- | :---: | :--- |\n| **`dummy`** | **The Coat Rack** | \u274c **NEVER MOVES** | Glued to the start so you never lose the head of your list. |\n| **`cur`** | **Your Hand** | \u2705 **MOVES FORWARD** | Steps to the end of the chain (`cur = cur.next`) so the next item attaches to the tail, NOT the front! |\n| **`dummy.next`**| **The First Real Item** | - | Skips the fake coat rack `[ 0 ]` and returns the true result! |\n\n### \ud83c\udfaf The 2-Second Return Rule: `return dummy.next` vs `return head`\nAsk yourself **one simple question** at the end of your function:\n> *\"Is the starting node pointed to by this variable a **FAKE placeholder node I created**, or a **REAL node from the input**?\"*\n\n```text\nCase A: You created a fake anchor          Case B: You modified an existing list\n        dummy = ListNode(0)                         cur = head\n\n            dummy                                       head\n              \u2502                                           \u2502\n              \u25bc                                           \u25bc\n            [ 0 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba [ 2 ]                   [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 3 ]\n            (Fake)      \u25b2                                 \u25b2\n                        \u2502                                 \u2502\n           \ud83d\udc49 return dummy.next                       \ud83d\udc49 return head\n         (Throw away the fake [0]!)                  (Keep the real starting node!)\n```\n\n* **Use `return dummy.next`** when: You constructed a new list or merged lists using `dummy = ListNode()`. Skipping `dummy` removes the fake `[0]` placeholder.\n* **Use `return head`** when: You modified the list in-place (like `deleteDuplicates`) where `head` was already the first legitimate node. Returning `head.next` would accidentally chop off the first real number!\n\n---\n\n## \ud83c\udfac 3. The 6 Universal Linked List Patterns\n\n### \ud83d\udd39 Pattern 1: The Zipper Merge (LC 21)\n* **What it does:** Combines two sorted lines into one single sorted line.\n* **Analogy:** Picking the shorter student at the front of two lines.\n\n```text\nlist1: [ 1 ] \u2500\u2500\u25ba [ 4 ]\nlist2: [ 2 ] \u2500\u2500\u25ba [ 3 ]\n\ndummy \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 4 ]\n```\n\n```python\ndef mergeTwoLists(list1, list2):\n    dummy = ListNode()\n    cur = dummy\n    \n    while list1 and list2:\n        if list1.val <= list2.val:\n            cur.next = list1\n            list1 = list1.next\n        else:\n            cur.next = list2\n            list2 = list2.next\n        cur = cur.next\n        \n    cur.next = list1 if list1 else list2\n    return dummy.next\n```\n\n---\n\n### \ud83d\udd39 Pattern 2: In-Place Arrow Reversal (LC 206)\n* **What it does:** Reverses every arrow in-place without allocating any new nodes ($\\mathcal{O}(n)$ time, $\\mathcal{O}(1)$ space).\n* **The Analogy:** **The Preschool Children Conga Line** \ud83c\udf92\n  * A line of children holding each other's backpacks: `[ Alice ] \u2500\u2500\u25ba [ Bob ] \u2500\u2500\u25ba [ Charlie ] \u2500\u2500\u25ba None`.\n  * The teacher says: *\"Turn around! Charlie at the front, Alice at the back!\"*\n  * **The Danger:** If Bob lets go of Charlie without a spotter, **Charlie runs away and gets lost!**\n\n#### The 3 Roles:\n1. **`prev` (Person Behind You):** Starts at `None` (empty air behind Alice).\n2. **`curr` (Person Turning Around):** Starts at `head` (Alice).\n3. **`nxt` (Teacher's Spotter Hand):** Taps the child in front and says: *\"Freeze! Hold on while the person behind you turns around!\"*\n\n```text\nROUND 1 (Alice turns around):\n  prev     curr        nxt\n   \u2502        \u2502           \u2502\n   \u25bc        \u25bc           \u25bc\n  None   [ Alice ] \u2500\u2500\u25ba [ Bob ] \u2500\u2500\u25ba [ Charlie ]\n\nBeat 1: nxt = curr.next    -> Teacher holds Bob!\nBeat 2: curr.next = prev   -> Alice lets go of Bob and grabs None (behind her).\nBeat 3: prev = curr        -> Slide prev to Alice.\nBeat 4: curr = nxt         -> Slide curr to Bob.\n\nNone \u25c4\u2500\u2500 [ Alice ]   [ Bob ] \u2500\u2500\u25ba [ Charlie ]\n           \u25b2           \u25b2\n          prev        curr\n```\n\n```python\ndef reverseList(head: ListNode | None) -> ListNode | None:\n    prev = None\n    curr = head\n    \n    while curr:\n        nxt = curr.next     # 1. SPOTTER: Hold child in front so they don't run away!\n        curr.next = prev    # 2. TURN AROUND: Grab backpack of person behind you!\n        prev = curr         # 3. ADVANCE PREV: You are now the person \"behind\" for next round!\n        curr = nxt          # 4. ADVANCE CURR: Next child's turn to turn around!\n        \n    return prev             # prev is holding Charlie (the NEW FRONT of the line!)\n```\n\n#### \u2753 Why `return prev`? Why not `return curr` or `curr.next`?\n* **Why NOT `return curr`?** The loop only terminates when `curr` becomes **`None`**! Returning `curr` returns empty `[]`!\n* **Why NOT `return curr.next`?** `None.next` raises `AttributeError: 'NoneType' has no attribute 'next'`! \ud83d\udca5\n* **Why `return prev`?** When `curr` falls into `None`, `prev` is standing on the **very last node** (the new head of the line!).\n* **Why `while curr:` instead of `while curr and curr.next:`?** `while curr.next` stops early on the last node, meaning the last node never turns around!\n\n\ud83d\udc49 *See full breakdown and visual comic in [`206_reverse_linked_list.md`](./206_reverse_linked_list.md).*\n\n---\n\n### \ud83d\udd39 Pattern 3: Tortoise & Hare (Fast & Slow Pointers)\n* **What it does:** Finds the middle node (LC 876) or detects cycles (LC 141) in a single pass without knowing the length!\n* **Analogy:** Two runners on a track. Slow runs 1 step pe
