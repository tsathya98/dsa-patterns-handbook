tern:** Linked List In-Place Arrow Reversal (The Conga Line 4-Beat Dance)  \n> **LeetCode Link:** [LeetCode 206: Reverse Linked List](https://leetcode.com/problems/reverse-linked-list/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven the `head` of a singly linked list, reverse the list, and return the reversed list's head.\n\n```text\nInput:  [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba [ 5 ] \u2500\u2500\u25ba None\nOutput: [ 5 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba None\n```\n\n---\n\n## \ud83c\udf92 The \"Aha!\" Mental Model: The Preschool Conga Line\n\nImagine 3 children walking in a line holding onto each other's backpacks:\n* Alice (1) holds Bob (2)'s backpack.\n* Bob (2) holds Charlie (3)'s backpack.\n* Charlie (3) holds nothing (`None` / empty air).\n\n```text\n               (holds)                   (holds)\n  [ Alice ] \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ Bob ] \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ Charlie ] \u2500\u2500\u25ba None\n```\n\n**Teacher's Command:**  \n> *\"Turn around! Charlie at the front, Alice at the back!\"*\n\n### \u26a0\ufe0f The Disaster Trap:\nIf Bob turns around and lets go of Charlie without someone holding Charlie:  \n**Charlie will walk away and get lost forever!** (The rest of the list is lost in memory).\n\n---\n\n## \ud83d\udee1\ufe0f The 3 Roles & The 4-Beat Dance\n\n1. **`prev` (Person Behind You):** Starts at `None` (empty air behind Alice).\n2. **`cur` (Person Currently Turning Around):** Starts at `head` (Alice).\n3. **`nxt` (Teacher's Spotter Hand):** Holds the child in front so they don't run off before `cur` turns around!\n\n```text\nROUND 1 (Alice turns around):\n  prev     cur         nxt\n   \u2502        \u2502           \u2502\n   \u25bc        \u25bc           \u25bc\n  None   [ Alice ] \u2500\u2500\u25ba [ Bob ] \u2500\u2500\u25ba [ Charlie ] \u2500\u2500\u25ba None\n\nBeat 1: nxt = cur.next    -> Teacher holds Bob!\nBeat 2: cur.next = prev   -> Alice lets go of Bob and grabs None (behind her).\nBeat 3: prev = cur        -> Alice is now the person \"behind\" for next round.\nBeat 4: cur = nxt         -> Next child's turn to turn around (cur moves to Bob).\n\nNone \u25c4\u2500\u2500 [ Alice ]   [ Bob ] \u2500\u2500\u25ba [ Charlie ] \u2500\u2500\u25ba None\n           \u25b2           \u25b2\n          prev        cur\n```\n\nRepeat this exact 4-beat rhythm for every single child!\n\n---\n\n## \u2753 The Big Questions Answered\n\n### 1. \"Why `while cur:` and NOT `while cur and cur.next:`?\"\n* If you write `while cur and cur.next:`, the moment `cur` reaches Charlie (the last child), `cur.next` is `None`!\n* The loop stops early! **Charlie never turns around!**\n* Using `while cur:` ensures **every child** turns around, and the loop stops only when `cur` steps off the end into `None`.\n\n### 2. \"Why `return prev`? Why can't we return `cur` or `cur.next`?\"\n* **Why NOT `return cur`?**  \n  The loop terminates precisely when `cur` becomes **`None`**! Returning `cur` returns an empty list `[]`!\n* **Why NOT `return cur.next`?**  \n  Since `cur` is `None`, calling `cur.next` crashes with:  \n  `AttributeError: 'NoneType' object has no attribute 'next'` \ud83d\udca5\n* **Why `return prev`?**  \n  Look at where `prev` is standing when `cur` steps into `None`:  \n  **`prev` is standing right on Charlie (Node 3)** \u2014 the **new front of the line**!\n\n```text\n                                        prev            cur\n                                         \u2502               \u2502\n                                         \u25bc               \u25bc\nNone \u25c4\u2500\u2500 [ Alice ] \u25c4\u2500\u2500 [ Bob ] \u25c4\u2500\u2500 [ Charlie ]        [ None ]\n                                         \u25b2\n                                 THIS IS YOUR NEW HEAD!\n```\n\n---\n\n## \ud83d\udcbb The Clean Code (Every Line Explained)\n\n```python\n# Definition for singly-linked list.\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\n\nclass Solution:\n    def reverseList(self, head: ListNode | None) -> ListNode | None:\n        prev = None\n        cur = head\n        \n        while cur:\n            nxt = cur.next     # Beat 1 (Spotter): Hold child in front\n            cur.next = prev    # Beat 2 (Turn Around): Grab person behind\n            prev = cur         # Beat 3 (Slide Prev): You are now the person behind\n            cur = nxt          # Beat 4 (Slide Cur): Next child's turn\n            \n        return prev            # prev is standing on the new front node!\n```\n\n---\n\n## \u23f1\ufe0f Complexity Blueprint\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 exactly one pass through the $n$ nodes.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 modified strictly in-place; zero new memory allocated.\n", "category": "02_linked_lists"}, "02_linked_lists/21_merge_two_sorted_lists.md": {"title": "\ud83e\udea2 LeetCode 21: Merge Two Sorted Lists \u2013 The \"No-Jargon\" Guide", "content": "# \ud83e\udea2 LeetCode 21: Merge Two Sorted Lists \u2013 The \"No-Jargon\" Guide\n\n> **Target Audience:** Complete beginner / 1st-year CS student  \n> **Difficulty:** Easy  \n> **LeetCode Link:** [LeetCode 21: Merge Two Sorted Lists](https://leetcode.com/problems/merge-two-sorted-lists/)\n\n---\n\n## \ud83d\udca1 The Big Picture: What Are We Actually Doing?\n\nImagine two lines of students waiting to enter a cafeteria, both already standing in order of height:\n\n```text\nLine 1: [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba None\nLine 2: [ 1 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba None\n```\n\nYour job is to **zipper them together into ONE single line**, from shortest to tallest:\n\n```text\nMerged: [ 1 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba None\n```\n\n> **The Golden Rule:**  \n> You do **NOT** create new students (no `ListNode(val)` calls).  \n> You simply untie the ropes (`.next`) and re-tie them in sorted order!\n\n---\n\n## \ud83e\udde0 The \"Aha!\" Moment: Why Do We Need `dummy` AND `cur`?\n\nThis is where almost every beginner gets stuck. Let's break it down with a physical analogy.\n\n### \ud83e\udde5 Analogy: The Coat Rack and Your Hand\n\nImagine you are hanging coats on a wall:\n\n1. **`dummy` is the Coat Rack on the wall:**\n   * It is bolted to the wall. **It NEVER moves.**\n   * Why do you need it? Because at the very start, you don't know whose coat is first! The coat rack holds the whole chain so it doesn't fall onto the floor.\n\n2. **`cur` is YOUR HAND:**\n   * Your hand grabs the shortest coat and hooks it on.\n   * Then your hand **steps forward** to the bottom of that coat, ready to attach the next one!\n\n---\n\n## \ud83c\udfac Step-by-Step Visual Comic: Watching `dummy` and `cur` in Action\n\nLet's merge `list1 = [1, 4]` and `list2 = [2, 3]`:\n\n---\n\n### \ud83d\udccd START: Place the Coat Rack (`dummy`) and put your hand on it (`cur`)\n\n```text\ndummy\n  \u2502\n  \u25bc\n[ 0 ] \u2500\u2500\u25ba None\n  \u25b2\n cur (Your hand starts on dummy)\n```\n\n---\n\n### \ud83d\udccd ROUND 1: Compare `list1` (1) vs `list2` (2)\n* Who is smaller? `1` is smaller!\n* **Action 1:** `cur.next = list1`  *(Your hand hooks [1] onto the rack)*\n* **Action 2:** `list1 = list1.next` *(Line 1 advances to [4])*\n* **Action 3:** `cur = cur.next` *(Your hand moves to [1])*\n\n```text\ndummy\n  \u2502\n  \u25bc\n[ 0 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba None\n                \u25b2\n               cur (Your hand is now here!)\n\nLine 1 is now at: [ 4 ]\nLine 2 is now at: [ 2 ] \u2500\u2500\u25ba [ 3 ]\n```\n\n---\n\n### \ud83d\udccd ROUND 2: Compare `list1` (4) vs `list2` (2)\n* Who is smaller? `2` is smaller!\n* **Action 1:** `cur.next = list2`  *(Hook [2] onto [1])*\n* **Action 2:** `list2 = list2.next` *(Line 2 advances to [3])*\n* **Action 3:** `cur = cur.next` *(Your hand moves to [2])*\n\n```text\ndummy\n  \u2502\n  \u25bc\n[ 0 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 1 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba None\n                              \u25b2\n                             cur (Hand moves to the tail!)\n\nLine 1 is now at: [ 4 ]\nLine 2 is now at: [ 3 ]\n```\n\n---\n\n### \ud83d\udccd ROUND 3: Compare `list1` (4) vs `list2` (3)\n* Who is smaller? `3` is smaller!\n* **Action 1:** `cur.next = list2`  *(Hook [3] onto [2])*\n* **Action 2:** `list2 = list2.next` *(Line 2 is now empty: `None`!)*\n* **Action 3:** `cur = cur.next` *(Your hand moves to [3])*\n\n```text\ndummy\n  \u2502\n  \u25bc\n[ 0 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 1 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u25ba None\n                                            \u25b2\n                                           cur (Hand at the tail)\n\nLine 1 is now at: [ 4 ]\nLine 2 is now:    EMPTY (None)\n```\n\n---\n\n### \ud83d\udccd FINISH: One line is empty! Attach the rest in 1 step!\nThe `while` loop stops because `list2` ran out of people.  \nWho is left? Node `[ 4 ]` in `list1`!\n\n* **Action:** `cur.next = list1`  *(Hook the rest of Line 1 directly onto [3])*\n\n```text\ndummy\n  \u2502\n  \u25bc\n[ 0 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 1 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 2 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 3 ] \u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 4 ] \u2500\u2500\u25ba None\n  \u25b2             \u25b2\ndummy       dummy.next\n(Fake hook)  (REAL START OF YOUR CHAIN!)\n```\n\n---\n\n## \u2753 The Million Dollar Question: Why `return dummy.next`?\n\nLook at the drawing above one more time:\n\n* If you return `dummy`, you are handing the teacher the **coat rack `[ 0 ]`**!  \n  Your answer will be: `[0, 1, 2, 3, 4]`. \u274c *(WRONG! Where did that 0 come from?)*\n* If you return `dummy.next`, you skip the coat rack and hand the teacher the **first real student `[ 1 ]`**!  \n  Your answer will be: `[1, 2, 3, 4]`. \u2705 *(PERFECT!)*\n\n---\n\n## \ud83d\udcbb The Clean Code (Every Line Explained)\n\n```python\n# Definition for singly-linked list.\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\n\nclass Solution:\n    def mergeTwoLists(self, list1: ListNode | None, list2: ListNode | None) -> ListNode | None:\n        # 1. The coat rack (dummy) and your hand (cur)\n        dummy = ListNode()\n        cur = dummy\n        \n        # 2. While BOTH lines have students waiting:\n        while list1 and list2:\n            if list1.val <= list2.val:\n                cur.next = list1       # Stitch student from Line 1\n                list1 = list1.next     # Advance Line 1\n            else:\n                cur.next = list2       # Stitch student from Line 2\n                list2 = list2.next     # Advance Line 2\n                \n            cur = cur.next             # Move your hand to the new end of the line!\n            \n        # 3. One line ran out! Stitch whoever is left over in ONE move:\n        if list1:\n            cur.next = list1\n        else:\n            cur.next = list2\n            \n        # 4. Skip the fake coat rack and return the first real student!\n        return dummy.next\n```\n\n---\n\n## \u26a0\ufe0f The 3 Traps That Confuse Beginners\n\n| Trap | What Happens | The Simple Fix |\n| :--- | :--- | :--- |\n| **`cur.next = list1.val`** | `.val` is just a number (like `4`), but `.next` expects a whole Node box! Next time you do `cur.next`, it crashes. | **Write `cur.next = list1`** (grab the whole student, not their badge number). |\n| **`while list1 or list2:`** | If one list finishes early, trying to check `list1.val` on an empty list crashes with `AttributeError`. | **Write `while list1 and list2:`** (only compare when both lines are alive). |\n| **`return dummy`** | Adds a random `0` at the very front of your merged answer. | **Write `return dummy.next`** (skips the fake hook). |\n\n---\n\n## \u23f1\ufe0f How Fast Is This?\n\n* **Time:** $\\mathcal{O}(n + m)$ \u2014 You only look at each student once. Lightning fast!\n* **Space:** $\\mathcal{O}(1)$ \u2014 You didn't buy any new boxes; you just reconnected the existing arrows.\n", "category": "02_linked_lists"}, "02_linked_lists/234_palindrome_linked_list.md": {"title": "\ud83e\ude9e LeetCode 234: Palindrome Linked List \u2013 Master Guide", "content": "# \ud83e\ude9e LeetCode 234: Palindrome Linked List \u2013 Master Guide\n\n> **Difficulty:** Easy / Medium Follow-Up  \n> **Study Plan:** LeetCode 75 / Top Interview 150 / NeetCode 150  \n> **Pattern:** Two Pointers Squeeze vs. In-Place \"Triple Crown\" (Fast/Slow Mid + In-Place Reversal)  \n> **LeetCode Link:** [LeetCode 234: Palindrome Linked List](https://leetcode.com/problems/palindrome-linked-list/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven the `head` of a singly linked list, return `True` if it is a palindrome (reads the exact same forwards and backwards), or `False` otherwise.\n\n```text\nExample 1:\nInput:  [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba None\nOutput: True\n\nExample 2:\nInput:  [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba None\nOutput: False\n```\n\n---\n\n## \u2696\ufe0f \"Is Converting to an Array FAANG-Worthy?\"\n\n### The Honest Interview Reality\n\nYour solution:\n```python\ncur = head\nlst = []\nwhile cur:\n    lst.append(cur.val)\n    cur = cur.next\n\nl = 0\nr = len(lst) - 1\nwhile l < r:\n    if lst[l] != lst[r]:\n        return False\n    l += 1\n    r -= 1\nreturn True\n```\n\n* **As an initial / baseline answer:** **YES (7.5 / 10).**  \n  In any top-tier interview (Google, Meta, Amazon), throwing this down in the first 2 minutes is fantastic. It demonstrates that you can quickly produce a clean, bug-free $\\mathcal{O}(n)$ time solution without getting flustered.\n* **As your final answer:** **NO (3 / 10).**  \n  Why? Because LeetCode and FAANG interviewers specifically ask:  \n  > *\"Follow up: Could you do it in $\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space?\"*  \n  Converting to an array bypasses the core challenge of linked lists: **in-place pointer manipulation without allocating extra RAM.**\n\n---\n\n### \ud83e\udd4a Squeeze (`l < r`) vs Python Slicing (`lst == lst[::-1]`)\n\nEven inside the array approach, **Two Pointers Squeeze dominates slicing**:\n\n| Feature | Slicing: `lst == lst[::-1]` | Two Pointers Squeeze: `l < r` | Why it Matters in Interviews |\n| :--- | :--- | :--- | :--- |\n| **Auxiliary Memory** | **$\\mathcal{O}(n)$** (creates a duplicate copy of the entire list) | **$\\mathcal{O}(1)$** (stores only two integer numbers `l` and `r`) | No wasted RAM or OOM errors on huge datasets. |\n| **Early Exit on Mismatch** | **Always $\\mathcal{O}(n)$** (blindly reverses the entire array first) | **$\\mathcal{O}(1)$ instant exit** (stops on step 1 if outer elements mismatch) | **$1,685\\times$ faster** on non-palindromes with early mismatch. |\n| **Interview Signal** | Looks like a Python language shortcut | Proves you master pointer mechanics & boundary invariants | Shows strong algorithmic foundation. |\n\n---\n\n## \ud83d\udc51 Approach 1: Dump to Array + Two Pointers Squeeze ($\\mathcal{O}(n)$ Time, $\\mathcal{O}(n)$ Space)\n\n### How It Works:\n1. Walk the linked list from `head` to `None`, appending each value to `lst = []`.\n2. Place `l = 0` and `r = len(lst) - 1`.\n3. Squeeze inward: if `lst[l] != lst[r]`, immediately short-circuit with `False`.\n4. If pointers cross without mismatch, return `True`.\n\n```python\nclass Solution:\n    def isPalindrome(self, head: Optional[ListNode]) -> bool:\n        lst = []\n        cur = head\n        while cur:\n            lst.append(cur.val)\n            cur = cur.next\n\n        l = 0\n        r = len(lst) - 1\n        while l < r:\n            if lst[l] != lst[r]:\n                return False  # Early exit!\n            l += 1\n            r -= 1\n        return True\n```\n\n---\n\n## \ud83c\udfc6 Approach 2: The FAANG In-Place \"Triple Crown\" ($\\mathcal{O}(n)$ Time, $\\mathcal{O}(1)$ Space)\n\nTo achieve **$\\mathcal{O}(1)$ auxiliary space**, we cannot allocate an array. We must manipulate the linked list directly using 3 modular steps:\n\n```text\nOriginal: [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba None\n\nStep 1: Find Midpoint (Tortoise & Hare)\n        [ 1 ] \u2500\u2500\u25ba [ 2 ]       [ 2 ] \u2500\u2500\u25ba [ 1 ]\n                   \u25b2 (slow)\n\nStep 2: Reverse the 2nd Half (Conga Line Dance from LC 206)\n        [ 1 ] \u2500\u2500\u25ba [ 2 ]       None \u25c4\u2500\u2500 [ 2 ] \u25c4\u2500\u2500 [ 1 ]\n                                                  \u25b2 (prev)\n\nStep 3: Compare Pointers Inward\n        p1: [ 1 ] \u2500\u2500\u25ba [ 2 ]\n        p2: [ 1 ] \u2500\u2500\u25ba [ 2 ]   (1 == 1, 2 == 2 -> True!)\n```\n\n---\n\n### Step 1: Tortoise & Hare (Find End of First Half)\n\nWe use two pointers:\n* `slow` moves **1 step** at a time.\n* `fast` moves **2 steps** at a time.\n\n> [!IMPORTANT]\n> Use `while fast.next and fast.next.next:` instead of `while fast and fast.next:`.  \n> Why? Because we want `slow` to stop at the **end of the first half**, right before the second half begins!\n\n* **Even List `[1, 2, 2, 1]`:** `slow` lands on the first `2`. `slow.next` is the start of the second half (`2`).\n* **Odd List `[1, 2, 3, 2, 1]`:** `slow` lands on `3` (the exact middle). `slow.next` is the start of the second half (`2`).\n\n---\n\n### Step 2: In-Place Reverse of the Second Half\n\nTake `slow.next` (the start of the second half) and reverse it using the **Conga Line 4-Beat Dance** from [LeetCode 206](./206_reverse_linked_list.md):\n\n```python\ndef reverse_list(head):\n    prev = None\n    cur = head\n    while cur:\n        nxt = cur.next     # 1. Spotter holds next\n        cur.next = prev    # 2. Reverse arrow\n        prev = cur         # 3. Advance prev\n        cur = nxt          # 4. Advance cur\n    return prev\n```\n\n---\n\n### Step 3: Compare First Half vs Reversed Second Half\n\n* Set `p1 = head` (start of first half).\n* Set `p2 = reversed_second_half_head`.\n* Walk together:\n  ```python\n  while p2:\n      if p1.val != p2.val:\n          return False\n      p1 = p1.next\n      p2 = p2.next\n  return True\n  ```\n\n> [!NOTE]\n> Why loop on `while p2:`?  \n> Because in odd-length lists (e.g. `[1, 2, 3, 2, 1]`), the second half has 2 elements (`[1, 2]`), while the first half still connects to the middle node `3`. When `p2` finishes, all mirrored pairs have been confirmed!\n\n---\n\n### \ud83c\udf1f Bonus Step 4: Restoring the Original List (The Senior/Staff Engineer Move)\n\nIn a real production system or multi-threaded service, mutating an input data structure without restoring it is a **dangerous side-effect**!\nA candidate who says:\n> *\"Before returning, I should reverse the second half back to its original orientation so callers don't experience unexpected mutations.\"*\n\n...will immediately stand out at Google / Meta.\n\n```python\n# Restore list back to normal:\nslow.next = self.reverse_list(second_half_head)\n```\n\n---\n\n## \ud83d\udcbb Complete Production Code (Approach 2)\n\n```python\n# Definition for singly-linked list.\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\n\nclass Solution:\n    def isPalindrome(self, head: Optional[ListNode]) -> bool:\n        if not head or not head.next:\n            return True\n\n        # -------------------------------------------------------------\n        # 1. Locate the end of the first half (Tortoise & Hare)\n        # -------------------------------------------------------------\n        slow = head\n        fast = head\n        while fast.next and fast.next.next:\n            slow = slow.next\n            fast = fast.next.next\n\n        # -------------------------------------------------------------\n        # 2. Reverse the second half in-place (LC 206)\n        # -------------------------------------------------------------\n        second_half_head = self.reverse_list(slow.next)\n\n        # -------------------------------------------------------------\n        # 3. Check if first half matches reversed second half\n        # -------------------------------------------------------------\n        first_half = head\n        second_half = second_half_head\n        is_palindrome = True\n\n        while is_palindrome and second_half:\n            if first_half.val != second_half.val:\n                is_palindrome = False\n            first_half = first_half.next\n            second_half = second_half.next\n\n        # -------------------------------------------------------------\n        # 4. Optional: Restore list to avoid mutating caller's data\n        # -------------------------------------------------------------\n        slow.next = self.reverse_list(second_half_head)\n\n        return is_palindrome\n\n    def reverse_list(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        \"\"\"Classic Conga Line 4-beat in-place reversal.\"\"\"\n        prev = None\n        cur = head\n        while cur:\n            nxt = cur.next\n            cur.next = prev\n            prev = cur\n            cur = nxt\n        return prev\n```\n\n---\n\n### \u26a1 Variant 2B: The Compact Embedded / Inlined Version (No Helper Function!)\n\nIf you don't want to define a separate helper method or class function, you can **embed the 4-beat dance directly inline**! This is super clean, short (~25 lines), and popular in timed interviews:\n\n```python\nclass Solution:\n    def isPalindrome(self, head: Optional[ListNode]) -> bool:\n        if not head or not head.next:\n            return True\n\n        # 1. Find midpoint (stop at end of 1st half)\n        slow = head\n        fast = head\n        while fast.next and fast.next.next:\n            slow = slow.next\n            fast = fast.next.next\n\n        # 2. Reverse 2nd half INLINE (Embedded 4-Beat Conga Line Dance)\n        prev = None\n        cur = slow.next\n        while cur:\n            nxt = cur.next      # 1. Spotter\n            cur.next = prev     # 2. Turn around\n            prev = cur          # 3. Slide prev\n            cur = nxt           # 4. Slide cur\n\n        # 3. Compare 1st half vs reversed 2nd half\n        first = head\n        second = prev           # prev is the head of the reversed second half!\n        while second:\n            if first.val != second.val:\n                return False\n            first = first.next\n            second = second.next\n\n        return True\n```\n\n#### Helper Method vs. Embedded Inline:\n* **Embedded Inline:** Faster to write in a 25-minute interview, fewer moving parts, zero extra function call overhead.\n* **Separate Helper Method:** Better if the interviewer asks to **restore the list** before returning, because you can just call `self.reverse_list(...)` twice instead of repeating the `while` loop twice!\n\n---\n\n## \ud83d\udcca Complexity Analysis\n\n| Metric | Approach 1 (Array + Squeeze) | Approach 2 (In-Place Triple Crown) |\n| :--- | :--- | :--- |\n| **Time Complexity** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ ($n/2$ to find mid + $n/2$ to reverse + $n/2$ to compare) |\n| **Space Complexity** | $\\mathcal{O}(n)$ (auxiliary Python array) | **$\\mathcal{O}(1)$** (pure in-place pointer manipulation) |\n| **Code Modularity** | Simple single-loop | Reuses standard LC 206 + LC 876 building blocks |\n\n---\n\n## \u26a0\ufe0f Common Traps & Pitfalls\n\n1. **The Fast Pointer Condition:**  \n   Using `while fast and fast.next:` instead of `while fast.next and fast.next.next:`.  \n   * If you use `while fast and fast.next:`, on an even list `[1, 2, 2, 1]`, `slow` stops on the *second* `2`, splitting the list unevenly into 3 and 1 nodes.\n2. **Forgetting to check `while second_half:`:**  \n   Always drive the comparison with the second half pointer (`second_half`), which correctly terminates before touching the middle element in odd lists.\n3. **Trying to reverse the entire list to compare:**  \n   If you reverse the whole list in-place, you destroy the original list and compare identical pointers against each other (which will always return `True`)!\n", "category": "02_linked_lists"}, "02_linked_lists/83_remove_duplicates_from_sorted_list.md": {"title": "\u2702\ufe0f LeetCode 83: Remove Duplicates from Sorted List \u2013 Master Guide", "content": "# \u2702\ufe0f LeetCode 83: Remove Duplicates from Sorted List \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** Top Interview 150 / LeetCode 75  \n> **Pattern:** Linked List In-Place Pointer Skipping  \n> **LeetCode Link:** [LeetCode 83: Remove Duplicates from Sorted List](https://leetcode.com/problems/remove-duplicates-from-sorted-list/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven the `head` of a **sorted** linked list, delete all duplicates such that each element appears only once. Return the linked list **sorted** as well.\n\n### Example:\n```text\nInput:  head = [1, 1, 2, 3, 3]\nOutput: [1, 2, 3]\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: The Snip-and-Recheck Rule\n\nLook at two adjacent nodes in the chain:\n\n```text\ncur\n \u2502\n \u25bc\n[ 1 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba [ 2 ] \u2500\u2500\u25ba None\n```\n\n* If `cur.val == cur.next.val` (duplicate found!):\n  * **Snip the duplicate:** Point `cur.next` to skip the neighbor: `cur.next = cur.next.next`.\n  * **CRUCIAL RULE:** **DO NOT move `cur` yet!**  \n    Why? Because the *new* neighbor might ALSO be a duplicate (e.g. `[1, 1, 1]`)!\n* If `cur.val != cur.next.val` (different numbers):\n  * Now it is safe to step forward: `cur = cur.next`.\n\n---\n\n## \ud83c\udfac Visual Trace on Consecutive Duplicates: `[1, 1, 1]`\n\n#### \ud83d\udccd Step 1: `cur` at first `1`\n```text\ncur\n \u2502\n \u25bc\n[ 1 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba None\n```\n* `cur.val (1) == cur.next.val (1)` $\\implies$ Duplicate!\n* `cur.next = cur.next.next`\n* **`cur` STAYS AT INDEX 0!**\n\n#### \ud83d\udccd Step 2: Re-check new neighbor!\n```text\ncur\n \u2502\n \u25bc\n[ 1 ] \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba [ 1 ] \u2500\u2500\u25ba None\n```\n* Look! The new neighbor is ALSO `1`!\n* `cur.val (1) == cur.next.val (1)` $\\implies$ Duplicate!\n* `cur.next = cur.next.next` (points to `None`)\n\n#### \ud83d\udccd Step 3: Loop terminates\n```text\nhead\n \u2502\n \u25bc\n[ 1 ] \u2500\u2500\u25ba None\n```\nAll duplicates are cleanly snipped out!\n\n---\n\n## \u2753 The Critical Question: Why `return head` and NOT `return head.next`?\n\n* In `mergeTwoLists`, you created a fake anchor: `dummy = ListNode(0)`. Returning `dummy.next` was necessary to throw away the fake `[0]`.\n* In `deleteDuplicates`, **`head` is the REAL first node** of the input!  \n  Even if there are duplicates (`1 -> 1`), you keep the first `1`!\n* Returning `head.next` would accidentally chop off that first legitimate number.\n* \ud83d\udc49 **Rule:** If `head` is a real starting node that belongs in the answer, write **`return head`**!\n\n---\n\n## \ud83d\udcbb The Clean Code\n\n```python\n# Definition for singly-linked list.\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\n\nclass Solution:\n    def deleteDuplicates(self, head: ListNode | None) -> ListNode | None:\n        cur = head\n        \n        while cur and cur.next:\n            if cur.val == cur.next.val:\n                cur.next = cur.next.next  # Snip duplicate! Do NOT advance cur.\n            else:\n                cur = cur.next            # Different values: safe to advance cur.\n                \n        return head                       # Keep original head!\n```\n\n---\n\n## \u23f1\ufe0f Complexity Blueprint\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 each node is visited at most once.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 modified strictly in-place with zero extra memory.\n", "category": "02_linked_lists"}, "02_linked_lists/linked_list_90_percent_taxonomy.md": {"title": "\ud83d\uddfa\ufe0f 90% of Linked List Questions Classified into Types", "content": "# \ud83d\uddfa\ufe0f 90% of Linked List Questions Classified into Types\n\n> **Source:** [LeetCode Discuss: 90% of the Linked List questions on linked list classified into Types](https://leetcode.com/discuss/post/2434752/90-of-the-linked-list-questions-on-linke-4xc3/) (Post #2434752)  \n> **Philosophy:** Stop treating every linked list problem like an isolated puzzle. Over 90% of all interview questions fall into these clean, predictable types.\n\n---\n\n## \u26a1 The 10-Second Classifier Decision Tree\n\nBefore writing any code, identify your problem's category:\n\n```text\n                              [ Linked List Problem ]\n                                         \u2502\n        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u25bc                                \u25bc                                \u25bc\n  [ GIVEN 1 LL ]                  [ 2 OR MORE LLs ]             [ DESIGN / HYBRID ]\n        \u2502                                \u2502                                \u2502\n  \u250c\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510      \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510          \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n  \u2502 1. Simple Recursion    \u2502      \u2502 \u2022 Zipper Merge      \u2502          \u2502 \u2022 Hash Table Augment\u2502\n  \u2502    (Stream/Horner/Swap)\u2502      \u2502 \u2022 Schoolbook Carry  \u2502          \u2502 \u2022 DLL + HashMap     \u2502\n  \u2502 2. Modify (Same Count) \u2502      \u2502 \u2022 Intersection      \u2502          \u2502   (LRU Cache)       \u2502\n  \u2502    - Reversing         \u2502      \u2502 \u2022 Merge k-Sorted    \u2502          \u2502 \u2022 Merge Sort on LL  \u2502\n  \u2502    - Reordering        \u2502      \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518          \u2502 \u2022 LL + Tree Hybrids \u2502\n  \u2502 3. Delete Nodes        \u2502                                       \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n  \u2502 4. Insert Node         \u2502\n  \u2502 5. Fast/Slow Pointers  \u2502\n  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## \ud83d\udcd1 The Master Classification Breakdown\n\n```text\n\u251c\u2500\u2500 # Linked List Fundamentals (Design)\n\u251c\u2500\u2500 # Category I: Given 1 Linked List\n\u2502   \u251c\u2500\u2500 1) Simple Recursion & Single-Pass\n\u2502   \u251c\u2500\u2500 2) Modifying the List (Node Count Remains Same)\n\u2502   \u2502   \u251c\u2500\u2500 A. Reversing the Linked List\n\u2502   \u2502   \u2514\u2500\u2500 B. Reordering the Nodes\n\u2502   \u251c\u2500\u2500 3) Delete Nodes\n\u2502   \u251c\u2500\u2500 4) Insert Node\n\u2502   \u2514\u2500\u2500 5) Fast Pointer & Slow Pointer (Cycles & Midpoints)\n\u251c\u2500\u2500 # Category II: Given 2 or More Linked Lists\n\u251c\u2500\u2500 # Category III: Hash Table Augmented\n\u251c\u2500\u2500 # Category IV: Design Data Structures Using Linked Lists\n\u251c\u2500\u2500 # Category V: Merge Sort on List\n\u251c\u2500\u2500 # Category VI: Linked List + Tree Hybrids\n\u2514\u2500\u2500 # Category VII: To Do (Hard Design Boss Challenges)\n```\n\n---\n\n## \ud83e\uddf1 0. Linked List Fundamentals\n\nThe building block: designing and understanding node connections from scratch.\n\n* [ ] [LC 707: Design Linked List](https://leetcode.com/problems/design-linked-list/)\n\n> \ud83d\udca1 **Design Superweapon (Sentinels):**  \n> In doubly linked lists, always initialize dummy `head` and `tail` nodes (`head.next = tail`, `tail.prev = head`). This completely eliminates edge-case checks for inserting at the front or deleting at the back.\n\n---\n\n## \ud83c\udfc3 I. Given 1 Linked List\n\n### 1) Simple Recursion & Single-Pass (Nothing Else)\nNodes are inspected or accumulated without changing the list structure or node count.\n\n* [x] [LC 1721: Swapping Nodes in a Linked List](file:///Users/sathyat/Developer/projects/dsa/1721_swapping_nodes_in_a_linked_list.md) *(Solved in Repo)*\n  * **Technique:** Measuring Stick / Offset Runners. Reaching node $k$ takes `k - 1` steps. Slide `fast` and `second` together.\n* [ ] [LC 369: Plus One Linked List](https://leetcode.com/problems/plus-one-linked-list/) *(Array cousin: [LC 66](file:///Users/sathyat/Developer/projects/dsa/66_plus_one.md) in repo)*\n  * **Technique:** Post-order recursion bubbles the carry backward: `carry = add_carry(node.next)`.\n* [x] [LC 1290: Convert Binary Number in a Linked List to Integer](file:///Users/sathyat/Developer/projects/dsa/1290_convert_binary_number_in_a_linked_list_to_integer.md) *(Solved in Repo)*\n  * **Technique:** Horner's Rule accumulator: `ans = (ans << 1) | head.val`. Pure $\\mathcal{O}(1)$ space, no string copying.\n\n---\n\n### 2) Modifying the LL (Node Count Remains the Same)\n\n#### A. Reversing the Linked List\nReverses the direction of pointers in-place ($\\mathcal{O}(n)$ time, $\\mathcal{O}(1)$ space).\n\n* [x] [LC 206: Reverse Linked List](file:///Users/sathyat/Developer/projects/dsa/206_reverse_linked_list.md) *(Solved in Repo)*\n  * **Mental Model:** Preschool Conga Line 4-beat dance (`nxt = curr.next`, `curr.next = prev`, `prev = curr`, `curr = nxt`).\n* [ ] [LC 92: Reverse Linked List II](https://leetcode.com/problems/reverse-linked-list-ii/)\n  * **Technique:** Reverse only the sub-segment between `left` and `right`, stitch boundaries.\n* [x] [LC 234: Palindrome Linked List](file:///Users/sathyat/Developer/projects/dsa/234_palindrome_linked_list.md) *(Solved in Repo)*\n  * **Technique:** In-Place Triple Crown (Tortoise & Hare Midpoint $\\to$ Reverse 2nd half $\\to$ Compare pointers $\\to$ Restore).\n* [ ] [LC 25: Reverse Nodes in k-Group](https://leetcode.com/problems/reverse-nodes-in-k-group/) *(Hard)*\n  * **Technique:** Check if $k$ nodes exist $\\to$ reverse the group of $k$ $\\to$ recursively reverse next group.\n* [ ] [LC 1265: Print Immutable Linked List in Reverse](https://leetcode.com/problems/print-immutable-linked-list-in-reverse/)\n  * **Technique:** Standard recursion call stack (`print_rev(head.getNext())`, then `head.printValue()`).\n\n#### B. Reordering the Nodes\nRearranges the order of nodes without adding or removing any nodes.\n\n* [ ] [LC 86: Partition List](https://leetcode.com/problems/partition-list/) \u2b50 **IMP**\n  * **Technique:** Multi-Track Conveyor Belts. Create two dummy heads (`small` for $< x$, `great` for $\\ge x$). Walk list, attach to appropriate belt, set `great.next = None`, and stitch `small.next = dummy_great.next`.\n* [ ] [LC 143: Reorder List](https://leetcode.com/problems/reorder-list/)\n  * **Technique:** Find middle $\\to$ reverse second half $\\to$ zipper weave nodes alternately.\n* [ ] [LC 24: Swap Nodes in Pairs](https://leetcode.com/problems/swap-nodes-in-pairs/)\n  * **Technique:** Pointer swapping with dummy anchor: `first = cur.next`, `second = cur.next.next`.\n* [ ] [LC 61: Rotate List](https://leetcode.com/problems/rotate-list/)\n  * **Technique:** Connect tail to head to form a ring, break ring at `len - (k % len)`.\n* [ ] [LC 328: Odd Even Linked List](https://leetcode.com/problems/odd-even-linked-list/)\n  * **Technique:** Two pointers (`odd` and `even`), walk simultaneously, link `odd.next = even_head`.\n\n---\n\n### 3) Delete Nodes\nBypassing unwanted nodes (`prev.next = cur.next`).\n\n* [ ] [LC 19: Remove Nth Node From End of List](https://leetcode.com/problems/remove-nth-node-from-end-of-list/)\n  * **Technique:** Offset runners by $N + 1$ steps from `dummy` so `slow` lands right before the deletion target.\n* [x] [LC 83: Remove Duplicates from Sorted List](file:///Users/sathyat/Developer/projects/dsa/83_remove_duplicates_from_sorted_list.md) *(Solved in Repo)*\n  * **Golden Rule:** List is SORTED $\\implies$ **No Hash Table needed!** Compare `cur.val == cur.next.val` in $\\mathcal{O}(1)$ space.\n* [ ] [LC 82: Remove Duplicates from Sorted List II](https://leetcode.com/problems/remove-duplicates-from-sorted-list-ii/)\n  * **Technique:** Remove *all* nodes with duplicate numbers. Use `dummy`, lookahead `while cur.next and cur.next.val == cur.next.next.val:`.\n* [ ] [LC 203: Remove Linked List Elements](https://leetcode.com/problems/remove-linked-list-elements/)\n  * **Technique:** Dummy head + skip target values: `if cur.next.val == val: cur.next = cur.next.next else: cur = cur.next`.\n\n---\n\n### 4) Insert Node\n* [ ] [LC 708: Insert into a Sorted Circular Linked List](https://leetcode.com/problems/insert-into-a-sorted-circular-linked-list/)\n  * **Technique:** 3 cases: (1) normal gap `prev <= val <= curr`, (2) wrap-around boundary `prev > curr` with `val >= prev` or `val <= curr`, (3) full 360\u00b0 circle.\n\n---\n\n### 5) Fast Pointer & Slow Pointer (Cycle or Middle Element)\nTwo runners moving at different speeds (`slow = 1 step`, `fast = 2 steps`).\n\n* [ ] [LC 141: Linked List Cycle](https://leetcode.com/problems/linked-list-cycle/)\n  * **Technique:** Floyd's Cycle Finding. If `fast == slow`, cycle exists.\n* [ ] [LC 876: Middle of the Linked List](https://leetcode.com/problems/middle-of-the-linked-list/)\n  * **Technique:** When `fast` reaches end, `slow` is at midpoint.\n* [ ] [LC 2095: Delete the Middle Node of a Linked List](https://leetcode.com/problems/delete-the-middle-node-of-a-linked-list/)\n  * **Technique:** Fast/slow with `dummy` or track `prev` before slow.\n* [ ] [LC 142: Linked List Cycle II](https://leetcode.com/problems/linked-list-cycle-ii/)\n  * **Technique:** Collision meet point $\\to$ reset `finder = head` $\\to$ step both at 1x $\\to$ meet at cycle start.\n\n---\n\n## \u26a1 II. Given 2 or More Linked Lists\n\nSynchronizing and merging multiple independent chains.\n\n* [ ] [LC 2: Add Two Numbers](https://leetcode.com/problems/add-two-numbers/)\n  * **Technique:** Simultaneous traversal + schoolbook carry: `carry, out = divmod(v1 + v2 + carry, 10)`.\n* [ ] [LC 445: Add Two Numbers II](https://leetcode.com/problems/add-two-numbers-ii/)\n  * **Technique:** Digits most significant first $\\implies$ use two stacks or reverse both lists first.\n* [x] [LC 21: Merge Two Sorted Lists](file:///Users/sathyat/Developer/projects/dsa/linked_list_master_cheat_sheet.md#pattern-1-the-zipper-merge-lc-21) *(Covered in Master Cheat Sheet)*\n  * **Technique:** Zipper merge: pick smaller head, attach to `cur.next`, stitch remaining tail.\n* [ ] [LC 23: Merge k Sorted Lists](https://leetcode.com/problems/merge-k-sorted-lists/) \u2b50 **IMP**\n  * **Technique:** Min-Heap (priority queue) of size $k$ $\\implies \\mathcal{O}(N \\log k)$ time, or Divide & Conquer merge pairs.\n* [ ] [LC 160: Intersection of Two Linked Lists](https://leetcode.com/problems/intersection-of-two-linked-lists/)\n  * **Technique:** Track Switch: `pA = pA.next if pA else headB`. Equalizes path lengths $A + B = B + A$.\n* [ ] [LC 1634: Add Two Polynomials Represented as Linked Lists](https://leetcode.com/problems/add-two-polynomials-represented-as-linked-lists/)\n  * **Technique:** Merge by exponent power: compare `p1.power` vs `p2.power`.\n\n---\n\n## \ud83d\uddc4\ufe0f III. Hash Table Augmented\n\nUsed when pointer manipulation alone requires costly $\\mathcal{O}(n^2)$ scans.\n\n* [ ] [LC 138: Copy List with Random Pointer](https://leetcode.com/problems/copy-list-with-random-pointer/) \u2b50 **IMP**\n  * **Technique:** Pass 1 creates `{old_node: Node(val)}`. Pass 2 wires `.next` and `.random` using dictionary lookups. (Can also be done in $\\mathcal{O}(1)$ space by interweaving).\n* [ ] [LC 1836: Remove Duplicates From an Unsorted Linked List](https://leetcode.com/problems/remove-duplicates-from-an-unsorted-linked-list/)\n  * **Crucial Rule:** Unsorted list $\\implies$ **Must use HashMap/Counter!** Pass 1 counts frequencies; Pass 2 deletes nodes where `count[val] > 1`.\n\n---\n\n## \ud83c\udfdb\ufe0f IV. Design Data Structures Using Linked Lists\n\nDoubly Linked Lists provide $\\mathcal{O}(1)$ node removal and insertion given a node pointer. Combining DLL + HashMap provides $\\mathcal{O}(1)$ lookup AND $\\mathcal{O}(1)$ updates.\n\n* [ ] [LC 146: LRU Cache](https://leetcode.com/problems/lru-cache/) \u2b50 **Top FAANG Question**\n  * **Architecture:** `HashMap { key: Node }` + `Doubly Linked List (head dummy <-> tail dummy)`.\n* [ ] [LC 706: Design HashMap](https://leetcode.com/problems/design-hashmap/) *(Chaining with bucket linked lists)*\n* [ ] [LC 716: Max Stack](https://leetcode.com/problems/max-stack/) *(DLL + TreeMap / Doubly Linked List)*\n* [ ] [LC 705: Design HashSet](https://leetcode.com/problems/design-hashset/)\n* [ ] [LC 1472: Design Browser History](https://leetcode.com/problems/design-browser-history/) *(Doubly Linked List back/forward)*\n* [ ] [LC 355: Design Twitter](https://leetcode.com/problems/design-twitter/) *(Note: Can use HashMaps + Min-Heap; no strict need for LL)*\n* [ ] [LC 622: Design Circular Queue](https://leetcode.com/problems/design-circular-queue/) *(Fixed array or Singly/Doubly Linked List)*\n\n---\n\n## \ud83c\udf32 V. Merge Sort on List\n\n* [ ] [LC 148: Sort List](https://leetcode.com/problems/sort-list/) \u2b50 **IMP**\n  * **Why it's special:** Arrays need $\\mathcal{O}(n)$ space to merge. Linked Lists do Merge Sort in **$\\mathcal{O}(1)$ auxiliary space**!\n  * **Steps:** Fast/Slow midpoint $\\to$ cut `slow.next = None` $\\to$ recurse left and right $\\to$ zipper merge (LC 21).\n\n---\n\n## \ud83c\udf33 VI. Linked List + Tree Hybrids\n\n* [ ] [LC 426: Convert Binary Search Tree to Sorted Doubly Linked List](https://leetcode.com/problems/convert-binary-search-tree-to-sorted-doubly-linked-list/)\n  * **Technique:** In-order traversal visits BST in sorted order; wire `prev.right = cur` and `cur.left = prev`.\n* [ ] [LC 430: Flatten a Multilevel Doubly Linked List](https://leetcode.com/problems/flatten-a-multilevel-doubly-linked-list/)\n  * **Technique:** Pre-order DFS traversal. Splice child chain between `cur` and `cur.next`.\n* [ ] [LC 2130: Maximum Twin Sum of a Linked List](https://leetcode.com/problems/maximum-twin-sum-of-a-linked-list/)\n  * **Technique:** Find middle $\\to$ reverse second half $\\to$ iterate both halves simultaneously summing pairs.\n* [ ] [LC 237: Delete Node in a Linked List](https://leetcode.com/problems/delete-node-in-a-linked-list/)\n  * **The Trick Question:** You are only given the node to delete! Copy next value: `node.val = node.next.val`, bypass next: `node.next = node.next.next`.\n\n---\n\n## \ud83c\udfd4\ufe0f VII. To Do: Hard Design Boss Challenges\n\nThe ultimate trio of complex linked list system designs:\n\n* [ ] [LC 432: All O`one Data Structure](https://leetcode.com/problems/all-oone-data-structure/) *(DLL of Frequency Buckets + Two HashMaps)*\n* [ ] [LC 460: LFU Cache](https://leetcode.com/problems/lfu-cache/) *(Least Frequently Used: HashMap of Frequencies to Doubly Linked Lists)*\n* [ ] [LC 2296: Design a Text Editor](https://leetcode.com/problems/design-a-text-editor/) *(Doubly Linked List cursor or two stacks)*\n\n---\n\n## \ud83d\udcca Summary Mapping: Your Solved Problems\n\n| Problem | Section in this Guide | Solved Guide |\n| :--- | :--- | :--- |\n| **LC 206: Reverse Linked List** | **I. 2. A (Reversing LL)** | [`206_reverse_linked_list.md`](file:///Users/sathyat/Developer/projects/dsa/206_reverse_linked_list.md) |\n| **LC 234: Palindrome Linked List** | **I. 2. A (Reversing LL)** | [`234_palindrome_linked_list.md`](file:///Users/sathyat/Developer/projects/dsa/234_palindrome_linked_list.md) |\n| **LC 1721: Swapping Nodes in a Linked List** | **I. 1 (Simple Recursion/Single Pass)** | [`1721_swapping_nodes_in_a_linked_list.md`](file:///Users/sathyat/Developer/projects/dsa/1721_swapping_nodes_in_a_linked_list.md) |\n| **LC 1290: Convert Binary in LL to Integer** | **I. 1 (Simple Recursion/Single Pass)** | [`1290_convert_binary_number_in_a_linked_list_to_integer.md`](file:///Users/sathyat/Developer/projects/dsa/1290_convert_binary_number_in_a_linked_list_to_integer.md) |\n| **LC 21: Merge Two Sorted Lists** | **II. Given 2 or More LLs** | [`linked_list_master_cheat_sheet.md`](file:///Users/sathyat/Developer/projects/dsa/linked_list_master_cheat_sheet.md#pattern-1-the-zipper-merge-lc-21) |\n| **LC 83: Remove Duplicates from Sorted List** | **I. 3 (Delete Nodes)** | [`83_remove_duplicates_from_sorted_list.md`](file:///Users/sathyat/Developer/projects/dsa/83_remove_duplicates_from_sorted_list.md) |\n| **LC 66: Plus One** | *(Array Cousin of LC 369 in I. 1)* | [`66_plus_one.md`](file:///Users/sathyat/Developer/projects/dsa/66_plus_one.md) |\n", "category": "02_linked_lists"}, "03_stacks_and_queues/20_valid_parentheses.md": {"title": "\ud83e\uddf1 LeetCode 20: Valid Parentheses \u2013 Master Guide", "content": "# \ud83e\uddf1 LeetCode 20: Valid Parentheses \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** NeetCode 150 / Top Interview 150 / Blind 75  \n> **Pattern:** Stack (Last-In, First-Out) & The \"Push-Expected\" Optimization  \n> **LeetCode Link:** [LeetCode 20: Valid Parentheses](https://leetcode.com/problems/valid-parentheses/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven a string `s` containing just the characters `'('`, `')'`, `'{'`, `'}'`, `'['` and `']'`, determine if the input string is valid.\n\nA string is valid if:\n1. Open brackets must be closed by the same type of brackets.\n2. Open brackets must be closed in the correct order.\n3. Every close bracket has a corresponding open bracket of the same type.\n\n```text\nExample 1: s = \"()\"       -> True\nExample 2: s = \"()[]{}\"   -> True\nExample 3: s = \"(]\"       -> False\nExample 4: s = \"([])\"     -> True\nExample 5: s = \"([)]\"     -> False (Order violation!)\n```\n\n---\n\n## \ud83c\udf92 The \"Aha!\" Mental Model: The Cafeteria Plate Stack\n\nThink of a **spring-loaded cafeteria tray dispenser**:\n* When you see an open bracket, you **push a plate onto the stack**.\n* The **last plate added** is always the **first plate removed** (**LIFO** - Last In, First Out).\n* If you put down a Round plate `(`, then a Square plate `[`, the **very next plate you take off MUST be a Square plate `]`**!\n* If someone tries to take off a Round plate while the Square plate is still on top, **the entire stack crashes!**\n\n```text\nInput: s = \" ( [ ] ) \"\n\nStep 1: see '(' -> push '('\n        [ ( ]\n\nStep 2: see '[' -> push '['\n        [ [ ]  <- TOP OF STACK\n        [ ( ]\n\nStep 3: see ']' -> must match TOP OF STACK!\n        Matches '['! Pop '['!\n        [ ( ]\n\nStep 4: see ')' -> must match TOP OF STACK!\n        Matches '('! Pop '('!\n        [   ]  <- STACK IS EMPTY!\n\nValid! Return True!\n```\n\n---\n\n## \u26a1 The 4 Speed Optimizations (3 ms \u2794 0 ms)\n\n| Issue in Common Solutions | The High-Performance Fix | Performance Impact |\n| :--- | :--- | :--- |\n| **Odd length processed through full loop** | `if len(s) % 2 != 0: return False` | **Instant $\\mathcal{O}(1)$ exit** on odd strings (e.g. `s = \"]\"`) |\n| `for i in range(len(s)): s[i]` | `for ch in s:` | Eliminates index generation and bounds checking |\n| `if len(stack) == 0:` | `if not stack:` | Uses direct CPython pointer truthiness |\n| Separate `stack[-1]` peek and `stack.pop()` | `if not stack or stack.pop() != ch:` | Combines peek, pop, and comparison in **1 step** |\n\n---\n\n## \ud83d\udce5 The \"Push-Expected\" Pattern (Top FAANG Optimization)\n\nInstead of pushing opening brackets and constantly looking up a closing-to-opening map:\n\n> **When you see an OPENING bracket, push the CLOSING bracket you EXPECT to see later!**\n\n```text\nWhen you see:       Push this to stack:\n     '('        \u2500\u2500\u25ba        ')'\n     '['        \u2500\u2500\u25ba        ']'\n     '{'        \u2500\u2500\u25ba        '}'\n```\n\n### Why this is brilliant:\nWhen you encounter a closing bracket (`')'`), **you don't even need a dictionary lookup!** You just pop and compare directly:\n```python\nelif not stack or stack.pop() != ch:\n    return False\n```\nThis **cuts dictionary lookups by 50%**!\n\n---\n\n## \ud83d\udcbb Complete Production Code (0 ms / Beats 100%)\n\n```python\nclass Solution:\n    def isValid(self, s: str) -> bool:\n        # 1. Instant early exit: valid parentheses must come in pairs!\n        if len(s) % 2 != 0:\n            return False\n\n        # 2. Map open bracket to what we EXPECT to close it\n        mapping = {'(': ')', '[': ']', '{': '}'}\n        stack = []\n\n        # 3. Direct C iteration (fastest loop in Python)\n        for ch in s:\n            if ch in mapping:\n                stack.append(mapping[ch])  # Push expected closer!\n            elif not stack or stack.pop() != ch:\n                return False\n\n        # 4. If stack is empty, every bracket was matched cleanly\n        return not stack\n```\n\n---\n\n## \ud83d\udcca Complexity Analysis\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 We process each character in the string at most twice (one push, one pop).\n* **Space Complexity:** $\\mathcal{O}(n)$ \u2014 In the worst case (e.g., `s = \"((((((\"`), the stack stores all $n$ characters.\n\n---\n\n## \u26a0\ufe0f Common Traps & Pitfalls\n\n1. **Closing Bracket First:** `s = \"]\"`  \n   Attempting `stack.pop()` when the stack is empty will crash with `IndexError: pop from empty list`.  \n   Always protect with `if not stack:`.\n2. **Leftover Opening Brackets:** `s = \"((\"`  \n   The loop finishes with no errors, but the stack still has elements! Always check `return not stack` (not `return True`).\n3. **Misnesting:** `s = \"([)]\"`  \n   Open brackets must close in reverse order. Stacks naturally handle this order invariant.\n", "category": "03_stacks_and_queues"}, "03_stacks_and_queues/678_valid_parenthesis_string.md": {"title": "\ud83c\udfaf LeetCode 678: Valid Parenthesis String \u2013 Master Study Guide", "content": "# \ud83c\udfaf LeetCode 678: Valid Parenthesis String \u2013 Master Study Guide\n\n> **Difficulty:** Medium | **Pattern:** Two Stacks (Indices) / Greedy Range  \n> **Complexity:** Time: $\\mathcal{O}(n)$ | Auxiliary Space: $\\mathcal{O}(n)$  \n> **Source Code:** [`678_valid_parenthesis_string.py`](./678_valid_parenthesis_string.py)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven a string `s` containing `'('`, `')'`, and `'*'`. Return `true` if valid:\n1. `'('` must be closed by `')'`.\n2. `'*'` is a **wildcard joker** \ud83c\udccf:\n   * It can be `'('`\n   * It can be `')'`\n   * It can be empty `\"\"` (disappear!)\n\n---\n\n## \u26a0\ufe0f Why `s.replace(\"*\", \")\")` Fails (The Trap)\n\nWhen you do `s.replace(\"*\", \")\")`, you force **EVERY single star** in the string to make the exact same choice!\n* In reality, **each star is independent**:\n  * Star 1 might want to be `'('`\n  * Star 2 might want to be `')'`\n  * Star 3 might want to disappear `\"\"`\n\n---\n\n## \ud83e\udde0 Mental Model: The Two Stacks (Index Bookkeeping)\n\nInstead of storing characters, **store the index positions** in two stacks:\n1. `open_stack`: indices of `'('`\n2. `star_stack`: indices of `'*'`\n\n```text\nString:   (   *   )\nIndex:    0   1   2\n\nopen_stack: [0]\nstar_stack: [1]\n```\n\n### The 2 Rules:\n\n#### Rule 1: When you see `')'`\n* If we have a real `'('`, pop it! (`open_stack.pop()`)\n* Otherwise, if we have a `'*'`, use it as a substitute `'('`! (`star_stack.pop()`)\n* If neither exists, we have an orphan `')'` $\\to$ **Impossible! Return `False`**.\n\n#### Rule 2: At the end, clean up leftover `'('`\nCan our leftover stars close our leftover open brackets?\n* A `'*'` can ONLY close a `'('` if it appears **AFTER** it!\n* If `open_stack[-1] < star_stack[-1]`: pop both! \u2705\n* If `open_stack[-1] > star_stack[-1]`: e.g. `*(` $\\to$ star is behind the bracket, so it can never close it! \u274c **Return `False`**.\n\nAny leftover stars at the end? They just become empty strings `\"\"`.\n\n---\n\n## \ud83d\udcbb Clean Implementation\n\n```python\nclass Solution:\n    def checkValidString(self, s: str) -> bool:\n        open_stack = []  # stores indices of '('\n        star_stack = []  # stores indices of '*'\n        \n        for i, ch in enumerate(s):\n            if ch == '(':\n                open_stack.append(i)\n            elif ch == '*':\n                star_stack.append(i)\n            else:  # ch == ')'\n                if open_stack:\n                    open_stack.pop()\n                elif star_stack:\n                    star_stack.pop()\n                else:\n                    return False\n        \n        # Match leftover '(' with '*' that come AFTER them\n        while open_stack and star_stack:\n            if open_stack[-1] < star_stack[-1]:\n                open_stack.pop()\n                star_stack.pop()\n            else:\n                return False\n                \n        return len(open_stack) == 0\n```\n\n---\n\n## \u26a1 Complexity\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2013 single pass to scan characters, followed by at most $\\mathcal{O}(n)$ pops.\n* **Space Complexity:** $\\mathcal{O}(n)$ \u2013 index stacks.\n", "category": "03_stacks_and_queues"}, "01_arrays_and_pointers/11_container_with_most_water.md": {"title": "\ud83e\udea3 LeetCode 11: Container With Most Water \u2013 Two-Pointer Master Guide", "content": "# \ud83e\udea3 LeetCode 11: Container With Most Water \u2013 Two-Pointer Master Guide\n\n> **Difficulty:** Medium  \n> **Study Plan:** Top Interview 150 / NeetCode 150 / Blind 75  \n> **Pattern:** Two Pointers (Shrinking Window / Opposite Ends)  \n> **LeetCode Link:** [LeetCode 11: Container With Most Water](https://leetcode.com/problems/container-with-most-water/)\n\n---\n\n## \ud83d\udccc Problem Description\n\nYou are given an integer array `height` of length $n$. There are $n$ vertical lines drawn such that the two endpoints of the $i$-th line are `(i, 0)` and `(i, height[i])`.\n\nFind two lines that together with the x-axis form a container, such that the container contains the most water.\n\nReturn *the maximum amount of water a container can store*.\n\n> **Notice:** You may not slant the container.\n\n```text\nExample 1:\nInput: height = [1,8,6,2,5,4,8,3,7]\nOutput: 49\nExplanation: The vertical lines are represented by array [1,8,6,2,5,4,8,3,7]. \nThe max area is between index 1 (height 8) and index 8 (height 7).\nWidth = 8 - 1 = 7.\nHeight = min(8, 7) = 7.\nArea = 7 * 7 = 49.\n\nExample 2:\nInput: height = [1,1]\nOutput: 1\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Intuition: Why Brute Force is Too Slow\n\nThe area between two bars at indices $l$ and $r$ ($l < r$) is governed by:\n$$\\text{Area} = \\text{width} \\times \\text{height} = (r - l) \\times \\min(height[l], height[r])$$\n\nA naive brute-force checks all pairs $(l, r)$, which takes $\\mathcal{O}(n^2)$ time. With $n \\le 10^5$, $\\mathcal{O}(n^2) = 10^{10}$ operations, which triggers a **Time Limit Exceeded (TLE)**.\n\n### The Two-Pointer Strategy\nTo do this in $\\mathcal{O}(n)$, we start with the widest possible container:\n- `l = 0` (leftmost bar)\n- `r = len(height) - 1` (rightmost bar)\n\nAt every step, the distance between the lines ($\\text{width} = r - l$) **shrinks by 1**.\n\n```text\n    Index:   0   1   2   3   4   5   6   7   8\n   Height:  [1,  8,  6,  2,  5,  4,  8,  3,  7]\n             \u25b2                               \u25b2\n             \u2502                               \u2502\n            left                           right\n     Width = 8 - 0 = 8\n     Bottleneck = min(1, 7) = 1\n     Area = 8 * 1 = 8\n```\n\n### \ud83d\udd11 The Crucial Question: Which pointer do we move?\nThe water capacity is bottlenecked strictly by the **shorter line**.\n- If we move the **taller line inward**:\n  - The width **decreases** $(r - l - 1)$.\n  - The height can at best be the same shorter line (or even shorter).\n  - Therefore, the area **can only decrease or stay worse**. It is mathematically impossible to find a larger area by moving the taller line!\n- If we move the **shorter line inward**:\n  - The width still decreases.\n  - BUT we might encounter a much taller line that compensates for the lost width.\n  - This is the **only move that could possibly yield a larger area**.\n\nHence, the greedy choice is always: **advance the pointer of the shorter line**.\n\n---\n\n## \ud83d\udcbb Standard Optimal Solution (User's Solution)\n\n```python\nfrom typing import List\n\nclass Solution:\n    def maxArea(self, height: List[int]) -> int:\n        l = 0\n        r = len(height) - 1\n        max_area = 0\n        \n        while l < r:\n            min_h = min(height[l], height[r])\n            width = r - l\n            curr_area = width * min_h\n            max_area = max(curr_area, max_area)\n            \n            if height[l] < height[r]:\n                l += 1\n            else:\n                r -= 1\n            \n        return max_area\n```\n\n---\n\n## \u23f1\ufe0f Complexity Analysis\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 Every iteration moves either pointer `l` forward or pointer `r` backward by 1. The two pointers meet after at most $n - 1$ steps. Since we must read through the heights to find the maximum, $\\mathcal{O}(n)$ is asymptotically optimal.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 Only a few primitive variables (`l`, `r`, `max_area`, `min_h`, `width`) are allocated in memory.\n\n---\n\n## \ud83d\udd2c Critical Findings & Practical Optimizations\n\nWhile the above solution is asymptotically optimal ($\\mathcal{O}(n)$), here are important findings regarding real-world performance and interview expectations:\n\n### 1. The Fast-Forward Optimization (Skipping Shorter Bars)\nWhenever you move a pointer away from a line of height $h$, the next container will have a smaller width. \nIf the next bar is **shorter than or equal to** $h$, its area is **guaranteed to be strictly smaller** than the area you just evaluated:\n$$\\text{new\\_area} = (\\text{width} - 1) \\times \\min(h_{\\text{new}}, h_{\\text{other}}) \\le (\\text{width} - 1) \\times h < \\text{width} \\times h$$\n\nTherefore, you can safely skip all subsequent bars that are $\\le$ the current bottleneck without calculating their area:\n\n```python\nwhile l < r and height[l] <= hl:\n    l += 1\n```\n\n### 2. Built-in Function Call Overhead in Python\nIn a tight loop running $10^5$ times:\n- `min()` and `max()` are Python function calls that add slight frame overhead.\n- Writing `hl < hr` and comparing directly with an `if area > max_area:` eliminates redundant comparisons and avoids calling `min()` followed immediately by another comparison check.\n\n### 3. Fast-Forward Implementation (Beats ~95%+ on LeetCode)\n\n```python\nfrom typing import List\n\nclass SolutionOptimized:\n    def maxArea(self, height: List[int]) -> int:\n        l = 0\n        r = len(height) - 1\n        max_area = 0\n\n        while l < r:\n            hl, hr = height[l], height[r]\n            \n            if hl < hr:\n                area = (r - l) * hl\n                if area > max_area:\n                    max_area = area\n                # Fast-forward past any bars shorter than or equal to hl\n                while l < r and height[l] <= hl:\n                    l += 1\n            else:\n                area = (r - l) * hr\n                if area > max_area:\n                    max_area = area\n                # Fast-forward past any bars shorter than or equal to hr\n                while l < r and height[r] <= hr:\n                    r -= 1\n\n        return max_area\n```\n\n---\n\n## \ud83c\udfe2 Mega-Company (Google / FAANG) Interview Playbook\n\n### Do companies like Google expect the faster version?\n**No, they do not expect you to code the micro-optimized version first.**\n\n1. **Cleanliness & Maintainability:** The standard solution is clean, readable, and less prone to off-by-one errors or missed boundary checks (`l < r`). Google interviewers prioritize bug-free, readable production code.\n2. **Identical Asymptotic Complexity:** Both solutions are $\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space. The theoretical worst-case (e.g., strictly monotonically increasing or decreasing heights) executes the exact same number of operations.\n3. **The Winning Interview Strategy:**\n   - **Step 1:** Write the standard clean solution first and prove correctness with a walk-through.\n   - **Step 2:** State the complexity ($\\mathcal{O}(n)$ time, $\\mathcal{O}(1)$ space) and explain why $\\mathcal{O}(n)$ is theoretically optimal.\n   - **Step 3 (The Senior Signal):** Offer the fast-forward observation verbally:\n     > *\"Asymptotically we are at the optimal $\\mathcal{O}(n)$, but as a practical constant-factor optimization, whenever we move a pointer because it was the bottleneck, any subsequent line on that side that is $\\le$ the bottleneck height cannot possibly beat our max area because width has decreased. We can fast-forward past them with an inner while loop.\"*\n   - This demonstrates deep optimization insight without adding unnecessary code complexity.\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/121_best_time_to_buy_and_sell_stock.md": {"title": "\ud83d\udcc8 LeetCode 121: Best Time to Buy and Sell Stock", "content": "# \ud83d\udcc8 LeetCode 121: Best Time to Buy and Sell Stock\n\n> **Difficulty:** Easy | **Top Interview 150:** Arrays / Strings  \n> **Pattern:** Running Minimum Tracking / 1D Greedy State Machine  \n> **Complexity:** Time: $\\mathcal{O}(n)$ | Space: $\\mathcal{O}(1)$  \n> **Source Code:** [`121_best_time_to_buy_and_sell_stock.py`](./121_best_time_to_buy_and_sell_stock.py)\n\n---\n\n## \ud83c\udfaf Is This Problem FAANG-Worthy?\n\n### Verdict: **YES \u2014 But as a Warm-Up Filter & Stepping Stone**\nDo not underestimate LC 121 because it's labeled \"Easy\". At **Meta, Google, Amazon, and Bloomberg**, LC 121 serves 3 distinct interview roles:\n1. **The 5-Minute Warm-Up / Smoke Screen:** In a 45-minute technical screen, interviewers often throw LC 121 in the first 7 minutes. They are checking:\n   * Do you immediately recognize $\\mathcal{O}(n^2)$ brute-force vs. $\\mathcal{O}(n)$ single pass?\n   * Can you write bug-free code in under 3 minutes without stuttering?\n   * Do you properly handle the case where prices strictly decrease (can you lose money, or is minimum profit $0$?).\n2. **The \"Gateway\" Problem for Part 2 / 3:**\n   * If you nail LC 121 in 5 minutes, they immediately pivot to:\n     * **LC 122 (Stock II):** Unlimited transactions (Greedy daily step collection).\n     * **LC 123 / 188 (Stock III & IV):** At most 2 or $k$ transactions (2D State Machine DP).\n     * **LC 309 / 714 (Stock with Cooldown or Transaction Fee):** Finite state machine DP.\n3. **Equivalence to Kadane's Algorithm:**\n   * If you transform the prices array into daily differences `diff[i] = prices[i] - prices[i-1]`, finding the maximum profit is **literally Kadane's Maximum Subarray Problem (LC 53)**. Interviewers love asking candidates if they see the equivalence!\n\n---\n\n## \ud83e\udde0 Mental Model: The \"Past Valley & Future Peak\"\n\nImagine you are traveling through time with a suitcase of cash.\nAt each day `i`, you have two questions:\n1. *\"Is today the cheapest day I've seen in all of history so far?\"*  \n   $\\rightarrow$ If yes, update `min_price = price`.\n2. *\"If I bought at the historical record low and sold today, how much profit would I make?\"*  \n   $\\rightarrow$ If `price - min_price > max_profit`, update `max_profit`.\n\n```text\nPrices:  [ 7,   1,   5,   3,   6,   4 ]\n          \u25b2     \u25b2         \u25b2\n          \u2502     \u2502         \u2514\u2500 Sell here (profit = 6 - 1 = 5)\n          \u2502     \u2514\u2500 New historical valley (min_price = 1)\n          \u2514\u2500 Initial valley (min_price = 7)\n```\n\n---\n\n## \ud83d\udd2c Code Analysis: Comparing Approaches\n\n### Your Submitted Code\n```python\nclass Solution:\n    def maxProfit(self, prices: List[int]) -> int:\n        max_prof = float(-inf)\n        min_price = float(inf)\n        for price in prices:\n            min_price = min(min_price, price)\n            max_prof = max(max_prof, price - min_price)\n        return max_prof\n```\n\n### Critical Analysis & Subtle Nuances:\n\n1. **Initial Value of `max_prof`:**\n   * In your code, you initialized `max_prof = float(-inf)`.\n   * **Why LeetCode accepted it:** For `[7, 6, 4, 3, 1]`, on day 1 `min_price = 7`, so `price - min_price = 7 - 7 = 0`. Thus `max_prof` was bumped to `0`.\n   * **Interview Note:** If you cannot make any profit, you simply do not transact, returning `0`. It is much cleaner and avoids edge case misunderstandings to initialize `max_profit = 0` directly.\n2. **`min()` / `max()` Function Overhead vs. `if/elif`:**\n   * Built-in `min()` and `max()` in Python incur Python function call overhead and tuple unpacking for each loop iteration.\n   * Using direct `if price < min_price:` and `elif price - min_price > max_profit:` is significantly faster (~35ms vs ~55ms) and demonstrates hardware-conscious branching intuition.\n\n---\n\n## \ud83d\udca1 Production Solution\n\n```python\nclass Solution:\n    def maxProfit(self, prices: List[int]) -> int:\n        min_price = float('inf')\n        max_profit = 0\n        \n        for price in prices:\n            if price < min_price:\n                min_price = price\n            elif price - min_price > max_profit:\n                max_profit = price - min_price\n                \n        return max_profit\n```\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 Single pass through `prices`.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 Only two scalar trackers (`min_price`, `max_profit`).\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/122_best_time_to_buy_and_sell_stock_ii.md": {"title": "\ud83d\udcc8 LeetCode 122: Best Time to Buy and Sell Stock II \u2013 Master Guide", "content": "# \ud83d\udcc8 LeetCode 122: Best Time to Buy and Sell Stock II \u2013 Master Guide\n\n> **Difficulty:** Medium  \n> **Study Plan:** Top Interview 150 / NeetCode 150 / Blind 75  \n> **Pattern:** Greedy (Valley-to-Peak / Daily Step Accumulation)  \n> **LeetCode Link:** [LeetCode 122: Best Time to Buy and Sell Stock II](https://leetcode.com/problems/best-time-to-buy-and-sell-stock-ii/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nYou are given an integer array `prices` where `prices[i]` is the stock price on the $i$-th day.\n\nOn each day, you may decide to buy and/or sell the stock. You can only hold **at most one** share of the stock at any time. However, you can buy it and then immediately sell it on the same day.\n\nFind and return **the maximum profit** you can achieve with **unlimited transactions**.\n\n```text\nExample 1:\nInput: prices = [7, 1, 5, 3, 6, 4]\nOutput: 7\nExplanation: \n- Buy on day 2 (price = 1) and sell on day 3 (price = 5), profit = 5 - 1 = 4.\n- Buy on day 4 (price = 3) and sell on day 5 (price = 6), profit = 6 - 3 = 3.\nTotal profit is 4 + 3 = 7.\n\nExample 2:\nInput: prices = [1, 2, 3, 4, 5]\nOutput: 4\nExplanation: Buy on day 1 (price = 1) and sell on day 5 (price = 5), profit = 5 - 1 = 4.\n\nExample 3:\nInput: prices = [7, 6, 4, 3, 1]\nOutput: 0\nExplanation: Prices strictly drop. We make zero transactions -> profit = 0.\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: Stock I vs. Stock II\n\n* **Stock I (LC 121):** You can only buy **once** and sell **once**. You must search for the single global minimum followed by the maximum profit.\n* **Stock II (LC 122):** You have **unlimited transactions**. You can jump in and out of the market as many times as you like!\n\n> \u26a0\ufe0f **Is this Kadane's Algorithm?**  \n> **No!** Kadane finds a *single contiguous subarray*. In Stock II, you can take multiple disconnected gains and skip all drops. It is **pure Greedy**.\n\n---\n\n## \ud83d\udd0d Two Ways to Think About the Solution\n\n### Approach 1: The \"Valley-to-Peak\" Method (Your Intuition)\nYou wait for a local minimum (a \"valley\" `x`), buy there, hold while prices rise, and cash out the moment prices drop (or when you reach the end).\n\n```python\nclass SolutionValleyToPeak:\n    def maxProfit(self, prices: list[int]) -> int:\n        prof = 0\n        x = 0\n        temp_prof = 0\n        for i in range(1, len(prices)):\n            if prices[i] > prices[i - 1]:\n                temp_prof = prices[i] - prices[x]\n                if i == len(prices) - 1:\n                    prof += temp_prof\n            else:\n                prof += temp_prof\n                temp_prof = 0\n                x = i\n        return prof\n```\n* **Why this works:** It correctly identifies every local bottom and top.\n* **The drawback:** Requires managing state variables (`x`, `temp_prof`) and an extra check for the end of the array (`if i == len(prices) - 1`).\n\n---\n\n### Approach 2: The \"Telescoping Sum\" Math Trick (The 3-Line Upgrade)\n\nLook at what happens when prices rise continuously: `[1, 2, 5]`\n* Buying at `1` and selling at `5` gives:\n  $$5 - 1 = \\mathbf{4}$$\n* Notice that collecting every single daily increase gives the exact same answer:\n  $$(2 - 1) + (5 - 2) = 1 + 3 = \\mathbf{4}$$\n\nIn general, across any multi-day upward slope $A \\le B \\le C$:\n$$(C - A) = (B - A) + (C - B)$$\n\nBecause intermediate days cancel out, **you don't need to remember where the valley started (`x`), and you don't need temporary profit (`temp_prof`)!**\n\nWhenever tomorrow's price is higher than today's, **just pocket the difference immediately**:\n\n```text\nPrices:       [ 7 ,    1 ,    5 ,    3 ,    6 ,    4 ]\nDaily Steps:     Drop   +4    Drop   +3    Drop\n\nTotal Profit = 4 + 3 = 7\n```\n\n---\n\n## \ud83d\udcbb Clean Python 3 Solution\n\n```python\nclass Solution:\n    def maxProfit(self, prices: list[int]) -> int:\n        profit = 0\n        \n        for i in range(1, len(prices)):\n            # If today's price is higher than yesterday's, take the profit!\n            if prices[i] > prices[i - 1]:\n                profit += prices[i] - prices[i - 1]\n                \n        return profit\n```\n\n---\n\n## \u23f1\ufe0f Complexity Analysis\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 Single linear pass over the array of length $n$.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 Only one accumulator variable (`profit`).\n\n---\n\n## \ud83c\udfe2 Interview Perspective (Google / Meta)\n\n1. **Why interviewers like this problem:** It tests whether a candidate can recognize that a seemingly complex \"buying schedule\" optimization collapses into a dead-simple greedy check.\n2. **Can you really buy and sell on the same day?**  \n   Yes! The problem allows buying and selling on the same day. Even if an interviewer says \"you can't buy and sell on the exact same day\", buying at $1$ and selling at $5$ yields identical profit to the daily increments, so the formula is mathematically equivalent.\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/125_valid_palindrome.md": {"title": "\ud83c\udfaf LeetCode 125: Valid Palindrome \u2013 Master Study Guide", "content": "# \ud83c\udfaf LeetCode 125: Valid Palindrome \u2013 Master Study Guide\n\n> **Difficulty:** Easy | **Pattern:** Two Pointers Formation A (Inward Squeeze)  \n> **Complexity:** Time: $\\mathcal{O}(n)$ | Auxiliary Space: $\\mathcal{O}(1)$ (In-place, beats 95% memory!)  \n> **Source Code:** [`125_valid_palindrome.py`](./125_valid_palindrome.py)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nA phrase is a **palindrome** if, after converting all uppercase letters into lowercase letters and removing all non-alphanumeric characters, it reads the same forward and backward.\n* Letters and numbers count.\n* Spaces, commas, colons, punctuation do not count.\n\n```text\nExample 1:\nInput:  s = \"A man, a plan, a canal: Panama\"\nCleaned: \"amanaplanacanalpanama\"\nResult: True (reads identical in reverse)\n\nExample 2:\nInput:  s = \"race a car\"\nResult: False ('e' != 'a')\n\nExample 3:\nInput:  s = \"0P\"\nResult: False ('0' != 'p')\n```\n\n---\n\n## \ud83e\udde0 Mental Model: The Inward Squeeze\n\nInstead of allocating a whole new string with regex or list comprehensions ($\\mathcal{O}(n)$ space trap), use two pointers squeezing inward:\n* Pointer `l` starts at the front (`0`).\n* Pointer `r` starts at the back (`len(s) - 1`).\n\n```text\n  l ->                                      <- r\n \"A   m a n ,   a   p l a n . . .   P a n a m a\"\n```\n\n### The Squeeze Logic:\n1. If `s[l]` is punctuation/space $\\to$ skip it forward (`l += 1`).\n2. If `s[r]` is punctuation/space $\\to$ skip it backward (`r -= 1`).\n3. If both are alphanumeric:\n   * Compare lowercased: `s[l].lower() == s[r].lower()`.\n   * Match? Advance both inward (`l += 1`, `r -= 1`).\n   * Mismatch? **Immediately return `False`**.\n4. If pointers cross without mismatch $\\to$ **Return `True`**.\n\n---\n\n## \ud83d\udcbb Production Implementation\n\n```python\nclass Solution:\n    def isPalindrome(self, s: str) -> bool:\n        l, r = 0, len(s) - 1\n        \n        while l < r:\n            if not s[l].isalnum():\n                l += 1\n            elif not s[r].isalnum():\n                r -= 1\n            elif s[l].lower() == s[r].lower():\n                l += 1\n                r -= 1\n            else:\n                return False\n                \n        return True\n```\n\n---\n\n## \u26a1 Complexity & FAANG Trade-offs\n\n| Approach | Time | Space | Verdict in FAANG Interview |\n|---|---|---|---|\n| Filter string + Reverse `s[::-1]` | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ | Works, but creates 2 new string copies. Rejected for $\\mathcal{O}(1)$ follow-up. |\n| **Two Pointers Squeeze (Yours!)** | $\\mathcal{O}(n)$ | $\\mathcal{O}(1)$ | \ud83c\udfc6 **Optimal**. Zero memory allocated, early termination on first mismatch. |\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/12_integer_to_roman.md": {"title": "\ud83c\udfdb\ufe0f LeetCode 12: Integer to Roman \u2013 Master Guide", "content": "# \ud83c\udfdb\ufe0f LeetCode 12: Integer to Roman \u2013 Master Guide\n\n> **Difficulty:** Medium  \n> **Study Plan:** Top Interview 150 / NeetCode 150  \n> **Pattern:** Greedy Subtraction (The ATM / Cashier Pattern)  \n> **LeetCode Link:** [LeetCode 12: Integer to Roman](https://leetcode.com/problems/integer-to-roman/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nRoman numerals are formed by appending the conversions of decimal place values from highest to lowest. Converting $3749$ means:\n* $3000 \\to \\text{\"MMM\"}$\n* $700 \\to 500 + 200 \\to \\text{\"DCC\"}$\n* $40 \\to \\text{\"XL\"}$\n* $9 \\to \\text{\"IX\"}$\n* Result = `\"MMMDCCXLIX\"`\n\nGiven an integer `num` ($1 \\le num \\le 3999$), convert it to a Roman numeral.\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: The ATM / Cashier Analogy \ud83c\udfe7\n\nInstead of converting `num` to a string (`str(num)`) and doing complicated digit-by-digit place-value math (`10 ** cur_l`), treat this like **an ATM dispensing cash with the fewest bills possible**.\n\nThere are 13 fixed bill denominations, arranged from **LARGEST to SMALLEST**:\n```text\nValue:   1000   900   500   400   100   90    50    40    10     9     5     4     1\nSymbol:   \"M\"  \"CM\"   \"D\"  \"CD\"   \"C\"  \"XC\"  \"L\"  \"XL\"   \"X\"  \"IX\"   \"V\"  \"IV\"   \"I\"\n```\n\nTo withdraw `num`:\n1. Check the largest bill ($1000$).\n2. While `num >= 1000`, peel off $1000$ and dispense `\"M\"`.\n3. Move to the next largest bill ($900$), and repeat until the remaining balance is $0$!\n\n---\n\n## \ud83d\udd0d Two Ways to Implement This\n\n### Approach 1: The Foolproof Whiteboard Version (Your Solution! \ud83c\udfc6)\n*Uses repeated subtraction with a `while` loop.*\n\n```python\nclass Solution:\n    def intToRoman(self, num: int) -> str:\n        # Denominations MUST be in descending order!\n        dct = {\n            1000: 'M', 900: 'CM', 500: 'D', 400: 'CD',\n            100: 'C',  90: 'XC',  50: 'L',  40: 'XL',\n            10: 'X',   9: 'IX',   5: 'V',   4: 'IV',\n            1: 'I'\n        }\n        \n        tot = []\n        for number in dct:\n            while num >= number:\n                tot.append(dct[number])\n                num -= number\n                \n        return \"\".join(tot)\n```\n\n#### Why this is the best choice for an interview:\n* **Zero math bugs:** No risk of mixing up integer division `//` and modulo `%`.\n* **Safe $\\mathcal{O}(1)$ execution:** In Roman numerals, no symbol repeats more than 3 times (`MMM`, `CCC`, `XXX`, `III`). The inner `while` loop runs **at most 3 times per denomination**! Total iterations across the entire program $\\le 15$.\n\n---\n\n### Approach 2: The Math Shortcut (Division & Modulo)\n*Eliminates the inner `while` loop by calculating the count directly.*\n\n```python\nclass SolutionMath:\n    def intToRoman(self, num: int) -> str:\n        values = [\n            (1000, \"M\"), (900, \"CM\"), (500, \"D\"), (400, \"CD\"),\n            (100, \"C\"),  (90, \"XC\"),  (50, \"L\"),  (40, \"XL\"),\n            (10, \"X\"),   (9, \"IX\"),   (5, \"V\"),   (4, \"IV\"),\n            (1, \"I\")\n        ]\n        \n        res = []\n        for val, sym in values:\n            if num == 0:\n                break\n            count = num // val       # How many bills fit?\n            res.append(sym * count)  # Append \"M\" * 3 = \"MMM\"\n            num %= val               # Remaining balance\n            \n        return \"\".join(res)\n```\n\n---\n\n## \u2696\ufe0f Comparison: Which One is Better?\n\n| Metric | Approach 1 (Repeated Subtraction) | Approach 2 (Division & Modulo) |\n|---|---|---|\n| **Code Style** | `while num >= number: num -= number` | `count = num // val; num %= val` |\n| **Interview Safety** | \u2b50\u2b50\u2b50\u2b50\u2b50 **Highest** (Intuitive, zero math errors) | \u2b50\u2b50\u2b50\u2b50 (Slight chance of mixing up `//` and `%`) |\n| **LeetCode Runtime** | 1\u20133 ms (Beats 90%+) | 1\u20133 ms (Beats 90%+) |\n| **Inner Loop Iterations** | $\\le 3$ times per symbol | 0 (Replaced by math) |\n\n---\n\n## \u23f1\ufe0f Complexity Analysis\n\n* **Time Complexity:** $\\mathcal{O}(1)$ \u2014 The loop runs over a fixed set of 13 denominations. Because $num \\le
