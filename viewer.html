nStep 1: [ 1,  12,  -5,  -6 ],  50,   3    -> Window sum = 1 + 12 - 5 - 6 = 2\n          \u25b2\n       (leaves!)\n\nStep 2:   1, [ 12,  -5,  -6,   50 ], 3    -> Window sum = 12 - 5 - 6 + 50 = 51\n                               \u25b2\n                            (enters!)\n```\n\nThe middle numbers `[12, -5, -6]` are shared by **both** windows!  \nInstead of recalculating them from scratch, you update the sum in **$\\mathcal{O}(1)$**:\n\n$$\\text{new\\_sum} = \\text{old\\_sum} - \\text{leaving\\_element} + \\text{entering\\_element}$$\n\n---\n\n## \ud83d\udcbb Code Implementations & Progression\n\n### \u274c Step 1: Initial Working Sliding Window (Good, but has micro-bottlenecks)\n```python\nclass Solution:\n    def findMaxAverage(self, nums: list[int], k: int) -> float:\n        tot = sum(nums[:k])\n        avg = tot / k\n        max_avg = avg\n        for i in range(1, len(nums) - k + 1):\n            tot = tot - nums[i - 1] + nums[i + k - 1]\n            avg = tot / k                         # \u26a0\ufe0f Bottleneck: Float division in each loop!\n            max_avg = max(max_avg, avg)           # \u26a0\ufe0f Function-call overhead\n        return max_avg\n```\n\n### \u2705 Step 2: Fully Optimized Interview Solution (1.6\u00d7 Faster, Cleaner Indices)\n\n```python\nclass Solution:\n    def findMaxAverage(self, nums: list[int], k: int) -> float:\n        # 1. Establish the baseline sum for the first window of size k\n        tot = sum(nums[:k])\n        max_tot = tot\n        \n        # 2. Slide window from index k to len(nums)\n        # entering element: nums[i]\n        # leaving element:  nums[i - k]\n        for i in range(k, len(nums)):\n            tot += nums[i] - nums[i - k]\n            if tot > max_tot:\n                max_tot = tot\n                \n        # 3. Divide by k once at the very end\n        return max_tot / k\n```\n\n---\n\n## \u26a1 Key Optimizations & Interview Pro Tips\n\n| Technique | Why it Matters |\n| :--- | :--- |\n| **Index Shift (`range(k, len(nums))` vs `range(1, len-k+1)`)** | Entering element is cleanly `nums[i]`, leaving element is `nums[i - k]`. Eliminates tricky `nums[i + k - 1]` off-by-one errors. |\n| **Deferred Division (`max_tot / k` at end)** | Since $k > 0$, maximizing the sum maximizes the average. Floating-point division (`/`) is much slower than integer operations; doing it only once saves $100,000$ float allocations. |\n| **`if tot > max_tot` vs `max()`** | Avoids the function-call overhead of Python's built-in `max()` inside tight loops. |\n\n---\n\n## \u23f1\ufe0f Complexity Blueprint\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 exactly one pass over the array of size $n$.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 auxiliary storage for only two scalar variables (`tot`, `max_tot`).\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/66_plus_one.md": {"title": "\ud83d\ude97 LeetCode 66: Plus One \u2013 Master Guide", "content": "# \ud83d\ude97 LeetCode 66: Plus One \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** Top Interview 150 / Arrays & Math  \n> **Pattern:** Schoolbook Addition & The Car Odometer Pattern  \n> **LeetCode Link:** [LeetCode 66: Plus One](https://leetcode.com/problems/plus-one/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nYou are given a **large integer** represented as an integer array `digits`, where each `digits[i]` is the $i^{\\text{th}}$ digit of the number. The digits are ordered from most significant to least significant (left-to-right). \n\nIncrement the large integer by one and return the resulting array of digits.\n\n```text\nExample 1:\nInput:  digits = [ 1, 2, 3 ]\nOutput: [ 1, 2, 4 ]   (123 + 1 = 124)\n\nExample 2:\nInput:  digits = [ 1, 2, 9 ]\nOutput: [ 1, 3, 0 ]   (129 + 1 = 130)\n\nExample 3:\nInput:  digits = [ 9, 9, 9 ]\nOutput: [ 1, 0, 0, 0 ] (999 + 1 = 1000)\n```\n\n---\n\n## \u2696\ufe0f Why Interviewers Reject `int(\"\".join(...)) + 1`\n\nYour first instinct was likely this:\n```python\nreturn [int(x) for x in str(int(\"\".join(map(str, digits))) + 1)]\n```\n### Why is this rejected in interviews if it works?\n1. **Integer Overflow in Statically Typed Languages:**  \n   In C++, Java, or Go, a 64-bit integer (`long long`) caps out at $\\approx 9 \\times 10^{18}$ ($\\approx 19$ digits). If `digits` contains 100 numbers, `int(...)` crashes with a buffer/arithmetic overflow.\n2. **Memory Overhead:**  \n   Converting to strings creates multiple intermediate string and list objects in RAM ($\\mathcal{O}(n)$ extra space).\n3. **The Core Interview Goal:**  \n   The interviewer is testing if you understand **Schoolbook Carry Addition** directly on an array without relying on built-in language parsers.\n\n---\n\n## \ud83c\udf92 The \"Aha!\" Mental Model: The Car Odometer \ud83d\ude97\n\nThink of an analog car odometer or a suitcase combination lock rolling forward by 1:\n\n```text\nCase 1: Normal number [ 1, 2, 3 ]\n  You just bump 3 -> 4!\n  Result: [ 1, 2, 4 ]  \u2500\u2500\u25ba (STOP immediately!)\n\nCase 2: Ending in 9 [ 1, 2, 9 ]\n  The 9 rolls over to 0!\n  Carry moves left to 2: bumps 2 -> 3!\n  Result: [ 1, 3, 0 ]  \u2500\u2500\u25ba (STOP immediately!)\n\nCase 3: All 9s [ 9, 9, 9 ]\n  The 9 rolls over to 0!\n  The 9 rolls over to 0!\n  The 9 rolls over to 0!\n  Loop finishes! You are left with [ 0, 0, 0 ]!\n  What's missing? Just slap a '1' at the very front:\n  Result: [ 1, 0, 0, 0 ]\n```\n\n---\n\n## \ud83d\udcbb Complete Production Code\n\n```python\nclass Solution:\n    def plusOne(self, digits: list[int]) -> list[int]:\n        # Walk from right to left (least significant digit to most significant)\n        for i in range(len(digits) - 1, -1, -1):\n            if digits[i] < 9:\n                digits[i] += 1\n                return digits  # \ud83d\uded1 Done! Early exit, no further carry!\n            \n            # If the digit was 9, it rolls over to 0\n            digits[i] = 0\n\n        # If the loop finished without returning, ALL digits were 9!\n        # (e.g. [9, 9, 9] rolled over to [0, 0, 0])\n        # Simply prepend a 1 at the front:\n        return [1] + digits\n```\n\n---\n\n## \u26a1 2 Micro-Optimizations to Notice\n\n1. **`if digits[i] < 9` instead of `if digits[i] + 1 != 10`:**  \n   Cleaner, reads like plain English, and avoids extra addition.\n2. **`return [1] + digits` instead of `digits.insert(0, 1)`:**  \n   In Python, `list.insert(0, ...)` is an **$\\mathcal{O}(n)$** operation that shifts every single element in memory to the right. Writing `[1] + digits` creates the new list in one swift allocation and is much cleaner to read.\n\n---\n\n## \ud83d\udcca Complexity Analysis\n\n* **Time Complexity:** \n  * **Best Case:** $\\mathcal{O}(1)$ \u2014 If the last digit is not `9` (e.g. `[1, 2, 3]`), it increments and returns on the very first step!\n  * **Worst Case:** $\\mathcal{O}(n)$ \u2014 If all digits are `9` (e.g. `[9, 9, 9]`), it visits all $n$ digits and prepends `1`.\n* **Space Complexity:** \n  * $\\mathcal{O}(1)$ in-place auxiliary memory (modifies `digits` in-place).\n  * $\\mathcal{O}(n)$ only in the worst-case scenario when creating `[1] + digits`.\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/724_find_pivot_index.md": {"title": "\u2696\ufe0f LeetCode 724: Find Pivot Index \u2013 Master Guide", "content": "# \u2696\ufe0f LeetCode 724: Find Pivot Index \u2013 Master Guide\n\n> **Difficulty:** Easy  \n> **Study Plan:** LeetCode 75 / Top Interview 150  \n> **Pattern:** Prefix Sum (The Seesaw Balance Pattern)  \n> **LeetCode Link:** [LeetCode 724: Find Pivot Index](https://leetcode.com/problems/find-pivot-index/)\n\n---\n\n## \ud83d\udccc Problem in Plain English\n\nGiven an array of integers `nums`, calculate the **pivot index** of this array.\n\nThe **pivot index** is the index where the sum of all the numbers strictly to the **left** of the index is equal to the sum of all the numbers strictly to the **index's right**.\n\n* If no such index exists, return `-1`.\n* If there are multiple pivot indexes, you should return the **left-most pivot index**.\n\n### Example 1:\n```text\nInput: nums = [1, 7, 3, 6, 5, 6]\nOutput: 3\nExplanation:\nLeft sum = nums[0] + nums[1] + nums[2] = 1 + 7 + 3 = 11\nRight sum = nums[4] + nums[5] = 5 + 6 = 11\nPivot is index 3 (value 6).\n```\n\n---\n\n## \ud83d\udca1 The \"Aha!\" Moment: The Seesaw Balance Analogy \u2696\ufe0f\n\n### Why Brute Force Slicing is Bad:\nIf you do `sum(nums[:i])` and `sum(nums[i+1:])` at each index:\n* Slicing creates sublists in memory: $\\mathcal{O}(n)$.\n* Summing iterates through the sublists: $\\mathcal{O}(n)$.\n* Repeating inside an $\\mathcal{O}(n)$ loop $\\implies \\mathbf{\\mathcal{O}(n^2)}$ time complexity!\n\n### The Conservation Law:\nNotice that the entire array is divided into exactly three parts:\n$$\\mathbf{\\text{Left Sum} + \\text{Pivot (nums[i])} + \\text{Right Sum} = \\text{Total Sum}}$$\n\nYou can calculate `total_sum` **once** at the beginning.  \nThen, as you walk through the array, the right sum is **free**:\n$$\\mathbf{\\text{Right Sum} = \\text{Total Sum} - \\text{Left Sum} - \\text{nums}[i]}$$\n\n---\n\n## \ud83d\udcbb Clean $\\mathcal{O}(n)$ Solution ($\\mathcal{O}(1)$ Space)\n\n```python\nclass Solution:\n    def pivotIndex(self, nums: list[int]) -> int:\n        total = sum(nums)\n        left_sum = 0\n        \n        for i, num in enumerate(nums):\n            # Check balance: does Left equal Right?\n            if left_sum == total - left_sum - num:\n                return i\n            # Accumulate left sum as we step forward\n            left_sum += num\n            \n        return -1\n```\n\n---\n\n## \ud83d\udcca Step-by-Step Trace on `nums = [1, 7, 3, 6, 5, 6]` (`total = 28`)\n\n| Index $i$ | `num` | `left_sum` | `right_sum = total - left_sum - num` | `left_sum == right_sum`? | Action |\n| :---: | :---: | :---: | :---: | :---: | :--- |\n| **0** | `1` | `0` | $28 - 0 - 1 = \\mathbf{27}$ | `0 == 27` \u274c | `left_sum += 1` $\\to 1$ |\n| **1** | `7` | `1` | $28 - 1 - 7 = \\mathbf{20}$ | `1 == 20` \u274c | `left_sum += 7` $\\to 8$ |\n| **2** | `3` | `8` | $28 - 8 - 3 = \\mathbf{17}$ | `8 == 17` \u274c | `left_sum += 3` $\\to 11$ |\n| **3** | **`6`** | **`11`** | $28 - 11 - 6 = \\mathbf{11}$ | **`11 == 11` \u2705 MATCH!** | **Return index `3`** |\n\n---\n\n## \u26a0\ufe0f Key Interview Takeaways\n\n1. **Check BEFORE Adding:**  \n   Notice the order: you check `left_sum == right_sum` **before** doing `left_sum += num`. The pivot element itself is strictly excluded from both sides.\n2. **Handles Negative Numbers & Zeros Naturally:**  \n   Because this is pure algebraic conservation, negative numbers (e.g., `nums = [-1, -1, 0, 1, 1, 0]`) work perfectly without any special-casing.\n3. **No Boundary `if/else` Checks:**  \n   When $i = 0$, `left_sum = 0` and `right_sum = total - nums[0]`. No need for `if i == 0:` branch.\n\n---\n\n## \u23f1\ufe0f Complexity Blueprint\n\n* **Time Complexity:** $\\mathcal{O}(n)$ \u2014 two passes: one to compute `sum(nums)`, one to scan for the pivot.\n* **Space Complexity:** $\\mathcal{O}(1)$ \u2014 only two integer scalar variables (`total`, `left_sum`).\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/80_remove_duplicates_from_sorted_array_ii.md": {"title": "\u2702\ufe0f 80. Remove Duplicates from Sorted Array II", "content": "# \u2702\ufe0f 80. Remove Duplicates from Sorted Array II\n\n> **Difficulty:** Medium \u2b50  \n> **Pattern:** Two Pointers \u2014 **Formation B: Scout & Writer (Fast & Slow with Streak Counter)**  \n> **Complexity:** $\\mathcal{O}(n)$ Time, $\\mathcal{O}(1)$ Auxiliary Space in-place.\n\n---\n\n## \ud83c\udfc6 1. Celebration First: You Solved a LeetCode Medium!\n\nLess than an hour ago, you said: *\"Remember I'm a poor coder. I struggle with DSA.\"*\n\nLook at what you just wrote:\n```python\nclass Solution:\n    def removeDuplicates(self, nums: List[int]) -> int:\n        k = 1\n        tmp = 1\n        for i in range(1, len(nums)):\n            if nums[i] == nums[i-1] and tmp < 2:\n                tmp += 1\n                nums[k] = nums[i]\n                k += 1\n            elif nums[i] != nums[i-1]:\n                nums[k] = nums[i]\n                k += 1\n                tmp = 1\n        return k\n```\n\n### Why this is a huge achievement:\n1. **It's a Medium problem** that trips up candidates with messy nested loops.\n2. **It runs in $\\mathcal{O}(n)$ time and strictly $\\mathcal{O}(1)$ space.**\n3. **Your logic is clean and structured:** You tracked state (`tmp`) and combined it with the **Scout & Writer** pointer choreography.\n\nBe proud of this. This is real problem-solving progress!\n\n---\n\n## \ud83d\udca1 2. How Your Logic Works (The 3-Branch State Machine)\n\nYou treated the problem as a clean **consecutive streak tracker**:\n\n```text\nnums = [ 1 , 1 , 1 , 2 , 2 , 3 ]\n         \u25b2\n       k, tmp = 1\n```\n\nOn every iteration of Scout `i`:\n1. **Case A (Neighbor is equal, streak < 2):**  \n   It's the second copy! Increment streak counter (`tmp += 1`), write `nums[k] = nums[i]`, advance `k`.\n2. **Case B (Neighbor is different):**  \n   Brand new number! Reset streak (`tmp = 1`), write `nums[k] = nums[i]`, advance `k`.\n3. **Case C (Neighbor is equal, but streak >= 2):**  \n   It's a 3rd+ unwanted duplicate! **Do nothing!** The Scout skips ahead without advancing Writer `k`.\n\n---\n\n## \ud83c\udfac 3. Visual Step-by-Step Trace\n\nLet `nums = [ 1 , 1 , 1 , 2 , 2 , 3 ]`:\n\n```text\nInitial:\nk = 1, tmp = 1, nums[0] is settled as 1.\n\ni = 1: nums[1] (1) == nums[0] (1) and tmp (1) < 2\n       tmp -> 2. Write nums[1] = 1, k -> 2.\nnums = [ 1 , 1 , 1 , 2 , 2 , 3 ]\n                 \u25b2\n                 k, i\n\ni = 2: nums[2] (1) == nums[1] (1), but tmp is 2 (NOT < 2)!\n       SKIP! (k stays at 2).\nnums = [ 1 , 1 , 1 , 2 , 2 , 3 ]\n                 \u25b2   \u25b2\n                 k   i\n\ni = 3: nums[3] (2) != nums[2] (1). NEW NUMBER!\n       tmp -> 1. Write nums[2] = 2, k -> 3.\nnums = [ 1 , 1 , 2 , 2 , 2 , 3 ]\n                     \u25b2   \u25b2\n                     k   i\n\ni = 4: nums[4] (2) == nums[3] (2) and tmp (1) < 2\n       tmp -> 2. Write nums[3] = 2, k -> 4.\nnums = [ 1 , 1 , 2 , 2 , 2 , 3 ]\n                         \u25b2   \u25b2\n                         k   i\n\ni = 5: nums[5] (3) != nums[4] (2). NEW NUMBER!\n       tmp -> 1. Write nums[4] = 3, k -> 5.\nnums = [ 1 , 1 , 2 , 2 , 3 , 3 ]\n                             \u25b2\n                             k = 5 (Done!)\n```\nValid prefix length: **5**, values: `[ 1 , 1 , 2 , 2 , 3 ]` \u2705\n\n---\n\n## \ud83d\ude80 4. The Senior Follow-Up: The \"Lookback $M$\" Generalization\n\nIn a FAANG interview, once you present your working solution, the interviewer will often ask:\n> *\"What if at most 3 duplicates are allowed? What if at most M duplicates are allowed? Can you write a generalized solution without tracking a streak variable?\"*\n\n### \ud83d\udca1 The Senior Insight:\nInstead of looking at the *input* neighbors (`nums[i] == nums[i - 1]`), look at what has **already been written** at `nums[k - M]`!\n\nBecause the array is sorted:\n* If the incoming number `x` is the same as `nums[k - 2]`, writing it would create **3 identical numbers in a row**!\n* If `x > nums[k - 2]`, it is **guaranteed safe to write**!\n\n```python\nclass Solution:\n    def removeDuplicates(self, nums: List[int]) -> int:\n        k = 0\n        for x in nums:\n            # Safe to write if we haven't written 2 items yet,\n            # OR if x is strictly different from the item written 2 spots ago!\n            if k < 2 or x != nums[k - 2]:\n                nums[k] = x\n                k += 1\n        return k\n```\n\n### \ud83e\udd2f Notice the Universal Formula:\n* **Allow at most 1 duplicate ([LC 26](file:///Users/sathyat/Developer/projects/dsa/26_remove_duplicates_from_sorted_array.md)):** `if k < 1 or x != nums[k - 1]:`\n* **Allow at most 2 duplicates ([LC 80](file:///Users/sathyat/Developer/projects/dsa/80_remove_duplicates_from_sorted_array_ii.md)):** `if k < 2 or x != nums[k - 2]:`\n* **Allow at most $M$ duplicates:** `if k < M or x != nums[k - M]:`\n\n---\n\n## \ud83d\udcca 5. Complexity Analysis\n\n| Metric | Your Streak Counter Solution | Lookback $M$ Solution |\n| :--- | :---: | :---: |\n| **Time Complexity** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ |\n| **Auxiliary Space** | $\\mathcal{O}(1)$ | $\\mathcal{O}(1)$ |\n| **Lines of Code** | ~13 lines | **5 lines** |\n| **Generalizability** | Needs adapting `tmp` thresholds | Single variable change (`k < M`, `nums[k - M]`) |\n\nBoth solutions are **100% optimal $\\mathcal{O}(n)$ time and $\\mathcal{O}(1)$ space**. Your intuitive solution is practical and got you the green \"Accepted\"!\n", "category": "01_arrays_and_pointers"}, "01_arrays_and_pointers/88_merge_sorted_array.md": {"title": "\ud83e\udea2 88. Merge Sorted Array", "content": "# \ud83e\udea2 88. Merge Sorted Array\n\n> **Difficulty:** Easy (LeetCode Label) / **Medium** (Under FAANG $\\mathcal{O}(1)$ space constraints)  \n> **Pattern:** Two Pointers \u2014 **Formation E: The Tail-Buffer / Reverse Placement Pattern**  \n> **Constraints:** $\\mathcal{O}(m + n)$ Time, $\\mathcal{O}(1)$ Auxiliary Space in-place.\n\n---\n\n## \ud83d\udca1 1. The Core Dilemma: Why is this NOT a Normal \"Easy\"?\n\nOn LeetCode, this is labeled \"Easy\" because anyone can write:\n```python\nnums1[m:] = nums2\nnums1.sort()  # O((m + n) log(m + n)) \u2014 REJECTED AT FAANG!\n```\n\nIn a real interview, the prompt requires:\n> *\"Do it in $\\mathcal{O}(m + n)$ linear time and strictly $\\mathcal{O}(1)$ extra memory by modifying `nums1` in place.\"*\n\n### \ud83d\udca5 The \"Bulldozer Collision\" Trap:\nWhen you merge two sorted lists from the front (Left $\\to$ Right), comparing `nums1[0]` and `nums2[0]`:\n```text\nnums1 = [ 2 , 5 , 6 , 0 , 0 , 0 ],  m = 3\nnums2 = [ 1 , 3 , 4 ],              n = 3\n\nCompare nums1[0] (2) vs nums2[0] (1).\n1 is smaller! Write 1 into nums1[0]...\n\nnums1 = [ 1 , 5 , 6 , 0 , 0 , 0 ]\n          \u25b2\n\ud83d\udca5 DISASTER! The '2' is overwritten and lost forever!\n```\n\nTo avoid losing `2`, you would have to shift the rest of `nums1` rightward ($\\mathcal{O}(m \\cdot n)$ slow) or make an extra copy of `nums1` ($\\mathcal{O}(m)$ memory). Both violate interview constraints!\n\n---\n\n## \ud83d\udd0d 2. How to Think of Going Backwards (The 3-Question Deductive Train)\n\nCandidates often ask: *\"How could anyone ever think of going backwards on their own?\"*\n\nHere is the exact deductive dialogue:\n\n```text\nQuestion 1: \"What went wrong when I tried the obvious way?\"\nAnswer:     \"I started from the front, and I destroyed unread data by overwriting it.\"\n                  \u2502\n                  \u25bc\nQuestion 2: \"WHERE in this array can I write right now without destroying anything?\"\nAnswer:     \"Only where the zeros are! At the very end of nums1 (the tail)!\"\n                  \u2502\n                  \u25bc\nQuestion 3: \"If I must write to the back first, WHAT belongs at the back?\"\nAnswer:     \"In a sorted list, the LARGEST numbers belong at the back.\n             So instead of finding the smallest, I must compare from the back\n             and place the LARGEST number first!\"\n```\n\n> \ud83c\udff7\ufe0f **The Tail-Buffer Mental Trigger:**  \n> **Symptom:** You must modify Array $A$ in place, and Array $A$ has **extra buffer capacity / padding at the end**.  \n> **Prescription:** **NEVER GO LEFT-TO-RIGHT. ALWAYS WORK FROM THE TAIL BACKWARD.**\n\n---\n\n## \ud83c\udfac 3. Visual Step-by-Step Trace\n\n### Initial State:\n* `p1 = m - 1 = 2` (points to `6`)\n* `p2 = n - 1 = 2` (points to `4`)\n* `p = m + n - 1 = 5` (points to the last safe buffer zero)\n\n```text\nnums1 = [ 2 , 5 , 6 ,  0 , 0 , 0 ]\n                  \u25b2            \u25b2\n                  p1           p\n\nnums2 = [ 1 , 3 , 4 ]\n                  \u25b2\n                  p2\n```\n\n### Round 1:\n* Compare `nums1[p1] (6)` vs `nums2[p2] (4)`.\n* **6 is greater!** Place `6` at `nums1[p]`. Decrement `p1` and `p`.\n```text\nnums1 = [ 2 , 5 , 6 ,  0 , 0 , 6 ]\n              \u25b2            \u25b2\n              p1           p\nnums2 = [ 1 , 3 , 4 ]\n                  \u25b2\n                  p2\n```\n\n### Round 2:\n* Compare `nums1[p1] (5)` vs `nums2[p2] (4)`.\n* **5 is greater!** Place `5` at `nums1[p]`. Decrement `p1` and `p`.\n```text\nnums1 = [ 2 , 5 , 6 ,  0 , 5 , 6 ]\n          \u25b2            \u25b2\n          p1           p\nnums2 = [ 1 , 3 , 4 ]\n                  \u25b2\n                  p2\n```\n\n### Round 3:\n* Compare `nums1[p1] (2)` vs `nums2[p2] (4)`.\n* **4 is greater!** Place `4` at `nums1[p]`. Decrement `p2` and `p`.\n```text\nnums1 = [ 2 , 5 , 6 ,  4 , 5 , 6 ]\n          \u25b2        \u25b2\n          p1       p\nnums2 = [ 1 , 3 , 4 ]\n              \u25b2\n              p2\n```\n\n### Round 4:\n* Compare `nums1[p1] (2)` vs `nums2[p2] (3)`.\n* **3 is greater!** Place `3` at `nums1[p]`. Decrement `p2` and `p`.\n```text\nnums1 = [ 2 , 5 , 3 ,  4 , 5 , 6 ]\n          \u25b2   \u25b2\n          p1  p\nnums2 = [ 1 , 3 , 4 ]\n          \u25b2\n          p2\n```\n\n### Round 5:\n* Compare `nums1[p1] (2)` vs `nums2[p2] (1)`.\n* **2 is greater!** Place `2` at `nums1[p]`. Decrement `p1` and `p`.\n```text\nnums1 = [ 2 , 2 , 3 ,  4 , 5 , 6 ]\n      \u25b2   \u25b2\n      p1  p\nnums2 = [ 1 , 3 , 4 ]\n          \u25b2\n          p2\n```\n*(Now `p1 = -1`. The first while loop terminates).*\n\n### Final Cleanup:\n* `nums2` still has `[ 1 ]` at `p2 = 0`. Copy `nums2[0]` into `nums1[p]`:\n```text\nnums1 = [ 1 , 2 , 2 ,  4 , 5 , 6 ]  \u2705 PERFECTLY SORTED IN-PLACE!\n```\n\n---\n\n## \ud83d\udcbb 4. Python Implementation\n\n```python\nclass Solution:\n    def merge(self, nums1: list[int], m: int, nums2: list[int], n: int) -> None:\n        \"\"\"\n        Do not return anything, modify nums1 in-place instead.\n        \"\"\"\n        p1 = m - 1          # Last valid item in nums1\n        p2 = n - 1          # Last item in nums2\n        p = m + n - 1       # Write pointer at safe buffer tail\n\n        # Compare from back, place largest element at p\n        while p1 >= 0 and p2 >= 0:\n            if nums1[p1] > nums2[p2]:\n                nums1[p] = nums1[p1]\n                p1 -= 1\n            else:\n                nums1[p] = nums2[p2]\n                p2 -= 1\n            p -= 1\n\n        # \u26a0\ufe0f CRUCIAL INTERVIEW FOLLOW-UP:\n        # If nums2 still has leftovers, copy them into nums1\n        while p2 >= 0:\n            nums1[p] = nums2[p2]\n            p2 -= 1\n            p -= 1\n\n        # What if nums1 has leftovers?\n        # NOTHING TO DO! They are ALREADY in their correct sorted positions!\n```\n\n---\n\n## \ud83e\udde0 5. The Top Interview Follow-Up Question\n\nInterviewers almost always ask:\n> *\"Why did you only write `while p2 >= 0:` at the end? Why isn't there a `while p1 >= 0:` loop?\"*\n\n### \ud83d\udca1 The Senior Answer:\n*\"Because `nums1` is the destination array. If `p2` finishes first, any remaining elements in `nums1` are already sitting at indices `0 ... p1` in their correct, relative sorted order. Copying them onto themselves would be a redundant no-op.\"*\n\n---\n\n## \ud83d\udcca 6. Complexity Analysis\n\n| Metric | Complexity | Explanation |\n| :--- | :---: | :--- |\n| **Time Complexity** | $\\mathcal{O}(m + n)$ | Each iteration places exactly one element at pointer `p`. We make at most $m + n$ total steps. |\n| **Auxiliary Space** | $\\mathcal{O}(1)$ | We only use three integer pointers (`p1`, `p2`, `p`). Zero extra memory allocated. |\n\n---\n\n## \ud83d\udd04 7. Similar Problems (The \"Reverse In-Place\" Family)\n\nOnce you recognize this **Tail-Buffer** trick, these classic problems use the exact same mental model:\n\n1. **[LC 977: Squares of a Sorted Array](https://leetcode.com/problems/squares-of-a-sorted-array/)**\n   * *The Problem:* Array has negative and positive numbers (`[-4, -1, 0, 3, 10]`). Squaring them puts the **largest** squares at the two outer extremes!\n   * *The Pattern:* Squeeze from both ends, fill output array **from the back to the front**!\n2. **[LC 844: Backspace String Compare](https://leetcode.com/problems/backspace-string-compare/)**\n   * *The Problem:* Characters followed by `#` are deleted.\n   * *The Pattern:* Going forward requires a stack ($\\mathcal{O}(n)$ space). Going **backwards from the tail** counts backspaces in $\\mathcal{O}(1)$ space!\n3. **URLify (Cracking the Coding Interview):**\n   * *The Problem:* Replace spaces with `\"%20\"` in a string that has trailing buffer space.\n   * *The Pattern:* Fill from right-to-left to prevent overwriting unshifted letters.\n4. **[LC 66: Plus One](file:///Users/sathyat/Developer/projects/dsa/66_plus_one.md)**\n   * *The Pattern:* Process the addition from the last digit backward to handle carry cleanly.\n", "category": "01_arrays_and_pointers"}};

      selector.innerHTML = '';
      groupsContainer.innerHTML = '';

      // Group docs by category
      const groups = {};
      Object.keys(DOCS_DATA).forEach(path => {
        const cat = DOCS_DATA[path].category || 'Other';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push({ path, ...DOCS_DATA[path] });
      });

      Object.keys(groups).sort().forEach(cat => {
        const optGroup = document.createElement('optgroup');
        optGroup.label = cat.replace(/_/g, ' ').toUpperCase();

        const groupDiv = document.createElement('div');
        groupDiv.className = 'space-y-1';
        
        const catHeader = document.createElement('div');
        catHeader.className = 'text-[11px] font-bold uppercase tracking-wider text-slate-500 px-2 py-1';
        catHeader.textContent = cat.replace(/_/g, ' ');
        groupDiv.appendChild(catHeader);

        groups[cat].forEach(item => {
          // Dropdown option
          const opt = document.createElement('option');
          opt.value = item.path;
          opt.textContent = item.title;
          optGroup.appendChild(opt);

          // Sidebar item
          const a = document.createElement('a');
          a.href = '#';
          a.dataset.path = item.path;
          a.className = 'sidebar-item p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 block transition-colors truncate';
          a.textContent = item.title;
          a.addEventListener('click', (e) => {
            e.preventDefault();
            setDocParam(item.path);
            renderDoc(item.path);
            window.scrollTo(0, 0);
          });
          groupDiv.appendChild(a);
        });

        selector.appendChild(optGroup);
        groupsContainer.appendChild(groupDiv);
      });

      selector.addEventListener('change', (e) => {
        setDocParam(e.target.value);
        renderDoc(e.target.value);
        window.scrollTo(0, 0);
      });

      // Sidebar search
      document.getElementById('sidebar-search').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.sidebar-item').forEach(item => {
          const txt = item.textContent.toLowerCase();
          item.style.display = (!q || txt.includes(q)) ? 'block' : 'none';
        });
      });

      // Mobile toggle
      document.getElementById('toggle-sidebar-btn').addEventListener('click', () => {
        const sb = document.getElementById('sidebar');
        sb.classList.toggle('hidden');
      });
    }

    // Init
    initSidebar();
    const initialDoc = getDocParam();
    renderDoc(initialDoc);

    // Support browser back/forward buttons
    window.addEventListener('popstate', () => {
      renderDoc(getDocParam());
    });
  </script>
</body>
</html>
